# مهمتان: النسخة التجريبية في المتصفح، والمكدّس تحت apps/.
#
# كان نطاق هذا الملف demo/ وحده، وكان التعليق هنا يقول إن اختبارات apps/api
# «لم تُشغَّل في CI قطّ ولا أعرف حالتها». شُغِّلت الآن محليًّا أولًا كما اشترط
# ذلك التعليق: ٥٦ اختبارًا خضراء، وفحص الأنواع نظيف، وبناء الويب يمرّ. فدخلت
# مهمة ثانية.
#
# المهمتان تعملان معًا على أي دفعة تطابق المرشّح: مرشّحات المسارات في Actions
# على مستوى سير العمل لا المهمة، وفصلهما يحتاج إجراءً خارجيًّا لا يستحقّه
# توفيرُ بضع دقائق. وهما تتوازيان على أي حال.
#
# اختبارات النسخة التجريبية تفتح Chromium فعليًّا: تسجّل دخولًا، وتلصق كشفًا،
# وتقطع الشبكة، وتزرع أزرارًا لترى المحرّك يرفضها. فهي أبطأ من اختبار وحدة
# وأصدق منه.

name: الاختبارات

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'site/**'
      - 'apps/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'demo/**'
      - 'site/**'
      - 'apps/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # لا npm ci: مساحة العمل تحمل workspaces لا يلزم بناؤها لتشغيل
      # اختبارات المتصفح، وتثبيتها كاملةً يضاعف زمن الدفعة بلا مقابل.
      - name: تثبيت playwright وحده
        run: npm install --no-save --no-audit --no-fund playwright@^1.55.0

      - name: تنزيل Chromium
        run: npx playwright install --with-deps chromium

      # حارس التسريب: المستودع عامّ. أي بريد على مزوّد بريد عامّ داخل الملفات
      # يعني عنوانًا شخصيًّا حقيقيًّا، وأي بريد مؤلِّف كذلك. سبق أن دخل عنوان
      # شخصي وكلمة مرور بنصّها الصريح في دفعتين، ولم يكشفهما شيء — هذا ما
      # يكشفهما.
      #
      # كلمة مرور الحسابات التجريبية معلنة في الصفحة نفسها عمدًا، فهي ليست
      # سرًّا. الممنوع هو أن تُقرن بهوية حقيقية.
      - name: التحقق من خلوّ المستودع من هوية شخصية
        run: |
          providers='gmail|googlemail|hotmail|outlook|live|yahoo|icloud|me\.com|proton(mail)?|aol'
          bad=0

          hits=$(git grep -InIE "[A-Za-z0-9._%+-]+@($providers)\.[A-Za-z]{2,}" -- . || true)
          if [ -n "$hits" ]; then
            echo "::error::بريد على مزوّد عامّ داخل الملفات:"
            echo "$hits"
            bad=1
          fi

          authors=$(git log --format='%ae%n%ce' | sort -u | grep -E "@($providers)\." || true)
          if [ -n "$authors" ]; then
            echo "::error::بريد على مزوّد عامّ في هوية الكوميتات:"
            echo "$authors"
            bad=1
          fi

          [ $bad -eq 0 ] && echo "نظيف: لا هوية شخصية في الملفات ولا في التاريخ."
          exit $bad

      # الحارس أعلاه يعرف مزوّدي البريد العامّين وحدهم، وmake_public.py يطبّق
      # قاعدة أضيق: لا يبقى في المنشور إلا @example.om و@hissa.om. فمرّ بينهما
      # حسابان — omar@test.com وsysadmin@hissa.local بصلاحياته الثماني عشرة —
      # حُذفا من المنشور وبقيا في المصدر المتتبَّع لمستودع عامّ.
      #
      # هذا الفحص يطبّق قاعدة البناء نفسها على المصدر، فلا يتباعدان مرّة أخرى.
      - name: بريد البذرة داخل نطاقَي العرض وحدهما
        run: |
          python3 - <<'GUARD'
          import io, json, re, sys

          DOMAINS = ('@example.om', '@hissa.om')   # نفس ثابت make_public.py
          bad = []

          def check(label, users):
              for u in users:
                  mail = u.get('email') or ''
                  if mail and not mail.endswith(DOMAINS):
                      bad.append(f'{label}: {u.get("id")} → {mail}')

          src = io.open('demo/hissa-live.html', encoding='utf-8').read()
          m = re.search(r'<script id="appstate" type="application/json">(.*?)</script>', src, re.S)
          if not m:
              sys.exit('demo/hissa-live.html: لا كتلة حالة')
          check('demo/hissa-live.html', json.loads(m.group(1).replace('\\u003c', '<')).get('users', []))

          for path in ('demo/tests/fixtures/state.ancient.json', 'demo/tests/fixtures/state.gutted.json'):
              check(path, json.loads(io.open(path, encoding='utf-8').read()).get('users', []))

          if bad:
              print('::error::بريد خارج نطاقَي العرض داخل المصدر المتتبَّع:')
              for line in bad:
                  print('  ' + line)
              sys.exit(1)
          print('نظيف: كل بريد في البذرة داخل @example.om أو @hissa.om.')
          GUARD

      # الأيقونات مولَّدة ومدفوعة، لكن إعادة توليدها تثبت أن المولِّد يعمل
      - name: بناء النسخة العامة
        run: npm run demo:site

      - name: تشغيل الاختبارات
        run: npm run demo:test

      - name: حفظ اللقطات عند الفشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: |
            .demo-work/*.png
            .demo-work/shots/**
          if-no-files-found: ignore
          retention-days: 7

  # المكدّس تحت apps/ — لم يكن يُشغَّل هنا شيء منه، فكانت دفعة تمسّه وحده
  # تمرّ بلا اختبار ولا فحص أنواع ولا بناء. ومصفوفة التتبّع في
  # docs/TRACEABILITY.md تستشهد بعمود «Test» لاختبارات لم تكن تعمل.
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: تثبيت مساحة العمل
        run: npm ci --no-audit --no-fund

      # 56 اختبارًا على node:test بقاعدة في الذاكرة: الوحدات، ومعايير القبول
      # AT-01…AT-12، والرحلة الكاملة من التسجيل إلى الصرف.
      - name: اختبارات الواجهة البرمجية
        run: npm test --workspace apps/api

      - name: فحص الأنواع
        run: npm run typecheck

      - name: بناء الويب
        run: npm run build --workspace apps/web
