# ⚠️ مُعطَّل عمدًا — يتعارض مع pages.yml على وجهة واحدة.
#
# هذا سير عمل Jekyll النموذجي من GitHub: يبني جذر المستودع موقعًا ثابتًا، أي
# أن README.md يصير index.html. وpages.yml يرفع site/index.html — النسخة
# العامة من التطبيق نفسه. الوجهة واحدة والمجموعة واحدة (concurrency: pages)،
# فكلاهما ينشر فوق الآخر، ومن يُنهي أخيرًا يفوز. هذا سبب ظهور README مرندرًا
# على الرابط مرّةً والتطبيقِ مرّةً.
#
# فأُزيل مشغّله التلقائي وبقي الملف كما كتبته: يعمل يدويًّا فقط من تبويب
# Actions. إن أردت أن يكون المنشور هو README لا التطبيق، أعِد سطرَي push
# أدناه وعطّل pages.yml بدلًا منه — لا يصحّ أن يعمل الاثنان.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: (معطَّل) نشر Jekyll — يدويًّا فقط

on:
  # المشغّل التلقائي مُزال — انظر الملاحظة أعلاه:
  #  push:
  #    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
