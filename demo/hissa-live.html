/* ══════════════════════════════════════════════════════════════════════════
   SYSTEM ADMINISTRATION DASHBOARD
   A different job asks different questions. Operations asks where the money
   is; administration asks who can reach it, whether anyone can reach it
   alone, and whether the record of who did what still hangs together.
   ══════════════════════════════════════════════════════════════════════════ */
const PERM_CATALOG = [
  { k: 'dashboard.read',      ar: 'قراءة لوحات التشغيل',       domain: 'عام' },
  { k: 'audit.read',          ar: 'قراءة سجل التدقيق',          domain: 'عام' },
  { k: 'pool.manage',         ar: 'إدارة الفرص وإغلاقها',       domain: 'الفرص',    sensitive: true },
  { k: 'application.review',  ar: 'فحص الطلبات واعتمادها',      domain: 'الفرص',    sensitive: true },
  { k: 'application.read',    ar: 'قراءة الطلبات',              domain: 'الفرص' },
  { k: 'funds.request',       ar: 'طلب صرف',                    domain: 'المال',    sensitive: true },
  { k: 'funds.approve',       ar: 'اعتماد صرف',                 domain: 'المال',    sensitive: true },
  { k: 'funds.read',          ar: 'قراءة الأرصدة والصرف',       domain: 'المال' },
  { k: 'distribution.create', ar: 'تنفيذ التوزيعات',            domain: 'المال',    sensitive: true },
  { k: 'report.publish',      ar: 'نشر التقارير',               domain: 'المتابعة', sensitive: true },
  { k: 'kyc.read',            ar: 'قراءة طابور التحقق',         domain: 'الالتزام' },
  { k: 'kyc.approve',         ar: 'اعتماد التحقق',              domain: 'الالتزام', sensitive: true },
  { k: 'case.work',           ar: 'معالجة الحالات',             domain: 'الالتزام' },
  { k: 'case.read',           ar: 'قراءة الحالات',              domain: 'الالتزام' },
  { k: 'settings.read',       ar: 'قراءة الإعدادات',            domain: 'النظام' },
  { k: 'admin.users',         ar: 'إدارة الحسابات',             domain: 'النظام',   sensitive: true },
  { k: 'admin.enrol',         ar: 'إصدار دعوات الانضمام',       domain: 'النظام',   sensitive: true },
];

const EXC_KIND_ORDER = { 'بيانات': 0, 'حوكمة': 1, 'صلاحية': 2, 'إعداد': 3, 'حساب': 4, 'دعوة': 5 };

/* What an administrator has to notice before someone else does. */
function accessExceptions() {
  const now = Date.now();
  const out = [];
  const staff = STATE.users.filter(x => x.role === 'staff');
  const active = staff.filter(x => !x.suspended);

  /* A sensitive permission nobody holds is a stalled process; one only a
     single person holds is a process that stops when they take leave. */
  PERM_CATALOG.filter(pc => pc.sensitive).forEach(pc => {
    const holders = active.filter(x => (x.perms || []).includes(pc.k));
    if (holders.length === 0)
      out.push({ sev: 3, kind: 'صلاحية', what: pc.ar,
        why: 'لا يملكها أي حساب نشط — كل عمل يعتمد عليها متوقف', ref: pc.k, view: 'ops.admin' });
    else if (holders.length === 1)
      out.push({ sev: 2, kind: 'صلاحية', what: pc.ar,
        why: 'يملكها حساب واحد فقط (' + holders[0].name + ') — يتوقف العمل بغيابه',
        ref: pc.k, view: 'ops.admin' });
  });

  const admins = active.filter(x => (x.perms || []).includes('admin.users'));
  if (admins.length < 2)
    out.push({ sev: 3, kind: 'حوكمة', what: 'مدير نظام واحد نشط',
      why: 'الرقابة الثنائية على الإعدادات تحتاج مديرَين — لا يمكن اعتماد أي اقتراح',
      ref: 'admin.users', view: 'ops.admin' });

  staff.filter(x => !(x.perms || []).length && !x.suspended).forEach(x =>
    out.push({ sev: 2, kind: 'حساب', what: x.name, why: 'حساب نشط بلا أي صلاحية — لا يفتح شاشة واحدة',
      ref: x.email || x.id, view: 'ops.admin' }));

  staff.filter(x => x.suspended).forEach(x =>
    out.push({ sev: 1, kind: 'حساب', what: x.name,
      why: 'موقوف منذ ' + Math.floor((now - new Date(x.suspended).getTime()) / DAY) + ' يومًا',
      ref: x.email || x.id, view: 'ops.admin' }));

  STATE.invites.forEach(i => {
    const st = inviteState(i);
    if (st === 'open') {
      const left = Math.ceil((new Date(i.expiresAt).getTime() - now) / DAY);
      if (left <= 2) out.push({ sev: 1, kind: 'دعوة', what: 'كود ' + i.code,
        why: 'صالح ' + (left <= 0 ? 'اليوم فقط' : left + ' يومًا') + ' لوظيفة '
          + (JOB_AR[i.job] || i.job) + ' ولم يُستخدم', ref: i.code, view: 'ops.admin' });
    } else if (st === 'expired') {
      out.push({ sev: 1, kind: 'دعوة', what: 'كود ' + i.code,
        why: 'انتهى دون استخدام — لوظيفة ' + (JOB_AR[i.job] || i.job), ref: i.code, view: 'ops.admin' });
    }
  });

  /* A privileged account nobody has used in months is a key left in a door.
     Only sensitive permissions count: a dormant read-only account is untidy,
     not dangerous. */
  active.filter(x => (x.perms || []).some(p => {
    const pc = PERM_CATALOG.find(y => y.k === p);
    return pc && pc.sensitive;
  })).forEach(x => {
    const days = x.lastSignInAt
      ? Math.floor((now - new Date(x.lastSignInAt).getTime()) / DAY) : null;
    if (days !== null && days >= DORMANT_DAYS)
      out.push({ sev: 2, kind: 'حساب', what: x.name,
        why: 'حساب بصلاحيات حسّاسة لم يُستخدم منذ ' + days + ' يومًا',
        ref: x.email || x.id, view: 'ops.admin' });
  });

  /* A recovery code still open is a second way into an account. */
  STATE.resets.filter(r => resetState(r) === 'open').forEach(r => {
    const t = user(r.userId) || { name: r.userId };
    const hrs = Math.max(0, Math.ceil((new Date(r.expiresAt).getTime() - now) / 3600000));
    out.push({ sev: 2, kind: 'حساب', what: 'كود استرداد قائم لحساب ' + t.name,
      why: 'صالح ' + hrs + ' ساعة بعد — يفتح الحساب لمن يحمله ويعرف بريده',
      ref: r.code, view: 'ops.admin' });
  });

  if (MIGRATION.filled.length)
    out.push({ sev: 2, kind: 'بيانات', what: 'رُقِّعت بنية الحالة عند التحميل',
      why: 'وصل المستند بحقول ناقصة (' + MIGRATION.filled.slice(0, 4).join('، ')
        + (MIGRATION.filled.length > 4 ? ' و' + (MIGRATION.filled.length - 4) + ' غيرها' : '')
        + ') فمُلئت بقيمها الافتراضية — من إصدار ' + MIGRATION.from + ' إلى ' + SCHEMA,
      ref: 'schema', view: null });

  STATE.settingProposals.filter(x => x.status === 'pending').forEach(x => {
    const days = Math.floor((now - new Date(x.proposedAt).getTime()) / DAY);
    const f = SETTING_FIELDS.find(y => y.k === x.key) || { label: x.key };
    out.push({ sev: 2, kind: 'إعداد', what: 'اقتراح تغيير «' + f.label + '»',
      why: 'معلّق منذ ' + days + ' يومًا وينتظر مديرًا غير من اقترحه',
      ref: x.id, view: 'ops.settings' });
  });

  /* Severity first, then kind. The tiebreaker matters: the list is cut at
     nine, and seven routine "only one person holds this" warnings share a
     severity with a finding that says the document itself arrived malformed.
     Sorted by severity alone the structural finding sorts last and falls off
     the board. A fixed kind order keeps it in view. */
  return out.sort((a, b) => b.sev - a.sev
    || (EXC_KIND_ORDER[a.kind] ?? 9) - (EXC_KIND_ORDER[b.kind] ?? 9));
}

/* The chain is either intact or it is not; saying which row broke is the
   only useful form of "not". */
function auditIntegrity() {
  const rows = STATE.audit;
  const breaks = [];
  for (let i = 1; i < rows.length; i += 1) {
    if (rows[i].prev !== rows[i - 1].hash) breaks.push(i);
  }
  const recomputed = [];
  let prev = '0'.repeat(16);
  rows.forEach((r, i) => {
    const copy = Object.assign({}, r);
    delete copy.hash;
    copy.prev = prev;
    if (h64(prev + '|' + JSON.stringify(copy)) !== r.hash) recomputed.push(i);
    prev = r.hash;
  });
  const byActor = {};
  const byAction = {};
  rows.forEach(r => {
    const name = (user(r.actor) || {}).name || 'غير معروف';
    byActor[name] = (byActor[name] || 0) + 1;
    byAction[r.action] = (byAction[r.action] || 0) + 1;
  });
  return {
    total: rows.length, breaks, recomputed,
    intact: breaks.length === 0 && recomputed.length === 0,
    byActor: Object.keys(byActor).map(k => ({ label: k, value: byActor[k] })).sort((a, b) => b.value - a.value),
    byAction: Object.keys(byAction).map(k => ({ label: k, value: byAction[k] })).sort((a, b) => b.value - a.value),
  };
}

/* Audit rows per day over a window — activity, not volume of money. */
function auditActivity(days) {
  const end = new Date(); end.setUTCHours(0, 0, 0, 0);
  const start = new Date(end.getTime() - (days - 1) * DAY);
  const out = Array.from({ length: days }, (_, i) => {
    const d = new Date(start.getTime() + i * DAY);
    return { key: d.toISOString().slice(0, 10), value: 0, count: 0,
      label: d.toISOString().slice(5, 10) };
  });
  const index = {};
  out.forEach((b, i) => { index[b.key] = i; });
  STATE.audit.forEach(r => {
    const k = String(r.at).slice(0, 10);
    if (index[k] != null) { out[index[k]].value += 1; out[index[k]].count += 1; }
  });
  return out;
}

/* ══════════════════════════════════════════════════════════════════════════
   DASHBOARD MODEL
   Four questions, answered in order. Every figure below is derived from the
   record — nothing on the dashboard is a written-in number.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 1. what needs intervention ─────────────────────────────────────────
   Exceptions, not counters. A counter tells you "3"; this tells you which
   three, how late each is, and which screen fixes it. Sorted by lateness so
   the top row is always the most overdue thing in the platform. */
const DAY = 86400000;
function exceptions() {
  const now = Date.now();
  const out = [];
  const age = iso => Math.floor((now - new Date(iso).getTime()) / DAY);

  STATE.cases.filter(c => c.status !== 'resolved').forEach(c => {
    const over = age(c.openedAt) - c.slaDays;
    if (over > 0) out.push({ over, kind: c.kind, ref: c.id,
      what: c.subject, where: pool(c.poolId) ? pool(c.poolId).ref : '—',
      why: 'تجاوزت مهلة الـSLA بـ' + over + ' يومًا'
        + (c.assignedTo ? ' · مع ' + ((user(c.assignedTo) || {}).name || '') : ' · بلا مسؤول'),
      view: 'ops.cases' });
  });

  STATE.reports.forEach(r => {
    const due = new Date(r.dueAt + 'T23:59:59Z').getTime();
    if (['published'].includes(r.status)) return;
    const over = Math.floor((now - due) / DAY);
    if (over > 0) out.push({ over, kind: 'تقرير', ref: r.id,
      what: 'تقرير ' + r.period + ' لـ' + (pool(r.poolId) || {}).ref,
      where: (pool(r.poolId) || {}).ref || '—',
      why: 'متأخر ' + over + ' يومًا عن موعد الاستحقاق'
        + (r.submittedAt ? ' وبانتظار النشر' : ' ولم يقدّمه صاحب المشروع'),
      view: 'ops.reports' });
    else if (['submitted', 'late'].includes(r.status) && r.submittedAt)
      out.push({ over: 0, kind: 'تقرير', ref: r.id, what: 'تقرير ' + r.period + ' بانتظار النشر',
        where: (pool(r.poolId) || {}).ref || '—', why: 'قُدِّم ولم يُنشر للمستثمرين بعد',
        view: 'ops.reports' });
  });

  STATE.disbursements.filter(d => d.status === 'requested').forEach(d => {
    out.push({ over: age(d.requestedAt), kind: 'صرف', ref: d.id,
      what: 'طلب صرف ' + fmt(d.amount, 0) + ' ر.ع',
      where: (pool(d.poolId) || {}).ref || '—',
      why: 'ينتظر اعتماد طرف ثانٍ منذ ' + age(d.requestedAt) + ' يومًا', view: 'ops.money' });
  });

  STATE.applications.filter(a => ['submitted', 'in_review'].includes(a.status)).forEach(a => {
    out.push({ over: age(a.resubmittedAt || a.submittedAt), kind: 'طلب تمويل', ref: a.id,
      what: a.project.title, where: a.company.name,
      why: (a.status === 'submitted' ? 'لم يبدأ فحصه' : 'قيد الفحص') + ' منذ '
        + age(a.resubmittedAt || a.submittedAt) + ' يومًا', view: 'ops.apps' });
  });

  STATE.users.filter(x => ['investor', 'owner'].includes(x.role) && x.kyc === 'pending').forEach(x => {
    out.push({ over: x.createdAt ? age(x.createdAt) : 0, kind: 'تحقق',
      what: x.name, where: x.email || '—', ref: x.email || x.id,
      why: 'حساب لا يستطيع الالتزام قبل اعتماد تحققه', view: 'ops.kyc' });
  });

  STATE.pools.filter(p => p.status === 'funding' && p.closesAt).forEach(p => {
    const over = Math.floor((now - new Date(p.closesAt + 'T23:59:59Z').getTime()) / DAY);
    if (over > 0) out.push({ over, kind: 'فرصة', ref: p.ref, what: p.title,
      where: p.issuer, why: 'انتهت مدة تمويلها منذ ' + over + ' يومًا ولم تُغلق', view: 'ops.pools' });
  });

  return out.sort((a, b) => b.over - a.over);
}

/* ── 2. where the money is ──────────────────────────────────────────────
   Every riyal an investor ever committed, and where it sits now. The five
   states partition the total exactly — a riyal is in one of them and only
   one, so the bar is an honest part-to-whole. Returns are a separate flow
   and are reported beside it, never as a slice of the principal. */
function moneyPosition() {
  const disbursedBy = {};
  STATE.disbursements.filter(d => d.status === 'executed')
    .forEach(d => { disbursedBy[d.poolId] = (disbursedBy[d.poolId] || 0) + d.amount; });

  let funding = 0, escrow = 0, spent = 0, refunded = 0, cancelled = 0;
  STATE.pools.forEach(p => {
    const alloc = allocatedOf(p.id).reduce((s, o) => s + (o.allocated || o.amount), 0);
    const paid = Math.min(disbursedBy[p.id] || 0, alloc);
    spent += paid;
    escrow += alloc - paid;
  });
  STATE.orders.forEach(o => {
    if (o.status === 'refunded') refunded += (o.refunded != null ? o.refunded : o.amount);
    else if (o.status === 'cancelled') cancelled += o.amount;
    else if (o.status === 'pending' || o.status === 'confirmed') funding += o.amount;
  });
  const distributed = STATE.distributions.reduce((s, d) => s + d.gross, 0);
  const total = funding + escrow + spent + refunded + cancelled;
  return {
    total, distributed,
    parts: [
      { key: 'funding', slot: 0,   label: 'قيد التمويل',          value: funding,
        note: 'التزامات على فرص لم تُغلق بعد — تُخصَّص أو تُسترد عند الإغلاق' },
      { key: 'escrow', slot: 1,    label: 'في الضمان',            value: escrow,
        note: 'مُخصَّصة لمشاريع أُغلقت، ولم يُصرف منها بعد' },
      { key: 'spent', slot: 2,     label: 'صُرف للمورّدين',        value: spent,
        note: 'خرجت فعلًا بموافقة طرفين ودليل مرحلة' },
      { key: 'refunded', slot: 3,  label: 'مُسترد للمستثمرين',     value: refunded,
        note: 'فرص لم تبلغ حدّها الأدنى، أو حصص نزلت تحت الحد الأدنى بعد التخصيص' },
      { key: 'cancelled', slot: 4, label: 'مُلغى في مهلة العدول',  value: cancelled,
        note: 'ألغاها المستثمر خلال المهلة' },
    ].filter(x => x.value > 0),
  };
}

/* ── 3. is funding moving ───────────────────────────────────────────────
   Weekly inflow, not a cumulative curve. A cumulative line only ever rises,
   so it looks healthy even in a dead month; the weekly bar shows a stall
   for what it is. */
function weeklyInflow(days) {
  const end = new Date(); end.setUTCHours(0, 0, 0, 0);
  const weeks = Math.max(1, Math.round(days / 7));
  const start = new Date(end.getTime() - (weeks * 7 - 1) * DAY);
  const buckets = Array.from({ length: weeks }, (_, i) => ({
    from: new Date(start.getTime() + i * 7 * DAY),
    value: 0, count: 0,
  }));
  let before = 0;
  STATE.orders.forEach(o => {
    const t = new Date(o.createdAt).getTime();
    if (t < start.getTime()) { before += o.amount; return; }
    const i = Math.min(weeks - 1, Math.floor((t - start.getTime()) / (7 * DAY)));
    if (i < 0) return;
    buckets[i].value += o.amount;
    buckets[i].count += 1;
  });
  let run = before;
  return buckets.map(b => {
    run += b.value;
    const label = String(b.from.getUTCMonth() + 1).padStart(2, '0') + '-'
                + String(b.from.getUTCDate()).padStart(2, '0');
    return { label, value: b.value, count: b.count, cumulative: run };
  });
}

/* ── 4. where each pool stands ──────────────────────────────────────────
   A table, not a chart: a pool carries eight attributes that all matter and
   no colour scale can hold them. Sorted by whichever closes soonest. */
function poolRows() {
  const now = Date.now();
  return STATE.pools.map(p => {
    const got = raised(p.id);
    const daysLeft = p.closesAt
      ? Math.ceil((new Date(p.closesAt + 'T23:59:59Z').getTime() - now) / DAY) : null;
    return {
      p, got, daysLeft,
      pctMin: p.minClose ? Math.min(100, (got / p.minClose) * 100) : 0,
      pctTarget: p.target ? Math.min(100, (got / p.target) * 100) : 0,
      urgency: p.status === 'funding' ? (daysLeft == null ? 999 : daysLeft) : 1000,
    };
  }).sort((a, b) => a.urgency - b.urgency);
}

/* ── ops · what needs attention ───────────────────────────────────────── */
function healthCounters() {
  const now = Date.now();
  const openCases = STATE.cases.filter(c => c.status === 'open');
  const overSla = openCases.filter(c => now - new Date(c.openedAt).getTime() > c.slaDays * 86400000);
  const recon = openCases.filter(c => c.kind === 'مطابقة');
  const lateReports = STATE.reports.filter(r =>
    r.status === 'late' || (r.status === 'scheduled' && now > new Date(r.dueAt + 'T23:59:59Z').getTime()));
  const dueSoon = STATE.reports.filter(r => r.status === 'scheduled'
    && new Date(r.dueAt + 'T23:59:59Z').getTime() - now < 45 * 86400000
    && new Date(r.dueAt + 'T23:59:59Z').getTime() >= now);
  const awaiting = STATE.disbursements.filter(d => d.status === 'requested');
  return { openCases, overSla, recon, lateReports, dueSoon, awaiting };
}

/* ══════════════════════════════════════════════════════════════════════════
   ops · analytics
   Distributions and concentrations — the questions you ask sitting down.
   Pool-by-pool state lives on the dashboard and is deliberately not repeated
   here; two places showing the same table is how they drift apart.
   ══════════════════════════════════════════════════════════════════════════ */
const TICKET_BANDS = [
  { label: 'أقل من 500',      min: 0,          max: 500000 },
  { label: '500 — 2,000',     min: 500000,     max: 2000000 },
  { label: '2,000 — 10,000',  min: 2000000,    max: 10000000 },
  { label: '10,000 — 25,000', min: 10000000,   max: 25000000 },
  { label: '25,000 فأكثر',    min: 25000000,   max: Infinity },
];

VIEWS['ops.pipeline'] = () => {
  const live = STATE.orders.filter(o => COUNTED.has(o.status));
  const total = live.reduce((s, o) => s + o.amount, 0);

  /* funnel — ordered stages, so the ordinal ramp, not categorical hues */
  const investors = usersOfRole('investor');
  const kycOk = investors.filter(x => x.kyc === 'approved');
  const suitOk = kycOk.filter(x => x.suit === 'pass' && x.consents);
  const ordered = new Set(STATE.orders.map(o => o.userId));
  const held = new Set(STATE.orders.filter(o => ['confirmed', 'allocated'].includes(o.status)).map(o => o.userId));
  const stages = [
    { label: 'مستثمرون مسجَّلون', value: investors.length },
    { label: 'اكتمل التحقق من الهوية', value: kycOk.length },
    { label: 'اجتازوا الملاءمة وأقرّوا الموافقات', value: suitOk.length },
    { label: 'أنشؤوا التزامًا', value: ordered.size },
    { label: 'التزام مؤكد أو مخصَّص', value: held.size },
  ];

  /* sectors — identity, so categorical in fixed order */
  const bySector = {};
  live.forEach(o => { const p = pool(o.poolId); bySector[p.sector] = (bySector[p.sector] || 0) + o.amount; });
  const sectors = Object.keys(bySector).map(k => ({ label: k, value: bySector[k] }))
    .sort((a, b) => b.value - a.value);

  /* class mix — where the money comes from, and how much rides on one class */
  const byClass = { retail: 0, angel: 0, sophisticated: 0 };
  const countClass = { retail: 0, angel: 0, sophisticated: 0 };
  live.forEach(o => {
    const iu = user(o.userId);
    if (!iu || !(iu.cls in byClass)) return;
    byClass[iu.cls] += o.amount;
    countClass[iu.cls] += 1;
  });
  const classParts = Object.keys(byClass).filter(k => byClass[k] > 0)
    .map((k, i) => ({ slot: ['retail', 'angel', 'sophisticated'].indexOf(k),
      label: CLASS_AR[k], value: byClass[k], count: countClass[k] }));

  /* ticket bands — ordered buckets, so the ordinal ramp again */
  const bands = TICKET_BANDS.map(b => {
    const inBand = live.filter(o => o.amount >= b.min && o.amount < b.max);
    return { label: b.label, value: inBand.length, sum: inBand.reduce((s, o) => s + o.amount, 0) };
  });

  /* concentration — the number that says how much rides on a few people */
  const byInvestor = {};
  live.forEach(o => { byInvestor[o.userId] = (byInvestor[o.userId] || 0) + o.amount; });
  const ranked = Object.keys(byInvestor).map(id => ({ id, name: (user(id) || {}).name || id, value: byInvestor[id] }))
    .sort((a, b) => b.value - a.value);

  return {

    lede: 'التوزيعات والتركّزات: من أين يأتي المال، وأين يتوقف الناس، وكم يعتمد النشاط على قلّة منهم. حالة كل فرصة على لوحة التشغيل ولا تُكرَّر هنا.',
    body: '<div class="stack" style="gap:2rem">'

    + band('01', 'أين يتوقف الناس؟', 'كل مرحلة مجموعة فرعية من التي قبلها',
        '<div class="card"><div class="card__body">' + frameHtml({
          title: 'قمع التحويل',
          sub: 'النسبة المعروضة هي المحمول من المرحلة السابقة لا من الأساس — فهي تقول أين يقع الفاقد بالضبط.',
          chart: funnelHtml(stages),
          cols: ['المرحلة', 'العدد', 'من السابقة', 'من الأساس'],
          rows: stages.map((s, i) => [esc(s.label), s.value,
            i ? (Math.round((s.value / stages[i - 1].value) * 1000) / 10) + '%' : '—',
            (Math.round((s.value / stages[0].value) * 1000) / 10) + '%']),
        }) + '</div></div>')

    + band('02', 'من أين يأتي المال؟', 'بالقطاع وبصنف المستثمر',
        '<div class="grid grid--2 grid--top">'
        + '<div class="card"><div class="card__body">' + frameHtml({
            title: 'الملتزم به حسب القطاع',
            sub: 'المبالغ القائمة فعلًا، لا الأهداف المعلنة.',
            chart: barsHtml(sectors, omr0, CAT),
            cols: ['القطاع', 'الملتزم به (ر.ع)', 'النسبة'],
            rows: sectors.map(s => [esc(s.label), fmt(s.value, 0),
              total ? ((s.value / total) * 100).toFixed(1) + '%' : '—']),
          }) + '</div></div>'
        + '<div class="card"><div class="card__body">' + frameHtml({
            title: 'الملتزم به حسب صنف المستثمر',
            sub: 'اعتماد التمويل على صنف واحد يجعل أي تغيير في حدوده تغييرًا في حجم المنصة.',
            chart: stackedBar(classParts, classParts.reduce((s, x) => s + x.value, 0), omr0),
            cols: ['الصنف', 'الملتزم به (ر.ع)', 'عدد الالتزامات', 'النسبة'],
            rows: classParts.map(c => [esc(c.label), fmt(c.value, 0), String(c.count),
              total ? ((c.value / total) * 100).toFixed(1) + '%' : '—']),
          }) + '</div></div></div>')

    + band('03', 'ما حجم الالتزام المعتاد؟', 'توزيع الالتزامات على شرائح المبلغ',
        '<div class="card"><div class="card__body">' + frameHtml({
          title: 'عدد الالتزامات في كل شريحة',
          sub: 'شرائح مرتَّبة، فالتدرّج يغمق مع ارتفاع الشريحة — واللون هنا يحمل الترتيب لا الهوية.',
          chart: '<div class="bars">' + bands.map((x, i) =>
              '<div class="bars__row"><span class="bars__label">' + esc(x.label) + '</span>'
              + '<span class="meter"><span class="meter__fill" style="width:'
              + ((x.value / Math.max(1, Math.max.apply(null, bands.map(y => y.value)))) * 100).toFixed(1)
              + '%;background:' + ORD[i] + '"></span></span>'
              + '<span class="bars__val">' + x.value + '</span></div>').join('') + '</div>',
          cols: ['الشريحة (ر.ع)', 'عدد الالتزامات', 'مجموعها (ر.ع)'],
          rows: bands.map(x => [esc(x.label), String(x.value), fmt(x.sum, 0)]),
        }) + '</div></div>')

    + band('04', 'كم يعتمد النشاط على قلّة؟', 'تركّز التمويل في أكبر المستثمرين',
        '<div class="grid grid--2 grid--top">'
        + '<div class="card"><div class="card__body">'
        + '<div class="hero"><span class="hero__v">' + topShare + '%</span>'
        + '<span class="hero__k">من إجمالي الملتزم به يأتي من أكبر خمسة مستثمرين</span></div>'
        + ratioMeter(top5, total || 1, omr0, topShare > 60 ? TONE.critical : topShare > 40 ? TONE.warning : TONE.good)
        + '<p class="xs muted">تركّز مرتفع يعني أن انسحاب مستثمر واحد يغيّر حجم النشاط. '
        + 'العدد الكلي للمستثمرين النشطين: <strong>' + ranked.length + '</strong>.</p>'
        + '</div></div>'
        + '<div class="card"><div class="card__head"><h2>أكبر المستثمرين</h2></div>'
        + '<div class="card__body card__body--flush"><div class="tablewrap"><table>'
        + '<thead><tr><th>المستثمر</th><th class="n">الملتزم به</th><th class="n">النسبة</th></tr></thead><tbody>'
        + (ranked.length ? ranked.slice(0, 8).map(x =>
            '<tr><td class="sm">' + esc(x.name) + '</td><td class="n">' + fmt(x.value, 0) + '</td>'
            + '<td class="n">' + (total ? ((x.value / total) * 100).toFixed(1) : '0') + '%</td></tr>').join('')
          : '<tr><td colspan="3" class="empty">لا التزامات بعد.</td></tr>')
        + '</tbody></table></div></div></div></div>')

    + '</div>',
  };

/* Amending is deliberately close to closing: both change what an investor
   already agreed to, and both are irreversible once done. */
function amendPanel() {
  const open = STATE.pools.filter(p => ['funding', 'funded', 'operating'].includes(p.status));
  if (!open.length) return '';
  const p = open.find(x => x.id === SESSION.poolId) || open[0];
  const live = liveOrdersOf(STATE, p.id).length;
  return '<div class="card"><div class="card__head"><h2>تعديل الإفصاح</h2></div><div class="card__body">'
    + '<div class="field" style="max-width:26rem"><label for="ampool">الفرصة</label>'
    + '<select id="ampool" data-act="pickPool">'
    + open.map(x => '<option value="' + x.id + '"' + (x.id === p.id ? ' selected' : '') + '>'
        + esc(x.ref) + ' — ' + esc(x.title) + '</option>').join('')
    + '</select></div>'
    + '<div class="note sm">النسخة السارية <strong>v' + p.disclosureVersion + '</strong>'
    + (p.status === 'funding' ? ' · التزامات قائمة قد تُفتح لها مهلة عدول: <strong>' + live + '</strong>' : '')
    + '</div>'
    + '<div class="field"><label for="amsum">ما الذي تغيّر</label>'
    + '<textarea id="amsum" rows="3" placeholder="صف التغيير كما سيقرؤه المستثمر — 20 حرفًا على الأقل"></textarea></div>'
    + '<label class="check"><input type="checkbox" id="ammat">'
    + '<span><strong>تغيير جوهري.</strong> يرفع رقم النسخة، ويفتح لكل مستثمر قائم في هذه الفرصة مهلة عدول '
    + 'مدتها ' + STATE.settings.coolingOffHours + ' ساعة يخرج فيها دون إبداء سبب.</span></label>'
    + '<button class="btn btn--primary" data-act="amendDisclosure" data-pool="' + p.id + '">نشر التعديل</button>'
    + '<p class="xs muted">النسخ المنشورة لا تُعدَّل ولا تُحذف: كل تعديل سطر جديد في سجل النسخ يراه المستثمر.</p>'
    + '</div></div>';
}

/* Shows exactly what closing would do to each investor — before anyone
   clicks. The balance check is the point: allocated + refunded must equal
   requested, to the baisa. */
function allocationPreview() {
  const p = STATE.pools.find(x => x.status === 'funding');
  if (!p) return '<p class="empty">لا توجد فرصة مفتوحة للتمويل.</p>';
  const live = STATE.orders.filter(o => o.poolId === p.id && COUNTED.has(o.status));
  if (!live.length) return '<p class="empty">لا التزامات قائمة في ' + esc(p.ref) + '.</p>';
  const total = live.reduce((s, o) => s + o.amount, 0);
  const ceiling = ceilingOf(p);

  let alloc;
  if (total < p.minClose) alloc = live.map(() => 0);
  else if (total <= ceiling) alloc = live.map(o => o.amount);
  else {
    alloc = proRata(ceiling, live.map(o => o.amount));
    for (let pass = 0; pass < live.length; pass += 1) {
      const under = alloc.map((a, i) => ({ a, i })).filter(x => x.a > 0 && x.a < STATE.settings.minTicket);
      if (!under.length) break;
      under.forEach(x => { alloc[x.i] = 0; });
      const w = alloc.map((a, i) => (a > 0 ? live[i].amount : 0));
      if (w.every(x => x === 0)) break;
      alloc = proRata(ceiling, w);
    }
  }
  let tReq = 0, tGot = 0, tRef = 0, tUnits = 0;
  const rows = live.map((o, i) => {
    const got = Math.min(alloc[i], o.amount), ref = o.amount - got;
    const units = Math.floor(got / STATE.settings.unitPrice);
    tReq += o.amount; tGot += got; tRef += ref; tUnits += units;
    return '<tr><td class="sm">' + esc((user(o.userId) || {}).name) + '</td>'
      + '<td><span class="mono xs">' + o.id + '</span></td>'
      + '<td class="n">' + fmt(o.amount, 0) + '</td><td class="n">' + fmt(got, 0) + '</td>'
      + '<td class="n">' + (ref ? fmt(ref, 0) : '—') + '</td><td class="n">' + units + '</td></tr>';
  }).join('');

  const balanced = tGot + tRef === tReq && (total < p.minClose || tGot === Math.min(total, ceiling));
  const verdict = total < p.minClose
    ? 'الملتزم به ' + fmt(total, 0) + ' دون الحد الأدنى ' + fmt(p.minClose, 0) + ' — الإغلاق الآن يسترد كل شيء.'
    : total > ceiling
      ? 'الملتزم به ' + fmt(total, 0) + ' فوق السقف ' + fmt(ceiling, 0) + ' — يُخصَّص الجميع تناسبيًا.'

/* ── monitoring · the report gate ──────────────────────────────────────
   Closes the loop the owner starts: submitted reports land here, and only
   what is published here reaches an investor. */
VIEWS['ops.reports'] = () => {
  const u = me();
  const canAct = can(u, 'report.publish');
  const waiting = STATE.reports.filter(r => ['submitted', 'late'].includes(r.status) && r.submittedAt);
  const scheduled = STATE.reports.filter(r => !r.submittedAt && r.status !== 'published');
  const published = STATE.reports.filter(r => r.status === 'published');
  const operating = STATE.pools.filter(p => ['funded', 'operating'].includes(p.status));

  const kpiTable = r => '<div class="tablewrap"><table><thead><tr><th>المؤشر</th>'
    + '<th class="n">الفعلي</th><th class="n">المتوقع</th><th class="n">الانحراف</th></tr></thead><tbody>'
    + (r.kpis || []).map(k => {
        const dev = k.forecast ? Math.round(((k.actual - k.forecast) / k.forecast) * 1000) / 10 : null;
        return '<tr><td class="sm">' + esc(k.metric) + '</td><td class="n">' + k.actual + '</td>'
          + '<td class="n">' + (k.forecast == null ? '—' : k.forecast) + '</td>'
          + '<td class="n">' + (dev === null ? '—'
              : '<span class="chip ' + (dev >= 0 ? 'chip--pos' : 'chip--warn') + '">'
                + (dev > 0 ? '+' : '') + dev + '%</span>') + '</td></tr>';
      }).join('') + '</tbody></table></div>';

  return {
    crumb: 'فريق التشغيل · ' + (JOB_AR[u.job] || ''), title: 'مراجعة التقارير',
    lede: 'لا يصل تقرير إلى مستثمر قبل أن يُراجَع هنا. تُقارن المؤشرات بما نشره الإفصاح، ويُنشر التقرير أو يُعاد لصاحب المشروع بسبب مكتوب.',
    body: (canAct ? '' : '<div class="note note--warn">حسابك يقرأ هذه الشاشة ولا ينشر فيها.</div>')
      + '<div class="card"><div class="card__head"><h2>بانتظار المراجعة</h2>'
      + '<span class="spacer chip ' + (waiting.length ? 'chip--warn' : 'chip--pos') + '">' + waiting.length + '</span></div>'
      + '<div class="card__body">'
      + (waiting.length ? waiting.map(r => {
          const p = pool(r.poolId) || {};
          const late = r.status === 'late';
          return '<div class="panel card" style="box-shadow:none"><div class="card__body">'
            + '<div class="row"><h3>' + esc(r.period) + ' — ' + esc(p.title || '') + '</h3>'
            + chip(REPORT_STATUS, r.status)
            + '<span class="spacer xs muted">قُدِّم ' + dt(r.submittedAt, true) + '</span></div>'
            + (late ? '<div class="note note--warn sm">قُدِّم بعد موعد الاستحقاق ' + dt(r.dueAt)
                + ' — يُسجَّل متأخرًا في مؤشر الالتزام بالمواعيد.</div>' : '')

            + (r.variance ? '<div class="note sm"><strong>تفسير الانحراف:</strong> ' + esc(r.variance) + '</div>' : '')
            + (canAct
                ? '<div class="field"><label for="rn_' + r.id + '">سبب الإعادة (يلزم عند الإعادة فقط)</label>'

      + (scheduled.concat(published).length

/* ── cases ─────────────────────────────────────────────────────────────
   Every open case has an owner and a clock; the dashboard points here. */
VIEWS['ops.cases'] = () => {
  const u = me();
  const canAct = can(u, 'case.work');
  const now = Date.now();
  const withAge = c => Object.assign({}, c, {
    age: Math.floor((now - new Date(c.openedAt).getTime()) / DAY),
    over: Math.floor((now - new Date(c.openedAt).getTime()) / DAY) - c.slaDays,
  });
  const open = STATE.cases.filter(c => c.status !== 'resolved').map(withAge)
    .sort((a, b) => b.over - a.over);
  const done = STATE.cases.filter(c => c.status === 'resolved');
  const resolved = done.filter(c => c.daysToResolve != null);
  const avg = resolved.length
    ? Math.round(resolved.reduce((s, c) => s + c.daysToResolve, 0) / resolved.length) : null;

  const card = c => '<div class="panel card" style="box-shadow:none"><div class="card__body">'
    + '<div class="row"><span class="mono xs">' + c.id + '</span>'
    + '<span class="chip">' + esc(c.kind) + '</span>'
    + chip(CASE_STATUS, c.status)
    + (c.over > 0 ? '<span class="chip chip--crit"><span class="chip__dot"></span>تجاوزت الـSLA بـ'

      : '<span class="chip chip--pos"><span class="chip__dot"></span>ضمن المهلة</span>')
    + '<span class="spacer xs muted">مفتوحة منذ ' + c.age + ' يومًا · مهلة ' + c.slaDays + '</span></div>'
    + '<h3>' + esc(c.subject) + '</h3>'
    + '<div class="sm muted">' + esc((pool(c.poolId) || {}).title || '—') + '</div>'
    + (c.raisedBy ? '<div class="sm">من: <strong>' + esc((user(c.raisedBy) || {}).name || '')
        + '</strong> <span class="mono xs muted">' + esc((user(c.raisedBy) || {}).email || '') + '</span></div>' : '')
    + '<div class="sm">المسؤول: ' + (c.assignedTo
        ? '<strong>' + esc((user(c.assignedTo) || {}).name || '') + '</strong>'
        : '<span class="muted">لم يتولّها أحد</span>') + '</div>'
    + ((c.notes || []).length
        ? '<div class="stack-s">' + c.notes.slice().reverse().map(n =>
            '<div class="note ' + (n.kind === 'resolve' ? 'note--pos ' : '') + 'sm">'
            + '<div class="xs muted">' + dt(n.at, true) + ' · ' + esc((user(n.by) || {}).name || '') + '</div>'
            + esc(n.text) + '</div>').join('') + '</div>'
        : '')
    + (canAct
        ? '<div class="field"><label for="cn_' + c.id + '">ملاحظة أو سبب الإغلاق</label>'
          + '<textarea id="cn_' + c.id + '" rows="2" placeholder="ما الذي فُعل"></textarea></div>'
          + '<div class="row">'
          + (c.assignedTo !== u.id
              ? '<button class="btn btn--sm" data-act="takeCase" data-case="' + c.id + '">تولّي الحالة</button>' : '')
          + '<button class="btn btn--sm" data-act="noteCase" data-case="' + c.id + '">إضافة ملاحظة</button>'
          + '<button class="btn btn--sm btn--primary" data-act="resolveCase" data-case="' + c.id + '">إغلاق</button>'
          + '</div>'
        : '')
    + '</div></div>';

  return {
    crumb: 'فريق التشغيل · ' + (JOB_AR[u.job] || ''), title: 'الحالات والشكاوى',
    lede: 'لكل حالة مسؤول ومهلة. العمل بلا مسؤول عمل بلا صاحب، فتولّي الحالة إجراء صريح يُسجَّل، والإغلاق يحتاج وصفًا لما عولج.',
    body: (canAct ? '' : '<div class="note note--warn">حسابك يقرأ الحالات ولا يعالجها.</div>')
      + '<div class="grid grid--4">'
      + [['مفتوحة', String(open.length)],

         ['بلا مسؤول', String(open.filter(c => !c.assignedTo).length)],
         ['متوسط زمن الإغلاق', avg == null ? '—' : avg + ' يومًا']]
        .map(k => '<div class="kv"><div class="kv__k">' + k[0] + '</div><div class="kv__v">' + k[1] + '</div></div>').join('')
      + '</div>'
      + '<div class="card"><div class="card__head"><h2>مفتوحة</h2>'
      + '<span class="spacer xs muted">الأكثر تجاوزًا للمهلة أولًا</span></div><div class="card__body">'
      + (open.length ? open.map(card).join('') : '<p class="empty">لا حالات مفتوحة.</p>')

   An auditor's work leaves the screen. Every dataset here is built from what

/* RFC 4180 quoting, and a BOM so Arabic opens correctly in Excel. */
function toCsv(cols, rows) {
  const cell = v => {
    const t = v == null ? '' : String(v);
    return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  };
  return '﻿' + [cols.map(cell).join(',')]
    .concat(rows.map(r => r.map(cell).join(',')))
    .join('\r\n') + '\r\n';
}

let LAST_SCREEN = null;

/* Every commit rebuilds the shell, which destroys whatever had focus. Doing
   nothing about it is not neutral: focus falls back to the document body, so
   a keyboard user is silently returned to the top of the page after each
   action. Name the focused control by what it does rather than by identity —
   the replacement is a different element with the same job — and put focus
   back on it. */
function focusKey(el) {
  if (!el || el === document.body || !el.dataset) return null;
  const d = el.dataset;
  if (el.id) return '#' + el.id;
  if (!d.act) return null;
  return [d.act, d.view, d.id, d.user, d.code, d.pool].map(x => x || '').join('|');
}
function findByKey(key) {
  if (!key) return null;
  if (key.charAt(0) === '#') return document.getElementById(key.slice(1));
  const all = document.querySelectorAll('[data-act]');
  for (let i = 0; i < all.length; i += 1) if (focusKey(all[i]) === key) return all[i];
  return null;
}

function render() {
  const u = me();
  const held = focusKey(document.activeElement);
  document.getElementById('root').innerHTML = u ? appShell(u) : publicShell();
  window.scrollTo(0, 0);
  /* Replacing the shell destroys whatever had focus, which drops a keyboard
     user back at the document root — behind the whole nav they just used.
     Move focus to the heading, but only when the screen actually changed:
     doing it on every re-render would yank focus mid-form on each commit.
     The very first render is the exception: nothing had focus to lose, and
     grabbing it there would put the reader past the skip link before they
     ever reached it. */
  const screen = u ? 'app:' + SESSION.view : 'pub:' + (SESSION.pub || 'landing');
  const first = LAST_SCREEN === null;
  const changed = screen !== LAST_SCREEN;
  LAST_SCREEN = screen;
  const h = document.getElementById('pagetitle');
  if (changed) {
    if (h && !first) h.focus({ preventScroll: true });
    return;
  }
  /* Same screen, rebuilt: return focus to the control that was in hand, or to
     the heading if that control no longer exists (it was the button that
     closed the case, and there is no such button any more). */
  if (!held) return;
  const back = findByKey(held);
  (back || h || {}).focus?.({ preventScroll: true });
}

/* ── register: six steps, each gating the next ────────────────────────── */
let REG = { step: 1, kind: 'investor', name: '', email: '', pw: '', cls: 'retail',
            answers: {}, consents: {}, otp: null, typed: '' };

function registerView() {
  const total = REG.kind === 'investor' ? 6 : 4;
  const bar = '<div class="stepper">' + Array.from({ length: total }, (_, i) =>
    '<span data-on="' + (i + 1 < REG.step ? 'done' : i + 1 === REG.step ? '1' : '0') + '"></span>').join('') + '</div>';

  let panel = '', title = '', sub = '';

  if (REG.step === 1) {
    title = 'ما نوع حسابك؟'; sub = 'المسار يختلف: المستثمر يمرّ باختبار ملاءمة، وصاحب المشروع يقدّم منشأة.';
    panel = '<div class="picker">'
      + [['investor', 'مستثمر', 'أبحث عن فرص لأستثمر فيها.'],
         ['owner', 'صاحب مشروع', 'لديّ منشأة قائمة وأريد تمويل توسعة محددة.']]
        .map(o => '<button class="picker__opt" data-act="regKind" data-kind="' + o[0] + '" aria-pressed="'
          + (REG.kind === o[0]) + '"><strong>' + o[1] + '</strong><span>' + o[2] + '</span></button>').join('')
      + '</div>'
      + '<button class="btn btn--primary" data-act="regNext">متابعة</button>';
  }

  if (REG.step === 2) {
    title = 'بياناتك'; sub = 'البريد هو معرّفك عند الدخول.';
    panel = '<div class="field"><label for="rname">الاسم الكامل</label>'
      + '<input id="rname" value="' + esc(REG.name) + '" autocomplete="name"></div>'
      + '<div class="field"><label for="remail">البريد الإلكتروني</label>'
      + '<input id="remail" type="email" dir="ltr" autocomplete="username" value="' + esc(REG.email) + '"></div>'
      + '<div class="field"><label for="rpw">كلمة المرور</label>'
      + '<input id="rpw" type="password" dir="ltr" autocomplete="new-password">'
      + '<span class="field__hint">ثمانية أحرف على الأقل.</span></div>'
      + '<div class="field"><label for="rpw2">تأكيد كلمة المرور</label>'
      + '<input id="rpw2" type="password" dir="ltr" autocomplete="new-password"></div>'
      + '<div class="note note--warn xs">لا تستخدم كلمة مرور حقيقية. هذه نسخة تجريبية تحفظ حالتها داخل الصفحة نفسها، ومن يملك الرابط يقرأ محتواها.</div>'
      + '<div id="rerr"></div>'
      + '<div class="row"><button class="btn" data-act="regBack">رجوع</button>'
      + '<button class="btn btn--primary" data-act="regNext">متابعة</button></div>';
  }

  if (REG.step === 3 && REG.kind === 'investor') {
    title = 'صنف المستثمر'; sub = 'الصنف يحدّد حدودك، وأي الفرص تراها أصلًا. يُراجَع عند التحقق من الهوية.';
    const lim = STATE.settings.limits;
    panel = '<div class="picker">'
      + [['retail', 'أفراد', 'الصنف الافتراضي. لا يتطلب إثباتًا إضافيًا.'],
         ['angel', 'ملائكي', 'يتطلب إقرارك بخبرة سابقة في استثمارات غير مدرجة أو بملاءمة مالية كافية.'],
         ['sophisticated', 'متمرس', 'يتطلب مستندًا يثبت الأهلية، ويخضع لاعتماد الشريك المرخّص.']]
        .map(o => {
          const c = lim[o[0]];
          const caps = (c.perIssuer == null ? 'بلا حدّ لكل متقدم تمويل' : 'حتى ' + fmt(c.perIssuer, 0) + ' ر.ع لكل متقدم تمويل')
            + ' · ' + (c.rolling12m == null ? 'بلا حدّ خلال 12 شهرًا' : 'حتى ' + fmt(c.rolling12m, 0) + ' ر.ع خلال 12 شهرًا');
          return '<button class="picker__opt" data-act="regCls" data-cls="' + o[0] + '" aria-pressed="'
            + (REG.cls === o[0]) + '"><strong>' + o[1] + '</strong>'
            + '<span class="caps">' + caps + '</span>'
            + '<span>' + o[2] + '</span></button>';
        }).join('')
      + '</div>'
      + (REG.cls !== 'retail'
          ? '<label class="check"><input type="checkbox" id="rproof"><span>أقرّ بأنني أستوفي شروط هذا الصنف، وأتعهد بتقديم ما يثبته عند التحقق. تصنيفي يبقى «أفراد» حتى يُعتمد الإثبات.</span></label>'
          : '')
      + '<div id="rerr"></div>'
      + '<div class="row"><button class="btn" data-act="regBack">رجوع</button>'
      + '<button class="btn btn--primary" data-act="regNext">متابعة</button></div>';
  }

  if (REG.step === 4 && REG.kind === 'investor') {
    title = 'اختبار الملاءمة'; sub = 'أربعة أسئلة تحدّد ما إذا كان هذا النوع من الاستثمار مناسبًا لك. الإجابة الصادقة تحميك.';
    panel = SUIT_Q.map((q, i) =>
      '<div class="field"><label>' + esc(q.q) + '</label>'
      + '<div class="picker">' + q.a.map((a, j) =>
          '<button class="picker__opt" data-act="regAns" data-q="' + i + '" data-v="' + a[1] + '" aria-pressed="'
          + (REG.answers[i] === a[1]) + '"><strong>' + esc(a[0]) + '</strong></button>').join('')
      + '</div></div>').join('')
      + '<div id="rerr"></div>'
      + '<div class="row"><button class="btn" data-act="regBack">رجوع</button>'
      + '<button class="btn btn--primary" data-act="regNext">متابعة</button></div>';
  }

  const consentStep = REG.kind === 'investor' ? 5 : 3;
  if (REG.step === consentStep) {
    title = 'الموافقات'; sub = 'كل موافقة منفصلة وصريحة. لا موافقة ضمنية ولا مربّع مؤشَّر مسبقًا.';
    const items = [
      ['terms', 'أوافق على شروط استخدام المنصة.'],
      ['risk', 'قرأت إفصاح المخاطر، وأدرك أنني قد أخسر كامل المبلغ المستثمر، وأنه لا ضمان للعائد ولا لرأس المال.'],
      ['privacy', 'أوافق على معالجة بياناتي الشخصية وفق سياسة الخصوصية وقانون حماية البيانات الشخصية.'],
      ['nomarket', 'أدرك عدم وجود سوق ثانوية لبيع حصتي قبل انتهاء مدة المشروع.'],
    ];
    panel = '<div class="stack-s">' + items.map(it =>
      '<label class="check"><input type="checkbox" class="rc" data-c="' + it[0] + '"'
      + (REG.consents[it[0]] ? ' checked' : '') + '><span>' + esc(it[1]) + '</span></label>').join('') + '</div>'
      + '<div id="rerr"></div>'
      + '<div class="row"><button class="btn" data-act="regBack">رجوع</button>'
      + '<button class="btn btn--primary" data-act="regNext">متابعة</button></div>';
  }

  const otpStep = REG.kind === 'investor' ? 6 : 4;
  if (REG.step === otpStep) {
    title = 'تأكيد الحساب'; sub = 'أُرسل رمز من ستة أرقام. في النسخة الحقيقية يصل برسالة قصيرة إلى رقمك.';
    panel = '<div class="note note--info">رمزك التجريبي: <strong class="mono">' + REG.otp + '</strong></div>'
      + '<div class="field"><label for="rotp">الرمز</label>'
      + '<input id="rotp" class="otp" inputmode="numeric" maxlength="6" value="' + esc(REG.typed) + '"></div>'
      + '<div id="rerr"></div>'
      + '<div class="row"><button class="btn" data-act="regBack">رجوع</button>'
      + '<button class="btn btn--primary" data-act="regFinish">إنشاء الحساب</button></div>'
      + '<p class="xs muted">سيُنشأ حسابك بحالة «تحقق قيد المراجعة». تستطيع التصفح فورًا، ولا تستطيع إنشاء التزام قبل أن يعتمد فريق الالتزام تحققك.</p>';
  }

  return '<div class="pub authwrap"><div class="authcard authcard--wide">'
    + bar
    + '<div class="authhead"><h1 id="pagetitle" tabindex="-1">' + title + '</h1><p>' + sub + '</p></div>'
    + panel
    + '<div class="authfoot">لديك حساب؟ '
    + '<button class="linkbtn" data-act="pub" data-pub="login">سجّل الدخول</button></div>'
    + '</div></div>';
}

function jobPermsHtml(job) {
  const spec = STAFF_JOBS.find(j => j.k === job);
  if (!spec) return '';
  return 'ستحمل الدعوة هذه الصلاحيات: <span class="mono xs">' + spec.perms.join(' · ') + '</span>';
}

/* ── administrator · accounts and invitations ─────────────────────────── */
VIEWS['ops.admin'] = () => {
  const u = me();
  const canEnrol = can(u, 'admin.enrol');
  const canReset = can(u, 'admin.users');
  const resets = STATE.resets.slice().reverse();
  const openRs = resets.filter(r => resetState(r) === 'open');
  /* One button, two tables: issuing a code is the same act whoever it is for. */
  const resetBtn = t => (canReset && t.id !== u.id && !t.suspended && !t.erasedAt
    ? '<button class="btn btn--sm" data-act="issueReset" data-user="' + t.id + '">كود استرداد</button>'
    : '<span class="xs muted">—</span>');
  const invites = STATE.invites.slice().reverse();
  const openInv = invites.filter(i => inviteState(i) === 'open');
  const staff = STATE.users.filter(x => x.role === 'staff');
  const members = STATE.users.filter(x => x.role !== 'staff');

  const inviteRows = invites.length
    ? invites.map(i => {
        const st = inviteState(i);
        return '<tr><td><span class="mono">' + i.code + '</span></td>'
          + '<td class="sm">' + esc(JOB_AR[i.job] || i.job) + '</td>'
          + '<td class="sm">' + esc(i.note || '—') + '</td>'
          + '<td>' + chip(INVITE_STATE, st) + '</td>'
          + '<td class="sm">' + (i.usedBy ? esc((user(i.usedBy) || {}).name || i.usedBy) : dt(i.expiresAt)) + '</td>'
          + '<td>' + (st === 'open' && canEnrol
              ? '<button class="btn btn--sm btn--danger" data-act="revokeInvite" data-code="' + i.code + '">إلغاء</button>'
              : '<span class="xs muted">—</span>') + '</td></tr>';
      }).join('')
    : '<tr><td colspan="6" class="empty">لم يُصدر كود بعد.</td></tr>';

  const staffRows = staff.map(t => {
    const self = t.id === u.id;
    return '<tr><td><div class="sm">' + esc(t.name) + (self ? ' <span class="chip">أنت</span>' : '') + '</div>'
      + '<div class="xs muted mono">' + esc(t.email || '') + '</div></td>'
      + '<td>' + (canEnrol && !self
          ? '<select data-act="setJob" data-user="' + t.id + '" style="min-width:9rem">'
            + STAFF_JOBS.map(j => '<option value="' + j.k + '"' + (j.k === t.job ? ' selected' : '') + '>'
              + esc(JOB_AR[j.k] || j.k) + '</option>').join('') + '</select>'
          : '<span class="sm">' + esc(JOB_AR[t.job] || t.job) + '</span>') + '</td>'
      + '<td class="sm">' + (t.perms || []).length + ' صلاحية'
      + '<div class="xs muted" style="max-width:22rem">' + (t.perms || []).join(' · ') + '</div></td>'
      + '<td>' + (t.suspended
          ? '<span class="chip chip--crit"><span class="chip__dot"></span>موقوف</span>'
          : '<span class="chip chip--pos"><span class="chip__dot"></span>نشط</span>') + '</td>'
      + '<td class="sm">' + (t.enrolledVia ? '<span class="mono xs">' + t.enrolledVia + '</span>' : 'مُنشأ ابتداءً') + '</td>'
      + '<td class="sm">' + (t.lastSignInAt ? dt(t.lastSignInAt, true) : '<span class="xs muted">لم يدخل بعد</span>') + '</td>'
      + '<td>' + resetBtn(t) + '</td>'
      + '<td>' + (canEnrol && !self
          ? '<button class="btn btn--sm' + (t.suspended ? '' : ' btn--danger') + '" data-act="toggleSuspend" '
            + 'data-user="' + t.id + '" data-on="' + (t.suspended ? '0' : '1') + '">'
            + (t.suspended ? 'إعادة تفعيل' : 'إيقاف') + '</button>'
          : '<span class="xs muted">—</span>') + '</td></tr>';
  }).join('');

  const memberRows = members.map(t => '<tr><td><div class="sm">' + esc(t.name) + '</div>'
    + '<div class="xs muted mono">' + esc(t.email || '') + '</div></td>'
    + '<td class="sm">' + esc(ROLE_AR[t.role]) + (t.role === 'investor' ? ' · ' + CLASS_AR[t.cls] : '') + '</td>'
    + '<td>' + (t.kyc === 'approved' ? '<span class="chip chip--pos"><span class="chip__dot"></span>معتمد</span>'
              : t.kyc === 'rejected' ? '<span class="chip chip--crit"><span class="chip__dot"></span>مرفوض</span>'
              : '<span class="chip chip--warn"><span class="chip__dot"></span>قيد المراجعة</span>') + '</td>'
    + '<td>' + (t.suspended ? '<span class="chip chip--crit"><span class="chip__dot"></span>موقوف</span>'
                            : '<span class="chip chip--pos"><span class="chip__dot"></span>نشط</span>') + '</td>'
    + '<td class="sm">' + (t.lastSignInAt ? dt(t.lastSignInAt, true) : '<span class="xs muted">لم يدخل بعد</span>') + '</td>'
    + '<td>' + resetBtn(t) + '</td>'
    + '<td>' + (() => {
        if (!canReset) return '<span class="xs muted">—</span>';
        if (t.erasedAt) return '<span class="chip">مطموس ' + dt(t.erasedAt) + '</span>';
        const b = eraseBlockers(t.id);
        /* A button that can only fail is not a control. Say what stands in the
           way instead, so the administrator knows what to close first. */
        return b.length
          ? '<span class="xs muted" title="' + esc(b.join('، ')) + '">مانع قائم</span>'
          : '<button class="btn btn--sm btn--danger" data-act="erasePerson" data-user="'
            + t.id + '">طمس البيانات</button>';
      })() + '</td>'
    + '<td>' + (canEnrol
        ? '<button class="btn btn--sm' + (t.suspended ? '' : ' btn--danger') + '" data-act="toggleSuspend" '
          + 'data-user="' + t.id + '" data-on="' + (t.suspended ? '0' : '1') + '">'
          + (t.suspended ? 'إعادة تفعيل' : 'إيقاف') + '</button>'
        : '<span class="xs muted">—</span>') + '</td></tr>').join('');

  return {
    crumb: 'فريق التشغيل · إدارة النظام', title: 'الحسابات والصلاحيات',
    lede: 'حسابات فريق التشغيل تُنشأ بدعوة يصدرها مدير النظام وتحمل الوظيفة وصلاحياتها. لا يختار أحد صلاحيته لنفسه، ولا يغيّر مدير وظيفته بنفسه.',
    body: (canEnrol ? '' : '<div class="note note--warn">حسابك يقرأ هذه الشاشة ولا يغيّر فيها.</div>')
      + (canEnrol
        ? '<div class="card"><div class="card__head"><h2>إصدار كود دعوة</h2>'
          + '<span class="spacer chip ' + (openInv.length ? 'chip--pos' : '') + '">' + openInv.length + ' صالح</span></div>'
          + '<div class="card__body">'
          + '<div class="grid grid--2">'
          + '<div class="field"><label for="ijob">الوظيفة</label><select id="ijob" data-act="jobPreview">'
          + STAFF_JOBS.map(j => '<option value="' + j.k + '">' + esc(JOB_AR[j.k] || j.k) + '</option>').join('')
          + '</select></div>'
          + '<div class="field"><label for="inote">لمن (اختياري)</label>'
          + '<input id="inote" placeholder="اسم الموظف أو قسمه"></div>'
          + '</div>'
          + '<div id="jobperms" class="note sm">' + jobPermsHtml(STAFF_JOBS[0].k) + '</div>'
          + '<button class="btn btn--primary" data-act="issueInvite">إصدار الكود</button>'
          + '<p class="xs muted">صالح لمرة واحدة ولمدة ' + INVITE_TTL_DAYS
          + ' أيام. سلّمه للموظف ليستخدمه من رابط «انضمام موظف» في شاشة الدخول.</p>'
          + '</div></div>'
        : '')
      + '<div class="card"><div class="card__head"><h2>أكواد الدعوة</h2></div>'
      + '<div class="card__body card__body--flush"><div class="tablewrap"><table>'
      + '<thead><tr><th>الكود</th><th>الوظيفة</th><th>لمن</th><th>الحالة</th><th>استُخدم / ينتهي</th><th></th></tr></thead>'
      + '<tbody>' + inviteRows + '</tbody></table></div></div></div>'
      + '<div class="card"><div class="card__head"><h2>فريق التشغيل</h2>'
      + '<span class="spacer chip">' + staff.length + '</span></div>'

    + '<button class="btn" data-act="logout">تسجيل الخروج</button></div></div>';

/* ══ actions ═════════════════════════════════════════════════════════════ */
const ACTS = {
  /* ── auth ─────────────────────────────────────────────────────────── */
  pub:   d => setSession({ pub: d.pub }),
  logout: () => {
    REG = { step: 1, kind: 'investor', name: '', email: '', pw: '', cls: 'retail',
            answers: {}, consents: {}, otp: null, typed: '' };
    ENR = { step: 1, code: '', job: null, name: '', email: '', pw: '', otp: null, typed: '' };
    setSession({ authUserId: null, pub: 'landing', view: null });
  },
  quickLogin: d => {
    const u = user(d.user);
    if (!u) return;
    if (u.suspended) { toast('هذا الحساب موقوف.', 'bad'); return; }
    setSession({ authUserId: u.id, view: null, pub: 'landing' });
    toast('دخلت باسم ' + u.name + '.', 'good');
  },
  doLogin: async (d, el) => {
    const email = document.getElementById('lem').value.trim().toLowerCase();
    const pw = document.getElementById('lpw').value;
    const box = document.getElementById('lerr');
    const say = (m, kind) => { box.innerHTML = '<div class="note note--' + (kind || 'crit') + ' sm">' + esc(m) + '</div>'; };
    /* The counter is keyed by the e-mail typed, not by the account found, so
       the wait is identical whether or not that account exists. */
    const wait = signinWait(email);
    if (wait > 0) {
      say('محاولات كثيرة متتالية. انتظر ' + wait + ' ثانية ثم أعد المحاولة.', 'warn');
      return;
    }
    const miss = () => {
      const n = signinFailed(email);
      const next = signinWait(email);
      say('البريد أو كلمة المرور غير صحيحة.'
        + (next > 0 ? ' بعد ' + n + ' محاولات، المحاولة التالية بعد ' + next + ' ثانية.' : ''));
    };
    const u = STATE.users.find(x => (x.email || '').toLowerCase() === email);
    /* An erased account keeps no salt and no hash, so there is nothing to
       derive against. It fails the same way a wrong address does — the door
       is gone, and saying so would confirm the account once existed. */
    if (!u || !pw || !u.salt || !u.pw) { miss(); return; }
    el.disabled = true; el.textContent = 'جارٍ التحقق…';
    const got = await derive(pw, u.salt);
    el.disabled = false; el.textContent = 'دخول';
    /* same failure message whether the account exists or the password is wrong */
    if (!sameHash(got, u.pw)) { miss(); return; }
    if (u.suspended) {
      say('هذا الحساب موقوف. راجع مدير النظام.');
      return;
    }
    signinCleared(email);
    setSession({ authUserId: u.id, view: null });
    toast('أهلًا ' + u.name + '.', 'good');
    /* Only where it persists. Without a writer there is nothing to record to,
       and committing would only fire the "this saves for nobody" warning at
       someone who has not yet done anything they expect to be saved. */
    if (WRITER) {
      /* The session is set first so the audit row carries the right actor. */
      await commit('تسجيل دخول', st => actRecordSignIn(st, u.id));
    }
  },

  /* ── the account's own password ───────────────────────────────────────── */
  changePw: async (d, el) => {
    const cur = document.getElementById('cpwCur').value;
    const nw  = document.getElementById('cpwNew').value;
    const ag  = document.getElementById('cpwAgain').value;
    const box = document.getElementById('cpwErr');
    const say = (m, kind) => { box.innerHTML = '<div class="note note--' + (kind || 'crit') + ' sm">' + esc(m) + '</div>'; };
    const u = me();
    const bad = pwProblem(nw, ag, cur);
    if (bad) { say(bad); return; }
    el.disabled = true; el.textContent = 'جارٍ التغيير…';
    const ok = sameHash(await derive(cur, u.salt), u.pw);

  /* ── registration ─────────────────────────────────────────────────── */
  regKind: d => { REG.kind = d.kind; render(); },
  regCls:  d => { REG.cls = d.cls; render(); },
  regAns:  d => { REG.answers[d.q] = Number(d.v); render(); },
  regBack: () => { if (REG.step > 1) REG.step -= 1; render(); },
  regNext: () => {
    const err = m => { const b = document.getElementById('rerr');
      if (b) b.innerHTML = '<div class="note note--crit sm">' + esc(m) + '</div>'; };

    if (REG.step === 2) {
      REG.name = document.getElementById('rname').value.trim();
      REG.email = document.getElementById('remail').value.trim().toLowerCase();
      const pw = document.getElementById('rpw').value, pw2 = document.getElementById('rpw2').value;
      if (REG.name.length < 3) return err('اكتب اسمك الكامل.');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(REG.email)) return err('بريد إلكتروني غير صالح.');
      if (STATE.users.some(u => (u.email || '').toLowerCase() === REG.email)) return err('هذا البريد مسجَّل بالفعل.');
      if (pw.length < 8) return err('كلمة المرور ثمانية أحرف على الأقل.');
      if (pw !== pw2) return err('كلمتا المرور غير متطابقتين.');
      REG.pw = pw;
    }
    if (REG.step === 3 && REG.kind === 'investor' && REG.cls !== 'retail') {
      const box = document.getElementById('rproof');
      if (box && !box.checked) return err('يلزم الإقرار باستيفاء شروط هذا الصنف.');
    }
    if (REG.step === 4 && REG.kind === 'investor') {
      if (Object.keys(REG.answers).length < SUIT_Q.length) return err('أجب عن كل الأسئلة.');
    }
    const consentStep = REG.kind === 'investor' ? 5 : 3;
    if (REG.step === consentStep) {
      document.querySelectorAll('.rc').forEach(c => { REG.consents[c.dataset.c] = c.checked; });
      if (!['terms', 'risk', 'privacy', 'nomarket'].every(k => REG.consents[k]))
        return err('يلزم قبول الموافقات الأربع صراحةً.');
      REG.otp = String(Math.floor(100000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 900000)));
    }
    REG.step += 1;
    render();
  },
  regFinish: async (d, el) => {
    const err = m => { const b = document.getElementById('rerr');
      if (b) b.innerHTML = '<div class="note note--crit sm">' + esc(m) + '</div>'; };
    REG.typed = document.getElementById('rotp').value.trim();
    if (REG.typed !== REG.otp) return err('الرمز غير صحيح.');

    el.disabled = true; el.textContent = 'جارٍ الإنشاء…';
    const salt = newSalt();
    const hash = await derive(REG.pw, salt);
    el.disabled = false;

    const score = Object.values(REG.answers).reduce((a, b) => a + b, 0);
    const id = 'u_new' + (STATE.users.length + 1);
    const ok = await commit('إنشاء حساب', st => {
      if (st.users.some(u => (u.email || '').toLowerCase() === REG.email))
        throw new Error('هذا البريد مسجَّل بالفعل.');
      const row = { id, name: REG.name, email: REG.email, salt, pw: hash,
                    role: REG.kind, consents: true, createdAt: nowIso() };
      if (REG.kind === 'investor') {
        /* A declared class is a claim, not a fact: it stays retail until
           compliance sees the evidence. */
        row.cls = 'retail';
        row.claimedCls = REG.cls;
        row.kyc = 'pending';
        row.suit = score >= SUIT_PASS ? 'pass' : 'restricted';
        row.suitScore = score;
      } else {
        row.pool = null;
        row.kyc = 'pending';
      }
      st.users.push(row);
      /* The identifier, not the e-mail: this row can never be rewritten, and a
   person who later asks for erasure would find their address preserved
   inside the one structure the system refuses to alter. */
      return { entity: id, actor: id, detail: 'حساب جديد (' + ROLE_AR[REG.kind] + ')' };
    });
    if (!ok) return;
    REG = { step: 1, kind: 'investor', name: '', email: '', pw: '', cls: 'retail',
            answers: {}, consents: {}, otp: null, typed: '' };
    setSession({ authUserId: id, view: null, pub: 'landing' });
    toast('أُنشئ حسابك. التحقق قيد المراجعة.', 'good');
  },

    /* Only the fields this step owns are enforced here; the whole-application
       check runs again at submit and again at approval. */
    const v = checkApplication(APP);
    const SCOPE = { 1: ['المنشأة'], 2: ['المشروع'], 3: ['التمويل'],
                    4: ['استخدام الأموال'], 5: ['المراحل'], 6: ['السيناريوهات', 'المخاطر'] };
    const mine = (SCOPE[APP.step] || []).flatMap(g => v.bad.filter(b => b[0] === g));

    render();

    if (!['true', 'nopromise', 'milestones', 'report'].every(k => APP.decls[k]))
      return err('يلزم قبول الإقرارات الأربعة صراحةً.');
    const v = checkApplication(APP);
    if (!v.ok) return err(v.bad[0][0] + ': ' + v.bad[0][1]);
    const draft = JSON.parse(JSON.stringify(APP));
    delete draft.step; delete draft.editingId;
    const editing = APP.editingId;
    const ok = editing
      ? await commit('إعادة تقديم طلب', st => actUpdateApplication(st, editing, draft, SESSION.authUserId))
      : await commit('تقديم طلب تمويل', st => actSubmitApplication(st, draft, SESSION.authUserId));
    if (!ok) return;
    APP = Object.assign({ step: 1, editingId: null }, BLANK_APP());
    setSession({ view: 'own.apps' });
    toast(editing ? 'أُعيد تقديم الطلب للفحص.' : 'قُدِّم الطلب. ستصلك ملاحظات الفحص هنا.', 'good');
  },

  uofAdd: () => { captureApp(); APP.uof.push({ item: '', supplier: '', amount: 0, quote: '' }); render(); },
  uofDel: d => { captureApp(); APP.uof.splice(Number(d.i), 1); render(); },
  msAdd:  () => { captureApp(); APP.milestones.push({ label: '', condition: '', amount: 0 }); render(); },
  msDel:  d => { captureApp(); APP.milestones.splice(Number(d.i), 1); render(); },
  riskAdd: () => { captureApp(); APP.risks.push(''); render(); },

  appReview: async d => {
    const box = document.getElementById('appnote');
    const note = box ? box.value : '';
    const ok = await commit('مراجعة طلب تمويل', st => actReviewApplication(st, d.app, d.do, note, SESSION.authUserId));
    if (ok) toast({ start: 'بدأ الفحص.', info: 'أُرسل طلب الاستكمال للمالك.',
                    approve: 'وافقت اللجنة — يمكن بناء الإفصاح ونشره.',
                    reject: 'سُجل الرفض مع سببه.' }[d.do] || 'نُفِّذ.', d.do === 'reject' ? 'bad' : 'good');
  },
  appPublish: async d => {
    const ok = await commit('نشر فرصة من طلب', st => actPublishApplication(st, d.app));
    if (ok) toast('نُشرت الفرصة وفُتحت للاستثمار.', 'good');
  },

  approveKyc: async d => {
    const ok = await commit('اعتماد تحقق', st => {
      assertPerm('kyc.approve');
      const t = st.users.find(x => x.id === d.user);
      if (!t) throw new Error('حساب غير موجود.');
      if (t.kyc === 'approved') throw new Error('معتمد بالفعل.');
      t.kyc = 'approved';
      t.kycApprovedAt = nowIso();
      if (d.grant === '1' && t.claimedCls) { t.cls = t.claimedCls; t.classApproved = true; }
      return { entity: t.id, detail: 'اعتماد تحقق ' + t.name
        + (d.grant === '1' && t.claimedCls ? ' ورفع الصنف إلى ' + CLASS_AR[t.claimedCls] : '') };
    });
    if (ok) toast('اعتُمد التحقق.', 'good');
  },
  rejectKyc: async d => {
    const ok = await commit('رفض تحقق', st => {
      assertPerm('kyc.approve');
      const t = st.users.find(x => x.id === d.user);
      if (!t) throw new Error('حساب غير موجود.');
      t.kyc = 'rejected';
      return { entity: t.id, detail: 'رفض تحقق ' + t.name };
    });
    if (ok) toast('سُجل الرفض.', 'bad');
  },

  go:      d => setSession({ view: d.view }),
  pickPool:    (d, el) => setSession({ poolId: el.value }),
  pickOwnPool: (d, el) => setSession({ ownPoolId: el.value }),
  setJob: async (d, el) => {
    const ok = await commit('تغيير وظيفة', st => actSetJob(st, d.user, el.value, SESSION.authUserId));
    if (ok) toast('حُدِّثت الوظيفة وصلاحياتها.', 'good');
  },
  jobPreview: (d, el) => {
    const box = document.getElementById('jobperms');
    if (box) box.innerHTML = jobPermsHtml(el.value);
  },
  setWin:  d => setSession({ win: Number(d.win) }),
  setTab:  d => setSession({ tab: d.tab }),
  openPool:d => setSession({ poolId: d.pool, view: 'inv.pool', tab: 'disclosure' }),
  investIn:d => setSession({ poolId: d.pool, view: 'inv.invest' }),
  theme:   () => {
    const root = document.documentElement;
    const dark = root.getAttribute('data-theme') === 'dark'
      || (!root.hasAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
    try { localStorage.setItem('hissa.theme', dark ? 'light' : 'dark'); } catch (e) {}
  },
  toggleFrame: (d, el) => {
    const f = document.getElementById(d.frame);
    const toTable = f.dataset.view === 'chart';
    f.dataset.view = toTable ? 'table' : 'chart';
    el.textContent = toTable ? 'عرض كرسم' : 'عرض كجدول';
  },
  addKpi: () => {
    const box = document.getElementById('kpiRows');
    if (box) box.insertAdjacentHTML('beforeend', kpiRowHtml());
  },

  submitOrder: async d => {
    const acks = [...document.querySelectorAll('.ack')];
    if (!acks.every(a => a.checked)) { toast('يلزم قبول الإقرارات الخمسة صراحةً.', 'bad'); return; }
    const amount = parseOmr(document.getElementById('iamt').value);
    if (amount == null) { toast('مبلغ غير صالح — مثال: 500.000', 'bad'); return; }
    const ok = await commit('إنشاء التزام', st => actCreateOrder(st, SESSION.authUserId, d.pool, amount));
    if (ok) toast('أُنشئ الالتزام. لك ' + STATE.settings.coolingOffHours + ' ساعة للعدول.', 'good');
  },
  closePool: async d => {
    const ok = await commit('إغلاق تمويل', st => actClosePool(st, d.pool));
    if (ok) toast('نُفِّذ الإغلاق وفق القاعدة.', 'good');
  },
  requestDsb: async d => {
    const mid = document.getElementById('msel').value;
    const ev  = document.getElementById('mev').value;
    const p = pool(d.pool), m = p.milestones.find(x => x.id === mid);
    const ok = await commit('طلب صرف مرحلة', st => actRequestDsb(st, d.pool, mid, m.amount, ev, SESSION.authUserId));
    if (ok) toast('أُرسل الطلب — يحتاج اعتماد طرف ثانٍ.', 'good');
  },
  createDsb: async () => {
    const [pid, mid] = document.getElementById('dpick').value.split('|');
    const ev = document.getElementById('dev').value;
    const p = pool(pid), m = p.milestones.find(x => x.id === mid);
    const ok = await commit('طلب صرف مرحلة', st => actRequestDsb(st, pid, mid, m.amount, ev, SESSION.authUserId));
    if (ok) toast('أُنشئ الطلب باسمك — لا يمكنك اعتماده بنفسك.', 'good');
  },
  approveDsb: async d => {
    const ok = await commit('اعتماد صرف', st => actApproveDisbursement(st, d.dsb, SESSION.authUserId));
    if (ok) toast('اعتُمد وصُرف.', 'good');
  },
  createDist: async d => {
    const gross = parseOmr(document.getElementById('dgross').value);
    const period = document.getElementById('dper').value.trim() || 'غير محددة';
    if (gross == null) { toast('مبلغ غير صالح.', 'bad'); return; }
    const ok = await commit('تنفيذ توزيع', st => actCreateDistribution(st, d.pool, gross, period));
    if (ok) toast('وُزّع المبلغ تناسبيًا على المستثمرين.', 'good');
  },
  submitReport: async d => {
    const kpis = [...document.querySelectorAll('.kpirow')].map(r => ({
      metric: r.querySelector('.k-metric').value.trim(),
      actual: Number(r.querySelector('.k-actual').value),
      forecast: r.querySelector('.k-forecast').value === '' ? null : Number(r.querySelector('.k-forecast').value),
    })).filter(k => k.metric && !Number.isNaN(k.actual) && r_ok(k));
    const ok = await commit('تقديم تقرير', st => actSubmitReport(st, d.report, kpis,
      document.getElementById('rnarr').value, document.getElementById('rvar').value));
    if (ok) toast('قُدِّم التقرير — بانتظار مراجعة فريق المتابعة.', 'good');
  },
};
const r_ok = k => k.metric.length > 0;
const actRequestDsb = actRequestDisbursement;

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.tagName === 'SELECT') return;
  const fn = ACTS[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t.dataset, t, e); }
});
/* Amount fields retotal as you type — the balance rule is the whole point of
   these two steps, so it must not wait for a step change to show. */
document.addEventListener('input', e => {
  const t = e.target.closest('[data-live="uof"], [data-live="ms"], .a_live');
  if (!t) return;
  captureApp();
  const target = APP.ask.target;
  const uofT = sumBy(APP.uof, 'amount'), msT = sumBy(APP.milestones, 'amount');
  const sum = document.getElementById('uofSum');
  if (sum) sum.textContent = fmt(uofT, 0);
  const bal = document.getElementById('uofBal');
  if (bal) {
    const diff = target - uofT;
    bal.className = 'note note--' + (target && diff === 0 ? 'pos' : 'warn') + ' sm';
    bal.textContent = !target ? 'حدّد المبلغ المطلوب في الخطوة السابقة أولًا.'
      : diff === 0 ? 'المجموع يطابق المبلغ المطلوب بالضبط.'
      : diff > 0 ? 'ينقص ' + fmt(diff, 0) + ' ر.ع لتغطية المطلوب.'
                 : 'يزيد ' + fmt(-diff, 0) + ' ر.ع عن المطلوب.';
  }
  const mbal = document.getElementById('msBal');
  if (mbal) {
    const diff = uofT - msT;
    mbal.className = 'note note--' + (uofT && diff === 0 ? 'pos' : 'warn') + ' sm';
    mbal.textContent = 'مجموع المراحل ' + fmt(msT, 0) + ' مقابل استخدام الأموال ' + fmt(uofT, 0)
      + (diff === 0 && uofT ? ' — مطابق.' : ' — الفرق ' + fmt(Math.abs(diff), 0) + ' ر.ع.');
  }
});

/* Ticking a document or a declaration changes the readiness verdict, so the
   last step has to redraw — otherwise it keeps showing a stale count. */
document.addEventListener('change', e => {
  if (e.target.classList && (e.target.classList.contains('docchk') || e.target.classList.contains('declchk'))) {
    captureApp();
    const box = document.getElementById('appReady');
    if (box) box.innerHTML = readinessHtml();
    return;
  }
  const t = e.target.closest('[data-act]');
  if (!t || t.tagName !== 'SELECT') return;
  const fn = ACTS[t.dataset.act];
  if (fn) fn(t.dataset, t, e);
});

/* ══ boot ════════════════════════════════════════════════════════════════ */
try {
  const th = localStorage.getItem('hissa.theme');
  if (th) document.documentElement.setAttribute('data-theme', th);
} catch (e) {}

render();

/* The writer resolves later, never during this first run, and may never
   resolve at all — the app is fully usable before it does. */
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('artifact').then(ns => {
    WRITER = ns;
    MODE = ns ? 'live' : 'local';
    render();
  }).catch(() => { MODE = 'local'; render(); });
  /* Saving resolves separately and may never resolve: the export panel
     renders disabled until it does, and stays disabled if it does not. */
  window.claude.use('downloads').then(ns => { SAVER = ns || false; render(); })
    .catch(() => { SAVER = false; render(); });
} else {
  MODE = 'local';
  SAVER = false;
  render();
}
})();
</script>
