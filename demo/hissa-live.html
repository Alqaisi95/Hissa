<title>حِصّة | Hissa Pools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style id="appstyle">
  /* ═══ tokens ════════════════════════════════════════════════════════════
     Complete light palette on bare :root. Dark redefines the same names
     twice — once for the system preference, once for an explicit choice —
     so the in-page toggle wins in both directions.
     ═══════════════════════════════════════════════════════════════════ */
  :root {
    --canvas:#f4f6f4; --panel:#ffffff; --panel-2:#eef1ee; --rule:#dfe3df; --rule-2:#ebeee9;
    --ink:#131d1b; --ink-2:#4b5755; --ink-3:#7c8785;
    --brand:#0d5c58; --brand-2:#0a4341; --brand-wash:#e0eeec; --on-brand:#ffffff;
    --sand:#8f5d16; --sand-wash:#f7efe1;
    --pos:#186040;  --pos-wash:#dcefe5;
    --warn:#7a4c0e; --warn-wash:#f9eed9;
    --crit:#8e1a1a; --crit-wash:#f8e4e4;
    --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a;
    --ord-1:#7cbfc2; --ord-2:#52a4a8; --ord-3:#2b878b; --ord-4:#136a6e; --ord-5:#0a4649;
    --st-good:#0ca30c; --st-warn:#fab219; --st-serious:#ec835a; --st-crit:#d03b3b;
    --grid:#e2e6e2;
    --r:10px; --r-s:6px;
    --ar:'IBM Plex Sans Arabic','Segoe UI',system-ui,sans-serif;
    --mo:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    --shadow:0 1px 2px rgba(16,28,26,.05), 0 8px 24px rgba(16,28,26,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas:#090e0d; --panel:#111a18; --panel-2:#192320; --rule:#233130; --rule-2:#182322;
      --ink:#e8efed; --ink-2:#a6b4b1; --ink-3:#75827f;
      --brand:#4bb3ab; --brand-2:#7ad2c8; --brand-wash:#0f2f2c; --on-brand:#041a19;
      --sand:#d5a05c; --sand-wash:#2a2216;
      --pos:#5cba8c; --pos-wash:#11301f;
      --warn:#d4a158; --warn-wash:#2e2413;
      --crit:#e58181; --crit-wash:#331717;
      --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70;
      --ord-1:#1d7478; --ord-2:#2b959a; --ord-3:#43b0b4; --ord-4:#67c8cb; --ord-5:#96dee0;
      --grid:#1e2b2a;
      --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --canvas:#090e0d; --panel:#111a18; --panel-2:#192320; --rule:#233130; --rule-2:#182322;
    --ink:#e8efed; --ink-2:#a6b4b1; --ink-3:#75827f;
    --brand:#4bb3ab; --brand-2:#7ad2c8; --brand-wash:#0f2f2c; --on-brand:#041a19;
    --sand:#d5a05c; --sand-wash:#2a2216;
    --pos:#5cba8c; --pos-wash:#11301f;
    --warn:#d4a158; --warn-wash:#2e2413;
    --crit:#e58181; --crit-wash:#331717;
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70;
    --ord-1:#1d7478; --ord-2:#2b959a; --ord-3:#43b0b4; --ord-4:#67c8cb; --ord-5:#96dee0;
    --grid:#1e2b2a;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.35);
  }

  /* ═══ base ═════════════════════════════════════════════════════════════ */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--canvas); color: var(--ink);
    font-family: var(--ar); font-size: 15px; line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,h4 { margin: 0; line-height: 1.3; font-weight: 600; }
  h1 { font-size: 1.45rem; letter-spacing: -.01em; }
  h2 { font-size: 1.05rem; }
  h3 { font-size: .92rem; }
  p, ul, ol { margin: 0; }
  ul, ol { padding-inline-start: 1.2rem; }
  /* mixed Arabic + Latin resolves per paragraph, not per document */
  p, li, td, th, dd, dt, .txt, .lede { unicode-bidi: plaintext; }
  a { color: var(--brand); }
  img, svg { max-width: 100%; }
  .num, .mono { font-family: var(--mo); font-variant-numeric: tabular-nums; }
  /* identifier-like runs stay LTR whatever the paragraph around them does */
  .mono, code { direction: ltr; unicode-bidi: isolate; display: inline-block; }
  .muted { color: var(--ink-3); }
  .sm { font-size: .82rem; } .xs { font-size: .73rem; }
  .stack { display: flex; flex-direction: column; gap: 1.15rem; }
  .stack-s { display: flex; flex-direction: column; gap: .55rem; }
  .row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
  .row--tight { gap: .35rem; }
  .spacer { margin-inline-start: auto; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 3px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

  /* ═══ shell ════════════════════════════════════════════════════════════ */
  .riskbar {
    background: var(--warn-wash); color: var(--warn);
    border-block-end: 1px solid color-mix(in srgb, var(--warn) 22%, transparent);
    font-size: .76rem; text-align: center; padding: .45rem 1rem;
  }
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--panel) 90%, transparent);
    backdrop-filter: blur(10px);
    border-block-end: 1px solid var(--rule);
    display: flex; align-items: center; gap: .9rem;
    padding: .6rem clamp(.8rem, 3vw, 1.6rem);
  }
  .brand { display: flex; align-items: center; gap: .6rem; min-width: 0; }
  .brand__mark {
    inline-size: 32px; block-size: 32px; flex: none; border-radius: 9px;
    background: var(--brand); color: var(--on-brand);
    display: grid; place-items: center; font-weight: 700; font-size: 1.05rem;
  }
  .brand__name { font-weight: 700; font-size: 1.02rem; line-height: 1.15; }
  .brand__sub { font-size: .68rem; color: var(--ink-3); line-height: 1.2; }

  .seg { display: flex; background: var(--panel-2); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button {
    font: inherit; font-size: .78rem; border: 0; cursor: pointer; white-space: nowrap;
    background: none; color: var(--ink-2); padding: .3rem .75rem; border-radius: 999px;
  }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
  .iconbtn {
    font: inherit; font-size: .76rem; cursor: pointer;
    background: var(--panel); color: var(--ink-2);
    border: 1px solid var(--rule); border-radius: 999px; padding: .3rem .7rem;
  }
  .iconbtn:hover { color: var(--ink); border-color: var(--ink-3); }

  .topbar__who { max-width: 200px; }
  @media (max-width: 720px) {
    .topbar { flex-wrap: wrap; row-gap: .5rem; }
    .brand { flex: 1 1 100%; }
    .topbar > .spacer { display: none; }
    .seg { overflow-x: auto; max-width: 100%; }
    .topbar__who { flex: 1 1 8rem; max-width: none; }
  }

  .layout { display: grid; grid-template-columns: 226px minmax(0, 1fr); align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }

  .side {
    position: sticky; top: 49px; align-self: start;
    block-size: calc(100dvh - 49px); overflow-y: auto;
    border-inline-end: 1px solid var(--rule);
    padding: 1rem .7rem 2rem;
    display: flex; flex-direction: column; gap: .15rem;
  }
  .side__group { font-size: .66rem; letter-spacing: .07em; text-transform: uppercase;
                 color: var(--ink-3); padding: .9rem .6rem .3rem; }
  .navlink {
    display: flex; align-items: center; gap: .55rem; width: 100%;
    font: inherit; font-size: .86rem; text-align: start; cursor: pointer;
    background: none; border: 0; color: var(--ink-2);
    padding: .48rem .6rem; border-radius: var(--r-s);
  }
  .navlink:hover { background: var(--panel-2); color: var(--ink); }
  .navlink[aria-current="true"] { background: var(--brand-wash); color: var(--brand); font-weight: 600; }
  .navlink__n { font-family: var(--mo); font-size: .68rem; color: var(--ink-3); flex: none; }
  .navlink[aria-current="true"] .navlink__n { color: var(--brand); }
  .navlink__badge {
    margin-inline-start: auto; font-family: var(--mo); font-size: .68rem;
    background: var(--panel-2); color: var(--ink-2); border-radius: 999px; padding: 0 .4rem;
  }
  @media (max-width: 900px) {
    .side {
      position: static; block-size: auto; flex-direction: row; overflow-x: auto;
      border-inline-end: 0; border-block-end: 1px solid var(--rule);
      padding: .5rem .8rem; gap: .3rem; scrollbar-width: thin;
    }
    .side__group { display: none; }
    .navlink { width: auto; white-space: nowrap; background: var(--panel-2); }
    .navlink__badge { margin-inline-start: .2rem; }
  }

  .main { padding: clamp(1rem, 3vw, 2rem) clamp(.8rem, 3vw, 2rem) 4rem; min-width: 0; }
  .main__inner { max-width: 1080px; margin-inline: auto; display: flex; flex-direction: column; gap: 1.4rem; }
  .pagehead { display: flex; flex-direction: column; gap: .3rem; }
  .pagehead__crumb { font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .pagehead__lede { color: var(--ink-2); font-size: .9rem; max-width: 74ch; }

  /* ═══ surfaces ═════════════════════════════════════════════════════════ */
  .card {
    background: var(--panel); border: 1px solid var(--rule);
    border-radius: var(--r); box-shadow: var(--shadow);
  }
  .card__head {
    display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
    padding: .8rem 1rem; border-block-end: 1px solid var(--rule-2);
  }
  .card__body { padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
  .card__body--flush { padding: 0; }
  .grid { display: grid; gap: 1.1rem; }
  .grid--2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
  .grid--3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
  .grid--4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 175px), 1fr)); }

  .kv { background: var(--panel-2); border-radius: var(--r-s); padding: .6rem .75rem; }
  .kv__k { font-size: .72rem; color: var(--ink-3); }
  .kv__v { font-family: var(--mo); font-size: 1.05rem; font-weight: 600; }

  .chip {
    display: inline-flex; align-items: center; gap: .3rem;
    font-size: .72rem; font-weight: 500; border-radius: 999px;
    padding: .1rem .55rem; background: var(--panel-2); color: var(--ink-2);
    unicode-bidi: plaintext;
  }
  .chip__dot { inline-size: 6px; block-size: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .chip--brand { background: var(--brand-wash); color: var(--brand); }
  .chip--pos   { background: var(--pos-wash);   color: var(--pos); }
  .chip--warn  { background: var(--warn-wash);  color: var(--warn); }
  .chip--crit  { background: var(--crit-wash);  color: var(--crit); }
  .chip--sand  { background: var(--sand-wash);  color: var(--sand); }

  .note {
    border-radius: var(--r-s); padding: .6rem .8rem; font-size: .82rem;
    background: var(--panel-2); color: var(--ink-2);
    border-inline-start: 3px solid var(--ink-3);
  }
  .note--info { background: var(--brand-wash); color: var(--brand-2); border-color: var(--brand); }
  .note--warn { background: var(--warn-wash); color: var(--warn); border-color: var(--warn); }
  .note--crit { background: var(--crit-wash); color: var(--crit); border-color: var(--crit); }
  .note--pos  { background: var(--pos-wash);  color: var(--pos);  border-color: var(--pos); }
  .empty { color: var(--ink-3); font-size: .85rem; text-align: center; padding: 1.6rem 1rem; }

  /* ═══ tables ═══════════════════════════════════════════════════════════ */
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .84rem; }
  th, td { text-align: start; padding: .5rem .75rem; border-block-end: 1px solid var(--rule-2); vertical-align: top; }
  th { font-size: .72rem; color: var(--ink-3); font-weight: 600; white-space: nowrap; }
  tbody tr:last-child td { border-block-end: 0; }
  td.n, th.n { text-align: end; font-family: var(--mo); font-variant-numeric: tabular-nums; white-space: nowrap; }
  tbody tr:hover { background: var(--rule-2); }
  tfoot td { font-weight: 600; border-block-start: 1px solid var(--rule); }

  /* ═══ forms ════════════════════════════════════════════════════════════ */
  .field { display: flex; flex-direction: column; gap: .25rem; min-width: 0; }
  .field > label { font-size: .78rem; color: var(--ink-2); font-weight: 500; }
  .field__hint { font-size: .72rem; color: var(--ink-3); }
  input, select, textarea {
    font: inherit; font-size: .88rem; color: var(--ink);
    background: var(--panel); border: 1px solid var(--rule);
    border-radius: var(--r-s); padding: .45rem .6rem; width: 100%;
  }
  input[type="number"], input.num { font-family: var(--mo); }
  textarea { resize: vertical; min-height: 4.5rem; }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px var(--brand-wash); }
  .check { display: flex; align-items: flex-start; gap: .5rem; font-size: .82rem; color: var(--ink-2); }
  .check input { inline-size: 16px; block-size: 16px; margin: .28rem 0 0; flex: none; accent-color: var(--brand); }

  .btn {
    font: inherit; font-size: .85rem; font-weight: 500; cursor: pointer;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--rule); border-radius: var(--r-s);
    padding: .45rem .95rem; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { border-color: var(--ink-3); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn--primary { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
  .btn--primary:hover:not(:disabled) { background: var(--brand-2); border-color: var(--brand-2); }
  .btn--danger { background: var(--crit-wash); color: var(--crit); border-color: color-mix(in srgb, var(--crit) 30%, transparent); }
  .btn--sm { font-size: .76rem; padding: .25rem .6rem; }

  /* ═══ tabs inside a view ═══════════════════════════════════════════════ */
  .tabs { display: flex; gap: .2rem; overflow-x: auto; border-block-end: 1px solid var(--rule); }
  .tabs button {
    font: inherit; font-size: .84rem; cursor: pointer; white-space: nowrap;
    background: none; border: 0; border-block-end: 2px solid transparent;
    color: var(--ink-3); padding: .5rem .8rem; margin-block-end: -1px;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { color: var(--brand); border-block-end-color: var(--brand); font-weight: 600; }

  /* ═══ meters, tiles, charts ════════════════════════════════════════════ */
  .meter { display: block; background: var(--panel-2); border-radius: 999px; block-size: 8px; overflow: hidden; }
  .meter__fill { display: block; block-size: 100%; border-radius: 999px; background: var(--brand); }

  .tile {
    background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r);
    border-inline-start: 3px solid var(--tone, var(--brand));
    padding: .8rem .9rem; display: flex; flex-direction: column; gap: .2rem;
  }
  .tile__k { font-size: .76rem; color: var(--ink-3); }
  .tile__v { font-family: var(--mo); font-size: 1.6rem; font-weight: 600; line-height: 1.15; }
  .tile__s { font-size: .72rem; color: var(--ink-2); display: flex; align-items: center; gap: .35rem; }
  .tile__s .chip__dot { background: var(--tone, var(--brand)); }
  .tile__state { font-weight: 600; color: var(--tone, var(--brand)); }

  .frame { display: flex; flex-direction: column; gap: .5rem; }
  .frame__head { display: flex; align-items: flex-start; gap: .6rem; }
  .frame__sub { font-size: .75rem; color: var(--ink-3); max-width: 62ch; }
  .frame__toggle {
    margin-inline-start: auto; flex: none; font: inherit; font-size: .71rem; cursor: pointer;
    background: var(--panel-2); color: var(--ink-2);
    border: 1px solid var(--rule); border-radius: 999px; padding: .15rem .55rem;
  }
  .frame__toggle:hover { color: var(--ink); }
  .frame[data-view="table"] .frame__chart, .frame[data-view="chart"] .frame__table { display: none; }

  .plot { width: 100%; height: auto; display: block; overflow: visible; }
  /* the plot is drawn LTR in both languages, and so are its numerals */
  .plot text { font-family: var(--mo); font-size: 10px; fill: var(--ink-3); direction: ltr; unicode-bidi: isolate; }
  .plot .axis { stroke: var(--grid); stroke-width: 1; }

  .bars { display: flex; flex-direction: column; gap: .5rem; }
  .bars__row { display: grid; grid-template-columns: minmax(6.5rem, 32%) 1fr auto; gap: .6rem; align-items: center; }
  .bars__label { font-size: .8rem; color: var(--ink-2); }
  .bars__val { font-family: var(--mo); font-size: .78rem; }
  @media (max-width: 560px) {
    .bars__row { grid-template-columns: 1fr auto; }
    .bars__row .meter { grid-column: 1 / -1; }
  }

  .funnel { display: flex; flex-direction: column; gap: .8rem; }
  .funnel__top { display: flex; align-items: baseline; gap: .6rem; }
  .funnel__val { margin-inline-start: auto; font-family: var(--mo); font-weight: 600; font-size: .88rem; }

  /* ═══ timeline ═════════════════════════════════════════════════════════ */
  .tl { display: flex; flex-direction: column; }
  .tl__item { display: grid; grid-template-columns: 18px 1fr; gap: .7rem; padding-block-end: 1rem; position: relative; }
  .tl__item:not(:last-child)::before {
    content: ''; position: absolute; inset-block: 16px 0;
    inset-inline-start: 8px; inline-size: 1px; background: var(--rule);
  }
  .tl__dot {
    inline-size: 17px; block-size: 17px; border-radius: 50%; margin-block-start: 3px;
    background: var(--panel); border: 2px solid var(--rule); z-index: 1;
  }
  .tl__dot--done { background: var(--brand); border-color: var(--brand); }
  .tl__dot--now  { background: var(--panel); border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-wash); }
  .tl__t { font-size: .86rem; font-weight: 500; }
  .tl__d { font-size: .74rem; color: var(--ink-3); }

  /* ═══ toast ════════════════════════════════════════════════════════════ */
  .toasts {
    position: fixed; inset-block-end: 1rem; inset-inline-start: 1rem; z-index: 90;
    display: flex; flex-direction: column; gap: .5rem; max-width: min(92vw, 400px);
  }
  .toast {
    background: var(--panel); border: 1px solid var(--rule); border-inline-start: 3px solid var(--brand);
    border-radius: var(--r-s); box-shadow: var(--shadow); padding: .6rem .8rem; font-size: .82rem;
  }
  .toast--bad { border-inline-start-color: var(--crit); }
  .toast--good { border-inline-start-color: var(--pos); }

  .savebar {
    display: flex; align-items: center; gap: .5rem;
    font-size: .73rem; color: var(--ink-3);
  }
  .savebar__dot { inline-size: 7px; block-size: 7px; border-radius: 50%; background: var(--ink-3); }
  .savebar--live .savebar__dot { background: var(--st-good); }
  .savebar--ro .savebar__dot { background: var(--st-warn); }

  /* ═══ public shell: landing, sign-in, registration ════════════════════ */
  .pubnav {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--canvas) 88%, transparent);
    backdrop-filter: blur(10px); border-block-end: 1px solid var(--rule);
    display: flex; align-items: center; gap: .8rem; padding: .7rem clamp(.9rem, 4vw, 2.5rem);
  }
  .pub { max-width: 1080px; margin-inline: auto; padding-inline: clamp(.9rem, 4vw, 2rem); }
  .hero { padding-block: clamp(2.5rem, 7vw, 4.5rem) clamp(1.5rem, 4vw, 2.5rem); }
  .hero h1 {
    font-size: clamp(1.75rem, 4.6vw, 2.9rem); line-height: 1.22;
    letter-spacing: -.02em; max-width: 20ch;
  }
  .hero__lede { font-size: clamp(.95rem, 1.6vw, 1.1rem); color: var(--ink-2); max-width: 60ch; margin-block-start: .9rem; }
  .hero__cta { display: flex; gap: .6rem; flex-wrap: wrap; margin-block-start: 1.5rem; }
  .btn--lg { font-size: .95rem; padding: .6rem 1.4rem; }
  .eyebrow {
    font-size: .72rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--brand); font-family: var(--mo);
  }
  .section { padding-block: clamp(1.8rem, 4vw, 3rem); border-block-start: 1px solid var(--rule); }
  .section__head { margin-block-end: 1.3rem; display: flex; flex-direction: column; gap: .35rem; }
  .section__head p { color: var(--ink-2); font-size: .9rem; max-width: 68ch; }

  .steps { counter-reset: s; display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }
  .step { position: relative; padding-block-start: 2.1rem; }
  .step::before {
    counter-increment: s; content: counter(s, decimal-leading-zero);
    position: absolute; inset-block-start: 0; inset-inline-start: 0;
    font-family: var(--mo); font-size: .8rem; font-weight: 600;

<div id="root"></div>
<div class="toasts" id="toasts"></div>
<script id="appscript">
(() => {
'use strict';
document.documentElement.lang = 'ar';
document.documentElement.dir  = 'rtl';

/* ══════════════════════════════════════════════════════════════════════════
   PERSISTENCE
   The page is the database. Every action rewrites the document with the new
   state embedded, and publishes it — all open views reload to that version.
   The template is the pristine <style> and <script> source read out of the
   DOM at boot; the live DOM is never serialized.
   ══════════════════════════════════════════════════════════════════════════ */
const STYLE_SRC  = document.getElementById('appstyle').textContent;
const SCRIPT_SRC = document.getElementById('appscript').textContent;
const CLOSE = '</' + 'script>';

let STATE = JSON.parse(document.getElementById('appstate').textContent);
let WRITER = null;              // the artifact namespace, once resolved
let MODE = 'loading';           // loading | live | local

function buildDoc(st) {
  const json = JSON.stringify(st).replace(/</g, '\\u003c');
  return '<!doctype html>\n<html lang="ar" dir="rtl">\n<head>\n'
    + '<meta charset="utf-8">\n'
    + '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
    + '<title>حِصّة | Hissa Pools</title>\n'
    + '<link rel="preconnect" href="https://fonts.googleapis.com">\n'
    + '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'
    + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">\n'
    + '<style id="appstyle">' + STYLE_SRC + '</style>\n</head>\n<body>\n'
    + '<script id="appstate" type="application/json">' + json + CLOSE + '\n'
    + '<div id="root"></div>\n<div class="toasts" id="toasts"></div>\n'
    + '<script id="appscript">' + SCRIPT_SRC + CLOSE + '\n</body>\n</html>';
}

/* Apply a mutation, chain an audit entry, persist. Returns false if the
   mutation itself refused (a rule said no) — those never reach storage. */
async function commit(label, mutate) {
  const draft = JSON.parse(JSON.stringify(STATE));
  let entry;
  try {
    entry = mutate(draft);
  } catch (err) {
    toast(err.message || 'تعذّر تنفيذ الإجراء', 'bad');
    return false;
  }
  appendAudit(draft, Object.assign({ action: label }, entry || {}));
  STATE = draft;
  render();

  if (!WRITER) {
    toast('نُفِّذ في هذه الجلسة فقط — لم يُحفظ للجميع', 'bad');
    return true;
  }
  try {
    await WRITER.publish(buildDoc(STATE));
    /* every open view, this one included, reloads to the new version */
  } catch (err) {
    const code = err && err.code;
    if (code === 'conflict') {
      toast('حفظ شخص آخر نسخة أحدث. ستُحمَّل نسختُه — أعد الإجراء عليها.', 'bad');
    } else if (code === 'not_granted' || code === 'not_writer') {
      MODE = 'local'; render();
      toast('لديك صلاحية قراءة فقط — الإجراء ظاهر لك ولا يُحفظ.', 'bad');
    } else {
      toast('تعذّر الحفظ: ' + (err && err.message ? err.message : 'خطأ غير معروف'), 'bad');
    }
  }
  return true;
}

/* ══ money: integer baisa throughout. 1 OMR = 1000 baisa, never a float. ══ */
const BAISA = 1000;
const omr = v => Math.round(v * BAISA);
function fmt(b, dec = 3) {
  if (b == null || Number.isNaN(b)) return '—';
  const neg = b < 0, abs = Math.abs(Math.trunc(b));
  const whole = (Math.floor(abs / BAISA)).toLocaleString('en-US');
  return (neg ? '-' : '') + (dec === 0 ? whole : whole + '.' + String(abs % BAISA).padStart(3, '0'));
}
const rial = (b, dec = 0) => fmt(b, dec) + ' ر.ع';
function parseOmr(text) {
  const s = String(text).trim().replace(/,/g, '');
  if (!/^\d+(\.\d{1,3})?$/.test(s)) return null;
  const [w, f = ''] = s.split('.');
  return Number(w) * BAISA + Number(f.padEnd(3, '0'));
}

/* Largest-remainder apportionment: the parts always sum to exactly `total`,
   so no baisa is invented or lost by rounding. */
function proRata(total, weights) {
  const sum = weights.reduce((a, b) => a + b, 0);
  if (sum <= 0) return weights.map(() => 0);
  const base = weights.map(w => Math.floor((total * w) / sum));
  let rem = total - base.reduce((a, b) => a + b, 0);
  const order = weights
    .map((w, i) => ({ i, r: total * w - Math.floor((total * w) / sum) * sum }))
    .sort((a, b) => b.r - a.r || a.i - b.i);
  for (const { i } of order) { if (rem <= 0) break; base[i] += 1; rem -= 1; }
  return base;
}

/* ══ ids, time, hashing ═══════════════════════════════════════════════════ */
const nowIso = () => new Date().toISOString();
function nextId(list, prefix) {
  const year = new Date().getFullYear();
  const n = list.filter(x => String(x.id).startsWith(prefix)).length + 1;
  return prefix + '-' + year + '-' + String(n).padStart(4, '0');
}
/* FNV-1a 64. Enough to make tampering with a log row visible; the server-side
   system chains SHA-256 instead. */
function h64(str) {
  const P = 0x100000001b3n, M = (1n << 64n) - 1n;
  let h = 0xcbf29ce484222325n;
  for (let i = 0; i < str.length; i += 1) { h ^= BigInt(str.charCodeAt(i)); h = (h * P) & M; }
  return h.toString(16).padStart(16, '0');
}
function appendAudit(st, entry) {
  const prev = st.audit.length ? st.audit[st.audit.length - 1].hash : '0'.repeat(16);
  const row = Object.assign({ at: nowIso(), actor: SESSION.authUserId }, entry, { prev });
  row.hash = h64(prev + '|' + JSON.stringify(row));
  st.audit.push(row);
}

/* ══ derived reads ═══════════════════════════════════════════════════════ */
const COUNTED  = new Set(['pending', 'confirmed', 'allocated']);
const user  = id => STATE.users.find(u => u.id === id);
const pool  = id => STATE.pools.find(p => p.id === id);
const ordersOf = poolId => STATE.orders.filter(o => o.poolId === poolId);
const raised   = poolId => ordersOf(poolId).filter(o => COUNTED.has(o.status)).reduce((s, o) => s + o.amount, 0);
const allocatedOf = poolId => STATE.orders.filter(o => o.poolId === poolId && o.status === 'allocated');
const uofTotal = p => p.uof.reduce((s, u) => s + u.amount, 0);
const ceilingOf = p => Math.round((p.target * STATE.settings.overfundBps) / 10000);

function rolling12m(userId) {
  return STATE.orders.filter(o => o.userId === userId && COUNTED.has(o.status))
                     .reduce((s, o) => s + o.amount, 0);
}
function perIssuer(userId, poolId) {
  return STATE.orders.filter(o => o.userId === userId && o.poolId === poolId && COUNTED.has(o.status))
                     .reduce((s, o) => s + o.amount, 0);
}

/* ══ eligibility: every reason a commitment can be refused, in one place ══ */
function eligibility(u, p) {
  const blocks = [];
  if (!u) return { blocks: [['—', 'اختر مستثمرًا.']], available: 0 };
  if (u.kyc !== 'approved') blocks.push(['BR-009', 'يلزم اكتمال التحقق من الهوية قبل إنشاء أي التزام.']);
  if (u.suit === 'restricted') blocks.push(['FR-005', 'نتيجة اختبار الملاءمة لا تسمح بهذا النوع من الاستثمار.']);
  if (!u.consents) blocks.push(['FR-006', 'يلزم قبول الشروط وإفصاح المخاطر وسياسة الخصوصية.']);
  if (p.status !== 'funding') blocks.push(['FR-205', 'هذه الفرصة غير مفتوحة للاستثمار حاليًا.']);

  const caps = STATE.settings.limits[u.cls] || { perIssuer: null, rolling12m: null };
  const usedIssuer  = perIssuer(u.id, p.id);
  const usedRolling = rolling12m(u.id);
  const headIssuer  = caps.perIssuer  == null ? Infinity : Math.max(0, caps.perIssuer  - usedIssuer);
  const headRolling = caps.rolling12m == null ? Infinity : Math.max(0, caps.rolling12m - usedRolling);
  const poolLeft    = Math.max(0, ceilingOf(p) - raised(p.id));

  const raw = Math.min(headIssuer, headRolling, poolLeft);
  const available = Number.isFinite(raw) ? raw : poolLeft;

  let binding = 'سعة الفرصة', bindingId = 'BR-017';
  if (caps.perIssuer != null && headIssuer <= headRolling && headIssuer <= poolLeft) {
    binding = 'حدّك لكل متقدم تمويل'; bindingId = 'BR-003';
  } else if (caps.rolling12m != null && headRolling <= poolLeft) {
    binding = 'حدّك خلال 12 شهرًا'; bindingId = u.cls === 'angel' ? 'BR-005' : 'BR-004';
  }
  if (available <= 0 && !blocks.length) blocks.push([bindingId, 'بلغت الحد المتاح لك في هذه الفرصة.']);

  return { blocks, available, binding, bindingId, caps, usedIssuer, usedRolling, poolLeft };
}

/* ══ actions ═════════════════════════════════════════════════════════════ */
function actCreateOrder(st, userId, poolId, amount) {
  const u = STATE.users.find(x => x.id === userId), p = pool(poolId);
  const v = eligibility(u, p);
  if (v.blocks.length) throw new Error(v.blocks[0][1]);
  if (amount == null) throw new Error('مبلغ غير صالح.');
  if (amount < STATE.settings.minTicket) throw new Error('أقل من الحد الأدنى ' + rial(STATE.settings.minTicket) + '.');
  if (amount > v.available) throw new Error('يتجاوز المتاح لك (' + rial(v.available) + ') — القيد: ' + v.binding + '.');
  const id = nextId(st.orders, 'ORD');
  st.orders.push({ id, poolId, userId, amount, status: 'pending', createdAt: nowIso() });
  return { entity: id, detail: 'التزام بـ ' + rial(amount, 3) + ' في ' + p.ref };
}

function actCancelOrder(st, orderId) {
  const o = st.orders.find(x => x.id === orderId);
  if (!o) throw new Error('التزام غير موجود.');
  if (o.status !== 'pending') throw new Error('لا يمكن الإلغاء إلا خلال مهلة العدول وقبل التأكيد.');
  o.status = 'cancelled';
  o.cancelledAt = nowIso();
  return { entity: orderId, detail: 'إلغاء خلال مهلة العدول (' + STATE.settings.coolingOffHours + ' ساعة)' };
}

/* Closing decides the pool's fate by the rule, not by anyone's discretion:
   below the minimum every baisa goes back; above the ceiling everyone is
   scaled down pro rata and a share that falls under the minimum ticket is
   refunded whole, its money redistributed. */
function actClosePool(st, poolId) {
  const p = st.pools.find(x => x.id === poolId);
  if (!p) throw new Error('فرصة غير موجودة.');
  if (p.status !== 'funding') throw new Error('لا تُغلق إلا فرصة مفتوحة للتمويل.');
  const live = st.orders.filter(o => o.poolId === poolId && COUNTED.has(o.status));
  const total = live.reduce((s, o) => s + o.amount, 0);

  if (total < p.minClose) {
    live.forEach(o => { o.status = 'refunded'; o.refundReason = 'target_not_reached'; });
    p.status = 'refunding';
    p.closedAt = nowIso();
    return { entity: p.ref, detail: 'لم يبلغ الحد الأدنى — استُرد ' + rial(total) + ' على ' + live.length + ' التزامًا' };
  }

  const ceiling = ceilingOf(p);
  if (total <= ceiling) {
    live.forEach(o => { o.status = 'allocated'; o.allocated = o.amount; });
  } else {
    let alloc = proRata(ceiling, live.map(o => o.amount));
    for (let pass = 0; pass < live.length; pass += 1) {
      const under = alloc.map((a, i) => ({ a, i })).filter(x => x.a > 0 && x.a < st.settings.minTicket);
      if (!under.length) break;
      under.forEach(x => { alloc[x.i] = 0; });
      const w = alloc.map((a, i) => (a > 0 ? live[i].amount : 0));
      if (w.every(x => x === 0)) break;
      alloc = proRata(ceiling, w);
    }
    live.forEach((o, i) => {
      const got = Math.min(alloc[i], o.amount);
      o.allocated = got;
      o.refunded = o.amount - got;
      o.status = got > 0 ? 'allocated' : 'refunded';
      if (got === 0) o.refundReason = 'allocation_remainder';
    });
  }
  p.status = 'funded';
  p.fundedAt = nowIso();
  const got = live.reduce((s, o) => s + (o.allocated || 0), 0);
  return { entity: p.ref, detail: 'أُغلقت على ' + rial(got) + ' موزعة على ' + live.filter(o => o.status === 'allocated').length + ' مستثمرًا' };
}

function actRequestDisbursement(st, poolId, milestoneId, amount, evidence, byUserId) {
  if (!evidence || evidence.trim().length < 6) throw new Error('يلزم وصف الدليل المرفق قبل طلب الصرف.');
  const p = st.pools.find(x => x.id === poolId);
  const m = p.milestones.find(x => x.id === milestoneId);
  if (!m) throw new Error('مرحلة غير موجودة.');
  if (m.state !== 'pending') throw new Error('هذه المرحلة صُرفت أو قيد الصرف.');
  const id = nextId(st.disbursements, 'DSB');
  st.disbursements.push({ id, poolId, milestoneId, amount, status: 'requested',
    requestedBy: byUserId, requestedAt: nowIso(), approvedBy: null, approvedAt: null, evidence: evidence.trim() });
  m.state = 'requested';
  return { entity: id, detail: 'طلب صرف ' + rial(amount) + ' لمرحلة «' + m.label + '»' };
}

/* Dual control is enforced per transaction, not per role: the same person may
   hold both permissions and still cannot approve what they requested. */
function actApproveDisbursement(st, dsbId, byUserId) {
  const d = st.disbursements.find(x => x.id === dsbId);
  if (!d) throw new Error('طلب غير موجود.');
  if (d.status !== 'requested') throw new Error('هذا الطلب اعتُمد أو نُفِّذ.');
  if (d.requestedBy === byUserId) throw new Error('لا يعتمد الطلبَ من أنشأه — يلزم طرف ثانٍ.');
  d.status = 'executed';
  d.approvedBy = byUserId;
  d.approvedAt = nowIso();
  const p = st.pools.find(x => x.id === d.poolId);
  const m = p.milestones.find(x => x.id === d.milestoneId);
  if (m) m.state = 'executed';
  if (p.status === 'funded') p.status = 'operating';
  return { entity: dsbId, detail: 'اعتماد وصرف ' + rial(d.amount) + ' — طالب: ' + (user(d.requestedBy) || {}).name };
}

function actCreateDistribution(st, poolId, gross, period) {
  const p = st.pools.find(x => x.id === poolId);
  const holders = st.orders.filter(o => o.poolId === poolId && o.status === 'allocated');
  if (!holders.length) throw new Error('لا يوجد مستثمرون مخصَّصون في هذه الفرصة.');
  if (!gross || gross <= 0) throw new Error('مبلغ توزيع غير صالح.');
  const shares = proRata(gross, holders.map(o => o.allocated || o.amount));
  const id = nextId(st.distributions, 'DST');
  st.distributions.push({ id, poolId, period, gross, paidAt: nowIso(),
    shares: holders.map((o, i) => ({ userId: o.userId, orderId: o.id, amount: shares[i] })) });
  return { entity: id, detail: 'توزيع ' + rial(gross) + ' على ' + holders.length + ' مستثمرًا في ' + p.ref };
}

function actSubmitReport(st, reportId, kpis, narrative, variance) {
  const r = st.reports.find(x => x.id === reportId);
  if (!r) throw new Error('تقرير غير موجود.');
  if (!kpis.length) throw new Error('يلزم مؤشر واحد على الأقل.');
  if (narrative.trim().length < 20) throw new Error('السرد قصير جدًا — 20 حرفًا على الأقل.');
  if (/مضمون|ضمان العائد|بلا مخاطر/.test(narrative)) throw new Error('السرد يحتوي عبارة ضمان — غير مسموح.');
  r.kpis = kpis; r.narrative = narrative.trim(); r.variance = variance.trim();
  r.submittedAt = nowIso();
  r.status = new Date() > new Date(r.dueAt + 'T23:59:59Z') ? 'late' : 'submitted';
  return { entity: reportId, detail: 'تقديم تقرير ' + r.period + (r.status === 'late' ? ' (متأخر)' : '') };
}

function actPublishReport(st, reportId) {
  const r = st.reports.find(x => x.id === reportId);
  if (!r) throw new Error('تقرير غير موجود.');
  if (!['submitted', 'late'].includes(r.status)) throw new Error('لا يُنشر إلا تقرير مُقدَّم.');
  r.status = 'published';
  r.publishedAt = nowIso();
  return { entity: reportId, detail: 'نشر تقرير ' + r.period + ' للمستثمرين' };
}


/* ══════════════════════════════════════════════════════════════════════════
   CREDENTIALS
   PBKDF2-SHA256, 150k iterations, per-account salt — the same derivation the
   seeded accounts were built with. It needs a secure context (https, or
   localhost); without one the page falls back to a weak digest and says so,
   rather than silently pretending the check is strong.

   The derived hashes live inside this document, which anyone holding the link
   can read. That is fine for accounts that guard nothing real, and is exactly
   why the sign-up form tells you not to reuse a password that matters.
   ══════════════════════════════════════════════════════════════════════════ */
const SUBTLE = (typeof crypto !== 'undefined' && crypto.subtle && window.isSecureContext) ? crypto.subtle : null;
const PBKDF2_ROUNDS = 150000;

const toHex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
const fromHex = hex => new Uint8Array(hex.match(/../g).map(h => parseInt(h, 16)));

async function derive(password, saltHex) {
  if (!SUBTLE) return 'weak:' + h64(saltHex + '|' + password);
  const key = await SUBTLE.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await SUBTLE.deriveBits(
    { name: 'PBKDF2', salt: fromHex(saltHex), iterations: PBKDF2_ROUNDS, hash: 'SHA-256' }, key, 256);
  return toHex(bits);
}
function newSalt() {
  const b = new Uint8Array(16);
  (crypto.getRandomValues ? crypto : { getRandomValues: a => a }).getRandomValues(b);
  return toHex(b);
}
/* Constant-time-ish compare: never leak how much of the hash matched. */
function sameHash(a, b) {
  if (typeof a !== 'string' || typeof b !== 'string' || a.length !== b.length) return false;
  let diff = 0;
  for (let i = 0; i < a.length; i += 1) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
  return diff === 0;
}

function trendSvg(points, tickFmt) {
  if (points.length < 2) return '<p class="empty">لا توجد نقاط كافية لرسم منحنى بعد.</p>';
  const W = 720, H = 220, L = 48, R = 14, T = 12, B = 26;
  const max = Math.max.apply(null, points.map(p => p.value)) || 1;
  const step = (W - L - R) / (points.length - 1);
  const x = i => L + i * step;
  const y = v => T + (H - T - B) * (1 - v / max);
  const line = points.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(p.value).toFixed(1)).join('');
  const area = line + 'L' + x(points.length - 1).toFixed(1) + ',' + y(0) + 'L' + x(0).toFixed(1) + ',' + y(0) + 'Z';
  const grid = [0, .25, .5, .75, 1].map(f => max * f).map(v =>
    '<line class="axis" x1="' + L + '" y1="' + y(v).toFixed(1) + '" x2="' + (W - R) + '" y2="' + y(v).toFixed(1) + '"></line>'
    + '<text x="' + (L - 6) + '" y="' + (y(v) + 3.5).toFixed(1) + '" text-anchor="end">' + tickFmt(v) + '</text>').join('');
  const marks = [0, Math.floor(points.length / 2), points.length - 1];
  const xl = marks.map(i => '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="'
    + (i === 0 ? 'start' : i === points.length - 1 ? 'end' : 'middle') + '">' + points[i].label + '</text>').join('');
  const last = points[points.length - 1];
  return '<svg class="plot" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="منحنى تراكمي ينتهي عند '
    + tickFmt(last.value) + '">' + grid
    + '<path d="' + area + '" style="fill:var(--cat-1);opacity:.13"></path>'
    + '<path d="' + line + '" style="fill:none;stroke:var(--cat-1);stroke-width:2;stroke-linejoin:round"></path>'
    + '<circle cx="' + x(points.length - 1).toFixed(1) + '" cy="' + y(last.value).toFixed(1) + '" r="3.5" style="fill:var(--cat-1)"></circle>'
    + '<text x="' + (x(points.length - 1) - 6).toFixed(1) + '" y="' + (y(last.value) - 9).toFixed(1)
    + '" text-anchor="end" style="font-weight:600;fill:var(--ink)">' + tickFmt(last.value) + '</text>'
    + xl + '</svg>';
}

function barsHtml(items, valueFmt, colors) {
  if (!items.length) return '<p class="empty">لا بيانات.</p>';
  const max = Math.max.apply(null, items.map(i => i.value)) || 1;
  return '<div class="bars">' + items.map((it, i) =>
    '<div class="bars__row"><span class="bars__label">' + esc(it.label) + '</span>'
    + '<span class="meter"><span class="meter__fill" style="width:' + ((it.value / max) * 100).toFixed(1)
    + '%;background:' + (it.color || colors[i % colors.length]) + '"></span></span>'
    + '<span class="bars__val">' + valueFmt(it.value) + '</span></div>').join('') + '</div>';
}

function funnelHtml(stages) {

function toast(msg, kind) {
  const box = document.getElementById('toasts');

  el.textContent = msg;

  setTimeout(() => el.remove(), 6000);
}

function healthCounters() {
  const now = Date.now();
  const openCases = STATE.cases.filter(c => c.status === 'open');
  const overSla = openCases.filter(c => now - new Date(c.openedAt).getTime() > c.slaDays * 86400000);
  const recon = openCases.filter(c => c.kind === 'مطابقة');
  const lateReports = STATE.reports.filter(r =>
    r.status === 'late' || (r.status === 'scheduled' && now > new Date(r.dueAt + 'T23:59:59Z').getTime()));
  const dueSoon = STATE.reports.filter(r => r.status === 'scheduled'
    && new Date(r.dueAt + 'T23:59:59Z').getTime() - now < 45 * 86400000
    && new Date(r.dueAt + 'T23:59:59Z').getTime() >= now);
  const awaiting = STATE.disbursements.filter(d => d.status === 'requested');
  return { openCases, overSla, recon, lateReports, dueSoon, awaiting };
}
function commitmentSeries(days) {
  const end = new Date(); end.setUTCHours(0, 0, 0, 0);
  const start = new Date(end.getTime() - (days - 1) * 86400000);
  const buckets = new Map();
  STATE.orders.forEach(o => {
    const d = new Date(o.createdAt); d.setUTCHours(0, 0, 0, 0);
    if (d < start) { buckets.set('before', (buckets.get('before') || 0) + o.amount); return; }
    const k = d.toISOString().slice(0, 10);
    buckets.set(k, (buckets.get(k) || 0) + o.amount);
  });
  let run = buckets.get('before') || 0;
  const pts = [];
  for (let i = 0; i < days; i += 1) {
    const d = new Date(start.getTime() + i * 86400000);
    const k = d.toISOString().slice(0, 10);
    run += buckets.get(k) || 0;
    pts.push({ label: k.slice(5), value: run, amount: buckets.get(k) || 0 });
  }
  return pts;
}

/* Shows exactly what closing would do to each investor — before anyone
   clicks. The balance check is the point: allocated + refunded must equal
   requested, to the baisa. */
function allocationPreview() {
  const p = STATE.pools.find(x => x.status === 'funding');
  if (!p) return '<p class="empty">لا توجد فرصة مفتوحة للتمويل.</p>';
  const live = STATE.orders.filter(o => o.poolId === p.id && COUNTED.has(o.status));
  if (!live.length) return '<p class="empty">لا التزامات قائمة في ' + esc(p.ref) + '.</p>';
  const total = live.reduce((s, o) => s + o.amount, 0);
  const ceiling = ceilingOf(p);

  let alloc;
  if (total < p.minClose) alloc = live.map(() => 0);
  else if (total <= ceiling) alloc = live.map(o => o.amount);
  else {
    alloc = proRata(ceiling, live.map(o => o.amount));
    for (let pass = 0; pass < live.length; pass += 1) {
      const under = alloc.map((a, i) => ({ a, i })).filter(x => x.a > 0 && x.a < STATE.settings.minTicket);
      if (!under.length) break;
      under.forEach(x => { alloc[x.i] = 0; });
      const w = alloc.map((a, i) => (a > 0 ? live[i].amount : 0));
      if (w.every(x => x === 0)) break;
      alloc = proRata(ceiling, w);
    }
  }
  let tReq = 0, tGot = 0, tRef = 0, tUnits = 0;
  const rows = live.map((o, i) => {
    const got = Math.min(alloc[i], o.amount), ref = o.amount - got;
    const units = Math.floor(got / STATE.settings.unitPrice);
    tReq += o.amount; tGot += got; tRef += ref; tUnits += units;
    return '<tr><td class="sm">' + esc((user(o.userId) || {}).name) + '</td>'
      + '<td><span class="mono xs">' + o.id + '</span></td>'
      + '<td class="n">' + fmt(o.amount, 0) + '</td><td class="n">' + fmt(got, 0) + '</td>'
      + '<td class="n">' + (ref ? fmt(ref, 0) : '—') + '</td><td class="n">' + units + '</td></tr>';
  }).join('');

  const balanced = tGot + tRef === tReq && (total < p.minClose || tGot === Math.min(total, ceiling));
  const verdict = total < p.minClose
    ? 'الملتزم به ' + fmt(total, 0) + ' دون الحد الأدنى ' + fmt(p.minClose, 0) + ' — الإغلاق الآن يسترد كل شيء.'
    : total > ceiling
      ? 'الملتزم به ' + fmt(total, 0) + ' فوق السقف ' + fmt(ceiling, 0) + ' — يُخصَّص الجميع تناسبيًا.'
      : 'الملتزم به ' + fmt(total, 0) + ' بين الحد الأدنى والسقف — يُخصَّص كل التزام بالكامل.';

  return '<div class="note note--info">' + esc(p.ref) + ' — ' + verdict + '</div>'
    + '<div class="tablewrap"><table><thead><tr><th>المستثمر</th><th>الالتزام</th>'
    + '<th class="n">الطلب</th><th class="n">المخصَّص</th><th class="n">المسترد</th><th class="n">الوحدات</th></tr></thead>'
    + '<tbody>' + rows + '</tbody><tfoot><tr><td colspan="2">الإجمالي</td>'
    + '<td class="n">' + fmt(tReq, 0) + '</td><td class="n">' + fmt(tGot, 0) + '</td>'
    + '<td class="n">' + fmt(tRef, 0) + '</td><td class="n">' + tUnits + '</td></tr></tfoot></table></div>'
    + '<div class="note note--' + (balanced ? 'pos' : 'crit') + '">'
    + (balanced
        ? 'المطابقة تامة: المخصَّص زائد المسترد يساوي إجمالي الطلبات ' + fmt(tReq, 0) + ' ر.ع بالضبط — لا بايسة تُفقد أو تُستحدث.'
        : 'انحراف في المطابقة — لا يُغلق حتى يُحل.') + '</div>';
}

function createDsbForm() {
  const opts = [];
  STATE.pools.forEach(p => {
    if (!['funded', 'operating'].includes(p.status)) return;
    p.milestones.filter(m => m.state === 'pending').forEach(m => {
      opts.push('<option value="' + p.id + '|' + m.id + '">' + esc(p.ref) + ' — ' + esc(m.label)
        + ' (' + fmt(m.amount, 0) + ' ر.ع)</option>');
    });
  });
  if (!opts.length) return '<div class="note note--pos">لا توجد مرحلة قابلة للطلب الآن.</div>';
  return '<div class="field"><label for="dpick">المرحلة</label><select id="dpick">' + opts.join('') + '</select></div>'
    + '<div class="field"><label for="dev">وصف الدليل</label><textarea id="dev" placeholder="رقم المحضر أو الفاتورة وما تثبته"></textarea></div>'
    + '<button class="btn btn--primary" data-act="createDsb">إنشاء الطلب</button>'
    + '<p class="xs muted">سيُسجَّل باسمك، ولن تستطيع اعتماده بنفسك بعدها.</p>';
}

    lede: 'كل إجراء يُلحق بالسجل ولا يُعدَّل ولا يُحذف. كل سطر يحمل تجزئة السطر الذي قبله، فأي تغيير لاحق يكسر السلسلة ويظهر.',

function navBadge(key) {
  const h = healthCounters();
  if (key === 'inv.portfolio') return STATE.orders.filter(o => o.userId === SESSION.authUserId && COUNTED.has(o.status)).length || '';
  if (key === 'ops.money')  return h.awaiting.length || '';
  if (key === 'ops.kyc')    return STATE.users.filter(x => ['investor','owner'].includes(x.role) && x.kyc === 'pending').length || '';
  if (key === 'ops.audit')  return STATE.audit.length || '';
  if (key === 'ops.dash')   return h.openCases.length || '';
  if (key === 'own.reports') return STATE.reports.filter(r =>
    r.poolId === (me().pool || '') && ['scheduled', 'late'].includes(r.status)).length || '';
  return '';
}

  return '<div class="pub authwrap"><div class="authcard authcard--wide">'

/* A staff account with no permission at all still gets a real page, not a
   blank one — it says who to ask. */
function lockedOut(u) {
  return '<div class="pub authwrap"><div class="authcard">'
    + '<div class="authhead"><h1>لا صلاحيات مفعّلة</h1>'
    + '<p>حسابك «' + esc(u.name) + '» لا يحمل أي صلاحية تفتح شاشة. راجع مسؤول النظام لتفعيل صلاحياتك.</p></div>'
    + '<button class="btn" data-act="logout">تسجيل الخروج</button></div></div>';
}

/* ══ actions ═════════════════════════════════════════════════════════════ */
const ACTS = {
  /* ── auth ─────────────────────────────────────────────────────────── */
  pub:   d => setSession({ pub: d.pub }),
  logout: () => {
    REG = { step: 1, kind: 'investor', name: '', email: '', pw: '', cls: 'retail',
            answers: {}, consents: {}, otp: null, typed: '' };
    setSession({ authUserId: null, pub: 'landing', view: null });
  },
  quickLogin: d => {
    const u = user(d.user);
    if (!u) return;
    setSession({ authUserId: u.id, view: null, pub: 'landing' });
    toast('دخلت باسم ' + u.name + '.', 'good');
  },
  doLogin: async (d, el) => {
    const email = document.getElementById('lem').value.trim().toLowerCase();
    const pw = document.getElementById('lpw').value;
    const box = document.getElementById('lerr');
    const fail = () => { box.innerHTML = '<div class="note note--crit sm">البريد أو كلمة المرور غير صحيحة.</div>'; };
    const u = STATE.users.find(x => (x.email || '').toLowerCase() === email);
    if (!u || !pw) { fail(); return; }
    el.disabled = true; el.textContent = 'جارٍ التحقق…';
    const got = await derive(pw, u.salt);
    el.disabled = false; el.textContent = 'دخول';
    /* same failure message whether the account exists or the password is wrong */
    if (!sameHash(got, u.pw)) { fail(); return; }
    setSession({ authUserId: u.id, view: null });
    toast('أهلًا ' + u.name + '.', 'good');
  },

  /* ── registration ─────────────────────────────────────────────────── */
  regKind: d => { REG.kind = d.kind; render(); },
  regCls:  d => { REG.cls = d.cls; render(); },
  regAns:  d => { REG.answers[d.q] = Number(d.v); render(); },
  regBack: () => { if (REG.step > 1) REG.step -= 1; render(); },
  regNext: () => {
    const err = m => { const b = document.getElementById('rerr');
      if (b) b.innerHTML = '<div class="note note--crit sm">' + esc(m) + '</div>'; };

    if (REG.step === 2) {
      REG.name = document.getElementById('rname').value.trim();
      REG.email = document.getElementById('remail').value.trim().toLowerCase();
      const pw = document.getElementById('rpw').value, pw2 = document.getElementById('rpw2').value;
      if (REG.name.length < 3) return err('اكتب اسمك الكامل.');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(REG.email)) return err('بريد إلكتروني غير صالح.');
      if (STATE.users.some(u => (u.email || '').toLowerCase() === REG.email)) return err('هذا البريد مسجَّل بالفعل.');
      if (pw.length < 8) return err('كلمة المرور ثمانية أحرف على الأقل.');
      if (pw !== pw2) return err('كلمتا المرور غير متطابقتين.');
      REG.pw = pw;
    }
    if (REG.step === 3 && REG.kind === 'investor' && REG.cls !== 'retail') {
      const box = document.getElementById('rproof');
      if (box && !box.checked) return err('يلزم الإقرار باستيفاء شروط هذا الصنف.');
    }
    if (REG.step === 4 && REG.kind === 'investor') {
      if (Object.keys(REG.answers).length < SUIT_Q.length) return err('أجب عن كل الأسئلة.');
    }
    const consentStep = REG.kind === 'investor' ? 5 : 3;
    if (REG.step === consentStep) {
      document.querySelectorAll('.rc').forEach(c => { REG.consents[c.dataset.c] = c.checked; });
      if (!['terms', 'risk', 'privacy', 'nomarket'].every(k => REG.consents[k]))
        return err('يلزم قبول الموافقات الأربع صراحةً.');
      REG.otp = String(Math.floor(100000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 900000)));
    }
    REG.step += 1;
    render();
  },
  regFinish: async (d, el) => {
    const err = m => { const b = document.getElementById('rerr');
      if (b) b.innerHTML = '<div class="note note--crit sm">' + esc(m) + '</div>'; };
    REG.typed = document.getElementById('rotp').value.trim();
    if (REG.typed !== REG.otp) return err('الرمز غير صحيح.');

    el.disabled = true; el.textContent = 'جارٍ الإنشاء…';
    const salt = newSalt();
    const hash = await derive(REG.pw, salt);
    el.disabled = false;

    const score = Object.values(REG.answers).reduce((a, b) => a + b, 0);
    const id = 'u_new' + (STATE.users.length + 1);
    const ok = await commit('إنشاء حساب', st => {
      if (st.users.some(u => (u.email || '').toLowerCase() === REG.email))
        throw new Error('هذا البريد مسجَّل بالفعل.');
      const row = { id, name: REG.name, email: REG.email, salt, pw: hash,
                    role: REG.kind, consents: true, createdAt: nowIso() };
      if (REG.kind === 'investor') {
        /* A declared class is a claim, not a fact: it stays retail until
           compliance sees the evidence. */
        row.cls = 'retail';
        row.claimedCls = REG.cls;
        row.kyc = 'pending';
        row.suit = score >= SUIT_PASS ? 'pass' : 'restricted';
        row.suitScore = score;
      } else {
        row.pool = null;
        row.kyc = 'pending';
      }
      st.users.push(row);
      return { entity: id, detail: 'حساب جديد (' + ROLE_AR[REG.kind] + ') — ' + REG.email };
    });
    if (!ok) return;
    REG = { step: 1, kind: 'investor', name: '', email: '', pw: '', cls: 'retail',
            answers: {}, consents: {}, otp: null, typed: '' };
    setSession({ authUserId: id, view: null, pub: 'landing' });
    toast('أُنشئ حسابك. التحقق قيد المراجعة.', 'good');
  },

  approveKyc: async d => {
    const ok = await commit('اعتماد تحقق', st => {
      const t = st.users.find(x => x.id === d.user);
      if (!t) throw new Error('حساب غير موجود.');
      if (t.kyc === 'approved') throw new Error('معتمد بالفعل.');
      t.kyc = 'approved';
      t.kycApprovedAt = nowIso();
      if (d.grant === '1' && t.claimedCls) { t.cls = t.claimedCls; t.classApproved = true; }
      return { entity: t.id, detail: 'اعتماد تحقق ' + t.name
        + (d.grant === '1' && t.claimedCls ? ' ورفع الصنف إلى ' + CLASS_AR[t.claimedCls] : '') };
    });
    if (ok) toast('اعتُمد التحقق.', 'good');
  },
  rejectKyc: async d => {
    const ok = await commit('رفض تحقق', st => {
      const t = st.users.find(x => x.id === d.user);
      if (!t) throw new Error('حساب غير موجود.');
      t.kyc = 'rejected';
      return { entity: t.id, detail: 'رفض تحقق ' + t.name };
    });
    if (ok) toast('سُجل الرفض.', 'bad');
  },

  go:      d => setSession({ view: d.view }),
  setTab:  d => setSession({ tab: d.tab }),
  openPool:d => setSession({ poolId: d.pool, view: 'inv.pool', tab: 'disclosure' }),
  investIn:d => setSession({ poolId: d.pool, view: 'inv.invest' }),
  theme:   () => {
    const root = document.documentElement;
    const dark = root.getAttribute('data-theme') === 'dark'
      || (!root.hasAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
    try { localStorage.setItem('hissa.theme', dark ? 'light' : 'dark'); } catch (e) {}
  },
  toggleFrame: (d, el) => {
    const f = document.getElementById(d.frame);
    const toTable = f.dataset.view === 'chart';
    f.dataset.view = toTable ? 'table' : 'chart';
    el.textContent = toTable ? 'عرض كرسم' : 'عرض كجدول';
  },
  addKpi: () => {
    const box = document.getElementById('kpiRows');
    if (box) box.insertAdjacentHTML('beforeend', kpiRowHtml());
  },

  submitOrder: async d => {
    const acks = [...document.querySelectorAll('.ack')];
    if (!acks.every(a => a.checked)) { toast('يلزم قبول الإقرارات الخمسة صراحةً.', 'bad'); return; }
    const amount = parseOmr(document.getElementById('iamt').value);
    if (amount == null) { toast('مبلغ غير صالح — مثال: 500.000', 'bad'); return; }
    const ok = await commit('إنشاء التزام', st => actCreateOrder(st, SESSION.authUserId, d.pool, amount));
    if (ok) toast('أُنشئ الالتزام. لك ' + STATE.settings.coolingOffHours + ' ساعة للعدول.', 'good');
  },
  cancelOrder: async d => {
    const ok = await commit('إلغاء التزام', st => actCancelOrder(st, d.order));
    if (ok) toast('أُلغي الالتزام خلال مهلة العدول.', 'good');
  },
  closePool: async d => {
    const ok = await commit('إغلاق تمويل', st => actClosePool(st, d.pool));
    if (ok) toast('نُفِّذ الإغلاق وفق القاعدة.', 'good');
  },
  requestDsb: async d => {
    const mid = document.getElementById('msel').value;
    const ev  = document.getElementById('mev').value;
    const p = pool(d.pool), m = p.milestones.find(x => x.id === mid);
    const ok = await commit('طلب صرف مرحلة', st => actRequestDsb(st, d.pool, mid, m.amount, ev, SESSION.authUserId));
    if (ok) toast('أُرسل الطلب — يحتاج اعتماد طرف ثانٍ.', 'good');
  },
  createDsb: async () => {
    const [pid, mid] = document.getElementById('dpick').value.split('|');
    const ev = document.getElementById('dev').value;
    const p = pool(pid), m = p.milestones.find(x => x.id === mid);
    const ok = await commit('طلب صرف مرحلة', st => actRequestDsb(st, pid, mid, m.amount, ev, SESSION.authUserId));
    if (ok) toast('أُنشئ الطلب باسمك — لا يمكنك اعتماده بنفسك.', 'good');
  },
  approveDsb: async d => {
    const ok = await commit('اعتماد صرف', st => actApproveDisbursement(st, d.dsb, SESSION.authUserId));
    if (ok) toast('اعتُمد وصُرف.', 'good');
  },
  createDist: async d => {
    const gross = parseOmr(document.getElementById('dgross').value);
    const period = document.getElementById('dper').value.trim() || 'غير محددة';
    if (gross == null) { toast('مبلغ غير صالح.', 'bad'); return; }
    const ok = await commit('تنفيذ توزيع', st => actCreateDistribution(st, d.pool, gross, period));
    if (ok) toast('وُزّع المبلغ تناسبيًا على المستثمرين.', 'good');
  },
  submitReport: async d => {
    const kpis = [...document.querySelectorAll('.kpirow')].map(r => ({
      metric: r.querySelector('.k-metric').value.trim(),
      actual: Number(r.querySelector('.k-actual').value),
      forecast: r.querySelector('.k-forecast').value === '' ? null : Number(r.querySelector('.k-forecast').value),
    })).filter(k => k.metric && !Number.isNaN(k.actual) && r_ok(k));
    const ok = await commit('تقديم تقرير', st => actSubmitReport(st, d.report, kpis,
      document.getElementById('rnarr').value, document.getElementById('rvar').value));
    if (ok) toast('قُدِّم التقرير — بانتظار مراجعة فريق المتابعة.', 'good');
  },
  publishReport: async d => {
    const ok = await commit('نشر تقرير', st => actPublishReport(st, d.report));
    if (ok) toast('نُشر التقرير للمستثمرين.', 'good');
  },
};
const r_ok = k => k.metric.length > 0;
const actRequestDsb = actRequestDisbursement;

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.tagName === 'SELECT') return;
  const fn = ACTS[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t.dataset, t, e); }
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.tagName !== 'SELECT') return;
  if (t.dataset.act === 'pickPool') setSession({ poolId: t.value });
});

/* ══ boot ════════════════════════════════════════════════════════════════ */
try {
  const th = localStorage.getItem('hissa.theme');
  if (th) document.documentElement.setAttribute('data-theme', th);
} catch (e) {}

render();

/* The writer resolves later, never during this first run, and may never
   resolve at all — the app is fully usable before it does. */
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('artifact').then(ns => {
    WRITER = ns;
    MODE = ns ? 'live' : 'local';
    render();
  }).catch(() => { MODE = 'local'; render(); });
} else {
  MODE = 'local';
  render();
}
})();
</script>
