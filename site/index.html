<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0d5c58">
<meta name="application-name" content="حِصّة">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حِصّة">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
<title>حِصّة | Hissa Pools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style id="appstyle">
  /* ═══ tokens ════════════════════════════════════════════════════════════
     Complete light palette on bare :root. Dark redefines the same names
     twice — once for the system preference, once for an explicit choice —
     so the in-page toggle wins in both directions.
     ═══════════════════════════════════════════════════════════════════ */
  :root {
    --canvas:#f4f6f4; --panel:#ffffff; --panel-2:#eef1ee; --rule:#dfe3df; --rule-2:#ebeee9;
    --ink:#131d1b; --ink-2:#4b5755; --ink-3:#7c8785;
    --brand:#0d5c58; --brand-2:#0a4341; --brand-wash:#e0eeec; --on-brand:#ffffff;
    --sand:#8f5d16; --sand-wash:#f7efe1;
    --pos:#186040;  --pos-wash:#dcefe5;
    --warn:#7a4c0e; --warn-wash:#f9eed9;
    --crit:#8e1a1a; --crit-wash:#f8e4e4;
    --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a; --cat-4:#eda100; --cat-5:#e87ba4;
    --ord-1:#7cbfc2; --ord-2:#52a4a8; --ord-3:#2b878b; --ord-4:#136a6e; --ord-5:#0a4649;
    /* Severity is an ordered ramp — green → amber → orange → red — not a set
       of identities, so neighbouring steps are close by design. What the old
       steps failed was contrast, not separation: warn sat at 1.83:1 and
       serious at 2.64:1 against white, under the 3:1 a chart mark needs, and
       they were the two middle states an operator has to tell apart. These
       are measured ≥4.65:1 on paper and ≥5.91:1 on the dark ground, which the
       old set never had at all — it was declared once and inherited. */
    --st-good:#177d3a; --st-warn:#9a6b06; --st-serious:#c2521f; --st-crit:#a81f16;
    --grid:#e2e6e2;
    --r:10px; --r-s:6px;
    /* One rhythm for every queue row. A single line is the default; two lines
       are an explicit choice, taken only where the second line changes what
       the reader does. */
    --row-1:40px; --row-2:52px;
    --ar:'IBM Plex Sans Arabic','Segoe UI',system-ui,sans-serif;
    --mo:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    --shadow:0 1px 2px rgba(16,28,26,.05), 0 8px 24px rgba(16,28,26,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas:#090e0d; --panel:#111a18; --panel-2:#192320; --rule:#233130; --rule-2:#182322;
      --ink:#e8efed; --ink-2:#a6b4b1; --ink-3:#75827f;
      --brand:#4bb3ab; --brand-2:#7ad2c8; --brand-wash:#0f2f2c; --on-brand:#041a19;
      --sand:#d5a05c; --sand-wash:#2a2216;
      --pos:#5cba8c; --pos-wash:#11301f;
      --warn:#d4a158; --warn-wash:#2e2413;
      --crit:#e58181; --crit-wash:#331717;
      --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#d55181;
      --ord-1:#1d7478; --ord-2:#2b959a; --ord-3:#43b0b4; --ord-4:#67c8cb; --ord-5:#96dee0;
      --st-good:#5cba8c; --st-warn:#d5a03c; --st-serious:#ea8a55; --st-crit:#e5736b;
      --grid:#1e2b2a;
      --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --canvas:#090e0d; --panel:#111a18; --panel-2:#192320; --rule:#233130; --rule-2:#182322;
    --ink:#e8efed; --ink-2:#a6b4b1; --ink-3:#75827f;
    --brand:#4bb3ab; --brand-2:#7ad2c8; --brand-wash:#0f2f2c; --on-brand:#041a19;
    --sand:#d5a05c; --sand-wash:#2a2216;
    --pos:#5cba8c; --pos-wash:#11301f;
    --warn:#d4a158; --warn-wash:#2e2413;
    --crit:#e58181; --crit-wash:#331717;
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500; --cat-5:#d55181;
    --ord-1:#1d7478; --ord-2:#2b959a; --ord-3:#43b0b4; --ord-4:#67c8cb; --ord-5:#96dee0;
    --st-good:#5cba8c; --st-warn:#d5a03c; --st-serious:#ea8a55; --st-crit:#e5736b;
    --grid:#1e2b2a;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.35);
  }

  /* ═══ base ═════════════════════════════════════════════════════════════ */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--canvas); color: var(--ink);
    font-family: var(--ar); font-size: 15px; line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,h4 { margin: 0; line-height: 1.3; font-weight: 600; }
  h1 { font-size: 1.45rem; letter-spacing: -.01em; }
  h2 { font-size: 1.05rem; }
  h3 { font-size: .92rem; }
  p, ul, ol { margin: 0; }
  ul, ol { padding-inline-start: 1.2rem; }
  /* mixed Arabic + Latin resolves per paragraph, not per document */
  p, li, td, th, dd, dt, .lede { unicode-bidi: plaintext; }
  a { color: var(--brand); }
  img, svg { max-width: 100%; }
  .num, .mono { font-family: var(--mo); font-variant-numeric: tabular-nums; }
  /* identifier-like runs stay LTR whatever the paragraph around them does */
  .mono, code { direction: ltr; unicode-bidi: isolate; display: inline-block; }
  .muted { color: var(--ink-3); }
  .sm { font-size: .82rem; } .xs { font-size: .73rem; }
  .stack { display: flex; flex-direction: column; gap: 1.15rem; }
  .stack-s { display: flex; flex-direction: column; gap: .55rem; }
  .row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
  .row--tight { gap: .35rem; }
  .spacer { margin-inline-start: auto; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 3px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

  /* ═══ shell ════════════════════════════════════════════════════════════ */
  .riskbar {
    background: var(--warn-wash); color: var(--warn);
    border-block-end: 1px solid color-mix(in srgb, var(--warn) 22%, transparent);
    font-size: .76rem; text-align: center; padding: .45rem 1rem;
  }
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--panel) 90%, transparent);
    backdrop-filter: blur(10px);
    border-block-end: 1px solid var(--rule);
    display: flex; align-items: center; gap: .9rem;
    padding: .6rem clamp(.8rem, 3vw, 1.6rem);
  }
  .brand { display: flex; align-items: center; gap: .6rem; min-width: 0; }
  .brand__mark {
    inline-size: 32px; block-size: 32px; flex: none; border-radius: 9px;
    background: var(--brand); color: var(--on-brand);
    display: grid; place-items: center; font-weight: 700; font-size: 1.05rem;
  }
  .brand__name { font-weight: 700; font-size: 1.02rem; line-height: 1.15; }
  .brand__sub { font-size: .68rem; color: var(--ink-3); line-height: 1.2; }

  .seg { display: flex; background: var(--panel-2); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button {
    font: inherit; font-size: .78rem; border: 0; cursor: pointer; white-space: nowrap;
    background: none; color: var(--ink-2); padding: .3rem .75rem; border-radius: 999px;
  }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
  .iconbtn {
    font: inherit; font-size: .76rem; cursor: pointer;
    background: var(--panel); color: var(--ink-2);
    border: 1px solid var(--rule); border-radius: 999px; padding: .3rem .7rem;
  }
  .iconbtn:hover { color: var(--ink); border-color: var(--ink-3); }

  .topbar__who { max-width: 200px; }
  @media (max-width: 900px) {
    /* «المظهر» and «خروج» moved into the sheet behind «المزيد», so the header
       fits on one line again instead of stacking two. */
    .topbar > .iconbtn { display: none; }
    .topbar { padding-block: .45rem; }
    .brand__sub { display: none; }
  }
  @media (max-width: 720px) {
    .seg { overflow-x: auto; max-width: 100%; }
    .topbar__who { flex: 1 1 8rem; max-width: none; }
  }

  .layout { display: grid; grid-template-columns: 226px minmax(0, 1fr); align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }

  .side {
    position: sticky; top: 49px; align-self: start;
    block-size: calc(100dvh - 49px); overflow-y: auto;
    border-inline-end: 1px solid var(--rule);
    padding: 1rem .7rem 2rem;
    display: flex; flex-direction: column; gap: .15rem;
  }
  .side__group { font-size: .66rem; letter-spacing: .07em; text-transform: uppercase;
                 color: var(--ink-3); padding: .8rem .6rem .25rem; }
  .side__group:first-child { padding-block-start: .2rem; }
  .navlink {
    display: flex; align-items: center; gap: .55rem; width: 100%;
    font: inherit; font-size: .86rem; text-align: start; cursor: pointer;
    background: none; border: 0; color: var(--ink-2);
    padding: .36rem .6rem; border-radius: var(--r-s);
  }
  .navlink { text-decoration: none; }
  .navlink:hover { background: var(--panel-2); color: var(--ink); }
  .navlink[aria-current="page"] { background: var(--brand-wash); color: var(--brand); font-weight: 600; }
  .navlink__n { font-family: var(--mo); font-size: .68rem; color: var(--ink-3); flex: none; }
  .navlink[aria-current="page"] .navlink__n { color: var(--brand); }
  .navlink__t { flex: 1 1 auto; min-inline-size: 0; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  .navlink__badge {
    margin-inline-start: auto; font-family: var(--mo); font-size: .68rem;
    background: var(--panel-2); color: var(--ink-3); border-radius: 999px; padding: 0 .4rem;
    flex: none;
  }
  /* A queue is coloured; the size of a record is not. */
  .navlink__badge--work { background: var(--warn-wash); color: var(--warn); font-weight: 600; }
  .navlink[aria-current="page"] .navlink__badge--work { background: var(--panel); }
  /* The current entry gets an edge as well as a wash: on the dark ground the
     wash alone is a shade, and a shade is not a position. */
  .navlink[aria-current="page"] { box-shadow: inset 2px 0 0 var(--brand); }
  html[dir="rtl"] .navlink[aria-current="page"] { box-shadow: inset -2px 0 0 var(--brand); }
  /* Visually hidden, still read aloud: the badge is a bare number on screen
     and «7 بانتظار العمل» to a screen reader. */
  .vh { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden;
        clip-path: inset(50%); white-space: nowrap; }
  @media (max-width: 900px) {
    .side {
      position: static; block-size: auto; flex-direction: row; overflow-x: auto;
      border-inline-end: 0; border-block-end: 1px solid var(--rule);
      padding: .5rem .8rem; gap: .3rem; scrollbar-width: thin;
    }
    .side .side__group { display: none; }
    .side .navlink { width: auto; white-space: nowrap; background: var(--panel-2); }
    .navlink__badge { margin-inline-start: .2rem; }
  }

  .main { padding: clamp(1rem, 3vw, 2rem) clamp(.8rem, 3vw, 2rem) 4rem; min-width: 0; }
  .main__inner { max-width: 1080px; margin-inline: auto; display: flex; flex-direction: column; gap: 1.4rem; }
  /* 1080px is right for a paragraph and wrong for a table: a queue with six
     columns squeezes while a quarter of a 1440 screen stays blank. A wide
     screen opens the container and keeps the limit on the prose inside it. */
  .main__inner--wide { max-width: min(100%, 1560px); gap: .8rem; }
  /* On a work surface the space above the first actionable row is pure
     overhead — it is crossed on every visit and read on none of them. */
  .main:has(.main__inner--wide) { padding-block-start: .8rem; }
  .main__inner--wide .pagehead { gap: .1rem; }
  .main__inner--wide .pagehead h1 { font-size: 1.25rem; }
  .main__inner--wide .band__q { padding-block-end: .35rem; }
  .main__inner--wide .pagehead__lede { max-width: 68ch; }
  .pagehead { display: flex; flex-direction: column; gap: .3rem; }
  .pagehead__crumb { font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .pagehead__lede { color: var(--ink-2); font-size: .9rem; max-width: 74ch; }

  /* ═══ surfaces ═════════════════════════════════════════════════════════ */
  .card {
    background: var(--panel); border: 1px solid var(--rule);
    border-radius: var(--r); box-shadow: var(--shadow);
  }
  .card__head {
    display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
    padding: .8rem 1rem; border-block-end: 1px solid var(--rule-2);
  }
  .card__body { padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
  .card__body--flush { padding: 0; }
  .grid { display: grid; gap: 1.1rem; }
  .grid--top { align-items: start; }
  .grid--2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
  .grid--3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
  .grid--4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 175px), 1fr)); }

  .kv { background: var(--panel-2); border-radius: var(--r-s); padding: .6rem .75rem; }
  .kv__k { font-size: .72rem; color: var(--ink-3); }
  .kv__v { font-family: var(--mo); font-size: 1.05rem; font-weight: 600; }

  .chip {
    display: inline-flex; align-items: center; gap: .3rem;
    font-size: .72rem; font-weight: 500; border-radius: 999px;
    padding: .1rem .55rem; background: var(--panel-2); color: var(--ink-2);
    unicode-bidi: plaintext;
  }
  .chip__dot { inline-size: 6px; block-size: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .chip--brand { background: var(--brand-wash); color: var(--brand); }
  .chip--pos   { background: var(--pos-wash);   color: var(--pos); }
  .chip--warn  { background: var(--warn-wash);  color: var(--warn); }
  .chip--crit  { background: var(--crit-wash);  color: var(--crit); }
  .chip--sand  { background: var(--sand-wash);  color: var(--sand); }

  .note {
    border-radius: var(--r-s); padding: .6rem .8rem; font-size: .82rem;
    background: var(--panel-2); color: var(--ink-2);
    border-inline-start: 3px solid var(--ink-3);
  }
  .note--info { background: var(--brand-wash); color: var(--brand-2); border-color: var(--brand); }
  .note--warn { background: var(--warn-wash); color: var(--warn); border-color: var(--warn); }
  .note--crit { background: var(--crit-wash); color: var(--crit); border-color: var(--crit); }
  .note--pos  { background: var(--pos-wash);  color: var(--pos);  border-color: var(--pos); }
  .empty { color: var(--ink-3); font-size: .85rem; text-align: center; padding: 1.6rem 1rem; }

  /* ═══ tables ═══════════════════════════════════════════════════════════ */
  .tablewrap { overflow-x: auto; }

  /* Below 900px — the same width at which the sidebar gives way to the
     bottom bar — a data table stops being a grid and becomes a stack of
     cards: the header row is hidden and every cell states its own label.
     `labelCells()` puts those labels on, reading them off the table's own
     thead, so the two can never disagree. At 768px an eight-column table
     still overflowed by 218px, which is why this is not 720. */
  @media (max-width: 900px) {
    .dt { border-collapse: separate; border-spacing: 0; }
    .dt thead {
      position: absolute; inline-size: 1px; block-size: 1px;
      overflow: hidden; clip-path: inset(50%); white-space: nowrap;
    }
    .dt tbody tr {
      display: block; background: var(--panel);
      border: 1px solid var(--rule); border-radius: var(--r);
      padding: .55rem .7rem; margin-block-end: .55rem;
    }
    .dt tbody tr:hover { background: var(--panel); }
    .dt tbody td {
      display: grid; grid-template-columns: 7.5rem minmax(0, 1fr);
      gap: .3rem .8rem; align-items: baseline;
      padding: .22rem 0; border: 0; text-align: start;
    }
    .dt tbody td::before {
      content: attr(data-label); color: var(--ink-3);
      font-size: .72rem; line-height: 1.5;
    }
    /* numbers stop hugging an edge that no longer exists */
    .dt tbody td.n { text-align: start; }
    /* the identifying cell is the card's heading, and needs no label */
    .dt tbody td[data-role="title"] {
      grid-template-columns: minmax(0, 1fr); font-weight: 600;
      padding-block-end: .35rem; border-block-end: 1px solid var(--rule-2);
      margin-block-end: .35rem;
    }
    .dt tbody td[data-role="act"] { grid-template-columns: minmax(0, 1fr); padding-block-start: .45rem; }
    .dt tbody td[data-role="wide"] { grid-template-columns: minmax(0, 1fr); }
    .dt tbody td[data-role]::before { content: none; }
    .dt tbody td:empty { display: none; }
    .dt tfoot tr { display: block; padding: .45rem .7rem; }
    .dt tfoot td { display: inline-block; border: 0; padding: .1rem .4rem; }
  }
  table { width: 100%; border-collapse: collapse; font-size: .84rem; }
  th, td { text-align: start; padding: .5rem .75rem; border-block-end: 1px solid var(--rule-2); vertical-align: top; }
  th { font-size: .72rem; color: var(--ink-3); font-weight: 600; white-space: nowrap; }
  tbody tr:last-child td { border-block-end: 0; }
  td.n, th.n { text-align: end; font-family: var(--mo); font-variant-numeric: tabular-nums; white-space: nowrap; }
  tbody tr:hover { background: var(--rule-2); }
  tfoot td { font-weight: 600; border-block-start: 1px solid var(--rule); }

  /* ═══ forms ════════════════════════════════════════════════════════════ */
  .field { display: flex; flex-direction: column; gap: .25rem; min-width: 0; }
  .field > label { font-size: .78rem; color: var(--ink-2); font-weight: 500; }
  .field__hint { font-size: .72rem; color: var(--ink-3); }
  input, select, textarea {
    font: inherit; font-size: .88rem; color: var(--ink);
    background: var(--panel); border: 1px solid var(--rule);
    border-radius: var(--r-s); padding: .45rem .6rem; width: 100%;
  }
  input[type="number"], input.num { font-family: var(--mo); }
  textarea { resize: vertical; min-height: 4.5rem; }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px var(--brand-wash); }
  .check { display: flex; align-items: flex-start; gap: .5rem; font-size: .82rem; color: var(--ink-2); }
  .check input { inline-size: 16px; block-size: 16px; margin: .28rem 0 0; flex: none; accent-color: var(--brand); }

  .btn {
    font: inherit; font-size: .85rem; font-weight: 500; cursor: pointer;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--rule); border-radius: var(--r-s);
    padding: .45rem .95rem; white-space: nowrap;
  }
  a.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  .btn:hover:not(:disabled) { border-color: var(--ink-3); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn--primary { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
  .btn--primary:hover:not(:disabled) { background: var(--brand-2); border-color: var(--brand-2); }
  .btn--danger { background: var(--crit-wash); color: var(--crit); border-color: color-mix(in srgb, var(--crit) 30%, transparent); }
  .btn--sm { font-size: .76rem; padding: .25rem .6rem; }
  /* a bare direction, so it stays square instead of wearing a word's width */
  .btn--go { padding-inline: .5rem; font-size: .9rem; line-height: 1; }

  /* ═══ tabs inside a view ═══════════════════════════════════════════════ */
  .tabs { display: flex; gap: .2rem; overflow-x: auto; border-block-end: 1px solid var(--rule); }
  .tabs button {
    font: inherit; font-size: .84rem; cursor: pointer; white-space: nowrap;
    background: none; border: 0; border-block-end: 2px solid transparent;
    color: var(--ink-3); padding: .5rem .8rem; margin-block-end: -1px;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { color: var(--brand); border-block-end-color: var(--brand); font-weight: 600; }

  /* ═══ meters, tiles, charts ════════════════════════════════════════════ */
  .meter { display: block; background: var(--panel-2); border-radius: 999px; block-size: 8px; overflow: hidden; }
  /* A fully rounded fill turns a 2% bar into a circle and reads longer than
     it is. The end is rounded 4px on the free side only, and never shrinks
     below 3px so a small value stays visible without being overstated. */
  .meter__fill {
    display: block; block-size: 100%; min-inline-size: 3px; background: var(--brand);
    border-start-end-radius: 4px; border-end-end-radius: 4px;
  }


  .frame { display: flex; flex-direction: column; gap: .5rem; }
  .frame__head { display: flex; align-items: flex-start; gap: .6rem; }
  .frame__sub { font-size: .75rem; color: var(--ink-3); max-width: 62ch; }
  .frame__toggle {
    margin-inline-start: auto; flex: none; font: inherit; font-size: .71rem; cursor: pointer;
    background: var(--panel-2); color: var(--ink-2);
    border: 1px solid var(--rule); border-radius: 999px; padding: .15rem .55rem;
  }
  .frame__toggle:hover { color: var(--ink); }
  .frame[data-view="table"] .frame__chart, .frame[data-view="chart"] .frame__table { display: none; }
  /* A mark grid needs width a phone has not got. Below 720px the figure that
     said so shows its table instead — the same numbers, already written. */
  @media (max-width: 900px) {
    .frame--wide .frame__chart, .frame--wide .frame__toggle { display: none; }
    .frame--wide .frame__table { display: block; }
  }

  .plot { width: 100%; height: auto; display: block; overflow: visible; }
  /* the plot is drawn LTR in both languages, and so are its numerals */
  .plot text { font-family: var(--mo); font-size: 10px; fill: var(--ink-3); direction: ltr; unicode-bidi: isolate; }
  .plot .axis { stroke: var(--grid); stroke-width: 1; }

  .bars { display: flex; flex-direction: column; gap: .5rem; }
  .bars__row { display: grid; grid-template-columns: minmax(6.5rem, 32%) 1fr auto; gap: .6rem; align-items: center; }
  .bars__label { font-size: .8rem; color: var(--ink-2); }
  .bars__val { font-family: var(--mo); font-size: .78rem; }
  @media (max-width: 560px) {
    .bars__row { grid-template-columns: 1fr auto; }
    .bars__row .meter { grid-column: 1 / -1; }
  }

  .funnel { display: flex; flex-direction: column; gap: .8rem; }
  .funnel__top { display: flex; align-items: baseline; gap: .6rem; }
  .funnel__val { margin-inline-start: auto; font-family: var(--mo); font-weight: 600; font-size: .88rem; }

  /* ═══ timeline ═════════════════════════════════════════════════════════ */
  .tl { display: flex; flex-direction: column; }
  .tl__item { display: grid; grid-template-columns: 18px 1fr; gap: .7rem; padding-block-end: 1rem; position: relative; }
  .tl__item:not(:last-child)::before {
    content: ''; position: absolute; inset-block: 16px 0;
    inset-inline-start: 8px; inline-size: 1px; background: var(--rule);
  }
  .tl__dot {
    inline-size: 17px; block-size: 17px; border-radius: 50%; margin-block-start: 3px;
    background: var(--panel); border: 2px solid var(--rule); z-index: 1;
  }
  .tl__dot--done { background: var(--brand); border-color: var(--brand); }
  .tl__dot--now  { background: var(--panel); border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-wash); }
  .tl__t { font-size: .86rem; font-weight: 500; }
  .tl__d { font-size: .74rem; color: var(--ink-3); }

  /* ═══ toast ════════════════════════════════════════════════════════════ */
  .toasts {
    position: fixed; inset-block-end: 1rem; inset-inline-start: 1rem; z-index: 90;
    display: flex; flex-direction: column; gap: .5rem; max-width: min(92vw, 400px);
  }
  /* a plain two-column list of facts; the value side may hold mono or markup */
  .deflist { display: grid; gap: 0; }
  .deflist__row {
    display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr);
    gap: .5rem 1rem; padding: .5rem 0; border-block-end: 1px solid var(--rule-2);
  }
  .deflist__row:last-child { border-block-end: 0; }
  .deflist__k { font-size: .78rem; color: var(--ink-3); }
  .deflist__v { font-size: .88rem; unicode-bidi: plaintext; }
  @media (max-width: 560px) { .deflist__row { grid-template-columns: minmax(0, 1fr); gap: .1rem; } }
  .chips { display: flex; flex-wrap: wrap; gap: .35rem; margin-block-start: .5rem; }

  /* Two live regions in one fixed column: they stack by flex order, so an
     alert never lands on top of a confirmation. */
  .toastwrap {
    position: fixed; inset-block-end: 1rem; inset-inline-start: 1rem; z-index: 90;
    display: flex; flex-direction: column; gap: .5rem; max-width: min(92vw, 400px);
  }
  .toastwrap .toasts { position: static; max-width: none; inset: auto; }
  .toasts:empty { display: none; }

  /* Reachable by keyboard, out of the way otherwise. */
  .skip {
    position: fixed; inset-block-start: -100px; inset-inline-start: 1rem; z-index: 200;
    background: var(--brand); color: #fff; padding: .55rem .9rem;
    border-radius: var(--r-s); font-size: .82rem; font-weight: 600; text-decoration: none;
    transition: inset-block-start .12s ease;
  }
  .skip:focus { inset-block-start: 1rem; }
  /* The heading is focused on every screen change so a keyboard lands on the
     new content. That focus is programmatic, so it gets no ring — :focus-visible
     already withholds one, and this makes it explicit. */
  h1[tabindex="-1"]:focus { outline: none; }
  h1[tabindex="-1"]:focus-visible { outline: 2px solid var(--brand); outline-offset: 4px; }
  .toast {
    background: var(--panel); border: 1px solid var(--rule); border-inline-start: 3px solid var(--brand);
    border-radius: var(--r-s); box-shadow: var(--shadow); padding: .6rem .8rem; font-size: .82rem;
  }
  .toast--bad { border-inline-start-color: var(--crit); }
  .toast--good { border-inline-start-color: var(--pos); }

  .savebar {
    display: flex; align-items: center; gap: .5rem;
    font-size: .73rem; color: var(--ink-3);
  }
  .savebar__dot { inline-size: 7px; block-size: 7px; border-radius: 50%; background: var(--ink-3); }
  .savebar--live .savebar__dot { background: var(--st-good); }
  .savebar--ro .savebar__dot { background: var(--st-warn); }

  /* ═══ public shell: landing, sign-in, registration ════════════════════ */
  .pubnav {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--canvas) 88%, transparent);
    backdrop-filter: blur(10px); border-block-end: 1px solid var(--rule);
    display: flex; align-items: center; gap: .8rem; padding: .7rem clamp(.9rem, 4vw, 2.5rem);
  }
  .pub { max-width: 1080px; margin-inline: auto; padding-inline: clamp(.9rem, 4vw, 2rem); }
  .hero { padding-block: clamp(2.5rem, 7vw, 4.5rem) clamp(1.5rem, 4vw, 2.5rem); }
  .hero h1 {
    font-size: clamp(1.75rem, 4.6vw, 2.9rem); line-height: 1.22;
    letter-spacing: -.02em; max-width: 20ch;
  }
  .hero__lede { font-size: clamp(.95rem, 1.6vw, 1.1rem); color: var(--ink-2); max-width: 60ch; margin-block-start: .9rem; }
  /* The third line of the headline is the claim the whole product rests on. */
  .hero__hl { color: var(--brand); }

  /* Four figures read off the live record, directly under the claim — the
     page says the rules are executed rather than described, and this is the
     nearest thing to proof a stranger can see before signing in. */
  .factstrip {
    display: grid; gap: .8rem 1.6rem; margin-block-start: 1.8rem;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr));
    border-block-start: 1px solid var(--rule); padding-block-start: 1.1rem;
  }
  .factstrip__i { display: flex; flex-direction: column; gap: .1rem; }
  .factstrip__v { font-family: var(--mo); font-size: clamp(1.3rem, 3vw, 1.75rem);
                  font-weight: 600; line-height: 1.1; }
  .factstrip__k { font-size: .76rem; color: var(--ink-3); }
  .factstrip__note { margin-block-start: .9rem; }

  /* The claim, then what enforces it. The second paragraph is the one that
     makes the first checkable, so it reads as evidence, not as more prose. */
  .pillar__proof {
    margin-block-start: .5rem; padding-block-start: .5rem;
    border-block-start: 1px dashed var(--rule);
    font-size: .8rem; color: var(--ink-3);
  }
  .hero__cta { display: flex; gap: .6rem; flex-wrap: wrap; margin-block-start: 1.5rem; }
  .btn--lg { font-size: .95rem; padding: .6rem 1.4rem; }
  .eyebrow {
    font-size: .72rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--brand); font-family: var(--mo);
  }
  .section { padding-block: clamp(1.8rem, 4vw, 3rem); border-block-start: 1px solid var(--rule); }
  .section__head { margin-block-end: 1.3rem; display: flex; flex-direction: column; gap: .35rem; }
  .section__head p { color: var(--ink-2); font-size: .9rem; max-width: 68ch; }

  .steps { counter-reset: s; display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }
  .step { position: relative; padding-block-start: 2.1rem; }
  .step::before {
    counter-increment: s; content: counter(s, decimal-leading-zero);
    position: absolute; inset-block-start: 0; inset-inline-start: 0;
    font-family: var(--mo); font-size: .8rem; font-weight: 600;
    color: var(--brand); background: var(--brand-wash);
    border-radius: 999px; padding: .1rem .55rem;
  }
  .step h3 { margin-block-end: .25rem; }
  .step p { font-size: .84rem; color: var(--ink-2); }

  .pillar { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); padding: 1rem; }
  .pillar h3 { margin-block-end: .3rem; }
  .pillar p { font-size: .84rem; color: var(--ink-2); }

  .classcard {
    border: 1px solid var(--rule); border-radius: var(--r); background: var(--panel);
    padding: 1rem; display: flex; flex-direction: column; gap: .5rem;
  }
  .classcard__name { font-weight: 600; }
  .classcard dl { display: grid; grid-template-columns: auto 1fr; gap: .25rem .7rem; font-size: .82rem; margin: 0; }
  .classcard dt { color: var(--ink-3); }
  .classcard dd { margin: 0; font-family: var(--mo); }

  .authwrap { display: grid; place-items: center; padding-block: clamp(1.5rem, 5vw, 3.5rem); }
  .authcard {
    width: min(100%, 470px); background: var(--panel);
    border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow);
    padding: clamp(1.1rem, 3vw, 1.8rem); display: flex; flex-direction: column; gap: 1rem;
  }
  .authcard--wide { width: min(100%, 620px); }
  .authhead { display: flex; flex-direction: column; gap: .25rem; }
  .authhead h1 { font-size: 1.3rem; }
  .authhead p { font-size: .85rem; color: var(--ink-2); }
  .authfoot { font-size: .82rem; color: var(--ink-2); text-align: center; }
  .linkbtn {
    font: inherit; font-size: inherit; background: none; border: 0; padding: 0;
    color: var(--brand); text-decoration: underline; cursor: pointer;
  }
  .stepper { display: flex; gap: .3rem; }
  .stepper span {
    flex: 1; block-size: 3px; border-radius: 999px; background: var(--panel-2);
  }
  .stepper span[data-on="1"] { background: var(--brand); }
  .stepper span[data-on="done"] { background: var(--brand-2); }

  .picker { display: grid; gap: .5rem; }
  .picker__opt {
    display: flex; flex-direction: column; gap: .2rem; text-align: start;
    font: inherit; cursor: pointer; width: 100%;
    background: var(--panel); border: 1px solid var(--rule);
    border-radius: var(--r-s); padding: .7rem .8rem; color: var(--ink);
  }
  .picker__opt:hover { border-color: var(--ink-3); }
  .picker__opt[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-wash); }
  .picker__opt strong { font-size: .88rem; display: block; }
  .picker__opt .caps { font-family: var(--mo); font-size: .74rem; color: var(--ink-2); }
  .picker__opt[aria-pressed="true"] .caps { color: var(--brand-2); }
  .picker__opt span { font-size: .78rem; color: var(--ink-2); }
  .picker__opt[aria-pressed="true"] span { color: var(--brand-2); }

  .otp {
    font-family: var(--mo); font-size: 1.3rem; letter-spacing: .5em;
    text-align: center; direction: ltr;
  }
  .demoacct {
    display: flex; align-items: center; gap: .5rem; width: 100%;
    font: inherit; font-size: .82rem; text-align: start; cursor: pointer;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--rule); border-radius: var(--r-s); padding: .45rem .7rem;
  }
  .demoacct:hover { border-color: var(--brand); background: var(--brand-wash); }
  .demoacct__role { margin-inline-start: auto; font-size: .72rem; color: var(--ink-3); }

  .whoami { display: flex; align-items: center; gap: .55rem; min-width: 0; }
  .whoami__av {
    inline-size: 30px; block-size: 30px; flex: none; border-radius: 50%;
    background: var(--brand-wash); color: var(--brand);
    display: grid; place-items: center; font-weight: 600; font-size: .82rem;
  }
  .whoami__n { font-size: .82rem; font-weight: 500; line-height: 1.2; }
  .whoami__r { font-size: .68rem; color: var(--ink-3); line-height: 1.2; }
  .locked { opacity: .62; }
  /* ═══ permission matrix ════════════════════════════════════════════════ */
  .pmx th, .pmx td { text-align: center; }
  .pmx th:first-child, .pmx td:first-child { text-align: start; min-inline-size: 12rem; }
  .pmx__who { vertical-align: bottom; }
  .pmx__who span { display: block; font-weight: 600; }
  .pmx__who .muted { font-weight: 400; }
  .pmx__c { padding-inline: .3rem; }
  /* presence, not magnitude: a filled mark or an empty one */
  .pm {
    display: inline-block; inline-size: 11px; block-size: 11px; border-radius: 50%;
    border: 1.5px solid var(--rule); background: transparent; vertical-align: middle;
  }
  .pm--on { background: var(--brand); border-color: var(--brand); }
  .pm--hot { border-radius: 3px; }
  .pm--on.pm--hot { background: var(--sand); border-color: var(--sand); }


  /* ═══ dashboard ════════════════════════════════════════════════════════ */
  .band { display: flex; flex-direction: column; gap: .85rem; }
  .band__q {
    display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap;
    padding-block-end: .5rem; border-block-end: 1px solid var(--rule);
  }
  .band__n {
    font-family: var(--mo); font-size: .7rem; font-weight: 600;
    color: var(--brand); background: var(--brand-wash);
    border-radius: 999px; padding: .1rem .5rem; flex: none;
  }
  .band__t { font-size: 1.02rem; font-weight: 600; }
  .band__s { font-size: .78rem; color: var(--ink-3); }

  .hero { display: flex; flex-direction: column; gap: .15rem; }
  .hero__v { font-family: var(--mo); font-size: clamp(2rem, 5vw, 3rem); font-weight: 600; line-height: 1.05; }
  .hero__k { font-size: .8rem; color: var(--ink-3); }

  /* part-to-whole: 2px surface gaps between fills, never borders */
  .pw { display: flex; block-size: 26px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--panel); }
  .pw__seg { display: block; min-inline-size: 3px; }
  .legend { display: flex; flex-wrap: wrap; gap: .3rem 1.1rem; }
  .legend__item { display: flex; align-items: center; gap: .4rem; font-size: .78rem; color: var(--ink-2); }
  .legend__sw { inline-size: 10px; block-size: 10px; border-radius: 3px; flex: none; }
  .legend__v { font-family: var(--mo); color: var(--ink); }
  .legend__p { font-size: .72rem; color: var(--ink-3); }

  .col__bar { fill: var(--cat-1); }
  .col:hover .col__bar { fill: var(--brand); }

  .ratio { display: flex; flex-direction: column; gap: .25rem; }
  .ratio__track { background: var(--panel-2); border-radius: 999px; block-size: 6px; overflow: hidden; }
  .ratio__fill { display: block; block-size: 100%; border-radius: 999px; }
  .ratio__row { display: flex; align-items: baseline; gap: .4rem; font-size: .8rem; }

  .exc { display: flex; flex-direction: column; }
  .exc__row {
    display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: .6rem .8rem;
    align-items: center; min-block-size: var(--row-2); padding: .3rem .1rem;
    border-block-end: 1px solid var(--rule-2);
  }
  .exc__row:last-child { border-block-end: 0; }
  /* The row an address named. It blinks once and stops: a permanent highlight
     would still be shouting long after the reader has found it. */
  .rowhit { animation: rowhit 2.2s ease-out 1; }
  @keyframes rowhit {
    0%, 55% { background: var(--brand-wash); box-shadow: inset 3px 0 0 var(--brand); }
    100%    { background: transparent; box-shadow: inset 3px 0 0 transparent; }
  }
  .exc__age {
    font-family: var(--mo); font-size: .74rem; font-weight: 600; text-align: center;
    border-radius: var(--r-s); padding: .15rem .45rem; min-inline-size: 3.4rem;
    background: var(--panel-2); color: var(--ink-2);
  }
  .exc__age--crit { background: var(--crit-wash); color: var(--crit); }
  .exc__age--warn { background: var(--warn-wash); color: var(--warn); }
  /* both are spans inside one cell: without this they share a line */
  .exc__what { display: block; font-size: .86rem; line-height: 1.4; }
  .exc__why { display: block; font-size: .74rem; line-height: 1.45; color: var(--ink-3); }
  @media (max-width: 560px) {
    .exc__row { grid-template-columns: auto minmax(0,1fr); }
    .exc__row > :last-child { grid-column: 1 / -1; }
  }

  /* exception groups: a kind is a heading with its own count, so a long list
     stays navigable without any of it being cut away */
  .excg + .excg { border-block-start: 1px solid var(--rule); }
  .excg__h {
    display: flex; align-items: center; gap: .45rem;
    padding-block: .45rem .15rem; font-size: .74rem; font-weight: 600;
    color: var(--ink-3); letter-spacing: .02em;
  }
  .excg__n {
    font-family: var(--mo); font-size: .68rem; font-weight: 500;
    background: var(--panel-2); color: var(--ink-2);
    border-radius: 999px; padding: .05rem .4rem;
  }

  /* one account's toxic combinations, each with the control that blocks it */
  .sod { border: 1px solid var(--rule); border-radius: var(--r); padding: .6rem .7rem; }
  .sod__h { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; margin-block-end: .35rem; }
  .sod__r {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
    gap: .6rem; align-items: start;
    padding-block: .45rem; border-block-start: 1px dashed var(--rule);
  }
  @media (max-width: 720px) {
    .sod__r { grid-template-columns: auto minmax(0, 1fr); }
    .sod__r > :last-child { grid-column: 1 / -1; }
  }
  /* the flipped matrix carries counts, not marks: it has to stay readable at
     thirty accounts, and a thirty-column mark grid does not */
  .pmx--flip th:first-child, .pmx--flip td:first-child { min-inline-size: 10rem; }
  .pmx--flip td { vertical-align: middle; }

  /* a reference is looked up, not read: it opens when asked and costs nothing
     until then */
  .fold { border: 1px solid var(--rule); border-radius: var(--r); background: var(--panel); }
  .fold > summary {
    cursor: pointer; padding: .55rem .9rem; font-size: .82rem; font-weight: 500;
    color: var(--ink-2); border-radius: var(--r); list-style-position: inside;
  }
  .fold > summary:hover { color: var(--ink); background: var(--panel-2); }
  .fold[open] > summary { border-block-end: 1px solid var(--rule-2); border-end-start-radius: 0; border-end-end-radius: 0; }
  .fold__b { padding: .8rem .9rem; }
  /* one line per change, not a card each */
  .tl--tight .tl__item { padding-block-end: .45rem; }
  .tl--tight .tl__item p { display: inline; font-size: .78rem; color: var(--ink-3); }
  .tl--tight .tl__t { display: inline; font-size: .82rem; }
  .tl--tight .tl__d { display: inline; margin-inline-start: .4rem; }

  .segsm { display: flex; background: var(--panel-2); border-radius: 999px; padding: 2px; gap: 2px; }
  .segsm button {
    font: inherit; font-size: .74rem; border: 0; cursor: pointer; white-space: nowrap;
    background: none; color: var(--ink-2); padding: .2rem .6rem; border-radius: 999px;
  }
  .segsm button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 600; }


  /* ═══ the phone ════════════════════════════════════════════════════════
     Below 900px the sidebar goes and a bottom bar takes over: four
     destinations in thumb reach and a sheet for the rest. Above it, nothing
     here applies and the desktop layout is untouched.
     ═══════════════════════════════════════════════════════════════════════ */
  .tabbar, .sheet, .sheetback, .riskbar__short { display: none; }

  @media (max-width: 900px) {
    .side { display: none; }
    .tabbar {
      display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
      position: fixed; inset-inline: 0; inset-block-end: 0; z-index: 40;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      backdrop-filter: blur(10px);
      border-block-start: 1px solid var(--rule);
      padding-block-end: env(safe-area-inset-bottom, 0px);
    }
    .tabbar__i {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: .15rem; min-block-size: 52px; padding: .35rem .2rem;
      font: inherit; font-size: .74rem; text-decoration: none; cursor: pointer;
      background: none; border: 0; color: var(--ink-3); position: relative;
    }
    .tabbar__i[aria-current="page"] { color: var(--brand); font-weight: 600; }
    .tabbar__i[aria-current="page"]::before {
      content: ''; position: absolute; inset-block-start: 0; inset-inline: 22%;
      block-size: 2px; background: var(--brand); border-radius: 0 0 2px 2px;
    }
    .tabbar__t { max-inline-size: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tabbar__b {
      font-family: var(--mo); font-size: .62rem; line-height: 1.4;
      background: var(--brand-wash); color: var(--brand);
      border-radius: 999px; padding: 0 .35rem;
    }
    /* room for the bar, and for a thumb resting below it */
    .main { padding-block-end: calc(76px + env(safe-area-inset-bottom, 0px)); }
    .toastwrap { inset-block-end: calc(68px + env(safe-area-inset-bottom, 0px)); }

    .sheetback {
      display: block; position: fixed; inset: 0; z-index: 50;
      background: rgba(0, 0, 0, .35);
    }
    .sheet {
      display: block; position: fixed; inset-inline: 0; inset-block-end: 0; z-index: 51;
      max-block-size: 82dvh; overflow-y: auto;
      background: var(--panel); border-block-start: 1px solid var(--rule);
      border-start-start-radius: 16px; border-start-end-radius: 16px;

  /* ── the risk warning ──────────────────────────────────────────────────

  /* ═══ work surface: queues ═════════════════════════════════════════════
     A queue is read down its left edge and acted on at its right, so every
     row is one flex line that wraps whole rather than a grid that shears. */
  .statusbar {
    display: flex; align-items: center; gap: .5rem;

  .qrow__age--crit { color: var(--crit); font-weight: 600; }
  .qrow__amt {

    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .qrow__acts { flex: none; }
  /* the refusal opens inside its own row, so the reason is written next to

  .qrow__reject {

  @media (max-width: 560px) {

    if (x.role === 'staff' && !Array.isArray(x.perms)) { x.perms = []; note('user.perms'); }
  });
  st.reports.forEach(r => {
    if (!Array.isArray(r.kpis)) { r.kpis = []; note('report.kpis'); }
  });

  /* A monotonic mutation counter, and the only key METRICS caches on. Neither
     existing marker can serve: `v` is a static format stamp and `schema` moves
     only when the shape changes — both read identical either side of an
     action, which is exactly the difference a cache has to see. */
  if (typeof st.version !== 'number') { st.version = 0; note('version'); }

  st.schema = SCHEMA;
  return st;
}

let STATE = migrateState(JSON.parse(document.getElementById('appstate').textContent));
let WRITER = null;              // the artifact namespace, once resolved
let MODE = 'loading';           // loading | live | local

    + '<style id="appstyle">' + STYLE_SRC + '</style>\n</head>\n<body>\n'

    /* A button, not an href="#pagetitle": the hash is the address bar now,

    +   '<div class="toasts" id="alerts" role="alert" aria-live="assertive"></div>'
    +   '<div class="toasts" id="toasts" role="status" aria-live="polite"></div>'
