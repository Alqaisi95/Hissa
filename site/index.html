  const shown = pick ? exc.filter(x => x.sev === pick) : exc;
  const filter = '<span class="segsm">'
    + [[0, 'الكل (' + exc.length + ')'], [3, SEV_AR[3][1] + ' ' + bySev[3]],
       [2, SEV_AR[2][1] + ' ' + bySev[2]], [1, SEV_AR[1][1] + ' ' + bySev[1]]]
      .map(o => '<button data-act="setExcSev" data-sev="' + o[0] + '" aria-pressed="'
        + (pick === o[0]) + '">' + esc(o[1]) + '</button>').join('')
    + '</span>';

  const groups = EXC_KIND_ORDER
    .filter(k => shown.some(x => x.kind === k))
    .map(k => ({ k, rows: shown.filter(x => x.kind === k) }));

  const b1 = !exc.length
    ? '<div class="note note--pos">لا خلل في الوصول: كل صلاحية حسّاسة يحملها أكثر من حساب نشط، '
      + 'ولا تجميع بلا ضابط، ولا حساب مميَّز غير مستخدم، ولا دعوة أو كود استرداد معلّق.</div>'
    : !shown.length
      ? '<div class="note note--pos">لا بند بهذه الشدّة. غيّر المرشّح أعلاه لرؤية البقية.</div>'
      : '<div class="card"><div class="card__body card__body--flush" style="padding:.2rem 1rem">'
        + groups.map(g => '<div class="excg"><div class="excg__h">' + esc(g.k)
            + '<span class="excg__n">' + g.rows.length + '</span></div>'
            + '<div class="exc">' + g.rows.map(x => {
                const sv = SEV_AR[x.sev] || SEV_AR[1];
                return '<div class="exc__row">'
                  + '<span class="exc__age' + (sv[0] ? ' exc__age--' + sv[0] : '') + '">' + sv[1] + '</span>'
                  + '<span><span class="exc__what">' + esc(x.what) + '</span>'
                  + '<span class="exc__why">' + esc(x.why) + '</span></span>'
                  + excTail(x, u) + '</div>';
              }).join('') + '</div></div>').join('')
        + '</div></div>'
        + '<p class="xs muted">معروض ' + shown.length + ' من ' + exc.length
        + ' بندًا — لا يُقتطع شيء من هذه القائمة، والمرشّح وحده يخفي.</p>';

  /* ── band 2 · segregation of duties ── */
  const sodRows = active.map(x => ({ x, hits: sodFindings(x) })).filter(r => r.hits.length);
  const naked = sodRows.filter(r => r.hits.some(h => !h.mitigation));
  const sodList = sodRows.length
    ? '<div class="stack-s">' + sodRows
        .sort((a, b) => Math.max(...b.hits.map(h => h.sev)) - Math.max(...a.hits.map(h => h.sev)))
        .map(r => '<div class="sod">'
          + '<div class="sod__h"><strong class="sm">' + esc(r.x.name) + '</strong>'
          + '<span class="chip">' + esc(JOB_AR[r.x.job] || r.x.job) + '</span>'
          + '<span class="spacer xs muted">يفتح ' + accessReach(r.x) + ' من '
          + STAFF_NAV.length + ' شاشة</span></div>'
          + r.hits.map(h => '<div class="sod__r">'
              + '<span class="exc__age' + (h.mitigation ? '' : ' exc__age--crit') + '">'
              + (h.mitigation ? 'محجوب' : 'مكشوف') + '</span>'
              + '<span><span class="exc__what">' + esc(h.label) + '</span>'
              + '<span class="exc__why">' + esc(h.why) + '</span>'
              + '<span class="exc__why mono">' + esc(h.perms.join(' + ')) + '</span></span>'
              + '<span class="sm">' + (h.mitigation
                  ? '<span class="chip chip--pos"><span class="chip__dot"></span>'
                    + esc(h.mitigation) + '</span>'
                  : '<span class="chip chip--crit"><span class="chip__dot"></span>'
                    + 'لا ضابط بعد المنح</span>') + '</span>'
              + '</div>').join('')
          + '</div>').join('') + '</div>'
    : '<div class="note note--pos">لا حساب نشط يجمع مسارًا كاملًا في يده.</div>';

  const b2 = '<div class="grid grid--2 grid--top">'
    + '<div class="card"><div class="card__body">'
    + '<div class="hero"><span class="hero__v" style="color:'
    + (naked.length ? 'var(--crit)' : 'var(--pos)') + '">' + naked.length + '</span>'
    + '<span class="hero__k">حسابًا نشطًا يجمع مسارًا كاملًا لا يمنعه ضابط لاحق</span></div>'
    + '<p class="xs muted">التجميع نفسه ليس خطأً دائمًا — فريق صغير يضطر إليه. الخطأ أن '
    + 'يكون غير معروف. وحين يمنعه ضابط على مستوى المعاملة يُقال ذلك هنا صراحةً بدل '
    + 'أن يُعرض كخطر قائم.</p>'
    + '<div class="tablewrap"><table><thead><tr><th>التجميع</th><th class="n">الشدّة</th>'
    + '<th>الضابط</th></tr></thead><tbody>'
    + SOD_RULES.map(r => '<tr><td class="sm">' + esc(r.label)
        + '<div class="xs muted mono">' + esc(r.perms.join(' + ')) + '</div></td>'
        + '<td class="n">' + (SEV_AR[r.sev] || SEV_AR[1])[1] + '</td>'
        + '<td class="xs">' + (r.mitigation ? esc(r.mitigation)
            : '<span style="color:var(--crit)">لا شيء يمنعها بعد المنح</span>') + '</td></tr>').join('')
    + '</tbody></table></div>'
    + '</div></div>'
    + '<div class="card"><div class="card__body">' + frameHtml({
        title: 'من يجمع ماذا',
        sub: 'كل حساب نشط يحمل تجميعًا معلنًا، ومعه الضابط الذي يمنعه — أو غيابه. '
           + 'هذه هي المعلومة التي لا تظهر في مصفوفة الصلاحيات مهما طال النظر إليها، '
           + 'لأنها خاصية اجتماع لا خاصية منحة.',
        chart: sodList,
        cols: ['الحساب', 'التجميع', 'الشدّة', 'الضابط المانع'],
        rows: sodRows.flatMap(r => r.hits.map(h => [esc(r.x.name), esc(h.label),
          (SEV_AR[h.sev] || SEV_AR[1])[1], h.mitigation ? esc(h.mitigation) : 'لا شيء'])),
      }) + '</div></div></div>';

  /* ── band 3 · who holds what ──
     Presence, not magnitude: a filled mark or an empty one, never a colour
     ramp. Above eight accounts the mark grid stops being readable — a column
     per account was fine for the seeded six and unreadable at thirty — so the
     rows and columns trade places and the marks become per-domain counts.
     The table underneath carries the exact grants either way. */
  const FLIP_AT = 8;
  const flip = active.length > FLIP_AT;
  const cell = (has, sensitive) => has
    ? '<span class="pm pm--on' + (sensitive ? ' pm--hot' : '') + '" aria-label="ممنوحة"></span>'
    : '<span class="pm" aria-label="غير ممنوحة"></span>';
  const DOMAINS = [...new Set(PERM_CATALOG.map(p => p.domain))];

  const matrix = flip
    ? '<div class="tablewrap"><table class="pmx pmx--flip"><thead><tr><th>الحساب</th>'
      + DOMAINS.map(d => '<th class="n">' + esc(d) + '</th>').join('')
      + '<th class="n">حسّاسة</th><th class="n">مدى الوصول</th></tr></thead><tbody>'
      + active.map(x => {
          const held = x.perms || [];
          const hot = held.filter(isSensitive).length;
          return '<tr><td><div class="sm">' + esc(x.name) + '</div>'
            + '<div class="xs muted">' + esc(JOB_AR[x.job] || '') + '</div></td>'
            + DOMAINS.map(d => {
                const all = PERM_CATALOG.filter(p => p.domain === d);
                const n = all.filter(p => held.includes(p.k)).length;
                return '<td class="n"><span class="chip' + (n === all.length ? ' chip--brand' : '')
                  + '">' + n + '/' + all.length + '</span></td>';
              }).join('')
            + '<td class="n"><span class="chip' + (hot ? ' chip--warn' : '') + '">' + hot + '</span></td>'
            + '<td class="n">' + accessReach(x) + '/' + STAFF_NAV.length + '</td></tr>';
        }).join('')
      + '</tbody></table></div>'
    : '<div class="tablewrap"><table class="pmx"><thead><tr><th>الصلاحية</th>'
      + active.map(x => '<th class="pmx__who"><span>' + esc(x.name.split(' ')[0]) + '</span>'
          + '<span class="xs muted">' + esc(JOB_AR[x.job] || '') + '</span></th>').join('')
      + '<th class="n">من يملكها</th></tr></thead><tbody>'
      + PERM_CATALOG.map(pc => {
          const holders = active.filter(x => (x.perms || []).includes(pc.k));
          const tone = !holders.length ? 'chip--crit' : holders.length === 1 && pc.sensitive ? 'chip--warn' : '';
          return '<tr><td><div class="sm">' + esc(pc.ar) + (pc.sensitive ? ' <span class="pm pm--hot"></span>' : '') + '</div>'
            + '<div class="xs muted mono">' + pc.k + '</div></td>'
            + active.map(x => '<td class="pmx__c">' + cell((x.perms || []).includes(pc.k), pc.sensitive) + '</td>').join('')
            + '<td class="n"><span class="chip ' + tone + '">' + holders.length + '</span></td></tr>';
        }).join('')
      + '</tbody></table></div>'
      + '<div class="row row--tight xs muted" style="margin-block-start:.6rem">'
      + active.map(x => '<span>' + esc(x.name) + ': ' + accessReach(x) + '/' + STAFF_NAV.length
          + ' شاشة</span>').join('<span>·</span>') + '</div>';

  const b3 = '<div class="card"><div class="card__body">' + frameHtml({
      wide: true,
      title: 'من يملك ماذا',
      sub: flip
        ? active.length + ' حسابًا نشطًا — فوق ' + FLIP_AT + ' حسابات تُقلب المصفوفة إلى '
          + 'عدّ لكل مجال، لأن شبكة علامات بهذا العرض لا تُقرأ. الجدول تحتها يحمل المنح بدقّة.'
        : 'العلامة الممتلئة ممنوحة والفارغة غير ممنوحة — حضور لا مقدار، فلا تدرّج لوني. '
          + 'العلامة المستديرة الصغيرة تعني صلاحية حسّاسة، وعمود العدد هو موضع الخطر: '
          + 'صفر عمل متوقف، وواحد اعتماد على شخص واحد.',
      chart: matrix,
      cols: ['الصلاحية', 'المفتاح', 'عدد من يملكها', 'من'],
      rows: PERM_CATALOG.map(pc => {
        const holders = active.filter(x => (x.perms || []).includes(pc.k));
        return [esc(pc.ar), '<span class="mono xs">' + pc.k + '</span>', String(holders.length),
          holders.map(h => esc(h.name)).join('، ') || '—'];
      }),
    }) + '</div></div>';

  /* ── band 4 · what changed in access ── */
  const cutoff = Date.now() - days * DAY;
  const allChanges = accessChanges();
  const changes = allChanges.filter(r => new Date(r.at).getTime() >= cutoff);
  const older = allChanges.length - changes.length;
  const b4 = '<div class="card"><div class="card__body">'
    + (changes.length
        ? '<div class="tl tl--tight">' + changes.map(r => {
            const who = (user(r.actor) || {}).name || 'غير معروف';
            return '<div class="tl__item"><span class="tl__dot tl__dot--done"></span><div>'
              + '<div class="tl__t">' + esc(r.action) + ' — <span class="sm">' + esc(who) + '</span></div>'
              + '<div class="tl__d">' + dt(r.at, true) + '</div>'
              + '<p class="sm">' + esc(r.detail || r.entity || '') + '</p></div></div>';
          }).join('') + '</div>'
        : '<p class="empty">لم يتغيّر شيء في الوصول خلال ' + days + ' يومًا.</p>')
    + (older ? '<p class="xs muted">و' + older + ' تغييرًا أقدم من الفترة المختارة — '
        + 'وسّع الفترة أعلاه أو افتح سجل التدقيق كاملًا.</p>' : '')
    + '<p class="xs muted">كل سطر هنا موجود في سجل التدقيق منذ وقوعه. الجديد أنه يُقرأ '
    + 'مجتمعًا: «هل تغيّر الوصول وأنا لا أنظر» سؤال لم يكن له جواب في شاشة واحدة.</p>'
    + '</div></div>';

  /* ── band 5 · is the record intact ── */
  const topActor = audit.byActor[0];
  const share = audit.total ? Math.round((topActor ? topActor.value : 0) / audit.total * 100) : 0;
  const b5 = '<div class="grid grid--2 grid--top">'
    + '<div class="card"><div class="card__body">'
    + '<div class="hero"><span class="hero__v" style="color:' + (audit.intact ? 'var(--pos)' : 'var(--crit)') + '">'
    + (audit.intact ? 'سليمة' : 'مكسورة') + '</span>'
    + '<span class="hero__k">سلسلة التجزئة عبر ' + audit.total + ' سطرًا في سجل التدقيق</span></div>'
    + (audit.intact
        ? '<div class="note note--pos sm">أُعيد حساب تجزئة كل سطر من محتواه ومن تجزئة سابقه، '
          + 'وطابقت المخزَّنة في كل الأسطر. أي تعديل أو حذف لسطر واحد كان سيكسر كل ما بعده.</div>'
        : (() => {
            const i = audit.recomputed[0] != null ? audit.recomputed[0] : audit.breaks[0];
            const r = STATE.audit[i] || {};
            return '<div class="note note--crit sm">لا تطابق في '
              + (audit.recomputed.length ? audit.recomputed.length + ' سطرًا عند إعادة الحساب' : '')
              + (audit.breaks.length ? (audit.recomputed.length ? '، و' : '') + audit.breaks.length + ' وصلة بين سطرين' : '')
              + '. أول موضع: السطر ' + (i + 1) + ' — «' + esc(r.action || '') + '» '
              + dt(r.at, true) + ' · تجزئة مخزَّنة <span class="mono">'
              + esc(String(r.hash || '').slice(0, 12)) + '…</span>. '
              + 'السطر نفسه هو ما تغيّر، أو سطر قبله.</div>';
          })())
    + '<div class="grid grid--3" style="gap:.6rem">'
    + [['أسطر السجل', String(audit.total)],
       ['أنواع الإجراءات', String(audit.byAction.length)],
       ['منفِّذون مختلفون', String(audit.byActor.length)]]
      .map(k => '<div class="kv"><div class="kv__k">' + k[0] + '</div><div class="kv__v">' + k[1] + '</div></div>').join('')
    + '</div>'
    + '<div class="note ' + (share > 70 ? 'note--warn' : '') + ' sm">'
    + (topActor
        ? 'أكثر المنفِّذين: <strong>' + esc(topActor.name || topActor.label) + '</strong> بـ' + share + '% من الأسطر. '
          + (share > 70 ? 'تركّز بهذا الحجم يجعل الرقابة الثنائية شكلية — طرفان في السجل واحدهما نادر.'
                        : 'التوزّع معقول: لا حساب واحد يحمل السجل.')
        : 'لا أسطر بعد.') + '</div>'
    + '</div></div>'
    + '<div class="card"><div class="card__body">' + frameHtml({
        title: 'نشاط السجل يوميًّا',
        sub: 'عدد الإجراءات المسجَّلة في كل يوم خلال ' + days + ' يومًا. '
           + 'الفراغ الطويل في نظام يُفترض أنه يعمل سؤال بحدّ ذاته.',
        chart: columnsSvg(activity.map(a => ({ label: a.label, value: a.value, count: a.count })),
          v => v + ' إجراء'),
        cols: ['اليوم', 'عدد الإجراءات'],
        rows: activity.filter(a => a.value > 0).map(a => [a.label, String(a.value)]),
      }) + '</div></div></div>'
    + '<div class="grid grid--4">'
    + [['حسابات فريق نشطة', String(active.length)],
       ['موقوفة', String(staff.length - active.length)],
       ['مستثمرون وأصحاب مشاريع', String(members.length)],
       ['دعوات صالحة', String(openInv.length)],
       ['اقتراحات إعدادات معلّقة', String(pendingSet.length)],
       ['بانتظار التحقق', String(members.filter(x => x.kyc === 'pending').length)]]
      .map(k => '<div class="kv"><div class="kv__k">' + k[0] + '</div><div class="kv__v">' + k[1] + '</div></div>').join('')
    + '</div>';

  const winPicker = '<span class="segsm">' + [[30, '30 يومًا'], [90, '90 يومًا']].map(w =>
    '<button data-act="setWin" data-win="' + w[0] + '" aria-pressed="' + (days === w[0]) + '">'
    + w[1] + '</button>').join('') + '</span>';

  return {
    crumb: 'إدارة النظام', title: 'لوحة إدارة النظام',
    wide: true, lede: '',
    hint: 'أسئلة الإدارة غير أسئلة التشغيل: لا أين المال، بل من يصل إليه، وهل يصل أحد وحده، '
        + 'وما الذي تغيّر في الوصول، وهل ما زال سجل «من فعل ماذا» متماسكًا.',
    /* Four bands, not five. "Who holds what" and "who can act alone" were two
       questions only on the screen — a reader asks them as one, and the answer
       to the second is the one they can act on. So the grouping leads and the
       matrix follows it folded: a reference is looked up, not read, and
       eighteen permissions across every active account was the single tallest
       thing on the page. */
    body: '<div class="stack" style="gap:1.4rem">'
      + band('01', 'هل في الوصول خلل؟',
             exc.length ? exc.length + ' بندًا، لا يُقتطع منها شيء' : 'لا شيء يستدعي تدخّلًا',
             b1, exc.length ? filter : '')
      + band('02', 'من يستطيع أن يفعل ماذا وحده؟',
             SOD_RULES.length + ' تجميعًا معلنًا على ' + active.length + ' حسابًا نشطًا',
             b2 + '<details class="fold"><summary>مصفوفة الصلاحيات كاملة — '
             + PERM_CATALOG.length + ' صلاحية على ' + active.length + ' حسابًا نشطًا</summary>'
             + '<div class="fold__b">' + b3 + '</div></details>')
      + band('03', 'ما الذي تغيّر في الوصول؟',
             changes.length + ' تغييرًا خلال ' + days + ' يومًا', b4, winPicker)
      + band('04', 'هل السجل متماسك؟', 'إعادة حساب السلسلة كاملة عند كل فتح', b5)
      + '</div>',
  };
};

/* ══════════════════════════════════════════════════════════════════════════
   ops · analytics
   Distributions and concentrations — the questions you ask sitting down.
   Pool-by-pool state lives on the dashboard and is deliberately not repeated
   here; two places showing the same table is how they drift apart.
   ══════════════════════════════════════════════════════════════════════════ */
const TICKET_BANDS = [
  { label: 'أقل من 500',      min: 0,          max: 500000 },
  { label: '500 — 2,000',     min: 500000,     max: 2000000 },
  { label: '2,000 — 10,000',  min: 2000000,    max: 10000000 },
  { label: '10,000 — 25,000', min: 10000000,   max: 25000000 },
  { label: '25,000 فأكثر',    min: 25000000,   max: Infinity },
];

VIEWS['ops.pipeline'] = () => {
  const base = BASE(STATE);
  const par = metricsParams();
  const live = STATE.orders.filter(o => COUNTED.has(o.status));
  const total = live.reduce((s, o) => s + o.amount, 0);

  /* Six selectors were written for this screen and it computed all six by
     hand instead — two implementations of one figure is the drift the layer
     exists to prevent. The funnel is the layer's now; so is the platform
     line above it. What stays inline is what no selector covers: the sector
     mix, the class mix, the ticket bands and the concentration. */
  const aum = selPlatformAum(base, SESSION);
  const pools = selActivePools(base, SESSION);
  const users = selActiveUsers(base, SESSION, par);
  const health = selPoolHealth(base, SESSION, par);
  const fees = selFeeRevenue(base, SESSION);
  const stages = selConversionFunnel(base, SESSION) || [];

  /* sectors — identity, so categorical in fixed order */
  const bySector = {};
  live.forEach(o => { const p = pool(o.poolId); bySector[p.sector] = (bySector[p.sector] || 0) + o.amount; });
  const sectors = Object.keys(bySector).map(k => ({ label: k, value: bySector[k] }))
    .sort((a, b) => b.value - a.value);

  /* class mix — where the money comes from, and how much rides on one class */
  const byClass = { retail: 0, angel: 0, sophisticated: 0 };
  const countClass = { retail: 0, angel: 0, sophisticated: 0 };
  live.forEach(o => {
    const iu = user(o.userId);
    if (!iu || !(iu.cls in byClass)) return;
    byClass[iu.cls] += o.amount;
    countClass[iu.cls] += 1;
  });
  const classParts = Object.keys(byClass).filter(k => byClass[k] > 0)
    .map((k, i) => ({ slot: ['retail', 'angel', 'sophisticated'].indexOf(k),
      label: CLASS_AR[k], value: byClass[k], count: countClass[k] }));

  /* ticket bands — ordered buckets, so the ordinal ramp again */
  const bands = TICKET_BANDS.map(b => {
    const inBand = live.filter(o => o.amount >= b.min && o.amount < b.max);
    return { label: b.label, value: inBand.length, sum: inBand.reduce((s, o) => s + o.amount, 0) };
  });

  /* concentration — the number that says how much rides on a few people */
  const byInvestor = {};
  live.forEach(o => { byInvestor[o.userId] = (byInvestor[o.userId] || 0) + o.amount; });
  const ranked = Object.keys(byInvestor).map(id => ({ id, name: (user(id) || {}).name || id, value: byInvestor[id] }))
    .sort((a, b) => b.value - a.value);
  const top5 = ranked.slice(0, 5).reduce((s, x) => s + x.value, 0);
  const topShare = total ? Math.round((top5 / total) * 100) : 0;
  const omr0 = v => fmt(v, 0) + ' ر.ع';

  return {
    crumb: 'فريق التشغيل', title: 'التحليلات',

   already agreed to, and both are irreversible once done. */

  const p = open.find(x => x.id === SESSION.poolId) || open[0];

    + '<div class="field" style="max-width:26rem"><label for="ampool">الفرصة</label>'

    + '<button class="btn btn--primary" data-act="amendDisclosure" data-pool="' + p.id + '">نشر التعديل</button>'
    + '<p class="xs muted">النسخ المنشورة لا تُعدَّل ولا تُحذف: كل تعديل سطر جديد في سجل النسخ يراه المستثمر.</p>'
    + '</div></div>';

/* Shows exactly what closing would do to each investor — before anyone
   clicks. The balance check is the point: allocated + refunded must equal
   requested, to the baisa. */
function allocationPreview() {
  const p = STATE.pools.find(x => x.status === 'funding');
  if (!p) return '<p class="empty">لا توجد فرصة مفتوحة للتمويل.</p>';
  const live = STATE.orders.filter(o => o.poolId === p.id && COUNTED.has(o.status));
  if (!live.length) return '<p class="empty">لا التزامات قائمة في ' + esc(p.ref) + '.</p>';
  const total = live.reduce((s, o) => s + o.amount, 0);
  const ceiling = ceilingOf(p);

  let alloc;
  if (total < p.minClose) alloc = live.map(() => 0);
  else if (total <= ceiling) alloc = live.map(o => o.amount);
  else {
    alloc = proRata(ceiling, live.map(o => o.amount));
    for (let pass = 0; pass < live.length; pass += 1) {
      const under = alloc.map((a, i) => ({ a, i })).filter(x => x.a > 0 && x.a < STATE.settings.minTicket);
      if (!under.length) break;
      under.forEach(x => { alloc[x.i] = 0; });
      const w = alloc.map((a, i) => (a > 0 ? live[i].amount : 0));
      if (w.every(x => x === 0)) break;
      alloc = proRata(ceiling, w);
    }
  }
  let tReq = 0, tGot = 0, tRef = 0, tUnits = 0;
  const rows = live.map((o, i) => {
    const got = Math.min(alloc[i], o.amount), ref = o.amount - got;
    const units = Math.floor(got / STATE.settings.unitPrice);
    tReq += o.amount; tGot += got; tRef += ref; tUnits += units;
    return '<tr><td class="sm">' + esc((user(o.userId) || {}).name) + '</td>'
      + '<td><span class="mono xs">' + o.id + '</span></td>'
      + '<td class="n">' + fmt(o.amount, 0) + '</td><td class="n">' + fmt(got, 0) + '</td>'
      + '<td class="n">' + (ref ? fmt(ref, 0) : '—') + '</td><td class="n">' + units + '</td></tr>';
  }).join('');

  const balanced = tGot + tRef === tReq && (total < p.minClose || tGot === Math.min(total, ceiling));
  const verdict = total < p.minClose
    ? 'الملتزم به ' + fmt(total, 0) + ' دون الحد الأدنى ' + fmt(p.minClose, 0) + ' — الإغلاق الآن يسترد كل شيء.'
    : total > ceiling
      ? 'الملتزم به ' + fmt(total, 0) + ' فوق السقف ' + fmt(ceiling, 0) + ' — يُخصَّص الجميع تناسبيًا.'
      : 'الملتزم به ' + fmt(total, 0) + ' بين الحد الأدنى والسقف — يُخصَّص كل التزام بالكامل.';

  return '<div class="note note--info">' + esc(p.ref) + ' — ' + verdict + '</div>'
    + '<div class="tablewrap"><table><thead><tr><th>المستثمر</th><th>الالتزام</th>'
    + '<th class="n">الطلب</th><th class="n">المخصَّص</th><th class="n">المسترد</th><th class="n">الوحدات</th></tr></thead>'
    + '<tbody>' + rows + '</tbody><tfoot><tr><td colspan="2">الإجمالي</td>'
    + '<td class="n">' + fmt(tReq, 0) + '</td><td class="n">' + fmt(tGot, 0) + '</td>'
    + '<td class="n">' + fmt(tRef, 0) + '</td><td class="n">' + tUnits + '</td></tr></tfoot></table></div>'
    + '<div class="note note--' + (balanced ? 'pos' : 'crit') + '">'
    + (balanced
        ? 'المطابقة تامة: المخصَّص زائد المسترد يساوي إجمالي الطلبات ' + fmt(tReq, 0) + ' ر.ع بالضبط — لا بايسة تُفقد أو تُستحدث.'
        : 'انحراف في المطابقة — لا يُغلق حتى يُحل.') + '</div>';
}

            + '<th>الطالب</th><th>رفضه</th><th>السبب</th><th>التاريخ</th></tr></thead><tbody>'
            + refused.map(d => '<tr><td><span class="mono xs">' + d.id + '</span></td>'

                + '<td class="sm">' + esc((user(d.requestedBy) || {}).name) + '</td>'
                + '<td class="sm">' + esc((user(d.rejectedBy) || {}).name) + '</td>'
                + '<td class="sm">' + esc(d.rejectReason || '') + '</td>'
                + '<td class="sm">' + dt(d.rejectedAt) + '</td></tr>').join('')
            + '</tbody></table></div></div></div>'
          : ''),
  };
};
function createDsbForm() {
  const opts = [];
  STATE.pools.forEach(p => {
    if (!['funded', 'operating'].includes(p.status)) return;
    p.milestones.filter(m => m.state === 'pending').forEach(m => {
      opts.push('<option value="' + p.id + '|' + m.id + '">' + esc(p.ref) + ' — ' + esc(m.label)
        + ' (' + fmt(m.amount, 0) + ' ر.ع)</option>');
    });
  });
  if (!opts.length) return '<div class="note note--pos">لا توجد مرحلة قابلة للطلب الآن.</div>';
  return '<div class="field"><label for="dpick">المرحلة</label><select id="dpick">' + opts.join('') + '</select></div>'
    + '<div class="field"><label for="dev">وصف الدليل</label><textarea id="dev" placeholder="رقم المحضر أو الفاتورة وما تثبته"></textarea></div>'
    + '<button class="btn btn--primary" data-act="createDsb">إنشاء الطلب</button>'
    + '<p class="xs muted">سيُسجَّل باسمك، ولن تستطيع اعتماده بنفسك بعدها.</p>';
}

/* ── ops · bank reconciliation ────────────────────────────────────────────
   A workflow screen, not an analysis board: cards in the order the work
   happens, like the disbursement screen — not the numbered bands the
   dashboards use. */
VIEWS['ops.recon'] = () => {
  const u = me();
  const canDo = can(u, 'funds.reconcile');
  const money = moneyPosition();
  const held = money.parts.reduce((s, x) =>
    s + (x.key === 'escrow' || x.key === 'funding' ? x.value : 0), 0);
  const open = STATE.reconciliations.find(r => r.status !== 'signed');
  const done = STATE.reconciliations.filter(r => r.status === 'signed').slice().reverse();
  const omr0 = v => fmt(v, 0) + ' ر.ع';

  /* ── 1 · what our own record claims ── */
  const b1 = '<div class="card"><div class="card__head"><h2>ما يقوله سجلّنا</h2>'
    + '<span class="spacer xs muted">محسوب لحظة العرض من الالتزامات والصرف</span></div>'
    + '<div class="card__body">'
    + '<div class="hero"><span class="hero__v">' + fmt(held, 0) + '</span>'
    + '<span class="hero__k">ريال عُماني يقول هذا المستند إنها في حساب الضمان الآن</span></div>'
    + (money.overDisbursed > 0
        ? '<div class="note note--crit"><strong>صرف زائد بلا غطاء: ' + omr0(money.overDisbursed) + '.</strong> '
          + money.overdrawn.map(x => esc(x.pool.ref) + ': صُرف ' + fmt(x.paid, 0)
              + ' من مخصَّص ' + fmt(x.alloc, 0)).join(' · ')
          + '. هذا مال خرج من الضمان أكثر ممّا دخله لتلك الفرصة، ولا يُغلق أي مطابقة قبل تفسيره.</div>'
        : '')
    + '<div class="grid grid--3" style="gap:.6rem">'
    + money.parts.map(x => '<div class="kv"><div class="kv__k">' + esc(x.label) + '</div>'
        + '<div class="kv__v" style="font-size:.95rem">' + omr0(x.value) + '</div></div>').join('')
    + '</div>'
    + '<p class="xs muted">هذا الرقم بقايا حسابية من جداولنا نحن: المخصَّص ناقص المصروف. '
    + 'وهو ليس دليلًا على شيء حتى يُقابَل بكشف من طرف لا مصلحة له في موافقتنا — '
    + 'وذلك هو كل الغرض من هذه الشاشة.</p>'
    + '</div></div>';

  /* ── 2 · paste the partner's statement ── */
  const b2 = open ? '' : (canDo
    ? '<div class="card"><div class="card__head"><h2>كشف الشريك المرخّص</h2></div>'
      + '<div class="card__body">'
      + '<div class="grid grid--4">'
      + '<div class="field"><label for="rcFrom">من</label>'
      + '<input id="rcFrom" type="date" dir="ltr" value="' + esc(nowIso().slice(0, 8) + '01') + '"></div>'
      + '<div class="field"><label for="rcTo">إلى</label>'
      + '<input id="rcTo" type="date" dir="ltr" value="' + esc(nowIso().slice(0, 10)) + '"></div>'
      + '<div class="field"><label for="rcOpen">الرصيد الافتتاحي (ر.ع)</label>'
      + '<input id="rcOpen" class="num" dir="ltr" inputmode="decimal" value="0.000"></div>'
      + '<div class="field"><label for="rcClose">الرصيد الختامي (ر.ع)</label>'
      + '<input id="rcClose" class="num" dir="ltr" inputmode="decimal" value="0.000"></div>'
      + '</div>'
      + '<div class="field"><label for="rcPaste">ألصق الكشف</label>'
      + '<textarea id="rcPaste" rows="7" dir="ltr" style="font-family:var(--mo);font-size:.78rem" '
      + 'placeholder="2026-08-01,ORD-2026-0001,Investor commitment ORD-2026-0001,1500.000,"></textarea>'
      + '<span class="field__hint">CSV أو مفصول بجدولة. الأعمدة: تاريخ (YYYY-MM-DD)، مرجع، وصف، '
      + 'وارد، صادر — أو أربعة أعمدة بمبلغ موقَّع في الأخير. الترويسة تُتجاهل.</span></div>'
      + '<div id="rcErr"></div>'
      + '<button class="btn btn--primary" data-act="openRecon">اقرأ الكشف وطابِق</button>'
      + '<p class="xs muted">تُقرأ الأسطر ثم تُطابَق بالمبلغ والاتجاه ومرجعٍ يظهر في وصف السطر نفسه. '
      + 'وما لا يُقرأ يُعرض بسببه — لا يُسقَط سطر من كشف بنكي في صمت.</p>'
      + '</div></div>'
    : '<div class="note note--warn">لا توجد مطابقة مفتوحة، وحسابك يقرأ هذه الشاشة ولا يُعدّ فيها.</div>');

  /* ── 3 · the open reconciliation ── */
  let b3 = '';
  if (open) {
    const bal = reconBalance(open);
    const broken = statementWhole(open);
    const unresolved = open.breaks.filter(b => !breakDone(b) && !b.caseId);
    const KIND_OPTS = BREAK_KINDS.map(k =>
      '<option value="' + k.k + '">' + esc(k.ar) + ' — ' + esc(k.why) + '</option>').join('');

    const breakRow = b => {
      const set = breakDone(b);
      return '<div class="panel card" style="box-shadow:none"><div class="card__body">'
        + '<div class="row row--tight">'
        + '<span class="chip ' + (b.side === 'statement' ? 'chip--sand' : 'chip--brand') + '">'
        + (b.side === 'statement' ? 'في الكشف لا عندنا' : 'عندنا لا في الكشف') + '</span>'
        + '<span class="num sm">' + rial(b.amount) + '</span>'
        + '<span class="mono xs muted">' + esc(b.ref) + '</span>'
        + '<span class="spacer">' + (b.caseId
            ? '<span class="chip chip--warn"><span class="chip__dot"></span>حالة ' + esc(b.caseId) + '</span>'
            : set ? '<span class="chip chip--pos"><span class="chip__dot"></span>مفسَّر</span>'
                  : '<span class="chip chip--crit"><span class="chip__dot"></span>بلا تفسير</span>')
        + '</span></div>'
        + '<div class="sm">' + esc(b.what) + '</div>'
        + (set ? '<div class="note note--pos sm"><strong>'
              + esc((BREAK_KINDS.find(k => k.k === b.kind) || {}).ar || '') + '</strong> — '
              + esc(b.note) + '</div>' : '')
        + (canDo && !b.caseId
            ? '<div class="grid grid--2">'
              + '<div class="field"><label for="bk_' + b.id + '">التصنيف</label>'
              + '<select id="bk_' + b.id + '">' + KIND_OPTS + '</select></div>'
              + '<div class="field"><label for="bn_' + b.id + '">التفسير</label>'
              + '<input id="bn_' + b.id + '" placeholder="ما هذا الفرق ولماذا وقع"></div></div>'
              + '<div class="row">'
              + '<button class="btn btn--sm btn--primary" data-act="explainBreak" data-rec="' + open.id
              + '" data-id="' + b.id + '">' + (set ? 'حدّث التفسير' : 'فسّر') + '</button>'
              + '<button class="btn btn--sm" data-act="escalateBreak" data-rec="' + open.id
              + '" data-id="' + b.id + '">افتح حالة مطابقة</button></div>'
            : '')
        + '</div></div>';
    };

    b3 = '<div class="card"><div class="card__head"><h2>المطابقة ' + esc(open.id) + '</h2>'
      + '<span class="chip">' + esc(open.periodFrom) + ' → ' + esc(open.periodTo) + '</span>'
      + '<span class="spacer chip ' + (open.status === 'prepared' ? 'chip--warn' : '') + '">'
      + (open.status === 'prepared' ? 'أُعدّت — بانتظار طرف ثانٍ' : 'مسودة') + '</span></div>'
      + '<div class="card__body">'

      + (open.rejected.length
          ? '<div class="note note--crit"><strong>' + open.rejected.length + ' سطرًا لم يُقرأ ولم يدخل المطابقة:</strong>'
            + '<div class="tablewrap" style="margin-block-start:.5rem"><table><thead><tr>'
            + '<th class="n">السطر</th><th>السبب</th><th>النصّ كما لُصق</th></tr></thead><tbody>'
            + open.rejected.map(r => '<tr><td class="n">' + r.n + '</td>'
                + '<td class="sm">' + esc(r.why) + '</td>'
                + '<td><span class="mono xs">' + esc(r.raw) + '</span></td></tr>').join('')
            + '</tbody></table></div></div>'
          : '')

      + '<div class="grid grid--4">'
      + [['أسطر مقروءة', String(open.lines.length)],
         ['مطابَقة بالمرجع', String(open.matched.length)],
         ['فروق', String(open.breaks.length)],
         ['بلا تفسير', String(unresolved.length)]]
        .map(k => '<div class="kv"><div class="kv__k">' + k[0] + '</div><div class="kv__v">' + k[1] + '</div></div>').join('')
      + '</div>'

      + '<h3>هل الكشف نفسه متّزن؟</h3>'
      + '<div class="tablewrap"><table><tbody>'
      + [['الرصيد الافتتاحي', rial(open.openingBalance)],
         ['زائد الوارد', rial(bal.inn)],
         ['ناقص الصادر', rial(bal.out)],
         ['يساوي', rial(bal.computed)],
         ['والكشف يعلن إقفالًا عند', rial(open.closingBalance)]]
        .map(r => '<tr><td class="sm">' + r[0] + '</td><td class="n">' + r[1] + '</td></tr>').join('')
      + '</tbody></table></div>'
      + (broken ? '<div class="note note--crit">' + esc(broken) + '</div>'
                : '<div class="note note--pos">الكشف متّزن داخليًّا: افتتاحيّه وحركته يبلغان إقفاله بالبايسة. '
                  + 'وهذا لا يقول إننا نطابقه — يقول إننا نقرأ كشفًا كاملًا.</div>')

      + '<h3>الفروق</h3>'
      + (open.breaks.length
          ? '<p class="xs muted">كل فرق هنا حركة على جهة واحدة بلا مقابل على الأخرى. '
            + 'ولا تُغلق المطابقة قبل أن يحمل كلٌّ منها تصنيفًا وتفسيرًا، أو حالةً مفتوحة بمهلة.</p>'
            + '<div class="stack-s">' + open.breaks.map(breakRow).join('') + '</div>'
          : '<div class="note note--pos">لا فرق: كل سطر في الكشف قابله حدث في السجل، والعكس.</div>')

      + '<h3>الإغلاق</h3>'
      + (open.returnReason && open.status === 'draft'
          ? '<div class="note note--crit"><strong>أُعيدت إلى المسودة.</strong> '
            + esc((user(open.returnedBy) || {}).name || '') + ' في ' + dt(open.returnedAt, true)
            + ' — ' + esc(open.returnReason) + '</div>'
          : '')
      + (open.status === 'prepared'
          ? '<div class="note note--info">أعدّها <strong>' + esc((user(open.preparedBy) || {}).name || '')
            + '</strong> في ' + dt(open.preparedAt, true) + '.'
            + (open.preparedBy === u.id
                ? ' <strong>وأنت من أعدّها، فلا توقّعها.</strong> يلزم طرف ثانٍ يملك صلاحية المطابقة.'
                : '') + '</div>'
          : '')
      + (canDo
          ? '<div class="row">'
            + (open.status === 'draft'
                ? '<button class="btn btn--primary" data-act="prepareRecon" data-rec="' + open.id + '">'
                  + 'أعِدّها للتوقيع</button>' : '')
            + (open.status === 'prepared' && open.preparedBy !== u.id
                ? '<button class="btn btn--primary" data-act="signRecon" data-rec="' + open.id + '">'
                  + 'وقّع المطابقة</button>'
                  + '<button class="btn btn--danger" data-act="askReject" data-kind="reconciliation" '
                  + 'data-id="' + open.id + '">أعِدها بسبب</button>' : '')
            + '</div>'
            + (REJECTING && REJECTING.kind === 'reconciliation' && REJECTING.id === open.id
                ? '<div class="qrow__reject">'
                  + '<div class="field"><label for="rejWhy">سبب الإعادة</label>'
                  + '<textarea id="rejWhy" rows="2" placeholder="ما الذي يمنع التوقيع عليها"></textarea></div>'
                  + '<div class="row row--tight">'
                  + '<button class="btn btn--sm btn--danger" data-act="doReject" data-kind="reconciliation" data-id="' + open.id + '">تأكيد الإعادة</button>'
                  + '<button class="btn btn--sm" data-act="cancelReject">تراجع</button></div></div>'
                : '')
            + '<p class="xs muted">التوقيع يقول «المال حيث قلنا إنه». فيحتاج طرفًا ثانيًا، ويحتاج '
            + 'أن يكون الكشف متّزنًا وكل فرق مفسَّرًا — تمامًا كما لا تُغلق فرصة لا يتطابق تخصيصها.</p>'
          : '<div class="note note--warn">حسابك يقرأ هذه المطابقة ولا يُعدّها ولا يوقّعها.</div>')
      + '</div></div>';
  }

  /* ── 4 · what has been signed ── */
  const b4 = '<div class="card"><div class="card__head"><h2>مطابقات موقَّعة</h2>'
    + '<span class="spacer chip">' + done.length + '</span></div>'
    + '<div class="card__body card__body--flush"><div class="tablewrap"><table>'
    + '<thead><tr><th>المرجع</th><th>الفترة</th><th class="n">الإقفال</th>'
    + '<th class="n">أسطر</th><th class="n">فروق</th><th>أعدّها</th><th>وقّعها</th><th>التاريخ</th></tr></thead><tbody>'
    + (done.length ? done.map(r => '<tr><td><span class="mono xs">' + r.id + '</span></td>'
        + '<td class="sm">' + esc(r.periodFrom) + ' → ' + esc(r.periodTo) + '</td>'
        + '<td class="n">' + fmt(r.closingBalance, 0) + '</td>'
        + '<td class="n">' + r.lines.length + '</td>'
        + '<td class="n">' + r.breaks.length + '</td>'
        + '<td class="sm">' + esc((user(r.preparedBy) || {}).name || '—') + '</td>'
        + '<td class="sm">' + esc((user(r.signedBy) || {}).name || '—') + '</td>'
        + '<td class="sm">' + dt(r.signedAt) + '</td></tr>').join('')
      : '<tr><td colspan="8" class="empty">لم تُوقَّع مطابقة بعد.</td></tr>')
    + '</tbody></table></div></div></div>';

  return {
    crumb: 'فريق التشغيل · ' + (JOB_AR[u.job] || ''), title: 'المطابقة البنكية',
    lede: 'تَعِد كل صفحة في هذه المنصة بأن المال في حساب ضمان منفصل لدى شريك مرخّص، '
        + 'ويُقرّ به المستثمر قبل كل التزام. هنا يُقابَل ذلك الوعد بكشفٍ من الشريك نفسه — '
        + 'ولا يُغلق إلا بتوقيع طرفين وبكل فرق مسمّى.',
    body: b1 + b2 + b3 + b4,
  };
};

/* ── ops · distributions ──────────────────────────────────────────────── */

    crumb: 'فريق التشغيل', title: 'التوزيعات',
    lede: 'يُقسَّم مبلغ التوزيع على المستثمرين بنسبة ما خُصص لكل منهم، بطريقة أكبر باقٍ — فمجموع الحصص يساوي المبلغ بالضبط.',
    body: (!p ? '<p class="empty">لا توجد فرصة بمستثمرين مخصَّصين بعد.</p>'
      : '<div class="card"><div class="card__head"><h2>توزيع جديد</h2></div><div class="card__body">'
        + '<div class="field"><label for="dpool">الفرصة</label><select id="dpool" data-act="pickPool">'
        + payable.map(x => '<option value="' + x.id + '"' + (x.id === p.id ? ' selected' : '') + '>'
          + esc(x.title) + '</option>').join('') + '</select></div>'
        + '<div class="field"><label for="dper">الفترة</label><input id="dper" value="الربع الثالث 2026"></div>'
        + '<div class="field"><label for="dgross">المبلغ الإجمالي (ر.ع)</label>'
        + '<input id="dgross" class="num" dir="ltr" inputmode="decimal" value="2100.000"></div>'
        + '<button class="btn btn--primary" data-act="createDist" data-pool="' + p.id + '">تنفيذ التوزيع</button>'
        + '<div class="tablewrap"><table><thead><tr><th>المستثمر</th><th class="n">المخصَّص</th><th class="n">الوزن</th></tr></thead><tbody>'

            const tot = holders.reduce((s, x) => s + (x.allocated || x.amount), 0);
            const a = o.allocated || o.amount;
            return '<tr><td class="sm">' + esc((user(o.userId) || {}).name) + '</td>'

          }).join('')
        + '</tbody></table></div></div></div>')
      + '<div class="card"><div class="card__head"><h2>سجل التوزيعات</h2></div>'
      + '<div class="card__body card__body--flush"><div class="tablewrap"><table>'

      + (STATE.distributions.length ? STATE.distributions.slice().reverse().map(d => {
          const sum = (d.shares || []).reduce((s, x) => s + x.amount, 0);
          return '<tr><td><span class="mono xs">' + d.id + '</span></td><td class="sm">' + esc(pool(d.poolId).ref) + '</td>'
            + '<td class="sm">' + esc(d.period) + '</td><td class="n">' + fmt(d.gross, 0) + '</td>'
            + '<td class="n">' + (d.shares ? fmt(sum, 0) + ' على ' + d.shares.length : '—') + '</td>'

        }).join('') : '<tr><td colspan="6" class="empty">لا توزيعات.</td></tr>')
      + '</tbody></table></div></div></div>',
  };
};

/* ── compliance · the queue that turns a registration into a usable account ── */

  const canAct = can(u, 'kyc.approve');
  const pending  = STATE.users.filter(x => ['investor', 'owner'].includes(x.role) && x.kyc === 'pending');

  const row = (t, showActions) => {
    const claim = t.claimedCls && t.claimedCls !== 'retail';
    return '<tr id="rec-' + esc(t.id) + '"><td class="sm">' + esc(t.name) + '</td>'
      + '<td><span class="mono xs">' + esc(t.email || '—') + '</span></td>'
      + '<td class="sm">' + esc(ROLE_AR[t.role]) + '</td>'
      + '<td class="sm">' + (t.role === 'investor'
          ? CLASS_AR[t.cls] + (claim ? ' <span class="chip chip--sand">يطلب ' + CLASS_AR[t.claimedCls] + '</span>' : '')
          : '—') + '</td>'
      + '<td>' + (t.role === 'investor'
          ? (t.suit === 'restricted'
              ? '<span class="chip chip--warn"><span class="chip__dot"></span>مقيدة' + (t.suitScore != null ? ' (' + t.suitScore + '/8)' : '') + '</span>'
              : '<span class="chip chip--pos"><span class="chip__dot"></span>اجتاز' + (t.suitScore != null ? ' (' + t.suitScore + '/8)' : '') + '</span>')
          : '—') + '</td>'
      + '<td>' + (t.kyc === 'approved' ? '<span class="chip chip--pos"><span class="chip__dot"></span>معتمد</span>'
                : t.kyc === 'rejected' ? '<span class="chip chip--crit"><span class="chip__dot"></span>مرفوض</span>'
                : '<span class="chip chip--warn"><span class="chip__dot"></span>قيد المراجعة</span>') + '</td>'
      + '<td>' + (showActions && canAct
          ? '<div class="row row--tight">'

            + (a.status === 'approved'

    body: '<div class="card"><div class="card__head"><h2>قيد المعالجة</h2>'

/* ── monitoring · the report gate ──────────────────────────────────────
   Closes the loop the owner starts: submitted reports land here, and only
   what is published here reaches an investor. */
VIEWS['ops.reports'] = () => {
  const u = me();
  const canAct = can(u, 'report.publish');
  const waiting = STATE.reports.filter(r => ['submitted', 'late'].includes(r.status) && r.submittedAt);
  const scheduled = STATE.reports.filter(r => !r.submittedAt && r.status !== 'published');
  const published = STATE.reports.filter(r => r.status === 'published');
  const operating = STATE.pools.filter(p => ['funded', 'operating'].includes(p.status));

  const kpiTable = r => '<div class="tablewrap"><table><thead><tr><th>المؤشر</th>'
    + '<th class="n">الفعلي</th><th class="n">المتوقع</th><th class="n">الانحراف</th></tr></thead><tbody>'
    + (r.kpis || []).map(k => {
        const dev = k.forecast ? Math.round(((k.actual - k.forecast) / k.forecast) * 1000) / 10 : null;
        return '<tr><td class="sm">' + esc(k.metric) + '</td><td class="n">' + k.actual + '</td>'
          + '<td class="n">' + (k.forecast == null ? '—' : k.forecast) + '</td>'
          + '<td class="n">' + (dev === null ? '—'
              : '<span class="chip ' + (dev >= 0 ? 'chip--pos' : 'chip--warn') + '">'
                + (dev > 0 ? '+' : '') + dev + '%</span>') + '</td></tr>';
      }).join('') + '</tbody></table></div>';

  return {
    crumb: 'فريق التشغيل · ' + (JOB_AR[u.job] || ''), title: 'مراجعة التقارير',
    lede: 'لا يصل تقرير إلى مستثمر قبل أن يُراجَع هنا. تُقارن المؤشرات بما نشره الإفصاح، ويُنشر التقرير أو يُعاد لصاحب المشروع بسبب مكتوب.',
    body: (canAct ? '' : '<div class="note note--warn">حسابك يقرأ هذه الشاشة ولا ينشر فيها.</div>')
      + '<div class="card"><div class="card__head"><h2>بانتظار المراجعة</h2>'
      + '<span class="spacer chip ' + (waiting.length ? 'chip--warn' : 'chip--pos') + '">' + waiting.length + '</span></div>'
      + '<div class="card__body">'
      + (waiting.length ? waiting.map(r => {
          const p = pool(r.poolId) || {};
          const late = r.status === 'late';
          return '<div class="panel card" id="rec-' + esc(r.id) + '" style="box-shadow:none"><div class="card__body">'
            + '<div class="row"><h3>' + esc(r.period) + ' — ' + esc(p.title || '') + '</h3>'
            + chip(REPORT_STATUS, r.status)
            + '<span class="spacer xs muted">قُدِّم ' + dt(r.submittedAt, true) + '</span></div>'
            + (late ? '<div class="note note--warn sm">قُدِّم بعد موعد الاستحقاق ' + dt(r.dueAt)
                + ' — يُسجَّل متأخرًا في مؤشر الالتزام بالمواعيد.</div>' : '')
            + kpiTable(r)
            + '<p class="sm">' + esc(r.narrative) + '</p>'
            + (r.variance ? '<div class="note sm"><strong>تفسير الانحراف:</strong> ' + esc(r.variance) + '</div>' : '')
            + (canAct
                ? '<div class="field"><label for="rn_' + r.id + '">سبب الإعادة (يلزم عند الإعادة فقط)</label>'
                  + '<textarea id="rn_' + r.id + '" rows="2" placeholder="ما الذي يجب تصحيحه"></textarea></div>'
                  + '<div class="row">'
                  + '<button class="btn btn--primary" data-act="publishReport" data-report="' + r.id + '">نشر للمستثمرين</button>'
                  + '<button class="btn" data-act="returnReport" data-report="' + r.id + '">إعادة لصاحب المشروع</button>'
                  + '</div>'
                : '')
            + '</div></div>';
        }).join('')
        : '<p class="empty">لا تقارير بانتظار المراجعة.</p>')
      + '</div></div>'

      + '<div class="card"><div class="card__head"><h2>الجدول والمنشور</h2></div>'
      + '<div class="card__body card__body--flush"><div class="tablewrap"><table>'
      + '<thead><tr><th>الفرصة</th><th>الفترة</th><th>الاستحقاق</th><th>الحالة</th><th>النشر</th></tr></thead><tbody>'
      + (scheduled.concat(published).length
          ? scheduled.concat(published).map(r => {
              const overdue = !r.submittedAt && new Date(r.dueAt + 'T23:59:59Z') < new Date();
              return '<tr><td class="sm">' + esc((pool(r.poolId) || {}).ref || '—') + '</td>'
                + '<td class="sm">' + esc(r.period) + '</td>'
                + '<td class="sm">' + (overdue ? '<span class="chip chip--crit"><span class="chip__dot"></span>'
                    + dt(r.dueAt) + '</span>' : dt(r.dueAt)) + '</td>'
                + '<td>' + chip(REPORT_STATUS, r.status) + '</td>'
                + '<td class="sm">' + dt(r.publishedAt) + '</td></tr>';
            }).join('')
          : '<tr><td colspan="5" class="empty">لا جدول بعد.</td></tr>')
      + '</tbody></table></div></div></div>'

      + (canAct && operating.length
        ? '<div class="card"><div class="card__head"><h2>جدولة فترة جديدة</h2></div><div class="card__body">'
          + '<div class="grid grid--3">'
          + '<div class="field"><label for="schpool">الفرصة</label><select id="schpool">'
          + operating.map(p => '<option value="' + p.id + '">' + esc(p.ref) + ' — ' + esc(p.title) + '</option>').join('')
          + '</select></div>'
          + '<div class="field"><label for="schper">الفترة</label><input id="schper" placeholder="الربع الرابع 2026"></div>'
          + '<div class="field"><label for="schdue">الاستحقاق</label><input id="schdue" type="date" dir="ltr"></div>'
          + '</div>'
          + '<button class="btn btn--primary" data-act="scheduleReport">جدولة</button>'
          + '<p class="xs muted">الالتزام بالتقارير يستمر طوال مدة المشروع، فجدولة الفترة التالية جزء من إغلاق الحالية.</p>'
          + '</div></div>'
        : ''),
  };
};

/* ── cases ─────────────────────────────────────────────────────────────
   Every open case has an owner and a clock; the dashboard points here. */
VIEWS['ops.cases'] = () => {
  const u = me();
  const canAct = can(u, 'case.work');
  const now = Date.now();
  const withAge = c => Object.assign({}, c, {
    age: Math.floor((now - new Date(c.openedAt).getTime()) / DAY),
    over: Math.floor((now - new Date(c.openedAt).getTime()) / DAY) - c.slaDays,
  });
  const open = STATE.cases.filter(c => c.status !== 'resolved').map(withAge)
    .sort((a, b) => b.over - a.over);
  const done = STATE.cases.filter(c => c.status === 'resolved');
  const resolved = done.filter(c => c.daysToResolve != null);
  const avg = resolved.length
    ? Math.round(resolved.reduce((s, c) => s + c.daysToResolve, 0) / resolved.length) : null;

  const card = c => '<div class="panel card" id="rec-' + esc(c.id) + '" style="box-shadow:none"><div class="card__body">'
    + '<div class="row"><span class="mono xs">' + c.id + '</span>'
    + '<span class="chip">' + esc(c.kind) + '</span>'
    + chip(CASE_STATUS, c.status)
    + (c.over > 0 ? '<span class="chip chip--crit"><span class="chip__dot"></span>تجاوزت الـSLA بـ'
        + c.over + ' يومًا</span>'
      : '<span class="chip chip--pos"><span class="chip__dot"></span>ضمن المهلة</span>')
    + '<span class="spacer xs muted">مفتوحة منذ ' + c.age + ' يومًا · مهلة ' + c.slaDays + '</span></div>'
    + '<h3>' + esc(c.subject) + '</h3>'
    + '<div class="sm muted">' + esc((pool(c.poolId) || {}).title || '—') + '</div>'
    + (c.raisedBy ? '<div class="sm">من: <strong>' + esc((user(c.raisedBy) || {}).name || '')
        + '</strong> <span class="mono xs muted">' + esc((user(c.raisedBy) || {}).email || '') + '</span></div>' : '')
    + '<div class="sm">المسؤول: ' + (c.assignedTo
        ? '<strong>' + esc((user(c.assignedTo) || {}).name || '') + '</strong>'
        : '<span class="muted">لم يتولّها أحد</span>') + '</div>'
    + ((c.notes || []).length
        ? '<div class="stack-s">' + c.notes.slice().reverse().map(n =>
            '<div class="note ' + (n.kind === 'resolve' ? 'note--pos ' : '') + 'sm">'
            + '<div class="xs muted">' + dt(n.at, true) + ' · ' + esc((user(n.by) || {}).name || '') + '</div>'
            + esc(n.text) + '</div>').join('') + '</div>'
        : '')
    + (canAct
        ? '<div class="field"><label for="cn_' + c.id + '">ملاحظة أو سبب الإغلاق</label>'
          + '<textarea id="cn_' + c.id + '" rows="2" placeholder="ما الذي فُعل"></textarea></div>'
          + '<div class="row">'
          + (c.assignedTo !== u.id
              ? '<button class="btn btn--sm" data-act="takeCase" data-case="' + c.id + '">تولّي الحالة</button>' : '')
          + '<button class="btn btn--sm" data-act="noteCase" data-case="' + c.id + '">إضافة ملاحظة</button>'
          + '<button class="btn btn--sm btn--primary" data-act="resolveCase" data-case="' + c.id + '">إغلاق</button>'
          + '</div>'
        : '')
    + '</div></div>';

  return {
    crumb: 'فريق التشغيل · ' + (JOB_AR[u.job] || ''), title: 'الحالات والشكاوى',
    lede: 'لكل حالة مسؤول ومهلة. العمل بلا مسؤول عمل بلا صاحب، فتولّي الحالة إجراء صريح يُسجَّل، والإغلاق يحتاج وصفًا لما عولج.',
    body: (canAct ? '' : '<div class="note note--warn">حسابك يقرأ الحالات ولا يعالجها.</div>')
      + '<div class="grid grid--4">'
      + [['مفتوحة', String(open.length)],
         ['تجاوزت الـSLA', String(open.filter(c => c.over > 0).length)],
         ['بلا مسؤول', String(open.filter(c => !c.assignedTo).length)],
         ['متوسط زمن الإغلاق', avg == null ? '—' : avg + ' يومًا']]
        .map(k => '<div class="kv"><div class="kv__k">' + k[0] + '</div><div class="kv__v">' + k[1] + '</div></div>').join('')
      + '</div>'
      + '<div class="card"><div class="card__head"><h2>مفتوحة</h2>'
      + '<span class="spacer xs muted">الأكثر تجاوزًا للمهلة أولًا</span></div><div class="card__body">'
      + (open.length ? open.map(card).join('') : '<p class="empty">لا حالات مفتوحة.</p>')
      + '</div></div>'

/* ══════════════════════════════════════════════════════════════════════════
   EXPORT
   An auditor's work leaves the screen. Every dataset here is built from what
   the signed-in account is already allowed to read, and credentials are
   never among the columns — a salt and a password hash have no business in
   a spreadsheet, whoever is asking.

let SAVER = null;   // the downloads namespace, once resolved

/* RFC 4180 quoting, and a BOM so Arabic opens correctly in Excel. */
function toCsv(cols, rows) {
  const cell = v => {
    const t = v == null ? '' : String(v);
    return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  };
  return '﻿' + [cols.map(cell).join(',')]
    .concat(rows.map(r => r.map(cell).join(',')))
    .join('\r\n') + '\r\n';
}

/* ══════════════════════════════════════════════════════════════════════════
   SHELL + ROUTER

function navBadge(key) {
  const h = healthCounters();
  if (key === 'inv.portfolio') return STATE.orders.filter(o => o.userId === SESSION.authUserId && COUNTED.has(o.status)).length || '';
  if (key === 'ops.money')  return h.awaiting.length || '';
  /* healthCounters() has computed `recon` since the first version of this
     function and nothing has ever read it. It is the count of open
     reconciliation cases — exactly what this badge is for. */
  if (key === 'ops.recon')  return h.recon.length
    + STATE.reconciliations.filter(r => r.status !== 'signed').length || '';
  if (key === 'ops.apps')   return STATE.applications.filter(a => !['published','rejected'].includes(a.status)).length || '';
  if (key === 'own.apps')   return appsOf(SESSION.authUserId).filter(a => !['published','rejected'].includes(a.status)).length || '';
  if (key === 'ops.kyc')    return STATE.users.filter(x => ['investor','owner'].includes(x.role) && x.kyc === 'pending').length || '';
  if (key === 'ops.audit')  return STATE.audit.length || '';
  if (key === 'ops.dash')   return h.openCases.length || '';
  if (key === 'own.reports') return STATE.reports.filter(r =>
    r.poolId === (me().pool || '') && ['scheduled', 'late'].includes(r.status)).length || '';
  return '';
}

/* A count beside a destination means one of two things, and they must not
   look alike: work waiting on somebody, or the size of a record. Only the
   first is worth a colour — a badge on the audit log saying 214 is not a
   queue, and colouring it teaches the reader to ignore the ones that are. */
const NAV_WORK = new Set(['ops.dash', 'ops.money', 'ops.recon', 'ops.apps',
                          'ops.kyc', 'own.apps', 'own.reports']);

/* One link, rendered the same in the sidebar and in the phone's sheet. It is
   a real anchor: middle click, Ctrl+click, "copy link address" and the back
   button all come free, and a screen reader announces it as what it is.
   `data-act` is deliberately absent so the click handler leaves it alone and
   the browser follows the href itself. */
function navLinkHtml(n) {
  const b = navBadge(n.k);
  const work = b !== '' && NAV_WORK.has(n.k);
  return '<a class="navlink" href="' + esc(hrefFor(n.k)) + '" data-view="' + n.k + '"'
    + (n.k === SESSION.view ? ' aria-current="page"' : '') + '>'
    + '<span class="navlink__t">' + esc(n.label) + '</span>'
    + (b === '' ? ''

/* The nav entries have carried a group since they were written and only the
   sheet ever used it; the sidebar printed the account's role once at the top
   and then fifteen numbered rows in one undivided column. */
function navGroups(nav) {
  const out = [];
  nav.forEach(n => {
    const g = n.group || 'أخرى';
    const at = out.find(x => x.g === g);
    if (at) at.items.push(n); else out.push({ g, items: [n] });
  });
  return out;
}

let LAST_SCREEN = null;
let LAST_HREF = null;
let NAVSHEET = false;      // the phone's «المزيد» sheet, open or not

/* Every commit rebuilds the shell, which destroys whatever had focus. Doing
   nothing about it is not neutral: focus falls back to the document body, so
   a keyboard user is silently returned to the top of the page after each
   action. Name the focused control by what it does rather than by identity —
   the replacement is a different element with the same job — and put focus
   back on it. */
function focusKey(el) {
  if (!el || el === document.body || !el.dataset) return null;
  if (el.id) return '#' + el.id;
  if (el.tagName === 'A' && el.getAttribute('href')) return 'a:' + el.getAttribute('href');
  const d = el.dataset;
  if (!d.act) return null;
  return [d.act, d.view, d.id, d.user, d.code, d.pool].map(x => x || '').join('|');
}
function findByKey(key) {
  if (!key) return null;
  if (key.charAt(0) === '#') return document.getElementById(key.slice(1));
  if (key.slice(0, 2) === 'a:') {
    try { return document.querySelector('a[href="' + CSS.escape(key.slice(2)) + '"]'); }
    catch (e) { return null; }
  }
  const all = document.querySelectorAll('[data-act]');
  for (let i = 0; i < all.length; i += 1) if (focusKey(all[i]) === key) return all[i];
  return null;
}

/* ── every table becomes a stack of cards on a phone ──────────────────────
   Forty-one tables in this document, up to nine columns wide, and a phone is
   390px across. Horizontal scrolling inside a card inside a page is how a
   number goes unread.

   Below 720px the header row is hidden and each cell carries its own label —
   and the labels are read off the table itself, here, after the screen is
   drawn. So none of the forty-one call sites had to be rewritten, a label
   cannot drift from the header it came from, and the forty-second table
   inherits the behaviour without being told.

   A matrix is exempt: in `.pmx` the meaning *is* the crossing of row and
   column, and one card per permission would destroy it. It keeps its scroll.
   ────────────────────────────────────────────────────────────────────────── */
function labelCells(root) {
  root.querySelectorAll('table').forEach(t => {
    if (t.classList.contains('pmx')) return;
    const heads = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
    if (!heads.length) return;                 // a layout table, not a data one
    t.classList.add('dt');
    t.querySelectorAll('tbody tr').forEach(tr => {
      [...tr.children].forEach((td, i) => {
        if (td.hasAttribute('colspan')) { td.dataset.role = 'wide'; return; }
        if (i === 0) { td.dataset.role = 'title'; return; }
        const h = heads[i] || '';
        if (h) td.setAttribute('data-label', h);
        else td.dataset.role = 'act';          // an unlabelled column is an action
      });
    });
    t.querySelectorAll('tfoot td').forEach(td => { td.dataset.role = 'wide'; });
  });
}

/* A row the address names is scrolled to and blinks once, so the eye lands
   where the dashboard said the work was instead of at the top of a list the
   reader now has to search. */
function focusRecord(id) {
  const el = document.getElementById('rec-' + id);
  if (!el) return false;
  try { el.scrollIntoView({ block: 'center' }); } catch (e) { el.scrollIntoView(); }
  el.classList.add('rowhit');
  setTimeout(() => el.classList.remove('rowhit'), 2200);
  return true;
}

function render() {
  resolveRoute();
  const u = me();
  const held = focusKey(document.activeElement);
  const wasY = window.scrollY;
  const screen = u ? 'app:' + SESSION.view : 'pub:' + (SESSION.pub || 'landing');
  const href = hashNow();
  const first = LAST_SCREEN === null;
  const changed = screen !== LAST_SCREEN;
  const moved = href !== LAST_HREF;
  LAST_SCREEN = screen; LAST_HREF = href;

  const root = document.getElementById('root');
  root.innerHTML = u ? appShell(u) : publicShell();
  labelCells(root);

  /* Three situations, and one unconditional scrollTo(0, 0) used to answer all
     three the same way — which is why every action threw the reader back to
     the top of a long screen, and then restored focus to a control they could
     no longer see. */
  if (ROUTE.id && moved && focusRecord(ROUTE.id)) {
    /* the address named a row: it is on screen now */
  } else if (changed) {
    window.scrollTo(0, 0);                       // a different screen starts at its top
  } else {
    window.scrollTo(0, wasY);                    // same screen rebuilt: keep the place
  }

  /* Replacing the shell destroys whatever had focus, which drops a keyboard
     user back at the document root — behind the whole nav they just used.
     Move focus to the heading, but only when the screen actually changed:
     doing it on every re-render would yank focus mid-form on each commit.
     The very first render is the exception: nothing had focus to lose, and
     grabbing it there would put the reader past the skip link before they
     ever reached it. */
  const h = document.getElementById('pagetitle');
  if (changed) {
    if (h && !first) h.focus({ preventScroll: true });
    return;
  }
  /* Same screen, rebuilt: return focus to the control that was in hand, or to
     the heading if that control no longer exists (it was the button that
     closed the case, and there is no such button any more). */
  if (!held) return;
  const back = findByKey(held);
  (back || h || {}).focus?.({ preventScroll: true });
}

      + '<span class="whoami__r mono">' + esc(u.email) + '</span></span>'
      + '<span class="demoacct__role">' + esc(what) + '</span></button>';

}

/* ── administrator · accounts and invitations ─────────────────────────── */
VIEWS['ops.admin'] = () => {
  const u = me();
  const canEnrol = can(u, 'admin.enrol');
  const canReset = can(u, 'admin.users');
  const resets = STATE.resets.slice().reverse();
  const openRs = resets.filter(r => resetState(r) === 'open');
  /* One button, two tables: issuing a code is the same act whoever it is for. */
  const resetBtn = t => (canReset && t.id !== u.id && !t.suspended && !t.erasedAt
    ? '<button class="btn btn--sm" data-act="issueReset" data-user="' + t.id + '">كود استرداد</button>'
    : '<span class="xs muted">—</span>');
  const invites = STATE.invites.slice().reverse();
  const openInv = invites.filter(i => inviteState(i) === 'open');
  const staff = STATE.users.filter(x => x.role === 'staff');
  const members = STATE.users.filter(x => x.role !== 'staff');

  const inviteRows = invites.length
    ? invites.map(i => {
        const st = inviteState(i);
        return '<tr id="rec-' + esc(i.code) + '"><td><span class="mono">' + i.code + '</span></td>'
          + '<td class="sm">' + esc(JOB_AR[i.job] || i.job) + '</td>'
          + '<td class="sm">' + esc(i.note || '—') + '</td>'
          + '<td>' + chip(INVITE_STATE, st) + '</td>'
          + '<td class="sm">' + (i.usedBy ? esc((user(i.usedBy) || {}).name || i.usedBy) : dt(i.expiresAt)) + '</td>'
          + '<td>' + (st === 'open' && canEnrol
              ? '<button class="btn btn--sm btn--danger" data-act="revokeInvite" data-code="' + i.code + '">إلغاء</button>'
              : '<span class="xs muted">—</span>') + '</td></tr>';
      }).join('')
    : '<tr><td colspan="6" class="empty">لم يُصدر كود بعد.</td></tr>';

  const staffRows = staff.map(t => {
    const self = t.id === u.id;
    return '<tr id="rec-' + esc(t.id) + '"><td><div class="sm">' + esc(t.name) + (self ? ' <span class="chip">أنت</span>' : '') + '</div>'
      + '<div class="xs muted mono">' + esc(t.email || '') + '</div></td>'
      + '<td>' + (canEnrol && !self

            + ' aria-label="وظيفة ' + esc(t.name) + '">'
            + STAFF_JOBS.map(j => '<option value="' + j.k + '"' + (j.k === t.job ? ' selected' : '') + '>'
              + esc(JOB_AR[j.k] || j.k) + '</option>').join('') + '</select>'
          : '<span class="sm">' + esc(JOB_AR[t.job] || t.job) + '</span>') + '</td>'
      + '<td class="sm">' + (t.perms || []).length + ' صلاحية'
      + '<div class="xs muted" style="max-width:22rem">' + (t.perms || []).join(' · ') + '</div></td>'
      + '<td>' + (t.suspended
          ? '<span class="chip chip--crit"><span class="chip__dot"></span>موقوف</span>'
          : '<span class="chip chip--pos"><span class="chip__dot"></span>نشط</span>') + '</td>'
      + '<td class="sm">' + (t.enrolledVia ? '<span class="mono xs">' + t.enrolledVia + '</span>' : 'مُنشأ ابتداءً') + '</td>'
      + '<td class="sm">' + (t.lastSignInAt ? dt(t.lastSignInAt, true) : '<span class="xs muted">لم يدخل بعد</span>') + '</td>'
      + '<td>' + resetBtn(t) + '</td>'
      + '<td>' + (canEnrol && !self
          ? '<button class="btn btn--sm' + (t.suspended ? '' : ' btn--danger') + '" data-act="toggleSuspend" '
            + 'data-user="' + t.id + '" data-on="' + (t.suspended ? '0' : '1') + '">'

          : '<span class="xs muted">—</span>') + '</td></tr>';
  }).join('');

  const memberRows = members.map(t => '<tr id="rec-' + esc(t.id) + '"><td><div class="sm">' + esc(t.name) + '</div>'

    body: (canEnrol ? '' : '<div class="note note--warn">حسابك يقرأ هذه الشاشة ولا يغيّر فيها.</div>')
      + (canEnrol
        ? '<div class="card"><div class="card__head"><h2>إصدار كود دعوة</h2>'
          + '<span class="spacer chip ' + (openInv.length ? 'chip--pos' : '') + '">' + openInv.length + ' صالح</span></div>'
          + '<div class="card__body">'
