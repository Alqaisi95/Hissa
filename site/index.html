/* ══════════════════════════════════════════════════════════════════════════
   SESSION — who you are looking as. Per-viewer only: it lives in this
   browser, never in the shared document.

   Identity persists here. *Where you are* does not — that lives in the URL,
   below. The place-fields kept in this object are a cache of the route,
   refilled before every render, so the screens keep one read surface while
   the address stays the single source of truth.
   ══════════════════════════════════════════════════════════════════════════ */
const DEFAULT_SESSION = {
  authUserId: null,          // null → the public site; set → the application
  pub: 'landing',            // landing | login | register
  view: null, poolId: 'p_cafe', tab: 'disclosure', appId: null, ownPoolId: null, win: 90, settingKey: null,
  excSev: 0,                 // 0 = every severity; the filter hides, never the screen
  dashTab: null,             // the open queue on ops.dash; null = the first it may open
};
let SESSION = Object.assign({}, DEFAULT_SESSION);
try {
  const saved = localStorage.getItem('hissa.session');
  if (saved) SESSION = Object.assign({}, DEFAULT_SESSION, JSON.parse(saved));
} catch (e) { /* private window, blocked storage — defaults are fine */ }
/* A `view` stored before routing existed would fight the address. */
SESSION.view = null; SESSION.pub = 'landing';

/* ══════════════════════════════════════════════════════════════════════════
   ROUTING

   Thirty-one screens shared one URL. Nothing could be linked to, the back
   button left the application, a refresh lost your place, and "look at this"
   had to be spoken rather than sent. It also made the installable app
   impossible: a `start_url` or a home-screen shortcut needs an address, and
   a dashboard had none.

   The hash, not the History API. This document has to work from a file on
   disk, inside the artifact frame (which carries its own <base>), and under
   a project path on Pages. The History API fails the first two. The hash
   works in all three and asks nothing of the server.

   Grammar:  #/<space>/<screen>[/<id>][/<sub>][?<filters>]

     #/                          the public site
     #/login  #/register  #/enrol  #/reset
     #/inv/pool/p_cafe/uof       an opportunity, on a named tab
     #/ops/adash?sev=3           a dashboard, filtered
     #/ops/cases/CASE-2026-0004  a screen, and the row it is about
   ══════════════════════════════════════════════════════════════════════════ */
const PUB_SCREENS = ['landing', 'login', 'register', 'enrol', 'reset'];
/* Which SESSION field is this screen's subject, and which its sub-view. */
const VIEW_ID_KEY = {
  'inv.pool': 'poolId', 'inv.invest': 'poolId',
  'ops.pools': 'poolId', 'ops.dist': 'poolId',
  'ops.apps': 'appId', 'ops.settings': 'settingKey',
  'own.project': 'ownPoolId', 'own.funds': 'ownPoolId', 'own.reports': 'ownPoolId',
};
const VIEW_SUB_KEY = { 'inv.pool': 'tab' };
/* Filters belong in the address — whoever opens your link sees your filter —
   but they are per-screen, so they do not follow you off it. */
/* `tab` is already taken by inv.pool as a path segment, so the dashboard's
   open queue gets its own session key and shares the short query name. */
const QUERY_KEYS = { win: 'w', excSev: 'sev', dashTab: 'tab' };

let ROUTE = { view: 'pub.landing', id: null, sub: null, query: {} };

function parseHash(h) {
  const raw = String(h == null ? location.hash : h).replace(/^#/, '');
  /* Anything not starting with a slash is an in-page fragment, not a route. */
  if (raw && raw.charAt(0) !== '/') return null;
  const cut = raw.indexOf('?');
  const path = cut === -1 ? raw : raw.slice(0, cut);
  const query = {};
  if (cut !== -1) raw.slice(cut + 1).split('&').forEach(p => {
    if (!p) return;
    const i = p.indexOf('=');
    const k = decodeURIComponent(i === -1 ? p : p.slice(0, i));
    query[k] = i === -1 ? '' : decodeURIComponent(p.slice(i + 1).replace(/\+/g, ' '));
  });
  const parts = path.split('/').filter(x => x !== '');
  if (!parts.length) return { view: 'pub.landing', id: null, sub: null, query };
  if (parts.length === 1)
    return PUB_SCREENS.includes(parts[0])
      ? { view: 'pub.' + parts[0], id: null, sub: null, query } : null;
  return {
    view: parts[0] + '.' + parts[1],
    id: parts[2] ? decodeURIComponent(parts[2]) : null,
    sub: parts[3] ? decodeURIComponent(parts[3]) : null,
    query,
  };
}

function hrefFor(r) {
  const v = typeof r === 'string' ? { view: r } : (r || {});
  const view = v.view || 'pub.landing';
  let path;
  if (view.slice(0, 4) === 'pub.') {
    const k = view.slice(4);
    path = k === 'landing' ? '/' : '/' + k;
  } else {
    path = '/' + view.replace('.', '/');
    if (v.id) path += '/' + encodeURIComponent(v.id);
    if (v.sub) path += '/' + encodeURIComponent(v.sub);
  }
  const q = Object.keys(v.query || {})
    .filter(k => v.query[k] !== '' && v.query[k] != null)
    .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(v.query[k]));
  return '#' + path + (q.length ? '?' + q.join('&') : '');
}

const hashNow = () => '#' + String(location.hash).replace(/^#/, '');
/* replaceState fires no hashchange, so a correction never re-enters the
   router. A sandboxed frame may refuse it; there the hash is set instead and
   the extra render is harmless. */
function setHash(href, replace) {
  if (hashNow() === href) { render(); return; }
  if (replace) {
    try { history.replaceState(null, '', href); render(); return; } catch (e) { /* fall through */ }
  }
  location.hash = href.slice(1);
}
function navigate(r, opts) { setHash(hrefFor(r), opts && opts.replace); }

const defaultViewFor = u => (u ? ((navFor(u)[0] || {}).k || 'acct.me') : 'pub.landing');

/* The screens still call setSession({view, poolId, tab, …}) as they always
   did. Anything that names a place becomes an address; the rest stays here. */
function setSession(patch) {
  const routed = ['view', 'pub', 'poolId', 'tab', 'appId', 'ownPoolId', 'settingKey', 'win', 'excSev', 'dashTab']
    .some(k => Object.prototype.hasOwnProperty.call(patch, k));
  Object.keys(patch).forEach(k => { if (k !== 'view' && k !== 'pub') SESSION[k] = patch[k]; });
  try { localStorage.setItem('hissa.session', JSON.stringify({ authUserId: SESSION.authUserId })); } catch (e) {}
  if (!routed) { render(); return; }

  const view = patch.view !== undefined ? (patch.view || defaultViewFor(me()))
             : patch.pub !== undefined ? 'pub.' + patch.pub
             : ROUTE.view;
  const same = view === ROUTE.view;
  const idKey = VIEW_ID_KEY[view], subKey = VIEW_SUB_KEY[view];
  const query = same ? Object.assign({}, ROUTE.query) : {};
  Object.keys(QUERY_KEYS).forEach(k => {
    if (patch[k] === undefined) return;
    if (!patch[k]) delete query[QUERY_KEYS[k]];
    else query[QUERY_KEYS[k]] = String(patch[k]);
  });
  const field = (key, cur) => (key
    ? (patch[key] !== undefined ? patch[key] : (same ? cur : SESSION[key]))
    : null);
  navigate({ view, id: field(idKey, ROUTE.id), sub: field(subKey, ROUTE.sub), query });
}

/* Refill the fields the screens read. The route decides; a route that names
   nothing leaves the screen to fall back on its own first record. */
function syncSession(r) {
  const isPub = r.view.slice(0, 4) === 'pub.';
  SESSION.view = isPub ? null : r.view;
  SESSION.pub = isPub ? r.view.slice(4) : 'landing';
  const idKey = VIEW_ID_KEY[r.view];
  if (idKey) SESSION[idKey] = r.id;
  const subKey = VIEW_SUB_KEY[r.view];
  if (subKey) SESSION[subKey] = r.sub || DEFAULT_SESSION[subKey];
  /* Read back through the same map the address is written with, so a key
     added to QUERY_KEYS cannot be written to the URL and then silently
     ignored on the way in. Numbers keep their coercion; the rest arrive as
     the strings they are, and an unknown value falls back rather than
     emptying the screen. */
  SESSION.win = Number(r.query[QUERY_KEYS.win]) || DEFAULT_SESSION.win;
  SESSION.excSev = Number(r.query[QUERY_KEYS.excSev]) || 0;
  SESSION.dashTab = r.query[QUERY_KEYS.dashTab] || null;
}

/* One place decides what the address means for whoever is looking at it, and
   rewrites the address when it means something else. */
function resolveRoute() {
  const u = me();
  let r = parseHash() || { view: defaultViewFor(u), id: null, sub: null, query: {} };
  const isPub = r.view.slice(0, 4) === 'pub.';

  if (!u && !isPub) {
    /* A shortcut or a shared link into the application with nobody signed in.
       Remember the destination and finish the trip after the sign-in. */
    r = { view: 'pub.login', id: null, sub: null, query: { next: hrefFor(r).slice(1) } };
  } else if (u && isPub) {
    r = { view: defaultViewFor(u), id: null, sub: null, query: {} };
  } else if (u && !(VIEWS[r.view] && navFor(u).some(n => n.k === r.view))) {
    /* No such screen, or one this account's permissions do not open. */
    r = { view: defaultViewFor(u), id: null, sub: null, query: {} };
  }
  const href = hrefFor(r);
  if (hashNow() !== href) { try { history.replaceState(null, '', href); } catch (e) {} }
  ROUTE = r;
  syncSession(r);
  return r;
}

const esc = s => String(s == null ? '' : s)
  .replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dt = (iso, withTime) => {
  if (!iso) return '—';
  const d = new Date(iso.length === 10 ? iso + 'T00:00:00Z' : iso);
  if (Number.isNaN(d.getTime())) return '—';
  const p = new Intl.DateTimeFormat('ar-OM-u-nu-latn', Object.assign(
    { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'Asia/Muscat' },
    withTime ? { hour: '2-digit', minute: '2-digit', hour12: false } : {}));
  return p.format(d);
};

/* Fixed order, never cycled: a series keeps its slot when the set shrinks.
   Five slots because the money position has five states; past five the tail
   folds into a table rather than growing the palette. */
const CAT = ['var(--cat-1)', 'var(--cat-2)', 'var(--cat-3)', 'var(--cat-4)', 'var(--cat-5)'];
const ORD = ['var(--ord-1)', 'var(--ord-2)', 'var(--ord-3)', 'var(--ord-4)', 'var(--ord-5)'];
const TONE = { good: 'var(--st-good)', warning: 'var(--st-warn)', serious: 'var(--st-serious)', critical: 'var(--st-crit)' };

function compact(v) {
  const a = Math.abs(v);
  if (a >= 1e6) return (Math.round(v / 1e5) / 10) + 'M';
  if (a >= 1e3) return (Math.round(v / 1e2) / 10) + 'k';
  return String(Math.round(v));
}

let frameSeq = 0;
/* Every chart ships the same numbers as a table. Colour alone never carries
   the meaning, and a reader who cannot separate two hues still gets the data. */
function frameHtml(o) {
  frameSeq += 1;
  const id = 'fr' + frameSeq;
  /* `wide` marks a figure that cannot survive a phone — a mark grid whose
     meaning is the crossing of row and column. There the frame shows the
     table it already ships instead, which is the whole reason every figure
     here carries one. */
  return '<div class="frame' + (o.wide ? ' frame--wide' : '') + '" data-view="chart" id="' + id + '">'
    + '<div class="frame__head"><div><h2>' + esc(o.title) + '</h2>'
    + (o.sub ? '<p class="frame__sub">' + esc(o.sub) + '</p>' : '') + '</div>'
    + '<button type="button" class="frame__toggle" data-act="toggleFrame" data-frame="' + id + '">عرض كجدول</button>'
    + '</div><div class="frame__chart">' + o.chart + '</div>'
    + '<div class="frame__table tablewrap"><table><thead><tr>'
    + o.cols.map((c, i) => '<th' + (i ? ' class="n"' : '') + '>' + esc(c) + '</th>').join('')
    + '</tr></thead><tbody>'
    + (o.rows.length ? o.rows.map(r => '<tr>' + r.map((c, i) =>
        '<td' + (i ? ' class="n"' : '') + '>' + c + '</td>').join('') + '</tr>').join('')
      : '<tr><td colspan="' + o.cols.length + '" class="empty">لا بيانات بعد.</td></tr>')
    + '</tbody></table></div></div>';
}
/* One series across categories, so one hue for every bar. Giving each row its
   own colour spends the only free channel on information the row label and the
   bar length already carry twice over — and on nominal categories (sectors,
   suppliers) the hue then implies an order that does not exist.

   `ramp` is for the case where the categories really are ordered — a funnel,
   amount bands — and there the darkening step means something. Every bar
   carries its value and share in a native tooltip, because a bar chart with no
   hover is a picture rather than a reading. */
function barsHtml(items, valueFmt, ramp) {
  if (!items.length) return '<p class="empty">لا بيانات.</p>';
  const max = Math.max.apply(null, items.map(i => i.value)) || 1;
  const total = items.reduce((a, b) => a + b.value, 0);
  return '<div class="bars">' + items.map((it, i) => {
    const share = total ? Math.round((it.value / total) * 100) : 0;
    const tip = it.label + ' — ' + valueFmt(it.value) + (total ? ' · ' + share + '%' : '');
    return '<div class="bars__row" title="' + esc(tip) + '">'
      + '<span class="bars__label">' + esc(it.label) + '</span>'
      + '<span class="meter"><span class="meter__fill" style="width:'
      + ((it.value / max) * 100).toFixed(1) + '%;background:'
      + (it.color || (ramp ? ramp[i % ramp.length] : 'var(--cat-1)')) + '"></span></span>'
      + '<span class="bars__val">' + valueFmt(it.value) + '</span></div>';
  }).join('') + '</div>';
}

function funnelHtml(stages) {
  const base = stages[0].value || 1;
  return '<div class="funnel">' + stages.map((s, i) => {
    const prev = i ? stages[i - 1].value : null;
    const pct = prev ? Math.round((s.value / prev) * 1000) / 10 : null;
    return '<div><div class="funnel__top"><span class="sm">' + esc(s.label) + '</span>'
      + '<span class="funnel__val">' + s.value + '</span></div>'
      + '<span class="meter" style="block-size:11px"><span class="meter__fill" style="width:'
      + ((s.value / base) * 100).toFixed(1) + '%;background:' + ORD[i % ORD.length] + '"></span></span>'
      + '<div class="xs muted">' + (pct === null ? 'الأساس' : pct + '% محمولة من المرحلة السابقة') + '</div></div>';
  }).join('') + '</div>';
}
/* ── stacked part-to-whole bar ─────────────────────────────────────────
   2px surface gaps between segments (never borders), a legend because
   there are more than two series, and a native per-segment tooltip. */
function stackedBar(parts, total, valueFmt) {
  if (!total) return '<p class="empty">لا مبالغ بعد.</p>';
  /* The slot comes from the state itself, so filtering an empty one out never
     repaints the states that remain. */
  const hue = x => CAT[x.slot];
  return '<div class="stack-s">'
    + '<div class="pw">' + parts.map(x =>
        '<span class="pw__seg" style="flex:' + x.value + ';background:' + hue(x) + '"'
        + ' title="' + esc(x.label + ' — ' + valueFmt(x.value)) + '"></span>').join('') + '</div>'
    + '<div class="legend">' + parts.map(x =>
        '<span class="legend__item"><span class="legend__sw" style="background:' + hue(x) + '"></span>'
        + '<span>' + esc(x.label) + '</span>'
        + '<span class="legend__v">' + valueFmt(x.value) + '</span>'
        + '<span class="legend__p">' + ((x.value / total) * 100).toFixed(1) + '%</span></span>').join('')
    + '</div></div>';
}

/* ── weekly columns ────────────────────────────────────────────────────
   One series, so one hue and no legend — the title names it. Only the
   tallest column is direct-labelled; the rest are carried by the axis and
   the hover. */
function columnsSvg(points, valueFmt) {
  if (!points.length) return '<p class="empty">لا بيانات في هذه الفترة.</p>';
  const W = 720, H = 200, L = 52, R = 12, T = 16, B = 30;
  const max = Math.max.apply(null, points.map(p => p.value)) || 1;
  const iw = (W - L - R) / points.length;
  const bw = Math.max(3, Math.min(34, iw - 6));
  const y = v => T + (H - T - B) * (1 - v / max);
  const peak = points.reduce((a, b, i) => (b.value > points[a].value ? i : a), 0);

  const grid = [0, .5, 1].map(f => max * f).map(v =>
    '<line class="axis" x1="' + L + '" y1="' + y(v).toFixed(1) + '" x2="' + (W - R) + '" y2="' + y(v).toFixed(1) + '"></line>'
    + '<text x="' + (L - 8) + '" y="' + (y(v) + 3.5).toFixed(1) + '" text-anchor="end">' + compact(v / 1000) + '</text>').join('');

  const bars = points.map((p, i) => {
    const cx = L + i * iw + iw / 2;
    const h = Math.max(p.value > 0 ? 2 : 0, (H - T - B) * (p.value / max));
    return '<g class="col">'
      + '<rect x="' + (cx - iw / 2).toFixed(1) + '" y="' + T + '" width="' + iw.toFixed(1)
      + '" height="' + (H - T - B) + '" fill="transparent">'
      + '<title>' + esc(p.label + ' · ' + valueFmt(p.value) + ' · ' + p.count + ' التزامًا') + '</title></rect>'
      + (p.value > 0
          ? '<rect class="col__bar" x="' + (cx - bw / 2).toFixed(1) + '" y="' + (H - B - h).toFixed(1)
            + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="4"></rect>'
          : '')
      + (i === peak && p.value > 0
          ? '<text x="' + cx.toFixed(1) + '" y="' + (H - B - h - 6).toFixed(1)
            + '" text-anchor="middle" style="font-weight:600;fill:var(--ink)">' + compact(p.value / 1000) + '</text>'
          : '')
      + '</g>';
  }).join('');

  const every = Math.ceil(points.length / 6);
  const xl = points.map((p, i) => (i % every === 0 || i === points.length - 1)
    ? '<text x="' + (L + i * iw + iw / 2).toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle">' + p.label + '</text>'
    : '').join('');

  return '<svg class="plot" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="التزامات جديدة كل أسبوع، بالألف ريال">'
    + grid + '<line class="axis" x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R) + '" y2="' + (H - B) + '"></line>'
    + bars + xl + '</svg>';
}

/* A ratio against a limit reads as a meter, never as a two-slice pie. */
/* The one place severity used to travel as colour and nothing else: the fill
   was tinted by tone with no word saying which tone it was. A reader who
   cannot separate the amber from the orange — or who prints the page — got
   nothing. The state now says its own name. */
const TONE_AR = { good: 'ضمن الحدّ', warning: 'يقترب', serious: 'مرتفع', critical: 'حرِج' };
function ratioMeter(value, target, valueFmt, tone) {
  const pct = target ? (value / target) * 100 : 0;
  const key = Object.keys(TONE).find(k => TONE[k] === tone);
  return '<div class="ratio">'
    + '<div class="ratio__track"><span class="ratio__fill" style="width:' + Math.min(100, pct).toFixed(1)
    + '%;background:' + (tone || 'var(--brand)') + '"></span></div>'
    + '<div class="ratio__row"><span class="num">' + valueFmt(value) + '</span>'
    + (key ? '<span class="xs" style="color:' + tone + ';font-weight:600">' + TONE_AR[key] + '</span>' : '')
    + '<span class="xs muted">من ' + valueFmt(target) + ' · ' + Math.round(pct) + '%</span></div></div>';
}

/* The warning in two lengths. The full sentence everywhere there is room;
   on a phone one clause that opens to the rest, so the caution stays in
   sight without taking a seventh of every screen. */
const RISK_FULL = 'قد تخسر كامل المبلغ المستثمر. لا ضمان للعائد أو لرأس المال، ولا توجد سوق ثانوية.';
const riskbar = () => '<div class="riskbar">'
  + '<span class="riskbar__full">' + RISK_FULL + '</span>'
  + '<details class="riskbar__short"><summary>قد تخسر كامل المبلغ المستثمر.</summary>'
  + '<p>لا ضمان للعائد أو لرأس المال، ولا توجد سوق ثانوية لبيع حصتك قبل نهاية المدة.</p></details>'
  + '</div>';

/* Two regions, not one: a refusal has to interrupt, a confirmation must not.
   Both exist in the document before any text lands in them — a live region
   created and filled in the same frame is not announced. */
function toast(msg, kind) {
  const box = document.getElementById(kind === 'bad' ? 'alerts' : 'toasts');
  if (!box) return;
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' toast--' + kind : '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), 6000);
}

                     + '<button class="btn btn--sm" data-act="investIn" data-pool="' + alt.id + '">انتقل إليها</button></div>' : '')
          : '<div class="note note--pos">المتاح لك في هذه الفرصة <strong class="num">' + rial(v.available)
            + '</strong>. القيد الفعّال: ' + esc(v.binding) + '.</div>')
      + '<div class="tablewrap"><table><thead><tr><th>القاعدة</th><th>ما فحصه النظام</th></tr></thead><tbody>'
      + v.blocks.map(b => '<tr><td><span class="mono xs">' + b[0] + '</span></td><td class="sm">' + esc(b[1]) + '</td></tr>').join('')
      + trace.map(t => '<tr><td><span class="mono xs">' + t[0] + '</span></td><td class="sm">' + esc(t[1]) + '</td></tr>').join('')
      + '</tbody></table></div></div></div></div>',
  };
};

/* ── 04 investor · holdings ───────────────────────────────────────────── */
/* ── investor · the portfolio ──────────────────────────────────────────────
   Ordered by what the holder can act on, not by what is pleasant to look at:
   a deadline first, then the position, then the record, then the headroom
   they will need before committing again.

   Every figure comes from a selector. The screen formats and never computes —
   which is what makes "القيمة المسجَّلة" honest here: it says cost because
   VALUATION_BASIS says cost, and it says so on the card rather than dressing
   a cost basis up as a valuation.
   ────────────────────────────────────────────────────────────────────────── */
VIEWS['inv.portfolio'] = () => {
  const u = me();
  const base = BASE(STATE);
  const p = metricsParams();

  const cost      = selInvestedCapital(base, SESSION, p);
  const holdings  = selHoldingsByPool(base, SESSION, p);
  const dists     = selDistributionsReceived(base, SESSION, p);
  const ret       = selNetReturn(base, SESSION, p);
  const allowance = selRemainingAllowance(base, SESSION, p);
  const cooling   = selCoolingOffState(base, SESSION, p);
  const mine      = (base.ordersByUser.get(u.id) || []).slice().reverse();

  /* ── the clock, first ── */
  const material = cooling.filter(x => x.reason === 'material_change');
  const band0 = !cooling.length ? '' :
    '<div class="note note--' + (material.length ? 'crit' : 'warn') + '">'
    + (material.length
        ? '<strong>تغيّر جوهري في إفصاح تلتزم فيه.</strong> صدرت نسخة جديدة، '
          + 'ولك حق العدول عن ' + material.length + ' التزامًا دون إبداء سبب — '
          + 'اقرأ ما تغيّر قبل أن تقرّر.'
        : '<strong>مهلة العدول ما زالت مفتوحة.</strong> تستطيع إلغاء '
          + cooling.length + ' التزامًا دون سبب.')
    + '<div class="row row--tight" style="margin-block-start:.5rem">'
    + cooling.map(x => '<a class="chip chip--warn" href="'
        + hrefFor({ view: 'inv.pool', id: x.poolId, sub: 'disclosure' })
        + '" style="text-decoration:none">' + esc(x.orderId) + ' · حتى '
        + dt(new Date(x.endsAt).toISOString(), true) + '</a>').join('')
    + '</div></div>';

  /* ── the position, said plainly ── */
  const pct = b => (b / 100).toFixed(2) + '%';
  const band1 = '<div class="grid grid--4">'
    + kpiCard('رأس المال الملتزم به', rial(cost), String(holdings.length) + ' فرصة')
    + kpiCard('توزيعات وصلتك نقدًا', rial(dists.total, 3), dists.count + ' دفعة')
    + kpiCard('العائد النقدي حتى الآن', pct(ret.bps), 'من رأس المال')
    + kpiCard('القيمة المسجَّلة', rial(ret.value),
        VALUATION_BASIS === 'COST' ? 'بالتكلفة — بلا إعادة تقييم' : 'أساس ' + VALUATION_BASIS)
    + '</div>'
    + '<div class="note note--info sm"><strong>لماذا القيمة تساوي التكلفة.</strong> '
    + 'لا سوق ثانوية لحصتك ولا مقيِّم مستقل، فأي رقم غير التكلفة سيكون ادّعاءً لا حقيقة. '
    + 'العائد المعروض أعلاه هو ما وصلك نقدًا فعلًا مقسومًا على ما دفعته — '
    + 'لا تقديرًا لما قد تساويه حصتك.</div>';

  /* ── what you hold, per opportunity ── */
  const band2 = '<div class="card"><div class="card__head"><h2>حيازاتك</h2>'
    + '<span class="spacer chip">' + holdings.length + '</span></div>'
    + '<div class="card__body card__body--flush">'
    + (holdings.length
        ? '<div class="tablewrap"><table><thead><tr><th>الفرصة</th><th>الحالة</th>'
          + '<th class="n">الملتزم به</th><th class="n">المخصَّص</th>'
          + '<th class="n">الوحدات</th><th class="n">حصتك من الفرصة</th></tr></thead><tbody>'
          + holdings.map(h => '<tr id="rec-' + esc(h.poolId) + '">'
              + '<td class="sm"><a href="' + hrefFor({ view: 'inv.pool', id: h.poolId })
              + '">' + esc(h.title) + '</a><div class="xs muted mono">' + esc(h.ref) + '</div></td>'
              + '<td>' + chip(POOL_STATUS, h.status) + '</td>'
              + '<td class="n">' + fmt(h.cost, 0) + '</td>'
              + '<td class="n">' + fmt(h.allocated, 0) + '</td>'
              + '<td class="n">' + (h.units || '—') + '</td>'
              + '<td class="n">' + (h.sharesBps ? pct(h.sharesBps) : '—') + '</td></tr>').join('')
          + '</tbody></table></div>'
        : '<p class="empty">' + esc(EMPTY_TEXT.holdings) + '</p>')
    + '</div></div>';

  /* ── the record, with the exit where it is still open ── */
  const band3 = '<div class="card"><div class="card__head"><h2>كل التزاماتك</h2>'
    + '<span class="spacer chip">' + mine.length + '</span></div>'
    + '<div class="card__body card__body--flush"><div class="tablewrap"><table>'
    + '<thead><tr><th>المرجع</th><th>الفرصة</th><th class="n">المبلغ</th>'
    + '<th class="n">المخصَّص</th><th>الحالة</th><th>التاريخ</th><th>العدول</th></tr></thead><tbody>'
    + (mine.length ? mine.map(o => {
        const pl = base.poolsById.get(o.poolId) || {};
        const open = cooling.find(c => c.orderId === o.id);
        return '<tr id="rec-' + esc(o.id) + '"><td><span class="mono xs">' + o.id + '</span></td>'
          + '<td class="sm">' + esc(pl.title || o.poolId) + '</td>'
          + '<td class="n">' + fmt(o.amount, 0) + '</td>'
          + '<td class="n">' + (o.allocated != null ? fmt(o.allocated, 0) : '—') + '</td>'
          + '<td>' + chip(ORDER_STATUS, o.status)
          + (o.refundReason ? '<div class="xs muted">' + esc(REFUND_REASON[o.refundReason] || o.refundReason) + '</div>' : '')
          + '</td>'
          + '<td class="sm">' + dt(o.createdAt) + '</td>'
          + '<td>' + (open
              ? '<button class="btn btn--sm btn--danger" data-act="withdrawOrder" data-order="' + o.id + '">عدول</button>'
                + '<div class="xs muted">حتى ' + dt(new Date(open.endsAt).toISOString(), true) + '</div>'
              : '<span class="xs muted">—</span>') + '</td></tr>';
      }).join('') : '<tr><td colspan="7" class="empty">' + esc(EMPTY_TEXT.holdings) + '</td></tr>')
    + '</tbody></table></div></div></div>';

  /* ── what came back, and how concentrated the risk is ── */
  const bySector = {};
  holdings.forEach(h => {
    const sec = (base.poolsById.get(h.poolId) || {}).sector || '—';
    bySector[sec] = (bySector[sec] || 0) + h.cost;
  });
  const sectorItems = Object.keys(bySector)
    .map(k => ({ label: k, value: bySector[k] })).sort((a, b) => b.value - a.value);

  const band4 = '<div class="grid grid--2 grid--top">'
    + '<div class="card"><div class="card__head"><h2>التوزيعات المستلمة</h2>'
    + '<span class="spacer num sm">' + rial(dists.total, 3) + '</span></div>'
    + '<div class="card__body card__body--flush">'
    + (dists.count
        ? '<div class="tablewrap"><table><thead><tr><th>المرجع</th><th>الفترة</th>'
          + '<th class="n">حصتك</th><th>التاريخ</th></tr></thead><tbody>'
          + dists.timeline.slice().reverse().map(r =>
              '<tr><td><span class="mono xs">' + esc(r.distributionId) + '</span></td>'
              + '<td class="sm">' + esc(r.period || '—') + '</td>'
              + '<td class="n">' + fmt(r.amount) + '</td>'
              + '<td class="sm">' + dt(r.at) + '</td></tr>').join('')
          + '</tbody></table></div>'
        : '<p class="empty">' + esc(EMPTY_TEXT.distributions) + '</p>')
    + '</div></div>'
    + '<div class="card"><div class="card__body">' + frameHtml({
        title: 'تركّز محفظتك على القطاعات',
        sub: 'تركّز رأس مالك في قطاع واحد يجعل تعثّره تعثّرك — وهذا الرسم كل ما تملكه '
           + 'من إنذار مبكر، إذ لا سوق تخرج منها.',
        chart: barsHtml(sectorItems, v => fmt(v, 0) + ' ر.ع'),
        cols: ['القطاع', 'رأس المال (ر.ع)', 'النسبة'],
        rows: sectorItems.map(s => [esc(s.label), fmt(s.value, 0),
          cost ? pct(Math.round((s.value * 10000) / cost)) : '—']),
      }) + '</div></div></div>';

  /* ── the headroom, before the next commitment rather than after it ── */
  const band5 = '<div class="card"><div class="card__head"><h2>ما زال متاحًا لك</h2>'
    + '<span class="chip">' + esc(CLASS_AR[allowance.cls] || allowance.cls) + '</span></div>'
    + '<div class="card__body">'
    + (allowance.remaining == null
        ? '<div class="note note--info">لا حدّ سنويّ منشور لصنفك. ما يحدّك هو سعة الفرصة '
          + 'نفسها، وما يعتمده الشريك المرخّص.</div>'
        : '<div class="grid grid--3">'
          + kpiCard('المتبقي خلال 12 شهرًا', rial(allowance.remaining))
          + kpiCard('استُخدم', rial(allowance.used), allowance.countedOrders + ' التزامًا في النافذة')
          + kpiCard('حدّ صنفك', rial(allowance.cap))
          + '</div>'
          + ratioMeter(allowance.used, allowance.cap, v => fmt(v, 0) + ' ر.ع',
              allowance.remaining === 0 ? TONE.critical
              : allowance.used * 4 > allowance.cap * 3 ? TONE.warning : TONE.good))
    + '<p class="xs muted">نافذة متحرّكة: التزام مضى عليه أكثر من اثني عشر شهرًا يخرج من '
    + 'العدّ ويعود إليك متّسعه. تُعرض هنا قبل أن تلتزم، لا في رسالة رفض بعدها.</p>'
    + '<div class="row"><a class="btn btn--primary" href="' + hrefFor({ view: 'inv.pools' })
    + '">تصفّح الفرص</a></div>'
    + '</div></div>';

  return {
    crumb: 'مستثمر · ' + (CLASS_AR[u.cls] || ''), title: 'محفظتي',
    lede: 'ما تملكه، وما وصلك منه نقدًا، وما زال أمامك من متّسع — وكل رقم هنا محسوب '
        + 'من السجل لحظة العرض، لا مخزَّنًا في حقل يمكن أن يتقادم.',
    body: band0 + band1 + band2 + band3 + band4 + band5,
  };
};

/* ── 05 investor · inbox, derived from what actually happened ─────────── */
VIEWS['inv.inbox'] = () => {
  const u = me();
  const items = [];
  STATE.orders.filter(o => o.userId === u.id).forEach(o => {
    const p = pool(o.poolId);
    items.push({ at: o.createdAt, topic: 'استثمار', tone: 'chip--brand',
      text: 'أُنشئ التزامك ' + o.id + ' بمبلغ ' + rial(o.amount, 3) + ' في «' + p.title + '».' });
    if (o.status === 'refunded') items.push({ at: o.cancelledAt || o.createdAt, topic: 'استرداد', tone: 'chip--warn',
      text: 'استُرد التزامك ' + o.id + ' — السبب: ' + (REFUND_REASON[o.refundReason] || 'غير محدد') + '.' });
    if (o.status === 'allocated') items.push({ at: p.fundedAt || o.createdAt, topic: 'تخصيص', tone: 'chip--pos',
      text: 'خُصص لك ' + rial(o.allocated || o.amount) + ' في «' + p.title + '» بعد إغلاق التمويل.' });
  });
  STATE.distributions.forEach(d => (d.shares || []).filter(s => s.userId === u.id).forEach(s => {
    items.push({ at: d.paidAt, topic: 'توزيع', tone: 'chip--pos',
      text: 'وصلك توزيع ' + rial(s.amount, 3) + ' عن ' + d.period + ' (' + d.id + ').' });
  }));
  STATE.pools.forEach(p => (p.disclosureLog || []).forEach(l => {
    const holds = STATE.orders.some(o => o.userId === u.id && o.poolId === p.id
      && ['pending', 'confirmed', 'allocated'].includes(o.status));
    if (!holds) return;
    items.push({ at: l.at, topic: l.material ? 'تغيير جوهري' : 'إفصاح',
      tone: l.material ? 'chip--warn' : 'chip--brand',
      text: (l.material ? 'صدرت نسخة v' + l.version + ' من إفصاح «' + p.title + '» — لك حق العدول خلال المهلة. '
                        : 'تحديث على إفصاح «' + p.title + '». ') + l.summary });
  }));
  STATE.reports.filter(r => r.status === 'published').forEach(r => {
    const holds = STATE.orders.some(o => o.userId === u.id && o.poolId === r.poolId && o.status === 'allocated');
    if (holds) items.push({ at: r.publishedAt, topic: 'تقرير', tone: 'chip--brand',
      text: 'نُشر تقرير ' + r.period + ' لـ«' + pool(r.poolId).title + '».' });
  });
  items.sort((a, b) => new Date(b.at) - new Date(a.at));

  return {
    crumb: 'مستثمر', title: 'الإشعارات',
    lede: 'كل إشعار مولَّد من حدث فعلي في السجل. لا تحتوي أي رسالة على رقم هوية أو حساب بنكي أو مستند.',
    body: '<div class="card"><div class="card__body">'
      + (items.length ? '<div class="stack-s">' + items.map(i =>
          '<div class="note"><div class="row row--tight"><span class="chip ' + i.tone + '">' + i.topic + '</span>'
          + '<span class="spacer xs muted">' + dt(i.at, true) + '</span></div>'
          + '<div class="sm">' + esc(i.text) + '</div></div>').join('') + '</div>'
        : '<p class="empty">لا إشعارات.</p>')
      + '</div></div>',
  };
};

/* ── owner · my applications ──────────────────────────────────────────── */

/* ── owner · my project ───────────────────────────────────────────────── */
/* An owner can carry more than one project: the one their account was linked
   to, plus every pool published from an application of theirs. */
function ownerPools() {
  const u = me();
  const ids = new Set();
  if (u.pool) ids.add(u.pool);
  STATE.applications.filter(a => a.ownerId === u.id && a.poolId).forEach(a => ids.add(a.poolId));
  return [...ids].map(pool).filter(Boolean);
}
function ownerPool() {
  const ps = ownerPools();
  return ps.find(x => x.id === SESSION.ownPoolId) || ps[0] || null;
}
function ownerPicker() {
  const ps = ownerPools();
  if (ps.length < 2) return '';
  const cur = ownerPool();
  return '<div class="field" style="max-width:340px"><label for="opick">المشروع</label>'
    + '<select id="opick" data-act="pickOwnPool">'
    + ps.map(x => '<option value="' + x.id + '"' + (x.id === cur.id ? ' selected' : '') + '>'
        + esc(x.title) + '</option>').join('')
    + '</select></div>';
}

const NO_PROJECT = {

  lede: 'حسابك جاهز، ولم يُربط به مشروع بعد.',

    + '<button class="btn" data-act="go" data-view="own.apps">متابعة طلباتي</button></div>',

/* ── owner · the project board ─────────────────────────────────────────────
   The fourth surface the metrics layer was written for, and the last one
   still computing its own arithmetic. Six selectors were written for it and
   not one had a caller: an owner opened this screen and saw a status chip, a
   total, a percentage, and a timeline of eight sentences that were equally
   true of every project on the platform.

   What an owner actually needs is narrower and harder. Whether the raise
   will clear its minimum before the clock runs out — below it every riyal
   goes back and they receive nothing at all. How much of their own milestone
   money has actually been released, and how much is still held. What the
   platform will take, on what basis, and priced by which day's rules. And
   whether the account holding the money has been tied out against the
   partner who holds it.

   Every figure comes from a selector keyed to this pool, and each returns
   undefined for an account that does not own it. The gate is not a hidden
   card: it is a number that was never computed.
   ────────────────────────────────────────────────────────────────────────── */
VIEWS['own.project'] = () => {
  const p = ownerPool();
  if (!p) return NO_PROJECT;
  const base = BASE(STATE);
  const par = metricsParams({ poolId: p.id });

  const prog = selFundingProgress(base, SESSION, par);
  const heads = selInvestorCount(base, SESSION, par);
  const tick = selTicketStats(base, SESSION, par);
  const ledg = selDisbursementLedger(base, SESSION, par);
  const fees = selFeesAccrued(base, SESSION, par);
  const rec = selReconciliationStatus(base, SESSION, par);

  const omr0 = v => fmt(v, 0) + ' ر.ع';
  const pctOf = b => (b / 100).toFixed(1) + '%';
  const daysLeft = p.closesAt
    ? Math.ceil((new Date(p.closesAt + 'T23:59:59Z').getTime() - Date.now()) / DAY) : null;

  /* ── ⓪ the one fact that decides whether the project happens ──
     Below the minimum at close, the rule refunds everyone and the owner gets
     nothing — so this is not a progress bar, it is a deadline. */
  const band0 = prog === undefined ? '' : (() => {
    if (p.status === 'refunding')
      return '<div class="note note--crit"><strong>لم يبلغ التمويل حدّه الأدنى في مدته.</strong> '
        + 'تُسترد الالتزامات كاملةً للمستثمرين ولا يُصرف من هذه الفرصة شيء. '
        + 'تقديم طلب جديد متاح، ويبدأ من الفحص لا من حيث توقّف.</div>';
    if (p.status !== 'funding')
      return '<div class="note note--pos"><strong>أُغلق التمويل بنجاح.</strong> '
        + 'خُصِّص ' + omr0(prog.raised) + ' ولم يعد بابُ الالتزام مفتوحًا — '
        + 'وما يليه صرفٌ على المراحل بدليل واعتماد طرف ثانٍ.</div>';
    const short = Math.max(0, prog.minClose - prog.raised);
    if (!prog.meetsMinimum)
      return '<div class="note note--crit"><strong>لم يبلغ الحدّ الأدنى بعد.</strong> '
        + 'ينقص <span class="num">' + omr0(short) + '</span>'
        + (daysLeft == null ? '' : (daysLeft > 0 ? '، وبقي ' + daysLeft + ' يومًا على الإغلاق'
                                                 : '، وقد انتهت مدة التمويل'))
        + '. الإغلاق دون الحدّ الأدنى يعني استرداد كل ريال للمستثمرين ولا يُصرف لك شيء — '
        + 'وهذه القاعدة تُنفَّذ آليًّا، لا تُقدَّر.</div>';
    return '<div class="note note--pos"><strong>بلغ الحدّ الأدنى.</strong> '
      + 'الإغلاق الآن ناجح، ويبقى متّسع <span class="num">' + omr0(prog.headroom) + '</span> '
      + 'حتى سقف الاكتتاب'
      + (daysLeft != null && daysLeft > 0 ? ' خلال ' + daysLeft + ' يومًا.' : '.')
      + '</div>';
  })();

  /* ── ① the raise, against the line that matters ── */
  const band1 = prog === undefined ? '' : '<div class="grid grid--4">'
    + kpiCard('الملتزم به', omr0(prog.raised), heads === undefined ? '' : heads + ' مستثمرًا')
    + kpiCard('الحدّ الأدنى للإغلاق', omr0(prog.minClose), pctOf(prog.pctOfMinimum) + ' منه')
    + kpiCard('الهدف المعلن', omr0(prog.target), pctOf(prog.pctOfTarget) + ' منه')
    + kpiCard('سقف الاكتتاب', omr0(prog.overfundCap), 'يبقى منه ' + omr0(prog.headroom))
    + '</div>'
    + '<div class="card"><div class="card__body">'
    + ratioMeter(prog.raised, prog.minClose, v => fmt(v, 0) + ' ر.ع',
        prog.meetsMinimum ? TONE.good
        : daysLeft != null && daysLeft <= 14 ? TONE.critical : TONE.warning)
    + '<p class="xs muted">المقياس مقابل الحدّ الأدنى لا الهدف: الهدف طموح، والحدّ الأدنى '
    + 'هو الخطّ الذي دونه لا يقوم المشروع.</p>'
    + (tick === undefined || !tick.count ? '' : '<div class="grid grid--4">'
        + kpiCard('عدد الالتزامات', String(tick.count))
        + kpiCard('الالتزام الوسيط', omr0(tick.median), 'المتوسط ' + omr0(tick.avg))
        + kpiCard('أصغر التزام', omr0(tick.min))
        + kpiCard('أكبر التزام', omr0(tick.max),
            tick.max && prog.raised ? pctOf(bps(tick.max, prog.raised)) + ' من الملتزم به' : '')
        + '</div>'
        /* Concentration only bites while the raise is open: once allocated,
           a withdrawal is no longer possible and the warning would be
           describing a risk that has already passed. */
        + (p.status === 'funding' && tick.max && prog.raised && bps(tick.max, prog.raised) > 3000
            ? '<div class="note note--warn sm">أكبر التزام واحد يحمل أكثر من ثلث ما جُمع. '
              + 'عدوله في مهلته أو سقوطه عند التخصيص يعيدك دون الحدّ الأدنى.</div>'
            : '')
        + (tick.belowMinCount
            ? '<div class="note sm">' + tick.belowMinCount + ' التزامًا دون الحدّ الأدنى للتذكرة. '
              + 'عند التخصيص التناسبي تُردّ الحصة التي تنزل تحت الحدّ كاملةً لصاحبها، '
              + 'ويُعاد توزيع مبلغها على الباقين.</div>'
            : ''))
    + '</div></div>';

  /* ── ② the money that is actually yours to draw ── */
  const band2 = ledg === undefined ? '' : '<div class="card"><div class="card__body">'
    + '<div class="grid grid--4">'
    + kpiCard('مخطَّط على المراحل', omr0(ledg.planned),
        ledg.milestonesTotal + ' مرحلة')
    + kpiCard('صُرف لك فعلًا', omr0(ledg.paid),
        ledg.milestonesPaid + ' من ' + ledg.milestonesTotal + ' مرحلة')
    + kpiCard('ما زال محتجزًا', omr0(ledg.remaining))
    + kpiCard('قيد انتظار اعتماد', omr0(ledg.requested),
        ledg.requested ? 'يلزمه طرف ثانٍ' : 'لا طلب معلّق')
    + '</div>'
    + ratioMeter(ledg.paid, ledg.planned || 1, v => fmt(v, 0) + ' ر.ع',
        ledg.planned && ledg.paid >= ledg.planned ? TONE.good
        : ledg.requested ? TONE.warning : TONE.good)
    + '<p class="xs muted">لا يخرج مبلغ مرحلة قبل دليل يثبت شرطها، وباعتماد شخص غير من طلب '
    + 'الصرف. المحتجز ليس تأخيرًا إداريًّا — هو الضمانة التي بُنيت عليها ثقة المستثمر.</p>'
    + '<div class="row"><a class="btn btn--primary" href="' + hrefFor({ view: 'own.funds' })
    + '">استخدام الأموال وطلب صرف مرحلة</a>'
    + '<a class="btn" href="' + hrefFor({ view: 'own.reports' }) + '">التقارير المستحقة</a></div>'
    + '</div></div>';

  /* ── ③ what the platform takes, and on what basis ──
     Stated to the owner in the same terms the disclosure states it to the
     investor, and priced by the settings in force when the pool closed —
     never by today's, which would reprice a two-year-old agreement. */
  const band3 = fees === undefined ? '' : '<div class="card"><div class="card__body">'
    + '<div class="grid grid--3">'
    + kpiCard('رسم المنصة', omr0(fees.platform),
        fees.platformBasis === 'RAISED_AT_CLOSE' ? 'على ما خُصِّص عند الإغلاق' : 'أساس ' + fees.platformBasis)
    + kpiCard('رسم النجاح', omr0(fees.success),
        fees.successBasis === 'PROFIT_ONLY' ? 'على الربح وحده' : 'أساس ' + fees.successBasis)
    + kpiCard('ما وُزّع على المستثمرين', omr0(fees.distributed),
        fees.profit ? 'منه ربح ' + omr0(fees.profit) : 'لم يتجاوز رأس المال بعد')
    + '</div>'
    + '<p class="xs muted">رسم المنصة يُحتسب مرة واحدة على رأس المال المخصَّص عند الإغلاق، '
    + 'ورسم النجاح لا يُحتسب إلا على ما يزيد عمّا استردّه المستثمر من رأس ماله — '
    + 'فلا «نجاح» قبل أن يعود إليه ما دفعه. وكلاهما بأسعار الإعدادات النافذة يوم إغلاق '
    + 'فرصتك، لا بأسعار اليوم.</p>'
    + '</div></div>';

  /* ── ④ is the money where we said it is ──
     The fact only: the amounts and the names live behind funds.read. */
  const band4 = rec === undefined ? '' : '<div class="card"><div class="card__body">'
    + (!rec.hasAny
        ? '<div class="note">لم تُجرَ مطابقة بنكية بعد. المطابقة تقابل سجلّ المنصة بكشف '
          + 'الشريك المرخّص، ولا تُغلق إلا بتوقيع طرفين.</div>'
        : rec.isOpen
          ? '<div class="note note--warn"><strong>مطابقة مفتوحة الآن.</strong> '
            + 'يُقابَل سجلّ المنصة بكشف الشريك المرخّص، ولا تُغلق قبل تفسير كل فرق '
            + 'وتوقيع طرف ثانٍ.'
            + (rec.lastPeriod ? ' آخر فترة موقَّعة: ' + esc(rec.lastPeriod) + '.' : '')
            + '</div>'
          : '<div class="note note--pos"><strong>الحساب مطابَق ومُوقَّع.</strong> '
            + 'الفترة ' + esc(rec.lastPeriod || '—')
            + (rec.signedAt ? ' · وُقّعت ' + dt(rec.signedAt) : '') + '.</div>')
    + '<p class="xs muted">تفاصيل الفروق ومبالغها ومن وقّعها تخصّ فريق المالية والمدقّق، '
    + 'ولا تُعرض هنا: ما يخصّك هو أن الحساب الذي يحمل مالك قد قوبل بكشف من يحمله.</p>'
    + '</div></div>';

  /* ── the path, derived and folded ──
     It answers "where am I in the process", which is a question asked once
     and then not again for weeks — so it opens on demand rather than taking
     a third of the screen every visit. */
  const published = STATE.reports.some(r => r.poolId === p.id && r.status === 'published');
  const steps = [
    { t: 'تقديم الطلب', d: 'المستندات التأسيسية والقوائم المالية وعروض الأسعار', done: true },
    { t: 'الفحص النافي للجهالة', d: 'تحقق من المنشأة والمُلاك وعروض الموردين', done: true },
    { t: 'قرار اللجنة', d: 'موافقة بشروط: مساهمة المالك لا تقل عن المعلن', done: true },
    { t: 'بناء الإفصاح ونشره', d: 'نسخة v' + p.disclosureVersion + ' منشورة في ' + dt(p.publishedAt), done: true },
    { t: 'فترة التمويل', d: 'تُغلق في ' + dt(p.closesAt), done: p.status !== 'funding', now: p.status === 'funding' },
    { t: 'الإغلاق والتخصيص', d: p.fundedAt ? 'أُغلقت في ' + dt(p.fundedAt) : 'لم تُغلق بعد', done: !!p.fundedAt },
    { t: 'الصرف على المراحل',
      d: ledg === undefined ? 'بموافقة طرفين ودليل لكل مرحلة'
        : ledg.milestonesPaid + ' من ' + ledg.milestonesTotal + ' مرحلة صُرفت بدليل واعتماد طرف ثانٍ',
      done: !!(ledg && ledg.milestonesPaid), now: p.status === 'operating' },
    { t: 'التقارير الدورية', d: 'ربع سنوية طوال المدة', done: published },
  ];
  const at = steps.filter(s => s.done).length;
  const path = '<details class="fold"><summary>المسار — الخطوة ' + at + ' من '
    + steps.length + '</summary><div class="tl" style="padding-block-start:.6rem">'
    + steps.map(s => '<div class="tl__item"><span class="tl__dot '
        + (s.done ? 'tl__dot--done' : s.now ? 'tl__dot--now' : '') + '"></span>'
        + '<div><div class="tl__t">' + esc(s.t) + '</div>'
        + '<div class="tl__d">' + esc(s.d) + '</div></div></div>').join('')
    + '</div></details>';

  return {
    crumb: 'صاحب مشروع · ' + p.ref, title: p.title, wide: true,
    lede: 'أرقام مشروعك محسوبة من السجل لحظة العرض، ومرتَّبة بما تقرّره: '
        + 'هل يبلغ التمويل حدّه، وكم خرج إليك، وماذا تأخذ المنصّة، وهل قوبل الحساب بكشف الشريك.',
    body: '<div class="stack" style="gap:1rem">'
      + ownerPicker()
      + band0
      + band('①', 'هل يبلغ التمويل حدّه؟',
             p.status === 'funding' && daysLeft != null
               ? (daysLeft > 0 ? 'بقي ' + daysLeft + ' يومًا' : 'انتهت المدة') : POOL_STATUS[p.status][0],
             band1)
      + band('②', 'كم خرج إليك، وكم بقي محتجزًا؟',
             ledg === undefined ? '' : ledg.milestonesPaid + '/' + ledg.milestonesTotal + ' مرحلة', band2)
      + band('③', 'ماذا تأخذ المنصّة؟', 'وبأي أساس', band3)
      + band('④', 'هل المال حيث قيل إنه؟', 'مطابقة حساب الضمان', band4)
      + path
      + '<div class="note note--warn sm">لا يجوز لك أو لأي طرف نيابة عنك وعدُ المستثمرين بعائد '
      + 'أو بضمان رأس المال، في التقارير أو خارج المنصة.</div>'
      + '</div>',
  };
};

        : '<tr><td colspan="4" class="empty">لا مراحل.</td></tr>')
      + '</tbody></table></div></div></div>'
      + '<div class="card"><div class="card__head"><h2>طلب صرف مرحلة</h2></div><div class="card__body">'
      + (!canRequest
          ? '<div class="note note--warn">لا يبدأ الصرف قبل إغلاق التمويل بنجاح.</div>'

              + pend.map(m => '<option value="' + m.id + '">' + esc(m.label) + ' — ' + fmt(m.amount, 0) + ' ر.ع</option>').join('')
              + '</select></div>'
              + '<div class="field"><label for="mev">وصف الدليل المرفق</label>'
              + '<textarea id="mev" placeholder="رقم المحضر أو الفاتورة وما تثبته"></textarea>'
              + '<span class="field__hint">يُسجَّل الوصف مع الطلب ويراه المعتمد والمدقق.</span></div>'
              + '<button class="btn btn--primary" data-act="requestDsb" data-pool="' + p.id + '">إرسال طلب الصرف</button>')
      + '</div></div>',
  };

/* ── owner · reporting duty ───────────────────────────────────────────── */
VIEWS['own.reports'] = () => {

  return {
    crumb: 'صاحب مشروع · ' + p.ref, title: 'التقارير',
    lede: 'التقرير ليس نصًا حرًا: يحمل مؤشرات فعلية مقابل ما نشره الإفصاح، وتفسيرًا لأي انحراف.',
    body: ownerPicker()
      + '<div class="card"><div class="card__body card__body--flush"><div class="tablewrap"><table>'
      + '<thead><tr><th>الفترة</th><th>الاستحقاق</th><th>الحالة</th><th>التقديم</th><th>النشر</th></tr></thead><tbody>'
      + (rs.length ? rs.map(r => '<tr><td>' + esc(r.period) + '</td><td class="sm">' + dt(r.dueAt) + '</td>'
          + '<td>' + chip(REPORT_STATUS, r.status) + '</td><td class="sm">' + dt(r.submittedAt) + '</td>'
          + '<td class="sm">' + dt(r.publishedAt) + '</td></tr>').join('')
        : '<tr><td colspan="5" class="empty">لا يبدأ جدول التقارير قبل إغلاق التمويل بنجاح.</td></tr>')
      + '</tbody></table></div></div></div>'
      + (openR
        ? '<div class="card"><div class="card__head"><h2>تقديم تقرير ' + esc(openR.period) + '</h2>'
          + '<span class="spacer xs muted">الاستحقاق ' + dt(openR.dueAt) + '</span></div><div class="card__body">'
          + '<div class="note note--info">لا يرى المستثمر هذا التقرير قبل مراجعته ونشره من فريق المتابعة.</div>'
          + '<div id="kpiRows" class="stack-s">' + kpiRowHtml(0) + '</div>'
          + '<button class="btn btn--sm" data-act="addKpi">+ مؤشر</button>'
          + '<div class="field"><label for="rnarr">السرد</label>'
          + '<textarea id="rnarr" placeholder="ما الذي حدث في الفترة، وما سببه"></textarea>'
          + '<span class="field__hint">20 حرفًا على الأقل، ويُفحص من عبارات ضمان العائد.</span></div>'
          + '<div class="field"><label for="rvar">تفسير الانحراف</label><textarea id="rvar"></textarea></div>'
          + '<button class="btn btn--primary" data-act="submitReport" data-report="' + openR.id + '">تقديم التقرير</button>'
          + '</div></div>'
        : '<div class="note note--pos">لا يوجد تقرير مستحق التقديم الآن.</div>'),
  };
};
let kpiSeq = 0;
function kpiRowHtml() {
  kpiSeq += 1;
  return '<div class="row kpirow" style="gap:.4rem">'
    + '<input class="k-metric" placeholder="اسم المؤشر" style="flex:2 1 10rem">'
    + '<input class="k-actual num" dir="ltr" type="number" step="any" placeholder="الفعلي" style="flex:1 1 6rem">'
    + '<input class="k-forecast num" dir="ltr" type="number" step="any" placeholder="المتوقع" style="flex:1 1 6rem">'
    + '</div>';
}
