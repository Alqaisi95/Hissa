/* ══════════════════════════════════════════════════════════════════════════
   SEGREGATION OF DUTIES

   The permission matrix answers "who holds what". It does not answer the
   question an administrator is actually accountable for: can one person walk
   a whole path end to end without anyone else touching it?

   That is a property of a *combination*, never of a single grant, so no
   amount of staring at the matrix reveals it — which is why the first version
   of this dashboard, matrix and all, could not have shown it. The
   combinations are declared here rather than inferred, because a rule nobody
   can read is a rule nobody can argue with.

   `mitigation` is what separates a warning from a scare. Holding both halves
   of the disbursement path is a real concentration of power, and
   actApproveDisbursement still refuses to let the requester approve their own
   request. Naming the first without the second is alarmism; naming neither is
   what this screen did before.
   ══════════════════════════════════════════════════════════════════════════ */
const SOD_RULES = [
  { k: 'mint', perms: ['admin.users', 'admin.enrol'], sev: 3,
    label: 'إنشاء حساب ومنحه صلاحياته',
    why: 'حاملها يصنع الطرفَ الثاني بنفسه — وكل رقابة ثنائية أخرى تفترض أن ذلك الطرف شخص آخر',
    mitigation: null },
  { k: 'pay', perms: ['funds.request', 'funds.approve'], sev: 2,
    label: 'طلب الصرف واعتماده',
    why: 'يملك طرفَي معاملة الصرف معًا',
    mitigation: 'محجوب على مستوى المعاملة: لا يعتمد الطلبَ من أنشأه' },
  { k: 'orig', perms: ['application.review', 'pool.manage'], sev: 2,
    label: 'اعتماد الطلب ونشره وإغلاقه',
    why: 'يوافق على المشروع ثم يبنيه فرصةً ويغلق تمويلها دون مراجع',
    mitigation: null },
  { k: 'onboard', perms: ['kyc.approve', 'application.review'], sev: 2,
    label: 'اعتماد هوية المتقدّم ثم طلبه',
    why: 'شرط اعتماد الطلب هو تحقّق هوية صاحبه — فيستوفيه بنفسه ثم يعتمد',
    mitigation: null },
  { k: 'narrate', perms: ['report.publish', 'pool.manage'], sev: 1,
    label: 'تعديل الإفصاح ونشر تقريره',
    why: 'يعدّل ما وعد به الإفصاح، وينشر التقرير الذي يُقاس عليه',
    mitigation: null },
];

/* Which declared combinations an account actually holds. */
function sodFindings(u) {
  const held = u.perms || [];
  return SOD_RULES.filter(r => r.perms.every(p => held.includes(p)));
}

/* An account's permissions against the standard grant of its own job. Nothing
   forbids the drift — actSetJob resets perms, but a hand-built account keeps
   whatever it was given. What is missing is any screen that says so. */
function permDrift(u) {
  const spec = STAFF_JOBS.find(j => j.k === u.job);
  if (!spec) return null;
  const held = new Set(u.perms || []);
  const std = new Set(spec.perms);
  const extra = [...held].filter(p => !std.has(p));
  const missing = [...std].filter(p => !held.has(p));
  return (extra.length || missing.length) ? { extra, missing, job: spec.k } : null;
}
const isSensitive = p => !!(PERM_CATALOG.find(x => x.k === p) || {}).sensitive;
/* How much of the platform an account opens — the one number that makes two
   accounts with different permission counts comparable. */
const accessReach = u => STAFF_NAV.filter(n => canOpen(u, n)).length;

/* A button that can only fail is not a control: mirror what actSetSuspended
   itself refuses, so the row shows the reason instead of a dead button. */
function suspendBlocker(t, byId) {
  if (t.id === byId) return 'لا توقف حسابك بنفسك';
  if (t.job === 'system_admin' && !t.suspended
      && !STATE.users.some(x => x.job === 'system_admin' && !x.suspended && x.id !== t.id))
    return 'آخر مدير نظام نشط';
  return null;
}

/* Kinds in the order an administrator should meet them. The previous version
   sorted by severity alone and cut the list at nine, so a structural finding
   that shared a severity with seven routine warnings fell off the board
   unseen. Nothing is cut now — this order only decides which group is read
   first. */
const EXC_KIND_ORDER = ['حوكمة', 'فصل مهام', 'صلاحية', 'انحراف', 'حساب', 'دعوة', 'إعداد', 'بيانات'];
const excKindRank = k => { const i = EXC_KIND_ORDER.indexOf(k); return i < 0 ? 99 : i; };

/* What an administrator has to notice before someone else does.
   Every finding carries where it is fixed: `act` when it can be fixed from
   this row, `view` when it needs the full screen. */
function accessExceptions() {
  const now = Date.now();
  const out = [];
  const meId = SESSION.authUserId;
  const staff = STATE.users.filter(x => x.role === 'staff');
  const active = staff.filter(x => !x.suspended);

  /* A sensitive permission nobody holds is a stalled process; one only a
     single person holds is a process that stops when they take leave. */
  PERM_CATALOG.filter(pc => pc.sensitive).forEach(pc => {
    const holders = active.filter(x => (x.perms || []).includes(pc.k));
    if (holders.length === 0)
      out.push({ sev: 3, kind: 'صلاحية', what: pc.ar,
        why: 'لا يملكها أي حساب نشط — كل عمل يعتمد عليها متوقف', ref: pc.k, view: 'ops.admin' });
    else if (holders.length === 1)
      out.push({ sev: 2, kind: 'صلاحية', what: pc.ar,
        why: 'يملكها حساب واحد فقط (' + holders[0].name + ') — يتوقف العمل بغيابه',
        ref: pc.k, view: 'ops.admin', rec: holders[0].id });
  });

  const admins = active.filter(x => (x.perms || []).includes('admin.users'));
  if (admins.length < 2)
    out.push({ sev: 3, kind: 'حوكمة', what: 'مدير نظام واحد نشط',
      why: 'الرقابة الثنائية على الإعدادات تحتاج مديرَين — لا يمكن اعتماد أي اقتراح',
      ref: 'admin.users', view: 'ops.admin' });

  /* Only the combinations nothing downstream blocks. A concentration the
     engine already refuses per transaction is documented in band 02, not
     raised here as work — an exception list that includes what is already
     handled teaches an administrator to skim it. */
  /* One row per combination, not per person. Two accounts holding the same
     pair used to produce two rows carrying the same sentence word for word,
     and a list that repeats itself teaches the reader to skim it. */
  const byRule = [];
  active.forEach(x => sodFindings(x).filter(r => !r.mitigation).forEach(r => {
    const at = byRule.find(g => g.rule.k === r.k);
    if (at) at.who.push(x); else byRule.push({ rule: r, who: [x] });
  }));
  byRule.forEach(({ rule, who }) => {
    out.push({ sev: rule.sev, kind: 'فصل مهام',
      what: rule.label + ' — ' + who.map(x => x.name).join('، '),
      why: rule.why + ' · لا ضابط يمنعها بعد المنح',
      ref: rule.perms.join(' + '), view: 'ops.admin',
      rec: who.length === 1 ? who[0].id : null });
  });

  staff.filter(x => !(x.perms || []).length && !x.suspended).forEach(x =>
    out.push({ sev: 2, kind: 'حساب', what: x.name, why: 'حساب نشط بلا أي صلاحية — لا يفتح شاشة واحدة',
      ref: x.email || x.id, view: 'ops.admin', rec: x.id }));

  staff.filter(x => x.suspended).forEach(x =>
    out.push({ sev: 1, kind: 'حساب', what: x.name,
      why: 'موقوف منذ ' + Math.floor((now - new Date(x.suspended).getTime()) / DAY) + ' يومًا',
      ref: x.email || x.id,
      act: { label: 'إعادة تفعيل', a: 'toggleSuspend', perm: 'admin.enrol',
             d: { user: x.id, on: '0' } } }));

  STATE.invites.forEach(i => {
    const st = inviteState(i);
    if (st === 'open') {
      const left = Math.ceil((new Date(i.expiresAt).getTime() - now) / DAY);
      if (left <= 2) out.push({ sev: 1, kind: 'دعوة', what: 'كود ' + i.code,
        why: 'صالح ' + (left <= 0 ? 'اليوم فقط' : left + ' يومًا') + ' لوظيفة '
          + (JOB_AR[i.job] || i.job) + ' ولم يُستخدم', ref: i.code,
        act: { label: 'إلغاء', a: 'revokeInvite', perm: 'admin.enrol', danger: true,
               d: { code: i.code } } });
    } else if (st === 'expired') {
      out.push({ sev: 1, kind: 'دعوة', what: 'كود ' + i.code,
        why: 'انتهى دون استخدام — لوظيفة ' + (JOB_AR[i.job] || i.job), ref: i.code, view: 'ops.admin', rec: i.code });
    }
  });

  /* A privileged account nobody has used is a key left in a door. The
     previous rule read `days !== null && days >= DORMANT_DAYS`, so an account
     that had *never* been signed into — lastSignInAt absent, days null — fell
     straight through it. That is the worse case of the two: a key nobody has
     ever turned, that nobody would miss. */
  active.filter(x => (x.perms || []).some(isSensitive)).forEach(x => {
    const blocker = suspendBlocker(x, meId);
    const stop = blocker ? null
      : { label: 'إيقاف', a: 'toggleSuspend', perm: 'admin.enrol', danger: true,
          d: { user: x.id, on: '1' } };
    if (!x.lastSignInAt) {
      /* Newly provisioned and not yet used is ordinary — an account is made
         before its holder first signs in. Provisioned weeks ago and still
         never used is the finding. Without a createdAt there is nothing to
         date it by, and the row says that rather than guessing. */
      const age = x.createdAt ? Math.floor((now - new Date(x.createdAt).getTime()) / DAY) : null;
      const fresh = age !== null && age < NEVER_USED_DAYS;
      out.push({ sev: fresh ? 1 : 3, kind: 'حساب', what: x.name,
        why: (fresh
          ? 'حساب بصلاحيات حسّاسة أُنشئ قبل ' + age + ' يومًا ولم يُستخدم بعد'
          : 'حساب بصلاحيات حسّاسة لم يُستخدم قط'
            + (age !== null ? ' منذ إنشائه قبل ' + age + ' يومًا' : '، ولا تاريخ إنشاء يؤرّخه'))
          + (blocker ? ' · ' + blocker : ''),
        ref: x.email || x.id,
        act: fresh ? null : stop, view: (fresh || !stop) ? 'ops.admin' : null });
      return;
    }
    const days = Math.floor((now - new Date(x.lastSignInAt).getTime()) / DAY);
    if (days >= DORMANT_DAYS)
      out.push({ sev: 2, kind: 'حساب', what: x.name,
        why: 'حساب بصلاحيات حسّاسة لم يُستخدم منذ ' + days + ' يومًا'
          + (blocker ? ' · ' + blocker : ''),
        ref: x.email || x.id, act: stop, view: stop ? null : 'ops.admin' });
  });

  /* Permissions that no longer match the job they are supposed to come from.
     Nothing in the engine forbids it — an account built by hand keeps what it
     was handed — and until now nothing showed it either. */
  active.forEach(x => {
    const d = permDrift(x);
    if (!d) return;
    const hot = d.extra.filter(isSensitive);
    const parts = [];
    if (d.extra.length) parts.push('تزيد ' + d.extra.length
      + (hot.length ? ' منها ' + hot.length + ' حسّاسة' : ''));
    if (d.missing.length) parts.push('تنقص ' + d.missing.length);
    out.push({ sev: hot.length ? 2 : 1, kind: 'انحراف', what: x.name,
      why: 'صلاحياته لا تطابق معيار وظيفة «' + (JOB_AR[d.job] || d.job) + '» — ' + parts.join(' و'),
      ref: (d.extra[0] || d.missing[0] || ''), view: 'ops.admin', rec: x.id });
  });

  /* A recovery code still open is a second way into an account. */
  STATE.resets.filter(r => resetState(r) === 'open').forEach(r => {
    const t = user(r.userId) || { name: r.userId };
    const hrs = Math.max(0, Math.ceil((new Date(r.expiresAt).getTime() - now) / 3600000));
    out.push({ sev: 2, kind: 'حساب', what: 'كود استرداد قائم لحساب ' + t.name,
      why: 'صالح ' + hrs + ' ساعة بعد — يفتح الحساب لمن يحمله ويعرف بريده',
      ref: r.code,
      act: { label: 'إلغاء', a: 'revokeReset', perm: 'admin.users', danger: true,
             d: { code: r.code } } });
  });

  if (MIGRATION.filled.length)
    out.push({ sev: 2, kind: 'بيانات', what: 'رُقِّعت بنية الحالة عند التحميل',
      why: 'وصل المستند بحقول ناقصة (' + MIGRATION.filled.slice(0, 4).join('، ')
        + (MIGRATION.filled.length > 4 ? ' و' + (MIGRATION.filled.length - 4) + ' غيرها' : '')
        + ') فمُلئت بقيمها الافتراضية — من إصدار ' + MIGRATION.from + ' إلى ' + SCHEMA,
      ref: 'schema', view: null });

  STATE.settingProposals.filter(x => x.status === 'pending').forEach(x => {
    const days = Math.floor((now - new Date(x.proposedAt).getTime()) / DAY);
    const f = SETTING_FIELDS.find(y => y.k === x.key) || { label: x.key };
    out.push({ sev: 2, kind: 'إعداد', what: 'اقتراح تغيير «' + f.label + '»',
      why: 'معلّق منذ ' + days + ' يومًا وينتظر مديرًا غير من اقترحه',
      ref: x.id, view: 'ops.settings', rec: x.id });
  });

  return out.sort((a, b) => b.sev - a.sev
    || excKindRank(a.kind) - excKindRank(b.kind)
    || String(a.what).localeCompare(String(b.what), 'ar'));
}

/* The subset of the audit log that changed who can reach what. Every one of
   these actions is already recorded; none of them was ever readable together,
   so "did access change when I was not looking" had no answer. */
const ACCESS_ACTIONS = new Set([
  'إنشاء حساب', 'إنشاء حساب مدير نظام', 'انضمام موظف بدعوة', 'تغيير وظيفة',
  'إيقاف حساب', 'إعادة تفعيل حساب', 'إصدار كود دعوة', 'إلغاء كود دعوة',
  'إصدار كود استرداد', 'إلغاء كود استرداد', 'استرداد كلمة المرور',
  'تغيير كلمة المرور', 'طمس بيانات شخصية', 'اعتماد تحقق', 'رفض تحقق',
]);
function accessChanges() {
  return STATE.audit.filter(r => ACCESS_ACTIONS.has(r.action)).slice().reverse();
}

/* The chain is either intact or it is not; saying which row broke is the
   only useful form of "not". */
function auditIntegrity() {
  const rows = STATE.audit;
  const breaks = [];
  for (let i = 1; i < rows.length; i += 1) {
    if (rows[i].prev !== rows[i - 1].hash) breaks.push(i);
  }
  const recomputed = [];
  let prev = '0'.repeat(16);
  rows.forEach((r, i) => {
    const copy = Object.assign({}, r);
    delete copy.hash;
    copy.prev = prev;
    if (h64(prev + '|' + JSON.stringify(copy)) !== r.hash) recomputed.push(i);
    prev = r.hash;
  });
  const byActor = {};
  const byAction = {};
  rows.forEach(r => {
    const name = (user(r.actor) || {}).name || 'غير معروف';
    byActor[name] = (byActor[name] || 0) + 1;
    byAction[r.action] = (byAction[r.action] || 0) + 1;
  });
  return {
    total: rows.length, breaks, recomputed,
    intact: breaks.length === 0 && recomputed.length === 0,
    byActor: Object.keys(byActor).map(k => ({ label: k, value: byActor[k] })).sort((a, b) => b.value - a.value),
    byAction: Object.keys(byAction).map(k => ({ label: k, value: byAction[k] })).sort((a, b) => b.value - a.value),
  };
}

/* Audit rows per day over a window — activity, not volume of money. */
function auditActivity(days) {
  const end = new Date(); end.setUTCHours(0, 0, 0, 0);
  const start = new Date(end.getTime() - (days - 1) * DAY);
  const out = Array.from({ length: days }, (_, i) => {
    const d = new Date(start.getTime() + i * DAY);
    return { key: d.toISOString().slice(0, 10), value: 0, count: 0,
      label: d.toISOString().slice(5, 10) };
  });
  const index = {};
  out.forEach((b, i) => { index[b.key] = i; });
  STATE.audit.forEach(r => {
    const k = String(r.at).slice(0, 10);
    if (index[k] != null) { out[index[k]].value += 1; out[index[k]].count += 1; }
  });
  return out;
}

/* ══════════════════════════════════════════════════════════════════════════
   DASHBOARD MODEL
   Four questions, answered in order. Every figure below is derived from the
   record — nothing on the dashboard is a written-in number.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 1. what needs intervention ─────────────────────────────────────────
   Exceptions, not counters. A counter tells you "3"; this tells you which
   three, how late each is, and which screen fixes it. Sorted by lateness so
   the top row is always the most overdue thing in the platform. */
const DAY = 86400000;
function exceptions() {
  const now = Date.now();
  const out = [];
  const age = iso => Math.floor((now - new Date(iso).getTime()) / DAY);

  STATE.cases.filter(c => c.status !== 'resolved').forEach(c => {
    const over = age(c.openedAt) - c.slaDays;
    if (over > 0) out.push({ over, kind: c.kind, ref: c.id,
      what: c.subject, where: pool(c.poolId) ? pool(c.poolId).ref : '—',
      why: 'تجاوزت مهلة الـSLA بـ' + over + ' يومًا'
        + (c.assignedTo ? ' · مع ' + ((user(c.assignedTo) || {}).name || '') : ' · بلا مسؤول'),
      view: 'ops.cases', rec: c.id });
  });

  STATE.reports.forEach(r => {
    const due = new Date(r.dueAt + 'T23:59:59Z').getTime();
    if (['published'].includes(r.status)) return;
    const over = Math.floor((now - due) / DAY);
    if (over > 0) out.push({ over, kind: 'تقرير', ref: r.id,
      what: 'تقرير ' + r.period + ' لـ' + (pool(r.poolId) || {}).ref,
      where: (pool(r.poolId) || {}).ref || '—',
      why: 'متأخر ' + over + ' يومًا عن موعد الاستحقاق'
        + (r.submittedAt ? ' وبانتظار النشر' : ' ولم يقدّمه صاحب المشروع'),
      view: 'ops.reports', rec: r.id });
    else if (['submitted', 'late'].includes(r.status) && r.submittedAt)
      out.push({ over: 0, kind: 'تقرير', ref: r.id, what: 'تقرير ' + r.period + ' بانتظار النشر',
        where: (pool(r.poolId) || {}).ref || '—', why: 'قُدِّم ولم يُنشر للمستثمرين بعد',
        view: 'ops.reports', rec: r.id });
  });

  STATE.disbursements.filter(d => d.status === 'requested').forEach(d => {
    out.push({ over: age(d.requestedAt), kind: 'صرف', ref: d.id,
      what: 'طلب صرف ' + fmt(d.amount, 0) + ' ر.ع',
      where: (pool(d.poolId) || {}).ref || '—',
      why: 'ينتظر اعتماد طرف ثانٍ منذ ' + age(d.requestedAt) + ' يومًا', view: 'ops.money', rec: d.id });
  });

  STATE.applications.filter(a => ['submitted', 'in_review'].includes(a.status)).forEach(a => {
    out.push({ over: age(a.resubmittedAt || a.submittedAt), kind: 'طلب تمويل', ref: a.id,
      what: a.project.title, where: a.company.name,
      why: (a.status === 'submitted' ? 'لم يبدأ فحصه' : 'قيد الفحص') + ' منذ '
        + age(a.resubmittedAt || a.submittedAt) + ' يومًا', view: 'ops.apps', rec: a.id });
  });

  STATE.users.filter(x => ['investor', 'owner'].includes(x.role) && x.kyc === 'pending').forEach(x => {
    out.push({ over: x.createdAt ? age(x.createdAt) : 0, kind: 'تحقق',
      what: x.name, where: x.email || '—', ref: x.email || x.id,
      why: 'حساب لا يستطيع الالتزام قبل اعتماد تحققه', view: 'ops.kyc', rec: x.id });
  });

  STATE.pools.filter(p => p.status === 'funding' && p.closesAt).forEach(p => {
    const over = Math.floor((now - new Date(p.closesAt + 'T23:59:59Z').getTime()) / DAY);
    if (over > 0) out.push({ over, kind: 'فرصة', ref: p.ref, what: p.title,
      where: p.issuer, why: 'انتهت مدة تمويلها منذ ' + over + ' يومًا ولم تُغلق', view: 'ops.pools', rec: p.id });
  });

  /* Money that left a pool beyond what was ever allocated to it. Nothing else
     in the platform reports this, and until the clamp in moneyPosition() came
     out nothing could: the figure was floored before anyone saw it. */
  moneyPosition().overdrawn.forEach(x => {
    out.push({ over: 9999, kind: 'صرف زائد', ref: x.pool.ref, what: x.pool.title,
      where: x.pool.issuer,
      why: 'صُرف ' + fmt(x.paid, 0) + ' ر.ع من فرصة لم يُخصَّص لها إلا ' + fmt(x.alloc, 0)
        + ' — زيادة ' + fmt(x.over, 0) + ' ر.ع خرجت بلا غطاء',
      view: 'ops.recon' });
  });

  return out.sort((a, b) => b.over - a.over);
}

/* ── 2. where the money is ──────────────────────────────────────────────
   Every riyal an investor ever committed, and where it sits now. The five
   states partition the total exactly — a riyal is in one of them and only
   one, so the bar is an honest part-to-whole. Returns are a separate flow
   and are reported beside it, never as a slice of the principal. */
function moneyPosition() {
  const disbursedBy = {};
  STATE.disbursements.filter(d => d.status === 'executed')
    .forEach(d => { disbursedBy[d.poolId] = (disbursedBy[d.poolId] || 0) + d.amount; });

  let funding = 0, escrow = 0, spent = 0, refunded = 0, cancelled = 0;
  /* Pools whose disbursements exceed what was ever allocated to them. This
     used to read `Math.min(disbursedBy[p.id] || 0, alloc)`, which floored
     escrow at zero and under-reported what had actually left — hiding the one
     condition the reconciliation screen exists to find. And it is reachable: a
     pool that closes between its minimum and its target allocates less than
     its milestones total, so releasing every milestone overdraws it.

     It is not a sixth slot in the part-to-whole. The five states partition
     money that behaved; an overdraw is money that did not, and giving it a
     slice would make the bar add up while the account did not. */
  const overdrawn = [];
  STATE.pools.forEach(p => {
    const alloc = allocatedOf(p.id).reduce((s, o) => s + (o.allocated || o.amount), 0);
    const paid = disbursedBy[p.id] || 0;
    const over = Math.max(0, paid - alloc);
    if (over > 0) overdrawn.push({ pool: p, alloc, paid, over });
    spent += paid - over;          // only what the allocation actually covered
    escrow += Math.max(0, alloc - paid);
  });
  const overDisbursed = overdrawn.reduce((s, x) => s + x.over, 0);
  STATE.orders.forEach(o => {
    if (o.status === 'refunded') refunded += (o.refunded != null ? o.refunded : o.amount);
    else if (o.status === 'cancelled') cancelled += o.amount;
    else if (o.status === 'pending' || o.status === 'confirmed') funding += o.amount;
  });
  const distributed = STATE.distributions.reduce((s, d) => s + d.gross, 0);
  const total = funding + escrow + spent + refunded + cancelled;
  return {
    total, distributed, overDisbursed, overdrawn,
    parts: [
      { key: 'funding', slot: 0,   label: 'قيد التمويل',          value: funding,
        note: 'التزامات على فرص لم تُغلق بعد — تُخصَّص أو تُسترد عند الإغلاق' },
      { key: 'escrow', slot: 1,    label: 'في الضمان',            value: escrow,
        note: 'مُخصَّصة لمشاريع أُغلقت، ولم يُصرف منها بعد' },
      { key: 'spent', slot: 2,     label: 'صُرف للمورّدين',        value: spent,
        note: 'خرجت فعلًا بموافقة طرفين ودليل مرحلة' },
      { key: 'refunded', slot: 3,  label: 'مُسترد للمستثمرين',     value: refunded,
        note: 'فرص لم تبلغ حدّها الأدنى، أو حصص نزلت تحت الحد الأدنى بعد التخصيص' },
      { key: 'cancelled', slot: 4, label: 'مُلغى في مهلة العدول',  value: cancelled,
        note: 'ألغاها المستثمر خلال المهلة' },
    ].filter(x => x.value > 0),
  };
}

/* ── 3. is funding moving ───────────────────────────────────────────────
   Weekly inflow, not a cumulative curve. A cumulative line only ever rises,
   so it looks healthy even in a dead month; the weekly bar shows a stall
   for what it is. */
function weeklyInflow(days) {
  const end = new Date(); end.setUTCHours(0, 0, 0, 0);
  const weeks = Math.max(1, Math.round(days / 7));
  const start = new Date(end.getTime() - (weeks * 7 - 1) * DAY);
  const buckets = Array.from({ length: weeks }, (_, i) => ({
    from: new Date(start.getTime() + i * 7 * DAY),
    value: 0, count: 0,
  }));
  let before = 0;
  STATE.orders.forEach(o => {
    const t = new Date(o.createdAt).getTime();
    if (t < start.getTime()) { before += o.amount; return; }
    const i = Math.min(weeks - 1, Math.floor((t - start.getTime()) / (7 * DAY)));
    if (i < 0) return;
    buckets[i].value += o.amount;
    buckets[i].count += 1;
  });
  let run = before;
  return buckets.map(b => {
    run += b.value;
    const label = String(b.from.getUTCMonth() + 1).padStart(2, '0') + '-'
                + String(b.from.getUTCDate()).padStart(2, '0');
    return { label, value: b.value, count: b.count, cumulative: run };
  });
}

/* ── 4. where each pool stands ──────────────────────────────────────────
   A table, not a chart: a pool carries eight attributes that all matter and
   no colour scale can hold them. Sorted by whichever closes soonest. */
function poolRows() {
  const now = Date.now();
  return STATE.pools.map(p => {
    const got = raised(p.id);
    const daysLeft = p.closesAt
      ? Math.ceil((new Date(p.closesAt + 'T23:59:59Z').getTime() - now) / DAY) : null;
    return {
      p, got, daysLeft,
      pctMin: p.minClose ? Math.min(100, (got / p.minClose) * 100) : 0,
      pctTarget: p.target ? Math.min(100, (got / p.target) * 100) : 0,
      urgency: p.status === 'funding' ? (daysLeft == null ? 999 : daysLeft) : 1000,
    };
  }).sort((a, b) => a.urgency - b.urgency);
}

/* ── ops · what needs attention ───────────────────────────────────────── */
function healthCounters() {
  const now = Date.now();
  const openCases = STATE.cases.filter(c => c.status === 'open');
  const overSla = openCases.filter(c => now - new Date(c.openedAt).getTime() > c.slaDays * 86400000);
  const recon = openCases.filter(c => c.kind === 'مطابقة');
  const lateReports = STATE.reports.filter(r =>
    r.status === 'late' || (r.status === 'scheduled' && now > new Date(r.dueAt + 'T23:59:59Z').getTime()));
  const dueSoon = STATE.reports.filter(r => r.status === 'scheduled'
    && new Date(r.dueAt + 'T23:59:59Z').getTime() - now < 45 * 86400000
    && new Date(r.dueAt + 'T23:59:59Z').getTime() >= now);
  const awaiting = STATE.disbursements.filter(d => d.status === 'requested');
  return { openCases, overSla, recon, lateReports, dueSoon, awaiting };
}

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  METRICS — a derived read layer                                          ║
   ╚══════════════════════════════════════════════════════════════════════════╝

   Every number a dashboard shows is the return value of a pure function of
   state. Nothing here is stored, no field is added to appstate, and no
   assignment to state appears below this line.

   Two layers, not one:

     BASE(state)                  indexes and raw totals · same for everyone ·
                                  cached on state.version
     sel*(base, session, params)  displayed numbers · gated by permission ·
                                  never cached

   The split is a privacy rule, not a performance one. Indexes are expensive
   and identical for every reader, so they are worth caching. Displayed numbers
   differ by account, and caching those would serve one account's figures to
   the next.

   Three contracts hold throughout:

     undefined ≠ 0.  No permission returns undefined and the card is not drawn.
                     No data returns 0 or [] and the card is drawn empty.
                     Collapsing them shows "٠ ر.ع" to someone not allowed to
                     know, which reads as a fact rather than a refusal.

     can() not assertPerm().  assertPerm throws, which is right for a mutation
                     and wrong here: one forbidden card must not take down the
                     dashboard around it. Hiding the card in the DOM is not the
                     control — the number is never computed.

     Time is a parameter.  No selector reads the clock. `params.now` is set
                     once at the boundary by metricsParams(), so a test can
                     drive any moment and get the same answer twice.

   Money is integer baisa throughout, and ratios leave as integer basis points.
   ────────────────────────────────────────────────────────────────────────── */

/* ── the five bases, in one place ──────────────────────────────────────────
   Each of these changes a figure people act on, and none of them can be
   derived from the code. They live here rather than scattered through the
   selectors so that a change of policy is one edit and one place to argue
   with. */
const VALUATION_BASIS    = 'COST';             // COST | COST_PLUS_DISTRIBUTIONS | UNIT_PRICE
const PLATFORM_FEE_BASIS = 'RAISED_AT_CLOSE';  // RAISED_AT_CLOSE | DISBURSED | DISTRIBUTED
const SUCCESS_FEE_BASIS  = 'PROFIT_ONLY';      // PROFIT_ONLY | GROSS_DISTRIBUTION
const ALLOWANCE_WINDOW   = 'ROLLING_12M';      // ROLLING_12M | LIFETIME | CALENDAR_YEAR
const ACTIVE_USER_BASIS  = 'SIGNIN_30D';       // SIGNIN_30D | ACTED_30D | HOLDS_POSITION
const ACTIVE_WINDOW_DAYS = 30;

/* Ratios leave this layer as integer basis points: 2.1% is 210, never 0.021.
   Everything stays in integers until the view formats it. */
const bps = (part, whole) => (whole ? Math.round((part * 10000) / whole) : 0);
const sumBaisa = (rows, pick) => rows.reduce((s, r) => s + (pick ? pick(r) : r), 0);

/* Time enters the layer exactly here. Selectors read params.now and never the
   clock, so the same state and the same params always give the same answer. */
function metricsParams(extra) {
  return Object.assign({ now: Date.now() }, extra || {});
}

/* ── settings as they stood at a moment ────────────────────────────────────
   settingsHistory records only what changed, and `settings` already holds the
   latest value of every key. So a snapshot is built by walking history newest
   first and undoing every change that had not yet taken effect — a key changed
   twice lands on the value it actually held.

   Every selector that touches a money rule must come through here with a
   timestamp. Reading current settings to price a two-year-old commitment
   reprices history by today's rules, and does it silently. */
function settingsAt(st, ts) {
  const at = ts == null ? Infinity : new Date(String(ts).length === 10 ? ts + 'T00:00:00Z' : ts).getTime();
  const snap = JSON.parse(JSON.stringify(st.settings));
  const holder = { settings: snap };
  st.settingsHistory.slice()
    .sort((a, b) => new Date(b.effectiveFrom) - new Date(a.effectiveFrom))
    .forEach(h => {
      const eff = new Date(h.effectiveFrom + 'T00:00:00Z').getTime();
      /* settingSet is the same key-path writer the approval path uses, so
         there is never a second copy of "which nested field is this". */
      if (eff > at) settingSet(holder, h.key, h.before);
    });
  return snap;
}

/* ── a distribution's split, whether it was seeded or created here ──────────
   Only actCreateDistribution writes `shares`; a seeded distribution has none,
   and a holder reading their own portfolio would be shown zero received
   against money that plainly moved. Splitting it on read with the same
   proRata the action uses keeps one apportionment rule in the system. */
function distributionShares(st, d) {
  if (Array.isArray(d.shares) && d.shares.length) return d.shares;
  const holders = st.orders.filter(o => o.poolId === d.poolId && o.status === 'allocated');
  if (!holders.length) return [];
  const cut = proRata(d.gross, holders.map(o => (o.allocated != null ? o.allocated : o.amount)));
  return holders.map((o, i) => ({ userId: o.userId, orderId: o.id, amount: cut[i] }));
}

/* ── BASE ──────────────────────────────────────────────────────────────────
   Cached on state.version alone: no clock, no filters, no account. Anything
   time-dependent is computed in a selector from params.now instead, so a case
   crossing its SLA does not need a state change to be noticed. */
let _base = { version: null, value: null };
/* Instrumentation, and the only reason it exists: "built once per version"
   is the whole claim of this cache, and a claim no test can read is a
   comment rather than a guarantee. */
let _baseBuilds = 0;

function buildBase(st) {
  _baseBuilds += 1;
  const group = (rows, key) => {
    const m = new Map();
    rows.forEach(r => {
      const k = typeof key === 'function' ? key(r) : r[key];
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(r);
    });
    return m;
  };
  const index = (rows, key) => {
    const m = new Map();
    rows.forEach(r => m.set(r[key], r));
    return m;
  };

  /* The spec asked for casesBySeverity. Cases carry no severity — they carry
     `kind` and `slaDays`, and what actually orders the queue is how far past
     its own SLA a case has run. That is a function of the clock, so it belongs
     in the selector; the index stays on status, which is not. */
  const sharesByUser = new Map();
  st.distributions.forEach(d => {
    distributionShares(st, d).forEach(sh => {
      if (!sharesByUser.has(sh.userId)) sharesByUser.set(sh.userId, []);
      sharesByUser.get(sh.userId).push({
        distributionId: d.id, poolId: d.poolId, period: d.period,
        at: d.paidAt, amount: sh.amount, orderId: sh.orderId,
      });
    });
  });

  return {
    state: st,
    version: st.version,
    settings: st.settings,
    settingsAt: ts => settingsAt(st, ts),
    ordersByPool:        group(st.orders, 'poolId'),
    ordersByUser:        group(st.orders, 'userId'),
    disbursementsByPool: group(st.disbursements, 'poolId'),
    distributionsByPool: group(st.distributions, 'poolId'),
    casesByStatus:       group(st.cases, 'status'),
    auditByDay:          group(st.audit, r => String(r.at).slice(0, 10)),
    usersById:           index(st.users, 'id'),
    poolsById:           index(st.pools, 'id'),
    sharesByUser,
  };
}

function BASE(st) {
  const state = st || STATE;
  if (_base.value && _base.version === state.version && _base.state === state) return _base.value;
  const value = buildBase(state);
  _base = { version: state.version, state, value };
  return value;
}

/* ── who is asking ─────────────────────────────────────────────────────────
   The session names the account; nothing accepts a userId from outside. A
   selector that took one as a parameter would be a way to read someone else's
   portfolio by editing a link. */
const actorOf = (base, session) =>
  (session && session.authUserId ? base.usersById.get(session.authUserId) : null) || null;

/* ══ 1 · investor — inv.portfolio ══════════════════════════════════════════
   Scope is the signed-in account and nothing else. */

function selInvestedCapital(base, session) {
  const u = actorOf(base, session);
  if (!u) return undefined;
  const mine = (base.ordersByUser.get(u.id) || []).filter(o => COUNTED.has(o.status));
  return sumBaisa(mine, o => (o.allocated != null ? o.allocated : o.amount));
}

function selHoldingsByPool(base, session) {
  const u = actorOf(base, session);
  if (!u) return undefined;
  const byPool = new Map();
  (base.ordersByUser.get(u.id) || []).filter(o => COUNTED.has(o.status)).forEach(o => {
    const h = byPool.get(o.poolId) || { poolId: o.poolId, cost: 0, allocated: 0, orders: 0 };
    h.cost += o.amount;
    h.allocated += (o.allocated != null ? o.allocated : o.amount);
    h.orders += 1;
    byPool.set(o.poolId, h);
  });
  return [...byPool.values()].map(h => {
    const p = base.poolsById.get(h.poolId) || {};
    /* Units are cut at close, so they are priced by the rules in force then. */
    const s = base.settingsAt(p.fundedAt || p.publishedAt);
    const poolAllocated = sumBaisa(
      (base.ordersByPool.get(h.poolId) || []).filter(o => o.status === 'allocated'),
      o => (o.allocated != null ? o.allocated : o.amount));
    return {
      poolId: h.poolId, ref: p.ref || h.poolId, title: p.title || '', status: p.status || '',
      orders: h.orders, cost: h.cost, allocated: h.allocated,
      units: s.unitPrice ? Math.floor(h.allocated / s.unitPrice) : 0,
      sharesBps: bps(h.allocated, poolAllocated),
    };
  }).sort((a, b) => b.allocated - a.allocated);
}

function selDistributionsReceived(base, session) {
  const u = actorOf(base, session);
  if (!u) return undefined;
  const rows = (base.sharesByUser.get(u.id) || [])
    .slice().sort((a, b) => new Date(a.at) - new Date(b.at));
  return { total: sumBaisa(rows, r => r.amount), count: rows.length, timeline: rows };
}

function selCurrentValue(base, session) {
  const u = actorOf(base, session);
  if (!u) return undefined;
  const cost = selInvestedCapital(base, session);
  if (VALUATION_BASIS === 'COST_PLUS_DISTRIBUTIONS')
    return cost + selDistributionsReceived(base, session).total;
  if (VALUATION_BASIS === 'UNIT_PRICE')
    return sumBaisa(selHoldingsByPool(base, session),
      h => h.units * base.settingsAt((base.poolsById.get(h.poolId) || {}).fundedAt).unitPrice);
  return cost;
}

/* Under a cost basis the only honest return is cash actually received: there
   is no secondary market and no independent valuer, so any other figure is a
   claim rather than a fact. `basis` travels with the number so a screen can
   say which one it is showing. */
function selNetReturn(base, session) {
  const u = actorOf(base, session);
  if (!u) return undefined;
  const cost = selInvestedCapital(base, session);
  const received = selDistributionsReceived(base, session).total;
  const value = selCurrentValue(base, session);
  return {
    basis: VALUATION_BASIS,
    cost, received, value,
    gain: value + received - cost,
    bps: bps(value + received - cost, cost),
  };
}

/* The number that stops an investor typing a figure the engine will refuse.
   It belongs above the commitment form, not in the error after it. */
function selRemainingAllowance(base, session, p) {
  const u = actorOf(base, session);
  if (!u || u.role !== 'investor') return undefined;
  const caps = base.settings.limits[u.cls] || { perIssuer: null, rolling12m: null };
  const from = ALLOWANCE_WINDOW === 'ROLLING_12M' ? p.now - 365 * DAY
             : ALLOWANCE_WINDOW === 'CALENDAR_YEAR' ? Date.UTC(new Date(p.now).getUTCFullYear(), 0, 1)
             : -Infinity;
  const counted = (base.ordersByUser.get(u.id) || []).filter(o =>
    COUNTED.has(o.status) && new Date(o.createdAt).getTime() >= from);
  const used = sumBaisa(counted, o => o.amount);
  return {
    window: ALLOWANCE_WINDOW,
    cls: u.cls,
    cap: caps.rolling12m,
    used,
    /* null is "no published limit", which is not the same as nothing left. */
    remaining: caps.rolling12m == null ? null : Math.max(0, caps.rolling12m - used),
    perIssuerCap: caps.perIssuer,
    countedOrders: counted.length,
  };
}

function selCoolingOffState(base, session, p) {
  const u = actorOf(base, session);
  if (!u) return undefined;
  return (base.ordersByUser.get(u.id) || [])
    .filter(o => ['pending', 'confirmed'].includes(o.status))
    .map(o => {
      const s = base.settingsAt(o.createdAt);
      const cool = new Date(o.createdAt).getTime() + s.coolingOffHours * 3600000;
      const reopened = o.withdrawUntil ? new Date(o.withdrawUntil).getTime() : 0;
      const endsAt = Math.max(cool, reopened);
      return {
        orderId: o.id, poolId: o.poolId, amount: o.amount,
        active: endsAt > p.now, endsAt,
        reason: reopened > cool ? 'material_change' : 'cooling_off',
      };
    })
    .filter(x => x.active)
    .sort((a, b) => a.endsAt - b.endsAt);
}

/* ══ 2 · owner — own.project · own.funds ═══════════════════════════════════
   A pool the account does not own returns undefined, never zeros. */

function ownsPool(base, session, poolId) {
  const u = actorOf(base, session);
  if (!u || !poolId) return false;
  if (u.pool === poolId) return true;
  return base.state.applications.some(a => a.ownerId === u.id && a.poolId === poolId);
}

function selFundingProgress(base, session, p) {
  if (!ownsPool(base, session, p.poolId)) return undefined;
  const pl = base.poolsById.get(p.poolId);
  const s = base.settingsAt(pl.publishedAt);
  const raisedNow = sumBaisa(
    (base.ordersByPool.get(pl.id) || []).filter(o => COUNTED.has(o.status)), o => o.amount);
  const cap = ceilingOf(pl, s);
  return {
    raised: raisedNow, target: pl.target, minClose: pl.minClose,
    pctOfTarget: bps(raisedNow, pl.target),
    pctOfMinimum: bps(raisedNow, pl.minClose),
    overfundCap: cap,
    headroom: Math.max(0, cap - raisedNow),
    meetsMinimum: raisedNow >= pl.minClose,
    status: pl.status,
  };
}

function selInvestorCount(base, session, p) {
  if (!ownsPool(base, session, p.poolId)) return undefined;
  const live = (base.ordersByPool.get(p.poolId) || []).filter(o => COUNTED.has(o.status));
  return new Set(live.map(o => o.userId)).size;
}

function selTicketStats(base, session, p) {
  if (!ownsPool(base, session, p.poolId)) return undefined;
  const amounts = (base.ordersByPool.get(p.poolId) || [])
    .filter(o => COUNTED.has(o.status)).map(o => o.amount).sort((a, b) => a - b);
  if (!amounts.length)
    return { count: 0, avg: 0, median: 0, min: 0, max: 0, belowMinCount: 0 };
  const mid = Math.floor(amounts.length / 2);
  return {
    count: amounts.length,
    avg: Math.floor(sumBaisa(amounts) / amounts.length),
    /* Integer median: an even count averages the middle pair and floors, so
       the result stays a whole baisa like every other figure here. */
    median: amounts.length % 2 ? amounts[mid] : Math.floor((amounts[mid - 1] + amounts[mid]) / 2),
    min: amounts[0], max: amounts[amounts.length - 1],
    belowMinCount: amounts.filter(a => a < base.settings.minTicket).length,
  };
}

function selDisbursementLedger(base, session, p) {
  if (!ownsPool(base, session, p.poolId)) return undefined;
  const ds = base.disbursementsByPool.get(p.poolId) || [];
  const paid = sumBaisa(ds.filter(d => d.status === 'executed'), d => d.amount);
  const pl = base.poolsById.get(p.poolId) || { milestones: [] };
  const planned = sumBaisa(pl.milestones || [], m => m.amount);
  return {
    requested: sumBaisa(ds.filter(d => d.status === 'requested'), d => d.amount),
    paid,
    planned,
    remaining: Math.max(0, planned - paid),
    milestonesPaid: (pl.milestones || []).filter(m => m.state === 'executed').length,
    milestonesTotal: (pl.milestones || []).length,
  };
}

/* The escrow is reconciled for the whole platform, not per pool, so an
   owner-gated selector must not hand one owner the platform's figures. What
   an owner is owed is the fact — has the account holding their money been
   tied out against the partner, and for which period. The amounts, the
   unexplained differences and the name of whoever signed belong to
   selOpenVariances and the reconciliation screen, both behind funds.read.

   This is why the split is a privacy rule and not a caching one: the same
   BASE feeds both, and only the selector decides who may know what. */
function selReconciliationStatus(base, session, p) {
  if (!ownsPool(base, session, p.poolId)) return undefined;
  const all = base.state.reconciliations;
  const open = all.find(r => r.status !== 'signed') || null;
  const last = all.filter(r => r.status === 'signed').slice(-1)[0] || null;
  if (!open && !last) return { hasAny: false, isOpen: false, lastPeriod: null, signedAt: null };
  return {
    hasAny: true,
    isOpen: !!open,
    lastPeriod: last ? last.periodFrom + ' → ' + last.periodTo : null,
    signedAt: last ? last.signedAt : null,
  };
}

/* Fees, priced by the rules in force when the pool closed — never today's. */
function poolFees(base, pl) {
  const s = base.settingsAt(pl.fundedAt || pl.publishedAt);
  const allocated = sumBaisa(
    (base.ordersByPool.get(pl.id) || []).filter(o => o.status === 'allocated'),
    o => (o.allocated != null ? o.allocated : o.amount));
  const distributed = sumBaisa(base.distributionsByPool.get(pl.id) || [], d => d.gross);
  const disbursed = sumBaisa(
    (base.disbursementsByPool.get(pl.id) || []).filter(d => d.status === 'executed'), d => d.amount);
  /* Decision: the platform fee is charged once, on capital actually raised at
     close — which is exactly what the disclosure tells the investor. A pool
     that never closed has raised nothing to charge against. */
  const platformOn = PLATFORM_FEE_BASIS === 'DISBURSED' ? disbursed
                   : PLATFORM_FEE_BASIS === 'DISTRIBUTED' ? distributed
                   : allocated;
  /* Decision: success is charged only on what exceeds the capital returned.
     Charging a "success" fee before an investor is whole would not survive
     being read aloud. */
  const profit = Math.max(0, distributed - allocated);
  const successOn = SUCCESS_FEE_BASIS === 'GROSS_DISTRIBUTION' ? distributed : profit;
  return {
    poolId: pl.id, ref: pl.ref,
    allocated, distributed, disbursed, profit,
    platform: Math.floor((platformOn * s.feeBps.platform) / 10000),
    success: Math.floor((successOn * s.feeBps.success) / 10000),
    platformBasis: PLATFORM_FEE_BASIS, successBasis: SUCCESS_FEE_BASIS,
  };
}

function selFeesAccrued(base, session, p) {
  if (!ownsPool(base, session, p.poolId)) return undefined;
  return poolFees(base, base.poolsById.get(p.poolId));
}

/* ══ 3 · operations — ops.dash ═════════════════════════════════════════════
   Not a board of numbers: a work queue. */

const AGE_BANDS = [
  { k: 'fresh', label: 'أقل من 24 ساعة', maxDays: 1 },
  { k: 'days',  label: 'من 1 إلى 3 أيام', maxDays: 3 },
  { k: 'stale', label: 'أكثر من 3 أيام', maxDays: Infinity },
];
const ageDays = (iso, now) => Math.floor((now - new Date(iso).getTime()) / DAY);
const bandOf = d => (AGE_BANDS.find(b => d < b.maxDays) || AGE_BANDS[AGE_BANDS.length - 1]).k;

/* Only what this account can actually approve. The three second-party rules
   are applied by exclusion here, using the same predicates the actions refuse
   with — so nothing is offered that will be rejected on click. */
function selMyApprovalQueue(base, session, p) {
  const u = actorOf(base, session);
  if (!u) return undefined;
  const out = [];

  if (can(u, DUAL.disbursement.perm))
    base.state.disbursements
      .filter(d => dualOpen('disbursement', d, u.id))
      .forEach(d => out.push({
        kind: 'disbursement', id: d.id, act: 'approveDsb', dataKey: 'dsb',
        amount: d.amount, at: d.requestedAt,
        who: (base.usersById.get(d.requestedBy) || {}).name || '',
        what: 'صرف ' + ((base.poolsById.get(d.poolId) || {}).ref || d.poolId),
      }));

  if (can(u, DUAL.settingProposal.perm))
    base.state.settingProposals
      .filter(x => dualOpen('settingProposal', x, u.id))
      .forEach(x => out.push({
        kind: 'settingProposal', id: x.id, act: 'decideSetting', dataKey: 'id',
        amount: null, at: x.proposedAt,
        who: (base.usersById.get(x.proposedBy) || {}).name || '',
        what: 'تغيير إعداد ' + x.key,
      }));

  if (can(u, DUAL.reconciliation.perm))
    base.state.reconciliations
      .filter(r => dualOpen('reconciliation', r, u.id))
      .forEach(r => out.push({
        kind: 'reconciliation', id: r.id, act: 'signRecon', dataKey: 'rec',
        amount: r.closingBalance, at: r.preparedAt,
        who: (base.usersById.get(r.preparedBy) || {}).name || '',
        what: 'مطابقة ' + r.periodFrom + ' → ' + r.periodTo,
      }));

  return out
    .map(x => Object.assign(x, { ageDays: ageDays(x.at, p.now), band: bandOf(ageDays(x.at, p.now)) }))
    .sort((a, b) => b.ageDays - a.ageDays);
}

function selPendingDisbursements(base, session, p) {
  const u = actorOf(base, session);
  if (!can(u, 'funds.read')) return undefined;
  const rows = base.state.disbursements
    .filter(d => DUAL.disbursement.ready(d))
    .map(d => ({
      id: d.id, poolRef: (base.poolsById.get(d.poolId) || {}).ref || d.poolId,
      amount: d.amount, at: d.requestedAt, ageDays: ageDays(d.requestedAt, p.now),
      band: bandOf(ageDays(d.requestedAt, p.now)),
      requestedBy: (base.usersById.get(d.requestedBy) || {}).name || '',
      mine: d.requestedBy === (u || {}).id,
    }))
    .sort((a, b) => b.ageDays - a.ageDays);
  const byBand = {};
  AGE_BANDS.forEach(b => { byBand[b.k] = rows.filter(r => r.band === b.k).length; });
  return { rows, byBand, total: rows.length, amount: sumBaisa(rows, r => r.amount) };
}

function selKycQueue(base, session, p) {
  const u = actorOf(base, session);
  /* The work surface gates on the permission that can act, not the one that
     can look: a queue offered to someone who may only read is a list of other
     people's work with no button on it. */
  if (!can(u, 'kyc.approve')) return undefined;
  return base.state.users
    .filter(x => ['investor', 'owner'].includes(x.role) && x.kyc === 'pending')
    .map(x => ({
      id: x.id, name: x.name, role: x.role, cls: x.cls || null,
      claimedCls: x.claimedCls || null, suit: x.suit || null,
      at: x.createdAt || null,
      ageDays: x.createdAt ? ageDays(x.createdAt, p.now) : null,
    }))
    .sort((a, b) => (b.ageDays || 0) - (a.ageDays || 0));
}

/* Cases carry no severity field. What orders this queue is how far past its
   own SLA each case has run — computed here rather than indexed, because it
   moves with the clock and not with the state. */
function selOpenCases(base, session, p) {
  const u = actorOf(base, session);
  if (!can(u, 'case.work')) return undefined;
  const open = (base.casesByStatus.get('open') || [])
    .concat(base.casesByStatus.get('assigned') || []);
  const sev = filters => filters;
  return open
    .map(c => {
      const age = ageDays(c.openedAt, p.now);
      const over = age - c.slaDays;
      return {
        id: c.id, kind: c.kind, subject: c.subject, status: c.status,
        poolRef: (base.poolsById.get(c.poolId) || {}).ref || null,
        assignedTo: c.assignedTo ? ((base.usersById.get(c.assignedTo) || {}).name || '') : null,
        ageDays: age, slaDays: c.slaDays, overDays: over,
        breached: over > 0,
      };
    })
    .filter(c => !(p.filters && p.filters.breachedOnly) || c.breached)
    .sort((a, b) => b.overDays - a.overDays);
}

function selApplicationsUnderReview(base, session, p) {
  const u = actorOf(base, session);
  if (!can(u, 'application.review')) return undefined;
  return base.state.applications
    .filter(a => ['submitted', 'in_review', 'info_requested'].includes(a.status))
    .map(a => {
      const at = a.resubmittedAt || a.submittedAt;
      return {
        id: a.id, title: a.project.title, company: a.company.name,
        status: a.status, target: a.ask.target,
        at, ageDays: at ? ageDays(at, p.now) : null,
        complete: checkApplication(a).ok,
      };
    })
    .sort((a, b) => (b.ageDays || 0) - (a.ageDays || 0));
}

function selPendingSettingProposals(base, session, p) {
  const u = actorOf(base, session);
  if (!can(u, 'settings.read')) return undefined;
  return base.state.settingProposals
    .filter(x => DUAL.settingProposal.ready(x))
    .map(x => ({
      id: x.id, key: x.key, before: x.before, value: x.value,
      effectiveFrom: x.effectiveFrom, reason: x.reason,
      proposedBy: (base.usersById.get(x.proposedBy) || {}).name || '',
      at: x.proposedAt, ageDays: ageDays(x.proposedAt, p.now),
      mine: x.proposedBy === (u || {}).id,
    }))
    .sort((a, b) => b.ageDays - a.ageDays);
}

function selOpenVariances(base, session, p) {
  const u = actorOf(base, session);
  if (!can(u, 'funds.read')) return undefined;
  const out = [];
  base.state.reconciliations.filter(r => r.status !== 'signed').forEach(r => {
    (r.breaks || []).forEach(b => out.push({
      recId: r.id, id: b.id, side: b.side, ref: b.ref, amount: b.amount,
      what: b.what, kind: b.kind, explained: !!(b.kind && b.note),
      caseId: b.caseId || null,
    }));
  });
  return out.sort((a, b) => b.amount - a.amount);
}

/* ══ 4 · administration — ops.adash ════════════════════════════════════════ */

function selPlatformAum(base, session) {
  const u = actorOf(base, session);
  if (!can(u, 'dashboard.read')) return undefined;
  const m = moneyPosition();
  const held = sumBaisa(m.parts.filter(x => x.key === 'escrow' || x.key === 'funding'), x => x.value);
  return {
    held, total: m.total, distributed: m.distributed,
    spent: sumBaisa(m.parts.filter(x => x.key === 'spent'), x => x.value),
    overDisbursed: m.overDisbursed,
  };
}

function selActivePools(base, session) {
  const u = actorOf(base, session);
  if (!can(u, 'dashboard.read')) return undefined;
  const byStatus = {};
  base.state.pools.forEach(p => { byStatus[p.status] = (byStatus[p.status] || 0) + 1; });
  return {
    byStatus,
    open: base.state.pools.filter(p => p.status === 'funding').length,
    operating: base.state.pools.filter(p => ['funded', 'operating'].includes(p.status)).length,
    total: base.state.pools.length,
  };
}

function selActiveUsers(base, session, p) {
  const u = actorOf(base, session);
  if (!can(u, 'dashboard.read')) return undefined;
  const since = p.now - ACTIVE_WINDOW_DAYS * DAY;
  const members = base.state.users.filter(x => x.role !== 'staff');
  const active = members.filter(x => {
    if (ACTIVE_USER_BASIS === 'HOLDS_POSITION')
      return (base.ordersByUser.get(x.id) || []).some(o => COUNTED.has(o.status));
    if (ACTIVE_USER_BASIS === 'ACTED_30D')
      return base.state.audit.some(r => r.actor === x.id && new Date(r.at).getTime() >= since);
    return !!x.lastSignInAt && new Date(x.lastSignInAt).getTime() >= since;
  });
  return {
    basis: ACTIVE_USER_BASIS, windowDays: ACTIVE_WINDOW_DAYS,
    active: active.length, members: members.length,
    staff: base.state.users.filter(x => x.role === 'staff' && !x.suspended).length,
  };
}

function selFeeRevenue(base, session) {
  const u = actorOf(base, session);
  if (!can(u, 'dashboard.read')) return undefined;
  const rows = base.state.pools.map(pl => poolFees(base, pl));
  return {
    platform: sumBaisa(rows, r => r.platform),
    success: sumBaisa(rows, r => r.success),
    total: sumBaisa(rows, r => r.platform + r.success),
    platformBasis: PLATFORM_FEE_BASIS, successBasis: SUCCESS_FEE_BASIS,
    byPool: rows.filter(r => r.platform || r.success),
  };
}

function selConversionFunnel(base, session) {
  const u = actorOf(base, session);
  if (!can(u, 'dashboard.read')) return undefined;
  const investors = base.state.users.filter(x => x.role === 'investor');
  const kycOk = investors.filter(x => x.kyc === 'approved');
  const eligible = kycOk.filter(x => x.suit === 'pass' && x.consents);
  const committed = eligible.filter(x =>
    (base.ordersByUser.get(x.id) || []).some(o => COUNTED.has(o.status)));
  const stages = [
    { k: 'registered', label: 'مستثمرون مسجَّلون', value: investors.length },
    { k: 'kyc',        label: 'اكتمل التحقق',       value: kycOk.length },
    { k: 'eligible',   label: 'اجتازوا الملاءمة',   value: eligible.length },
    { k: 'committed',  label: 'أنشؤوا التزامًا',     value: committed.length },
  ];
  return stages.map((s, i) => Object.assign({}, s, {
    fromPrevBps: i ? bps(s.value, stages[i - 1].value) : 10000,
    fromBaseBps: bps(s.value, stages[0].value),
  }));
}

function selPoolHealth(base, session, p) {
  const u = actorOf(base, session);
  if (!can(u, 'dashboard.read')) return undefined;
  let onTarget = 0, behind = 0, closedUnderfunded = 0;
  base.state.pools.forEach(pl => {
    if (pl.status === 'refunding') { closedUnderfunded += 1; return; }
    if (pl.status !== 'funding') { onTarget += 1; return; }
    const got = sumBaisa((base.ordersByPool.get(pl.id) || []).filter(o => COUNTED.has(o.status)), o => o.amount);
    if (got >= pl.minClose) onTarget += 1; else behind += 1;
  });
  return { onTarget, behind, closedUnderfunded, total: base.state.pools.length };
}

/* The chain check is a first-class indicator, not a technical footnote: an
   FNV-1a chain breaks at any edited row and every row after it shows. Noticing
   that a week later is far worse than noticing it now.

   It walks the whole log, so it is deliberately lazy and cached apart from
   BASE — putting it there would rehash the entire audit on every action even
   when nobody has the administration screen open. */
let _integrity = { version: null, value: null };
function selAuditIntegrity(base, session) {
  const u = actorOf(base, session);
  if (!can(u, 'audit.read')) return undefined;
  if (_integrity.version !== base.version) {
    const r = auditIntegrity();
    const first = r.recomputed.concat(r.breaks).sort((a, b) => a - b)[0];
    _integrity = {
      version: base.version,
      value: { ok: r.intact, brokenAtIndex: first == null ? null : first, checkedCount: r.total },
    };
  }
  return _integrity.value;
}

function selActivityByType(base, session, p) {
  const u = actorOf(base, session);
  if (!can(u, 'audit.read')) return undefined;
  const days = (p.filters && p.filters.days) || 30;
  const start = p.now - (days - 1) * DAY;
  const series = [];
  for (let i = 0; i < days; i += 1) {
    const key = new Date(start + i * DAY).toISOString().slice(0, 10);
    series.push({ day: key, value: (base.auditByDay.get(key) || []).length });
  }
  const byAction = {};
  base.state.audit.forEach(r => {
    if (new Date(r.at).getTime() < start) return;
    byAction[r.action] = (byAction[r.action] || 0) + 1;
  });
  return {
    days, series,
    total: sumBaisa(series, s => s.value),
    byAction: Object.keys(byAction).map(k => ({ label: k, value: byAction[k] }))
      .sort((a, b) => b.value - a.value),
  };
}

/* ══ 5 · display components ════════════════════════════════════════════════
   The seeded database is small and most series will be nearly empty. A chart
   drawn from one point is not a trend, it is a number wearing a chart's
   clothes — and it reads as broken. The threshold lives here so it is one
   rule for every screen rather than a judgement call per card. */
const MIN_SERIES = 3;

const EMPTY_TEXT = {
  holdings:     'لا التزامات بعد — يظهر أول التزام هنا فور إنشائه.',
  distributions:'لا توزيعات بعد — تظهر هنا عند أول توزيع على المستثمرين.',
  queue:        'لا شيء ينتظرك — كل ما يخصّ صلاحياتك محسوم.',
  cases:        'لا حالات مفتوحة.',
  kyc:          'لا طلبات تحقق معلّقة.',
  variances:    'لا فروق مفتوحة في المطابقة.',
  series:       'لا نشاط في هذه الفترة.',
  proposals:    'لا اقتراحات إعدادات معلّقة.',
};

function emptyHtml(key) {
  return '<p class="empty">' + esc(EMPTY_TEXT[key] || 'لا بيانات بعد.') + '</p>';
}

/* undefined means the account may not know, so nothing is drawn — not even a
   frame. A drawn-but-empty card would answer a question it was not allowed to
   answer. */
function kpiCard(label, value, note) {
  if (value === undefined) return '';
  return '<div class="kv"><div class="kv__k">' + esc(label) + '</div>'
    + '<div class="kv__v">' + value + '</div>'
    + (note ? '<div class="xs muted">' + esc(note) + '</div>' : '') + '</div>';
}

/* Defers to barsHtml so there is one bar in the system, not two that drift. */
function hbarHtml(items, fmtValue) {
  if (!items || !items.length) return emptyHtml('series');
  return barsHtml(items, fmtValue);
}

/* Below MIN_SERIES points the component draws the number instead of the
   chart. Same call site, same data, honest picture. */
function seriesHtml(points, fmtValue, emptyKey) {
  const live = (points || []).filter(p => p.value > 0);
  if (!live.length) return emptyHtml(emptyKey || 'series');
  if (live.length < MIN_SERIES) {
    const last = live[live.length - 1];
    return '<div class="hero"><span class="hero__v">' + fmtValue(last.value) + '</span>'
      + '<span class="hero__k">' + esc(last.day || last.label || '')
      + ' · نقطة واحدة لا تصنع اتجاهًا، فالرقم أصدق من الرسم</span></div>';
  }
  return columnsSvg(points.map(p => ({ label: (p.day || p.label || '').slice(5), value: p.value, count: p.value })), fmtValue);
}

function queueHtml(rows, emptyKey, rowHtml) {
  if (rows === undefined) return '';
  if (!rows.length) return emptyHtml(emptyKey);
  return '<div class="exc">' + rows.map(rowHtml).join('') + '</div>';
}

function timelineHtml(items, emptyKey) {
  if (items === undefined) return '';
  if (!items || !items.length) return emptyHtml(emptyKey);
  return '<div class="tl">' + items.map(i =>
    '<div class="tl__item"><span class="tl__dot tl__dot--done"></span><div>'
    + '<div class="tl__t">' + esc(i.title) + '</div>'
    + '<div class="tl__d">' + dt(i.at, true) + '</div>'
    + (i.note ? '<p class="sm">' + esc(i.note) + '</p>' : '')
    + '</div></div>').join('') + '</div>';
}

/* ══════════════════════════════════════════════════════════════════════════

const WINDOWS = [[30, '30 يومًا'], [90, '90 يومًا'], [180, '6 أشهر'], [365, 'سنة']];

function band(n, title, sub, body, actions) {

    + '<div class="band__q"><span class="band__n">' + n + '</span>'

}

    + '</div>'

    + '</tbody></table></div></div></div>';

  const winPicker = '<span class="segsm">' + WINDOWS.map(w =>
    '<button data-act="setWin" data-win="' + w[0] + '" aria-pressed="' + (days === w[0]) + '">'
    + w[1] + '</button>').join('') + '</span>';


  return band('05', 'أين المال الآن؟', 'من إجمالي ' + omr0(money.total) + ' التزم بها المستثمرون', b2)
    + band('06', 'هل يتحرك التمويل؟', 'الداخل أسبوعيًا خلال الفترة المختارة', b3, winPicker)

/* ── ops · pipeline ───────────────────────────────────────────────────── */
/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  ops.dash — a work surface, not a board of numbers                       ║
   ╚══════════════════════════════════════════════════════════════════════════╝

   The question here is "what do I do now", and the unit is a thing that can
   be acted on. "How are things going" is a different question on a different
   horizon, and it lives on التحليلات.

   The governing rule: every row shown is actionable by this account at this
   moment. A row that is offered and then refused on click is a defect, not an
   error message — so the filtering happens in selMyApprovalQueue, using the
   same predicates the actions refuse with, before anything is drawn.
   ────────────────────────────────────────────────────────────────────────── */

/* Relative, because "منذ ٣ أيام" is the fact a queue is read for; the exact
   stamp is in the tooltip for whoever needs it. */
function agoAr(days) {
  if (days == null) return '—';
  if (days <= 0) return 'اليوم';
  if (days === 1) return 'أمس';
  if (days === 2) return 'منذ يومين';
  if (days <= 10) return 'منذ ' + days + ' أيام';
  return 'منذ ' + days + ' يومًا';
}

/* Which row is showing its reason box. One at a time, held here rather than in
   the DOM so a rebuild after any other action cannot strand a half-typed
   refusal in a row that no longer exists. */
let REJECTING = null;      // { kind, id } | null

/* Eight, not five: the row is 40px now rather than 62, so the same card
   height carries more of the queue before «عرض الكل» is needed. */
const QUEUE_CAP = 8;

/* undefined means this account may not know, so no card is drawn at all — not
   an empty one, which would answer a question it was not allowed to answer.
   An empty array is different: the card is drawn with its own written empty
   line, because a queue that disappears when it clears reads as a fault, and
   one that sits there empty reads as finished. */
function queueCard(o) {
  if (o.rows === undefined) return '';
  const rows = o.rows;
  const shown = rows.slice(0, QUEUE_CAP);
  return '<section class="card qcard' + (o.tone ? ' qcard--' + o.tone : '') + '">'
    + '<div class="card__head"><h2>' + esc(o.title) + '</h2>'
    + '<span class="chip' + (rows.length ? (o.tone === 'crit' ? ' chip--crit' : ' chip--warn') : ' chip--pos') + '">'
    + rows.length + '</span>'
    + (o.note ? '<span class="xs muted">' + esc(o.note) + '</span>' : '')
    + (o.actions ? '<span class="spacer">' + o.actions + '</span>' : '')
    + '</div>'
    + '<div class="card__body card__body--flush">'
    + (rows.length
        ? '<div class="qrows">' + shown.map(o.rowHtml).join('') + '</div>'
          + (rows.length > QUEUE_CAP
              ? '<a class="qmore" href="' + o.moreHref + '">عرض الكل (' + rows.length + ') ←</a>'
              : '')
        : '<p class="empty">' + esc(o.empty) + '</p>')
    + '</div></section>';
}

/* One row of the approval queue, and the inline refusal it can open. */
function approvalRow(x) {
  const open = REJECTING && REJECTING.kind === x.kind && REJECTING.id === x.id;
  const KIND_AR = { disbursement: 'صرف', settingProposal: 'إعداد', reconciliation: 'مطابقة' };
  return '<div class="qrow" id="rec-' + esc(x.id) + '">'
    + '<div class="qrow__main">'
    +   '<span class="chip chip--brand">' + esc(KIND_AR[x.kind] || x.kind) + '</span>'
    +   '<span class="qrow__what">' + esc(x.what) + '</span>'
    +   '<span class="qrow__who">' + esc(x.who) + '</span>'
    +   '<span class="qrow__age" title="' + esc(dt(x.at, true)) + '">' + esc(agoAr(x.ageDays)) + '</span>'
    +   '<span class="qrow__amt">' + (x.amount == null ? '—' : rial(x.amount)) + '</span>'
    + '</div>'
    + (open
        ? '<div class="qrow__reject">'
          + '<div class="field"><label for="rejWhy">سبب الرفض</label>'
          + '<textarea id="rejWhy" rows="2" placeholder="ما الذي يمنع اعتماد هذا، بعشرة أحرف على الأقل"></textarea></div>'
          + '<div class="row row--tight">'
          + '<button class="btn btn--sm btn--danger" data-act="doReject" data-kind="' + x.kind + '" data-id="' + esc(x.id) + '">تأكيد الرفض</button>'
          + '<button class="btn btn--sm" data-act="cancelReject">تراجع</button></div>'
          + '<p class="xs muted">السبب يدخل سجل التدقيق كما تكتبه — هو الجواب الوحيد لاحقًا على «لماذا لم يخرج هذا المال».</p>'
          + '</div>'
        : '<div class="row row--tight qrow__acts">'

          + '</div>')

}

/* Three numbers, deliberately not a chart: at this size a column plot carries
   less than the digits do, and the third bucket is the one that matters. */
function ageBuckets(byBand) {
  const cells = AGE_BANDS.map(b => {
    const n = byBand[b.k] || 0;
    const hot = b.k === 'stale' && n > 0;
    return '<div class="agecell' + (hot ? ' agecell--hot' : '') + '">'
      + '<div class="agecell__v">' + n + '</div>'
      + '<div class="agecell__k">' + esc(b.label) + '</div></div>';
  }).join('');
  return '<div class="agerow">' + cells + '</div>';
}

/* ══════════════════════════════════════════════════════════════════════════
   ops · the administration dashboard
   ══════════════════════════════════════════════════════════════════════════ */
/* ══════════════════════════════════════════════════════════════════════════
   ops · the administration dashboard

   Five questions, in the order an administrator is accountable for them.
   Operations asks where the money is; administration asks who can reach it,
   whether anyone can reach it alone, what changed while nobody was looking,
   and whether the record of who did what still hangs together.

   Two rules this screen keeps that the first version did not:

   Nothing is silently cut. The old list stopped at nine rows and said "and N
   more" with no way to reach them, so a finding could be computed, counted,
   and never seen. Every finding here is rendered; the filter is the reader's
   choice, not the screen's.

   Every row ends in the same place the fix does. Where the fix is one act —
   revoke, suspend, reactivate — the row carries the button, and it goes
   through the same commit(), the same assertPerm(), the same chained audit
   row as it would from any other screen. No new mutation exists for this
   dashboard: it gains the action without gaining a privilege.
   ══════════════════════════════════════════════════════════════════════════ */
const SEV_AR = { 3: ['crit', 'حرِج'], 2: ['warn', 'انتباه'], 1: ['', 'للعلم'] };

/* Where a finding is fixed. A control the account cannot use is not shown as
   a control — the reference is shown instead, so the row still identifies
   what it is talking about. */
function excTail(x, u) {
  if (x.act && can(u, x.act.perm)) {
    const attrs = Object.keys(x.act.d)
      .map(k => ' data-' + k + '="' + esc(x.act.d[k]) + '"').join('');
    return '<button class="btn btn--sm' + (x.act.danger ? ' btn--danger' : '')
      + '" data-act="' + x.act.a + '"' + attrs + '>' + esc(x.act.label) + '</button>';
  }
  /* The row names a record, so the link names it too: it opens the screen
     *and* the row, instead of leaving the reader to find again what this
     dashboard had already found for them. */
  if (x.view && canOpen(u, STAFF_NAV.find(n => n.k === x.view)))
    return '<a class="btn btn--sm btn--go" href="' + esc(hrefFor({ view: x.view, id: x.rec || null }))
      + '" aria-label="' + esc((x.rec ? 'افتح السطر' : 'افتح') + ' — ' + x.what) + '">'
      + '<span aria-hidden="true">←</span></a>';
  return '<span class="xs muted mono">' + esc(x.ref || '') + '</span>';
}
