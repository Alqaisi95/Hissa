/* ══════════════════════════════════════════════════════════════════════════
   APPLICATION SHELL — only reachable with an account
   ══════════════════════════════════════════════════════════════════════════ */
function appShell(u) {
  const nav = navFor(u);
  if (!nav.length) return lockedOut(u);
  /* resolveRoute() has already corrected an address this account cannot open;
     this only covers an account whose permissions opened nothing at all. */
  if (!nav.some(n => n.k === SESSION.view)) SESSION.view = nav[0].k;
  const view = VIEWS[SESSION.view]();

  /* "Read only" was the wrong word for it: everything works, it just never
     leaves this tab. On a plain static host that is the only mode there is. */
  const modeLabel = MODE === 'live' ? 'حيّ · يُحفظ للجميع'
                  : MODE === 'local' ? 'نسخة هذه الجلسة · لا تُحفظ للجميع' : 'جارٍ الاتصال…';
  const sub = u.role === 'investor' ? CLASS_AR[u.cls]
            : u.role === 'owner' ? 'صاحب مشروع'
            : JOB_AR[u.job] || 'فريق التشغيل';

  return riskbar()
  + '<header class="topbar">'
  +   '<div class="brand"><div class="brand__mark" aria-hidden="true">ح</div><div>'
  +     '<div class="brand__name">حِصّة</div>'
  +     '<div class="brand__sub">تمويل جماعي لمشاريع تشغيلية — سلطنة عُمان</div></div></div>'
  +   '<div class="spacer"></div>'
  +   '<div class="whoami"><div class="whoami__av" aria-hidden="true">' + esc(u.name.trim().charAt(0)) + '</div>'
  +     '<div><div class="whoami__n">' + esc(u.name) + '</div>'
  +     '<div class="whoami__r">' + esc(ROLE_AR[u.role]) + ' · ' + esc(sub) + '</div></div></div>'
  +   '<button class="iconbtn" data-act="theme">المظهر</button>'
  +   '<button class="iconbtn" data-act="logout">خروج</button>'
  + '</header>'
  + '<div class="layout">'
  +   '<nav class="side" aria-label="أقسام التطبيق">'
  +     navGroups(nav).map(g => '<div class="side__group">' + esc(g.g) + '</div>'
          + g.items.map(navLinkHtml).join('')).join('')
  +     '<div class="side__group">الحالة</div>'
  +     '<div class="savebar savebar--' + (MODE === 'live' ? 'live' : MODE === 'local' ? 'ro' : '') + '" style="padding:.4rem .6rem">'
  +       '<span class="savebar__dot" aria-hidden="true"></span><span>' + modeLabel + '</span></div>'
  /* Two different questions, so two lines: whether an action reaches anyone
     else, and whether the page opens at all without a network. */
  +     '<div class="savebar savebar--' + (OFFLINE === 'ready' ? 'live' : OFFLINE === 'arming' ? '' : 'ro')
  +       '" style="padding:.4rem .6rem">'
  +       '<span class="savebar__dot" aria-hidden="true"></span><span>'
  +       esc(OFFLINE_LABEL[OFFLINE] || OFFLINE_LABEL.none) + '</span></div>'
  +     (SW_WAITING
        ? '<div class="note note--info xs" style="margin:.5rem .2rem 0">صدرت نسخة أحدث من التطبيق. '
          + '<button class="linkbtn" data-act="applyUpdate">أعد التحميل لتطبيقها</button>'
          + '<div class="xs muted" style="margin-block-start:.2rem">لا تُطبَّق من تلقائها: '
          + 'القفز بالنسخة وأنت في منتصف نموذج ليس تحديثًا بل فقدان عمل.</div></div>'
        : '')
  +     (u.role === 'investor' && u.kyc !== 'approved'
        ? '<div class="note note--warn xs" style="margin:.5rem .2rem 0">تحققك قيد المراجعة. التصفح متاح، وإنشاء الالتزام لا.</div>' : '')
  +   '</nav>'
  /* A screen says whether its content is prose or a table; the shell does not
     guess. Only the two work surfaces claim the width today. */
  +   '<main class="main"><div class="main__inner' + (view.wide ? ' main__inner--wide' : '') + '">'
  +     '<div class="pagehead"><div class="pagehead__crumb">' + esc(view.crumb) + '</div>'
  +       '<h1 id="pagetitle" tabindex="-1"' + (view.hint ? ' title="' + esc(view.hint) + '"' : '')
  +         '>' + esc(view.title) + '</h1>'
  /* A work surface is opened many times a day and its lede is read once. A
     screen may hand its explanation to the heading as a hint instead of
     spending forty-eight pixels on it for ever. */
  +       (view.lede ? '<p class="pagehead__lede">' + view.lede + '</p>' : '') + '</div>'
  +     view.body
  +   '</div></main>'
  + '</div>'
  + tabbar(u, nav)
  + navSheet(u, nav, modeLabel);
}

/* ── the phone's navigation ────────────────────────────────────────────────
   Fifteen entries in a horizontal strip measured 2254px inside a 390px
   screen: two and a half of them were reachable without dragging, and the
   status panel sat behind all fifteen where nobody ever saw it.

   Four destinations within thumb reach, chosen by what this account can
   actually open, and everything else — including that status panel — one tap
   away in a sheet. */
function tabbar(u, nav) {
  const order = MOBILE_PRIMARY[u.role] || [];
  const open = nav.filter(n => n.k !== NAV_ACCOUNT.k);
  const primary = order.map(k => open.find(n => n.k === k)).filter(Boolean).slice(0, 4);
  if (primary.length < 4) open.forEach(n => {
    if (primary.length < 4 && !primary.includes(n)) primary.push(n);
  });
  const item = n => {
    const b = navBadge(n.k);
    return '<a class="tabbar__i" href="' + esc(hrefFor(n.k)) + '" data-view="' + n.k + '"'
      + (n.k === SESSION.view ? ' aria-current="page"' : '') + '>'
      + '<span class="tabbar__t">' + esc(n.short || n.label) + '</span>'
      + (b ? '<span class="tabbar__b">' + b + '</span>' : '') + '</a>';
  };
  return '<nav class="tabbar" aria-label="التنقّل السريع">'
    + primary.map(item).join('')
    + '<button class="tabbar__i" data-act="moreNav" aria-expanded="' + (NAVSHEET ? 'true' : 'false')
    + '" aria-controls="navsheet"><span class="tabbar__t">المزيد</span></button>'
    + '</nav>';
}

/* Everything the account opens, grouped and named in full — plus the two
   status lines, which on a phone had nowhere else to live. */
function navSheet(u, nav, modeLabel) {
  if (!NAVSHEET) return '';
  const groups = navGroups(nav);
  return '<div class="sheetback" data-act="moreNav"></div>'
    + '<div class="sheet" id="navsheet" role="dialog" aria-label="كل الشاشات">'
    + '<div class="sheet__grip" aria-hidden="true"></div>'
    + '<div class="sheet__head"><strong>' + esc(u.name) + '</strong>'
    + '<span class="xs muted spacer">' + esc(ROLE_AR[u.role]) + '</span>'
    + '<button class="btn btn--sm" data-act="moreNav">إغلاق</button></div>'
    + '<div class="sheet__body">'
    + groups.map(g => '<div class="side__group">' + esc(g.g) + '</div>'
        + g.items.map(navLinkHtml).join('')).join('')
    + '<div class="side__group">الحالة</div>'
    + '<div class="savebar savebar--' + (MODE === 'live' ? 'live' : MODE === 'local' ? 'ro' : '')
    + '" style="padding:.4rem .6rem"><span class="savebar__dot" aria-hidden="true"></span><span>'
    + modeLabel + '</span></div>'
    + '<div class="savebar savebar--' + (OFFLINE === 'ready' ? 'live' : OFFLINE === 'arming' ? '' : 'ro')
    + '" style="padding:.4rem .6rem"><span class="savebar__dot" aria-hidden="true"></span><span>'
    + esc(OFFLINE_LABEL[OFFLINE] || OFFLINE_LABEL.none) + '</span></div>'
    + '<div class="row" style="padding:.6rem .2rem 0">'
    + '<button class="iconbtn" data-act="theme">المظهر</button>'
    + '<button class="iconbtn" data-act="logout">خروج</button></div>'
    + '</div></div>';
}

/* A staff account with no permission at all still gets a real page, not a
   blank one — it says who to ask. */
function lockedOut(u) {
  return '<div class="pub authwrap"><div class="authcard">'
    + '<div class="authhead"><h1 id="pagetitle" tabindex="-1">لا صلاحيات مفعّلة</h1>'
    + '<p>حسابك «' + esc(u.name) + '» لا يحمل أي صلاحية تفتح شاشة. راجع مسؤول النظام لتفعيل صلاحياتك.</p></div>'
    + '<button class="btn" data-act="logout">تسجيل الخروج</button></div></div>';
}

/* ══ actions ═════════════════════════════════════════════════════════════ */
const ACTS = {
  /* ── auth ─────────────────────────────────────────────────────────── */
  pub:   d => setSession({ pub: d.pub }),
  logout: () => {
    REG = { step: 1, kind: 'investor', name: '', email: '', pw: '', cls: 'retail',
            answers: {}, consents: {}, otp: null, typed: '' };
    ENR = { step: 1, code: '', job: null, name: '', email: '', pw: '', otp: null, typed: '' };
    setSession({ authUserId: null, pub: 'landing', view: null });
  },
  quickLogin: d => {
    const u = user(d.user);
    if (!u) return;
    if (u.suspended) { toast('هذا الحساب موقوف.', 'bad'); return; }
    setSession({ authUserId: u.id, view: null, pub: 'landing' });
    toast('دخلت باسم ' + u.name + '.', 'good');
  },
  doLogin: async (d, el) => {
    const email = document.getElementById('lem').value.trim().toLowerCase();
    const pw = document.getElementById('lpw').value;
    const box = document.getElementById('lerr');
    const say = (m, kind) => { box.innerHTML = '<div class="note note--' + (kind || 'crit') + ' sm">' + esc(m) + '</div>'; };
    /* The counter is keyed by the e-mail typed, not by the account found, so
       the wait is identical whether or not that account exists. */
    const wait = signinWait(email);
    if (wait > 0) {
      say('محاولات كثيرة متتالية. انتظر ' + wait + ' ثانية ثم أعد المحاولة.', 'warn');
      return;
    }
    const miss = () => {
      const n = signinFailed(email);
      const next = signinWait(email);
      say('البريد أو كلمة المرور غير صحيحة.'
        + (next > 0 ? ' بعد ' + n + ' محاولات، المحاولة التالية بعد ' + next + ' ثانية.' : ''));
    };
    const u = STATE.users.find(x => (x.email || '').toLowerCase() === email);
    /* An erased account keeps no salt and no hash, so there is nothing to
       derive against. It fails the same way a wrong address does — the door
       is gone, and saying so would confirm the account once existed. */
    if (!u || !pw || !u.salt || !u.pw) { miss(); return; }
    el.disabled = true; el.textContent = 'جارٍ التحقق…';
    const got = await derive(pw, u.salt);
    el.disabled = false; el.textContent = 'دخول';
    /* same failure message whether the account exists or the password is wrong */
    if (!sameHash(got, u.pw)) { miss(); return; }
    if (u.suspended) {
      say('هذا الحساب موقوف. راجع مدير النظام.');
      return;
    }
    signinCleared(email);
    /* A shortcut from the home screen, or a link a colleague sent, put the
       destination in the address before the sign-in. Finish that trip rather
       than dropping them on the default screen and making them navigate. */
    const next = ROUTE.query.next ? parseHash(ROUTE.query.next) : null;
    SESSION.authUserId = u.id;
    try { localStorage.setItem('hissa.session', JSON.stringify({ authUserId: u.id })); } catch (e) {}
    if (next && VIEWS[next.view] && navFor(u).some(n => n.k === next.view)) navigate(next);
    else setSession({ view: null });
    toast('أهلًا ' + u.name + '.', 'good');
    /* Only where it persists. Without a writer there is nothing to record to,
       and committing would only fire the "this saves for nobody" warning at
       someone who has not yet done anything they expect to be saved. */
    if (WRITER) {
      /* The session is set first so the audit row carries the right actor. */
      await commit('تسجيل دخول', st => actRecordSignIn(st, u.id));
    }
  },

  /* ── the account's own password ───────────────────────────────────────── */
  changePw: async (d, el) => {
    const cur = document.getElementById('cpwCur').value;
    const nw  = document.getElementById('cpwNew').value;
    const ag  = document.getElementById('cpwAgain').value;
    const box = document.getElementById('cpwErr');
    const say = (m, kind) => { box.innerHTML = '<div class="note note--' + (kind || 'crit') + ' sm">' + esc(m) + '</div>'; };
    const u = me();
    const bad = pwProblem(nw, ag, cur);
    if (bad) { say(bad); return; }
    el.disabled = true; el.textContent = 'جارٍ التغيير…';
    const ok = sameHash(await derive(cur, u.salt), u.pw);
    if (!ok) { el.disabled = false; el.textContent = 'تغيير كلمة المرور'; say('كلمة المرور الحالية غير صحيحة.'); return; }
    const salt = newSalt();
    const hash = await derive(nw, salt);
    el.disabled = false; el.textContent = 'تغيير كلمة المرور';
    const done = await commit('تغيير كلمة المرور', st => actChangePassword(st, u.id, salt, hash));
    if (done) { box.innerHTML = ''; toast('غُيِّرت كلمة المرور. أي كود استرداد قائم لحسابك أُلغي.', 'good'); }
  },

  /* ── the three data-subject rights ────────────────────────────────────── */
  downloadMyData: async (d, el) => {
    const box = document.getElementById('pdErr');
    const say = (m, bad) => { if (box) box.innerHTML = '<div class="note note--'
      + (bad ? 'crit' : 'pos') + ' sm">' + esc(m) + '</div>'; };
    if (!SAVER) { say('حفظ الملفات غير متاح في هذا العرض.', true); return; }
    const data = personalData(SESSION.authUserId);
    if (!data) { say('تعذّر تجميع بياناتك.', true); return; }
    el.disabled = true;
    try {
      await SAVER.save({ filename: 'hissa-بياناتي-' + nowIso().slice(0, 10) + '.json',
        data: JSON.stringify(data, null, 2) });
      say('حُفظت نسخة كاملة من بياناتك.');
    } catch (err) {
      const code = err && err.code;
      say(code === 'declined' ? 'أُلغي الحفظ.' : 'تعذّر الحفظ في هذا العرض.', code !== 'declined');
    }
    el.disabled = false;
  },

  rectify: async (d, el) => {
    const name = document.getElementById('rcName').value;
    const email = document.getElementById('rcEmail').value;
    const pw = document.getElementById('rcPw').value;
    const box = document.getElementById('rcErr');
    const say = m => { box.innerHTML = '<div class="note note--crit sm">' + esc(m) + '</div>'; };
    const u = me();
    if (!pw) { say('أكّد بكلمة مرورك — البريد هو معرّفك عند الدخول.'); return; }
    el.disabled = true; el.textContent = 'جارٍ التحقق…';
    const ok = sameHash(await derive(pw, u.salt), u.pw);
    el.disabled = false; el.textContent = 'حفظ التصحيح';
    if (!ok) { say('كلمة المرور غير صحيحة.'); return; }
    const done = await commit('تصحيح بيانات حساب', st => actRectifyAccount(st, u.id, name, email));
    if (done) { box.innerHTML = ''; toast('صُحِّحت بياناتك.', 'good'); }
  },

  erasePerson: async d => {
    const ok = await commit('طمس بيانات شخصية',
      st => actErasePersonalData(st, d.user, SESSION.authUserId));
    if (ok) toast('طُمست البيانات الشخصية. سجلات المال وسلسلة التدقيق كما هي.', 'bad');
  },

  /* ── administrator-issued recovery ────────────────────────────────────── */
  issueReset: async d => {
    let code = null;
    const ok = await commit('إصدار كود استرداد', st => {
      const r = actIssueReset(st, d.user, SESSION.authUserId);
      code = r.entity;
      return r;
    });
    if (ok) toast('كود الاسترداد: ' + code + ' — صالح لمرة واحدة ولمدة '
      + RESET_TTL_HOURS + ' ساعة. سلّمه لصاحب الحساب مباشرة.', 'good');
  },
  revokeReset: async d => {
    const ok = await commit('إلغاء كود استرداد', st => actRevokeReset(st, d.code, SESSION.authUserId));
    if (ok) toast('أُلغي الكود.', 'bad');
  },
  doReset: async (d, el) => {
    const code  = document.getElementById('rscode').value;
    const email = document.getElementById('rsem').value;
    const nw    = document.getElementById('rspw').value;
    const ag    = document.getElementById('rspw2').value;
    const box   = document.getElementById('rserr');
    const say = m => { box.innerHTML = '<div class="note note--crit sm">' + esc(m) + '</div>'; };
    const bad = pwProblem(nw, ag);
    if (bad) { say(bad); return; }
    if (!code.trim() || !email.trim()) { say('اكتب الكود والبريد الإلكتروني.'); return; }
    el.disabled = true; el.textContent = 'جارٍ التعيين…';
    const salt = newSalt();
    const hash = await derive(nw, salt);
    el.disabled = false; el.textContent = 'تعيين كلمة المرور';
    const ok = await commit('استرداد كلمة المرور', st => actRedeemReset(st, code, email, salt, hash));
    if (ok) {
      signinCleared(email.trim().toLowerCase());
      box.innerHTML = '';
      setSession({ pub: 'login' });
      toast('عُيِّنت كلمة المرور. سجّل الدخول بها الآن.', 'good');
    }
  },

  /* ── registration ─────────────────────────────────────────────────── */
  regKind: d => { REG.kind = d.kind; render(); },
  regCls:  d => { REG.cls = d.cls; render(); },
  regAns:  d => { REG.answers[d.q] = Number(d.v); render(); },
  regBack: () => { if (REG.step > 1) REG.step -= 1; render(); },
  regNext: () => {
    const err = m => { const b = document.getElementById('rerr');
      if (b) b.innerHTML = '<div class="note note--crit sm">' + esc(m) + '</div>'; };

    if (REG.step === 2) {
      REG.name = document.getElementById('rname').value.trim();
      REG.email = document.getElementById('remail').value.trim().toLowerCase();
      const pw = document.getElementById('rpw').value, pw2 = document.getElementById('rpw2').value;
      if (REG.name.length < 3) return err('اكتب اسمك الكامل.');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(REG.email)) return err('بريد إلكتروني غير صالح.');
      if (STATE.users.some(u => (u.email || '').toLowerCase() === REG.email)) return err('هذا البريد مسجَّل بالفعل.');
      if (pw.length < 8) return err('كلمة المرور ثمانية أحرف على الأقل.');
      if (pw !== pw2) return err('كلمتا المرور غير متطابقتين.');
      REG.pw = pw;
    }
    if (REG.step === 3 && REG.kind === 'investor' && REG.cls !== 'retail') {
      const box = document.getElementById('rproof');
      if (box && !box.checked) return err('يلزم الإقرار باستيفاء شروط هذا الصنف.');
    }
    if (REG.step === 4 && REG.kind === 'investor') {
      if (Object.keys(REG.answers).length < SUIT_Q.length) return err('أجب عن كل الأسئلة.');
    }
    const consentStep = REG.kind === 'investor' ? 5 : 3;
    if (REG.step === consentStep) {
      document.querySelectorAll('.rc').forEach(c => { REG.consents[c.dataset.c] = c.checked; });
      if (!['terms', 'risk', 'privacy', 'nomarket'].every(k => REG.consents[k]))
        return err('يلزم قبول الموافقات الأربع صراحةً.');
      REG.otp = String(Math.floor(100000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 900000)));
    }
    REG.step += 1;
    render();
  },
  regFinish: async (d, el) => {
    const err = m => { const b = document.getElementById('rerr');
      if (b) b.innerHTML = '<div class="note note--crit sm">' + esc(m) + '</div>'; };
    REG.typed = document.getElementById('rotp').value.trim();
    if (REG.typed !== REG.otp) return err('الرمز غير صحيح.');

    el.disabled = true; el.textContent = 'جارٍ الإنشاء…';
    const salt = newSalt();
    const hash = await derive(REG.pw, salt);
    el.disabled = false;

    const score = Object.values(REG.answers).reduce((a, b) => a + b, 0);
    const id = 'u_new' + (STATE.users.length + 1);
    const ok = await commit('إنشاء حساب', st => {
      if (st.users.some(u => (u.email || '').toLowerCase() === REG.email))
        throw new Error('هذا البريد مسجَّل بالفعل.');
      const row = { id, name: REG.name, email: REG.email, salt, pw: hash,
                    role: REG.kind, consents: true, createdAt: nowIso() };
      if (REG.kind === 'investor') {
        /* A declared class is a claim, not a fact: it stays retail until
           compliance sees the evidence. */
        row.cls = 'retail';
        row.claimedCls = REG.cls;
        row.kyc = 'pending';
        row.suit = score >= SUIT_PASS ? 'pass' : 'restricted';
        row.suitScore = score;
      } else {
        row.pool = null;
        row.kyc = 'pending';
      }
      st.users.push(row);
      /* The identifier, not the e-mail: this row can never be rewritten, and a
   person who later asks for erasure would find their address preserved
   inside the one structure the system refuses to alter. */
      return { entity: id, actor: id, detail: 'حساب جديد (' + ROLE_AR[REG.kind] + ')' };
    });
    if (!ok) return;
    REG = { step: 1, kind: 'investor', name: '', email: '', pw: '', cls: 'retail',
            answers: {}, consents: {}, otp: null, typed: '' };
    setSession({ authUserId: id, view: null, pub: 'landing' });
    toast('أُنشئ حسابك. التحقق قيد المراجعة.', 'good');
  },

  /* ── disclosure amendments and the withdrawal right ────────────────── */
  amendDisclosure: async d => {
    const sum = document.getElementById('amsum');
    const mat = document.getElementById('ammat');
    const ok = await commit('تعديل إفصاح',
      st => actAmendDisclosure(st, d.pool, sum ? sum.value : '', mat && mat.checked, SESSION.authUserId));
    if (ok) toast(mat && mat.checked
      ? 'نُشرت نسخة جديدة وفُتح حق العدول للمستثمرين القائمين.'
      : 'نُشر التحديث — لم يُصنَّف جوهريًا فلم يُفتح حق عدول.', 'good');
  },
  withdrawOrder: async d => {
    const ok = await commit('عدول عن التزام', st => actWithdrawOrder(st, d.order, SESSION.authUserId));
    if (ok) toast('نُفِّذ العدول — يُسترد المبلغ عبر الشريك المرخّص.', 'good');
  },

  /* ── investor-raised cases ─────────────────────────────────────────── */
  caseKind: (d, el) => {
    const hint = document.getElementById('ckhint');
    const spec = CASE_KINDS.find(x => x.k === el.value);
    if (spec && hint) hint.textContent = spec.hint;
  },
  openCase: async () => {
    const err = m => { const b = document.getElementById('cerr');
      if (b) b.innerHTML = '<div class="note note--crit sm">' + esc(m) + '</div>'; };
    const kind = document.getElementById('ckind').value;
    const poolId = document.getElementById('cpool').value;
    const subject = document.getElementById('csubj').value;
    const body = document.getElementById('cbody').value;
    let failed = null;
    const ok = await commit('فتح طلب دعم', st => {
      try { return actOpenCase(st, kind, subject, body, poolId, SESSION.authUserId); }
      catch (e) { failed = e.message; throw e; }
    });
    if (!ok) { if (failed) err(failed); return; }
    const box = document.getElementById('cerr');
    if (box) box.innerHTML = '';
    toast('أُرسل طلبك وسُجِّل بمهلته.', 'good');
  },

  exportCsv: async (d, el) => {
    const spec = EXPORTS[d.set];
    const box = document.getElementById('experr');
    const say = (m, bad) => { if (box) box.innerHTML = '<div class="note note--'
      + (bad ? 'crit' : 'pos') + ' sm">' + esc(m) + '</div>'; };
    if (!spec || !SAVER) return;
    if (!can(me(), spec.perm)) { say('لا تملك صلاحية تصدير هذه البيانات.', true); return; }
    const { cols, rows } = spec.build();
    const csv = toCsv(cols, rows);
    const stamp = nowIso().slice(0, 10);
    const base = 'hissa-' + d.set + '-' + stamp;
    el.disabled = true;
    try {
      await SAVER.save({ filename: base + '.csv', data: csv });
      say('حُفظ ' + spec.label + ' — ' + rows.length + ' سطرًا.');
    } catch (err) {
      const code = err && err.code;
      if (code === 'extension_not_enabled') {
        /* csv is an extended type and may be off for this view; the same
           bytes are still readable as text. */
        try {
          await SAVER.save({ filename: base + '.txt', data: csv });
          say('لا يقبل هذا العرض ملفات CSV، فحُفظ المحتوى نفسه بصيغة نصية.');
        } catch (e2) {
          say(e2 && e2.code === 'declined' ? 'أُلغي الحفظ.' : 'تعذّر الحفظ.', e2 && e2.code !== 'declined');
        }
      } else if (code === 'declined') say('أُلغي الحفظ.');
      else if (code === 'rate_limited') say('نافذة حفظ مفتوحة بالفعل — أغلقها ثم أعد المحاولة.', true);
      else if (code === 'too_large') say('الملف أكبر من الحد المسموح.', true);
      else say('تعذّر الحفظ في هذا العرض.', true);
    }
    el.disabled = false;
  },

  /* ── monitoring ───────────────────────────────────────────────────── */
  publishReport: async d => {
    const ok = await commit('نشر تقرير', st => actPublishReport(st, d.report));
    if (ok) toast('نُشر التقرير — يراه المستثمرون المخصَّصون في هذه الفرصة.', 'good');
  },
  returnReport: async d => {
    const box = document.getElementById('rn_' + d.report);
    const ok = await commit('إعادة تقرير', st => actReturnReport(st, d.report, box ? box.value : '', SESSION.authUserId));
    if (ok) toast('أُعيد التقرير لصاحب المشروع مع السبب.', 'bad');
  },
  scheduleReport: async () => {
    const pid = document.getElementById('schpool').value;
    const per = document.getElementById('schper').value;
    const due = document.getElementById('schdue').value;
    const ok = await commit('جدولة تقرير', st => actScheduleReport(st, pid, per, due));
    if (ok) toast('جُدولت الفترة — تظهر لصاحب المشروع في شاشة التقارير.', 'good');
  },

  /* ── cases ────────────────────────────────────────────────────────── */
  takeCase: async d => {
    const ok = await commit('تولّي حالة', st => actTakeCase(st, d.case, SESSION.authUserId));
    if (ok) toast('تولّيت الحالة — صارت باسمك في السجل.', 'good');
  },
  noteCase: async d => {
    const box = document.getElementById('cn_' + d.case);
    const ok = await commit('ملاحظة على حالة',
      st => actNoteCase(st, d.case, box ? box.value : '', SESSION.authUserId));
    if (ok) toast('أُضيفت الملاحظة.', 'good');
  },
  resolveCase: async d => {
    const box = document.getElementById('cn_' + d.case);
    const ok = await commit('إغلاق حالة',
      st => actResolveCase(st, d.case, box ? box.value : '', SESSION.authUserId));
    if (ok) toast('أُغلقت الحالة.', 'good');
  },

  /* ── settings ─────────────────────────────────────────────────────── */
  openSetting: d => setSession({ settingKey: d.key || null }),
  proposeSetting: async d => {
    const f = SETTING_FIELDS.find(x => x.k === d.key);
    const raw = document.getElementById('setval').value;
    const eff = document.getElementById('seteff').value;
    const why = document.getElementById('setwhy').value;
    const value = parseSetting(f.kind, raw);
    if (raw.trim() !== '' && value == null) { toast('قيمة غير صالحة.', 'bad'); return; }
    const ok = await commit('اقتراح تغيير إعداد',
      st => actProposeSetting(st, d.key, value, why, eff, SESSION.authUserId));
    if (ok) { setSession({ settingKey: null }); toast('قُدِّم الاقتراح — يعتمده مدير آخر.', 'good'); }
  },
  decideSetting: async d => {
    /* Approval only. A refusal needs a reason, so it goes through askReject
       like every other refusal on the work surface. */
    const ok = await commit('اعتماد تغيير إعداد',
      st => actDecideSetting(st, d.id, true, SESSION.authUserId));
    if (ok) toast('نُفِّذ التغيير وسُجِّل في التاريخ.', 'good');
  },

  /* ── refusing something, with the reason attached ──────────────────────
     One row opens at a time, and the reason is read from the box inside that
     row. On failure the box stays open with the text still in it — a refused
     refusal that wiped what you typed would be the second insult. */
  askReject: d => { REJECTING = { kind: d.kind, id: d.id }; render(); },
  cancelReject: () => { REJECTING = null; render(); },
  doReject: async d => {
    const box = document.getElementById('rejWhy');
    const why = box ? box.value : '';
    const spec = {

      settingProposal: ['رفض تغيير إعداد',    st => actDecideSetting(st, d.id, false, SESSION.authUserId, why)],
    }[d.kind];
    if (!spec) return;
    const ok = await commit(spec[0], spec[1]);

    const st = inviteState(inv);
    if (st === 'used')    return err('هذا الكود استُخدم من قبل.');
    if (st === 'expired') return err('انتهت صلاحية هذا الكود — اطلب كودًا جديدًا.');

    render();

    const err = m => { const b = document.getElementById('eerr');

    ENR.name = document.getElementById('ename').value.trim();
    ENR.email = document.getElementById('eemail').value.trim().toLowerCase();
    const pw = document.getElementById('epw').value, pw2 = document.getElementById('epw2').value;
    if (ENR.name.length < 3) return err('اكتب اسمك الكامل.');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(ENR.email)) return err('بريد إلكتروني غير صالح.');
    if (STATE.users.some(u => (u.email || '').toLowerCase() === ENR.email)) return err('هذا البريد مسجَّل بالفعل.');
    if (pw.length < 8) return err('كلمة المرور ثمانية أحرف على الأقل.');
    if (pw !== pw2) return err('كلمتا المرور غير متطابقتين.');
    ENR.pw = pw;
    ENR.otp = String(Math.floor(100000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 900000)));

/* Amount fields retotal as you type — the balance rule is the whole point of
   these two steps, so it must not wait for a step change to show. */
document.addEventListener('input', e => {
  const t = e.target.closest('[data-live="uof"], [data-live="ms"], .a_live');
  if (!t) return;
  captureApp();
  const target = APP.ask.target;
  const uofT = sumBy(APP.uof, 'amount'), msT = sumBy(APP.milestones, 'amount');
  const sum = document.getElementById('uofSum');
  if (sum) sum.textContent = fmt(uofT, 0);
  const bal = document.getElementById('uofBal');
  if (bal) {
    const diff = target - uofT;
    bal.className = 'note note--' + (target && diff === 0 ? 'pos' : 'warn') + ' sm';
    bal.textContent = !target ? 'حدّد المبلغ المطلوب في الخطوة السابقة أولًا.'
      : diff === 0 ? 'المجموع يطابق المبلغ المطلوب بالضبط.'
      : diff > 0 ? 'ينقص ' + fmt(diff, 0) + ' ر.ع لتغطية المطلوب.'
                 : 'يزيد ' + fmt(-diff, 0) + ' ر.ع عن المطلوب.';
  }
  const mbal = document.getElementById('msBal');
  if (mbal) {
    const diff = uofT - msT;
    mbal.className = 'note note--' + (uofT && diff === 0 ? 'pos' : 'warn') + ' sm';
    mbal.textContent = 'مجموع المراحل ' + fmt(msT, 0) + ' مقابل استخدام الأموال ' + fmt(uofT, 0)
      + (diff === 0 && uofT ? ' — مطابق.' : ' — الفرق ' + fmt(Math.abs(diff), 0) + ' ر.ع.');
  }
});

/* Ticking a document or a declaration changes the readiness verdict, so the
   last step has to redraw — otherwise it keeps showing a stale count. */
document.addEventListener('change', e => {
  if (e.target.classList && (e.target.classList.contains('docchk') || e.target.classList.contains('declchk'))) {
    captureApp();
    const box = document.getElementById('appReady');
    if (box) box.innerHTML = readinessHtml();
    return;
  }
  const t = e.target.closest('[data-act]');
  if (!t || t.tagName !== 'SELECT') return;
  const fn = ACTS[t.dataset.act];
  if (fn) fn(t.dataset, t, e);
});

/* ══════════════════════════════════════════════════════════════════════════
   OFFLINE AND INSTALLABILITY

   A service worker needs two things this document does not always have: a
   top-level browsing context, and a same-origin script it is allowed to
   register. On the published share link the page runs inside a frame and
   there is no path on that origin to put a worker at — blob: and data: URLs
   are refused by the specification, and an iframed document is not
   installable. So registration is not attempted there, and the status line
   says which of the two the app is running as instead of implying an offline
   capability it does not have.

   The trigger is the manifest link, which only the static build writes. One
   code path, no injected script, nothing to keep in sync between the two
   copies.
   ══════════════════════════════════════════════════════════════════════════ */
const FRAMED = (() => { try { return window.top !== window.self; } catch (e) { return true; } })();
let OFFLINE = 'none';      // none | framed | unsupported | arming | ready | failed
let SW_WAITING = null;     // a newer worker, installed and waiting to take over
let SW_RELOADING = false;

const OFFLINE_LABEL = {
  ready:       'يعمل دون اتصال',
  arming:      'جارٍ تجهيز العمل دون اتصال…',
  framed:      'داخل إطار — لا عمل دون اتصال',
  unsupported: 'هذا المتصفح لا يدعم العمل دون اتصال',
  failed:      'تعذّر تجهيز العمل دون اتصال',
  none:        'يحتاج اتصالًا',
};

function offerUpdate(worker) {
  SW_WAITING = worker;
  render();
}

function armOffline() {
  /* No manifest means this is not the static build: nothing to register. */
  if (!document.querySelector('link[rel="manifest"]')) {
    OFFLINE = FRAMED ? 'framed' : 'none';
    return;
  }
  if (FRAMED) { OFFLINE = 'framed'; return; }
  if (!('serviceWorker' in navigator) || !window.isSecureContext) {
    OFFLINE = 'unsupported';
    return;
  }
  /* A controller already attached is the whole answer: this page is being
     served by the worker right now. Waiting for register() to resolve before
     saying so is wrong twice over — it is slower than the fact, and while
     offline the registration's update fetch may not settle at all, which left
     the status reading «جارٍ التجهيز» on a page that was demonstrably already
     working without a network. */
  OFFLINE = navigator.serviceWorker.controller ? 'ready' : 'arming';
  navigator.serviceWorker.register('./sw.js').then(reg => {
    if (navigator.serviceWorker.controller) OFFLINE = 'ready';
    if (reg.waiting) offerUpdate(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', () => {
        /* Only an update: with no controller yet this is the first install,
           and there is nothing for the reader to decide. */
        if (nw.state === 'installed' && navigator.serviceWorker.controller) offerUpdate(nw);
      });
    });
    render();
  }).catch(() => { OFFLINE = 'failed'; render(); });

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (SW_RELOADING) { location.reload(); return; }
    OFFLINE = 'ready';
    render();
  });

  addEventListener('online', () => toast('عاد الاتصال.', 'good'));
  addEventListener('offline', () => toast('انقطع الاتصال — التطبيق يعمل، وما تغيّره يبقى في هذا المتصفح.', 'bad'));
}

/* ══ boot ════════════════════════════════════════════════════════════════ */
try {
  const th = localStorage.getItem('hissa.theme');
  if (th) document.documentElement.setAttribute('data-theme', th);
} catch (e) {}

/* The address bar is the navigation: the back button, a pasted link, a
   home-screen shortcut and every nav anchor all arrive here. */
addEventListener('hashchange', () => { NAVSHEET = false; render(); });
/* A sheet that cannot be dismissed from the keyboard is a trap. */
addEventListener('keydown', e => {
  if (e.key === 'Escape' && NAVSHEET) { NAVSHEET = false; render(); }
});

render();
armOffline();

/* The writer resolves later, never during this first run, and may never
   resolve at all — the app is fully usable before it does. */
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('artifact').then(ns => {
    WRITER = ns;
    MODE = ns ? 'live' : 'local';
    render();
  }).catch(() => { MODE = 'local'; render(); });
  /* Saving resolves separately and may never resolve: the export panel
     renders disabled until it does, and stays disabled if it does not. */
  window.claude.use('downloads').then(ns => { SAVER = ns || false; render(); })
    .catch(() => { SAVER = false; render(); });
} else {
  MODE = 'local';
  SAVER = false;
  render();
}
})();
</script>

</body>
</html>
