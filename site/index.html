/* Apply a mutation, chain an audit entry, persist. Returns false if the
   mutation itself refused (a rule said no) — those never reach storage. */
async function commit(label, mutate) {
  const draft = JSON.parse(JSON.stringify(STATE));
  let entry;
  try {
    entry = mutate(draft);
  } catch (err) {
    toast(err.message || 'تعذّر تنفيذ الإجراء', 'bad');
    return false;
  }
  appendAudit(draft, Object.assign({ action: label }, entry || {}));
  /* After the audit row, so the version identifies a state the row is already
     part of. A refusal never reaches here, so a rejected action leaves the
     counter — and every cache keyed on it — untouched. */
  draft.version = (draft.version || 0) + 1;
  STATE = draft;
  render();

  if (!WRITER) {
    toast('نُفِّذ في هذه الجلسة فقط — لم يُحفظ للجميع', 'bad');
    return true;
  }
  try {
    await WRITER.publish(buildDoc(STATE));
    /* every open view, this one included, reloads to the new version */
  } catch (err) {
    const code = err && err.code;
    if (code === 'conflict') {
      toast('حفظ شخص آخر نسخة أحدث. ستُحمَّل نسختُه — أعد الإجراء عليها.', 'bad');
    } else if (code === 'not_granted' || code === 'not_writer') {
      MODE = 'local'; render();
      toast('لديك صلاحية قراءة فقط — الإجراء ظاهر لك ولا يُحفظ.', 'bad');
    } else {
      toast('تعذّر الحفظ: ' + (err && err.message ? err.message : 'خطأ غير معروف'), 'bad');
    }
  }
  return true;
}

/* ══ money: integer baisa throughout. 1 OMR = 1000 baisa, never a float. ══ */
const BAISA = 1000;
const omr = v => Math.round(v * BAISA);
function fmt(b, dec = 3) {
  if (b == null || Number.isNaN(b)) return '—';
  const neg = b < 0, abs = Math.abs(Math.trunc(b));
  const whole = (Math.floor(abs / BAISA)).toLocaleString('en-US');
  return (neg ? '-' : '') + (dec === 0 ? whole : whole + '.' + String(abs % BAISA).padStart(3, '0'));
}
const rial = (b, dec = 0) => fmt(b, dec) + ' ر.ع';
function parseOmr(text) {
  const s = String(text).trim().replace(/,/g, '');
  if (!/^\d+(\.\d{1,3})?$/.test(s)) return null;
  const [w, f = ''] = s.split('.');
  return Number(w) * BAISA + Number(f.padEnd(3, '0'));
}

/* Largest-remainder apportionment: the parts always sum to exactly `total`,
   so no baisa is invented or lost by rounding. */
function proRata(total, weights) {
  const sum = weights.reduce((a, b) => a + b, 0);
  if (sum <= 0) return weights.map(() => 0);
  const base = weights.map(w => Math.floor((total * w) / sum));
  let rem = total - base.reduce((a, b) => a + b, 0);
  const order = weights
    .map((w, i) => ({ i, r: total * w - Math.floor((total * w) / sum) * sum }))
    .sort((a, b) => b.r - a.r || a.i - b.i);
  for (const { i } of order) { if (rem <= 0) break; base[i] += 1; rem -= 1; }
  return base;
}

/* ══ ids, time, hashing ═══════════════════════════════════════════════════ */
const nowIso = () => new Date().toISOString();
/* Highest existing number plus one, never the count: the seeded cases start
   at 0004, so counting them handed the next one an id that already existed —
   and a duplicate id makes every find() by id return the wrong record. */
function nextId(list, prefix) {
  const year = new Date().getFullYear();
  let max = 0;
  list.forEach(x => {
    const m = String(x.id).match(new RegExp('^' + prefix + '-\\d{4}-(\\d+)$'));
    if (m) max = Math.max(max, Number(m[1]));
  });
  return prefix + '-' + year + '-' + String(max + 1).padStart(4, '0');
}
/* FNV-1a 64. Enough to make tampering with a log row visible; the server-side
   system chains SHA-256 instead. */
function h64(str) {
  const P = 0x100000001b3n, M = (1n << 64n) - 1n;
  let h = 0xcbf29ce484222325n;
  for (let i = 0; i < str.length; i += 1) { h ^= BigInt(str.charCodeAt(i)); h = (h * P) & M; }
  return h.toString(16).padStart(16, '0');
}
function appendAudit(st, entry) {
  const prev = st.audit.length ? st.audit[st.audit.length - 1].hash : '0'.repeat(16);
  /* `actor` may be supplied by the mutation: on self-registration there is
     no signed-in account yet, and the new account is the actor. */
  const row = Object.assign({ at: nowIso(), actor: SESSION.authUserId }, entry, { prev });
  row.hash = h64(prev + '|' + JSON.stringify(row));
  st.audit.push(row);
}

/* ══ derived reads ═══════════════════════════════════════════════════════ */
const COUNTED  = new Set(['pending', 'confirmed', 'allocated']);
const user  = id => STATE.users.find(u => u.id === id);
const pool  = id => STATE.pools.find(p => p.id === id);
const ordersOf = poolId => STATE.orders.filter(o => o.poolId === poolId);
const raised   = poolId => ordersOf(poolId).filter(o => COUNTED.has(o.status)).reduce((s, o) => s + o.amount, 0);
const allocatedOf = poolId => STATE.orders.filter(o => o.poolId === poolId && o.status === 'allocated');
const uofTotal = p => p.uof.reduce((s, u) => s + u.amount, 0);
/* `overfundBps` is the ceiling as a share of target, not the excess above it:
   12000 means the pool accepts up to 120% of target, never target plus 120%.
   The settings argument lets a screen price an old pool by the rules that were
   in force when it was published; omitted, it reads the current ones. */
const ceilingOf = (p, s) => Math.round((p.target * (s || STATE.settings).overfundBps) / 10000);

/* A rolling window, not a lifetime total. The setting is named `rolling12m`
   and the disclosure promises the investor a limit "خلال 12 شهرًا"; summing
   every commitment an account ever made contradicts both, and tightens
   silently as the account ages until an active investor is frozen out. Time
   is a parameter so this is testable. */
function rolling12m(userId, now) {
  const from = (now == null ? Date.now() : now) - 365 * DAY;
  return STATE.orders
    .filter(o => o.userId === userId && COUNTED.has(o.status)
              && new Date(o.createdAt).getTime() >= from)
    .reduce((s, o) => s + o.amount, 0);
}
function perIssuer(userId, poolId) {
  return STATE.orders.filter(o => o.userId === userId && o.poolId === poolId && COUNTED.has(o.status))
                     .reduce((s, o) => s + o.amount, 0);
}

/* ══ eligibility: every reason a commitment can be refused, in one place ══ */
function eligibility(u, p) {
  const blocks = [];
  if (!u) return { blocks: [['—', 'اختر مستثمرًا.']], available: 0 };
  if (u.kyc !== 'approved') blocks.push(['BR-009', 'يلزم اكتمال التحقق من الهوية قبل إنشاء أي التزام.']);
  if (u.suit === 'restricted') blocks.push(['FR-005', 'نتيجة اختبار الملاءمة لا تسمح بهذا النوع من الاستثمار.']);
  if (!u.consents) blocks.push(['FR-006', 'يلزم قبول الشروط وإفصاح المخاطر وسياسة الخصوصية.']);
  if (p.status !== 'funding') blocks.push(['FR-205', 'هذه الفرصة غير مفتوحة للاستثمار حاليًا.']);

  const caps = STATE.settings.limits[u.cls] || { perIssuer: null, rolling12m: null };
  const usedIssuer  = perIssuer(u.id, p.id);
  const usedRolling = rolling12m(u.id);
  const headIssuer  = caps.perIssuer  == null ? Infinity : Math.max(0, caps.perIssuer  - usedIssuer);
  const headRolling = caps.rolling12m == null ? Infinity : Math.max(0, caps.rolling12m - usedRolling);
  const poolLeft    = Math.max(0, ceilingOf(p) - raised(p.id));

  const raw = Math.min(headIssuer, headRolling, poolLeft);
  const available = Number.isFinite(raw) ? raw : poolLeft;

  let binding = 'سعة الفرصة', bindingId = 'BR-017';
  if (caps.perIssuer != null && headIssuer <= headRolling && headIssuer <= poolLeft) {
    binding = 'حدّك لكل متقدم تمويل'; bindingId = 'BR-003';
  } else if (caps.rolling12m != null && headRolling <= poolLeft) {
    binding = 'حدّك خلال 12 شهرًا'; bindingId = u.cls === 'angel' ? 'BR-005' : 'BR-004';
  }
  if (available <= 0 && !blocks.length) blocks.push([bindingId, 'بلغت الحد المتاح لك في هذه الفرصة.']);

  return { blocks, available, binding, bindingId, caps, usedIssuer, usedRolling, poolLeft };
}

/* ══ actions ═════════════════════════════════════════════════════════════ */
function actCreateOrder(st, userId, poolId, amount) {
  const u = STATE.users.find(x => x.id === userId), p = pool(poolId);
  const v = eligibility(u, p);
  if (v.blocks.length) throw new Error(v.blocks[0][1]);
  if (amount == null) throw new Error('مبلغ غير صالح.');
  if (amount < STATE.settings.minTicket) throw new Error('أقل من الحد الأدنى ' + rial(STATE.settings.minTicket) + '.');
  if (amount > v.available) throw new Error('يتجاوز المتاح لك (' + rial(v.available) + ') — القيد: ' + v.binding + '.');
  const id = nextId(st.orders, 'ORD');
  st.orders.push({ id, poolId, userId, amount, status: 'pending', createdAt: nowIso() });
  return { entity: id, detail: 'التزام بـ ' + rial(amount, 3) + ' في ' + p.ref };
}
/* Closing decides the pool's fate by the rule, not by anyone's discretion:
   below the minimum every baisa goes back; above the ceiling everyone is
   scaled down pro rata and a share that falls under the minimum ticket is
   refunded whole, its money redistributed. */
function actClosePool(st, poolId) {
  assertPerm('pool.manage');
  const p = st.pools.find(x => x.id === poolId);
  if (!p) throw new Error('فرصة غير موجودة.');
  if (p.status !== 'funding') throw new Error('لا تُغلق إلا فرصة مفتوحة للتمويل.');
  const live = st.orders.filter(o => o.poolId === poolId && COUNTED.has(o.status));
  const total = live.reduce((s, o) => s + o.amount, 0);

  if (total < p.minClose) {
    live.forEach(o => { o.status = 'refunded'; o.refundReason = 'target_not_reached'; });
    p.status = 'refunding';
    p.closedAt = nowIso();
    return { entity: p.ref, detail: 'لم يبلغ الحد الأدنى — استُرد ' + rial(total) + ' على ' + live.length + ' التزامًا' };
  }

  const ceiling = ceilingOf(p);
  if (total <= ceiling) {
    live.forEach(o => { o.status = 'allocated'; o.allocated = o.amount; });
  } else {
    let alloc = proRata(ceiling, live.map(o => o.amount));
    for (let pass = 0; pass < live.length; pass += 1) {
      const under = alloc.map((a, i) => ({ a, i })).filter(x => x.a > 0 && x.a < st.settings.minTicket);
      if (!under.length) break;
      under.forEach(x => { alloc[x.i] = 0; });
      const w = alloc.map((a, i) => (a > 0 ? live[i].amount : 0));
      if (w.every(x => x === 0)) break;
      alloc = proRata(ceiling, w);
    }
    live.forEach((o, i) => {
      const got = Math.min(alloc[i], o.amount);
      o.allocated = got;
      o.refunded = o.amount - got;
      o.status = got > 0 ? 'allocated' : 'refunded';
      if (got === 0) o.refundReason = 'allocation_remainder';
    });
  }
  p.status = 'funded';
  p.fundedAt = nowIso();
  const got = live.reduce((s, o) => s + (o.allocated || 0), 0);
  return { entity: p.ref, detail: 'أُغلقت على ' + rial(got) + ' موزعة على ' + live.filter(o => o.status === 'allocated').length + ' مستثمرًا' };
}

function actRequestDisbursement(st, poolId, milestoneId, amount, evidence, byUserId) {
  assertPerm('funds.request');
  if (!evidence || evidence.trim().length < 6) throw new Error('يلزم وصف الدليل المرفق قبل طلب الصرف.');
  const p = st.pools.find(x => x.id === poolId);
  const m = p.milestones.find(x => x.id === milestoneId);
  if (!m) throw new Error('مرحلة غير موجودة.');
  if (m.state !== 'pending') throw new Error('هذه المرحلة صُرفت أو قيد الصرف.');
  const id = nextId(st.disbursements, 'DSB');
  st.disbursements.push({ id, poolId, milestoneId, amount, status: 'requested',
    requestedBy: byUserId, requestedAt: nowIso(), approvedBy: null, approvedAt: null, evidence: evidence.trim() });
  m.state = 'requested';
  return { entity: id, detail: 'طلب صرف ' + rial(amount) + ' لمرحلة «' + m.label + '»' };
}

/* ══════════════════════════════════════════════════════════════════════════
   DUAL CONTROL — the second-party rules, written once

   Three places in this system refuse to let one person be both halves of a
   transaction. Each rule needs two readers: the action, which refuses, and the
   approval queue, which must not offer what the action will refuse. Written
   twice they drift, and the drift is silent — the queue keeps showing a row
   that fails the moment it is clicked, and nothing reports the mismatch.

   So each rule is a pair. `ready` is the state that makes a row actionable at
   all; `secondParty` is the rule itself. The action asserts both; the queue
   filters on both plus the permission.

   A fourth refusal exists — actIssueReset will not cut a recovery code for
   your own account — but it produces no queue: an administrator issues a code
   outright, and nothing waits on a second party. It stays a guard on the
   control in ops.admin, which is where it already is.
   ══════════════════════════════════════════════════════════════════════════ */
const DUAL = {
  disbursement: {
    perm: 'funds.approve',
    ready: d => d.status === 'requested',
    secondParty: (d, byId) => d.requestedBy !== byId,
    refusal: 'لا يعتمد الطلبَ من أنشأه — يلزم طرف ثانٍ.',
  },
  settingProposal: {
    perm: 'admin.users',
    ready: x => x.status === 'pending',
    secondParty: (x, byId) => x.proposedBy !== byId,
    refusal: 'لا يعتمد الاقتراحَ من اقترحه — يلزم مدير آخر.',
  },
  reconciliation: {
    perm: 'funds.reconcile',
    ready: r => r.status === 'prepared',
    secondParty: (r, byId) => r.preparedBy !== byId,
    refusal: 'أعددتَ هذه المطابقة بنفسك — لا توقّعها. يلزم طرف ثانٍ.',
  },
};
/* One row, one person: is this actionable by them right now? */
const dualOpen = (kind, row, byId) =>
  DUAL[kind].ready(row) && DUAL[kind].secondParty(row, byId);

/* Dual control is enforced per transaction, not per role: the same person may
   hold both permissions and still cannot approve what they requested. */
function actApproveDisbursement(st, dsbId, byUserId) {
  assertPerm('funds.approve');
  const d = st.disbursements.find(x => x.id === dsbId);
  if (!d) throw new Error('طلب غير موجود.');
  if (!DUAL.disbursement.ready(d)) throw new Error('هذا الطلب اعتُمد أو نُفِّذ.');
  if (!DUAL.disbursement.secondParty(d, byUserId)) throw new Error(DUAL.disbursement.refusal);
  d.status = 'executed';
  d.approvedBy = byUserId;
  d.approvedAt = nowIso();
  const p = st.pools.find(x => x.id === d.poolId);
  const m = p.milestones.find(x => x.id === d.milestoneId);
  if (m) m.state = 'executed';
  if (p.status === 'funded') p.status = 'operating';
  return { entity: dsbId, detail: 'اعتماد وصرف ' + rial(d.amount) + ' — طالب: ' + (user(d.requestedBy) || {}).name };
}

/* Refusing to release money is a decision, and until now the system had no
   way to record one. A request could be approved or left sitting; a reviewer
   who thought it wrong had nothing to press, and the audit log could never
   answer "why did this money not go out". That is the half of dual control
   that was missing — a second party who can only ever say yes is not a
   control, they are a delay.

   The milestone goes back to `pending`, because actRequestDisbursement
   refuses any milestone that is not — without this, a refused request would
   lock its milestone out of ever being requested again. */
function actRejectDisbursement(st, dsbId, reason, byUserId) {
  assertPerm('funds.approve');
  const d = st.disbursements.find(x => x.id === dsbId);
  if (!d) throw new Error('طلب غير موجود.');
  if (!DUAL.disbursement.ready(d)) throw new Error('هذا الطلب اعتُمد أو نُفِّذ.');
  /* The same second-party rule as approval: refusing your own request would
     let a requester quietly retract it with nobody else in the record. */
  if (!DUAL.disbursement.secondParty(d, byUserId))
    throw new Error('لا ترفض طلبًا أنشأته بنفسك — يلزم طرف ثانٍ.');
  if (!reason || reason.trim().length < 10)
    throw new Error('اكتب سبب الرفض — عشرة أحرف على الأقل، ويُقرأ في التدقيق.');
  d.status = 'rejected';
  d.rejectedBy = byUserId;
  d.rejectedAt = nowIso();
  d.rejectReason = reason.trim();
  const p = st.pools.find(x => x.id === d.poolId);
  const m = p ? (p.milestones || []).find(x => x.id === d.milestoneId) : null;
  if (m && m.state === 'requested') m.state = 'pending';
  return { entity: dsbId, detail: 'رفض صرف ' + rial(d.amount) + ' — طالبه '
    + ((user(d.requestedBy) || {}).name || d.requestedBy) + ' · السبب: ' + reason.trim() };
}

function actCreateDistribution(st, poolId, gross, period) {
  assertPerm('distribution.create');
  const p = st.pools.find(x => x.id === poolId);
  const holders = st.orders.filter(o => o.poolId === poolId && o.status === 'allocated');
  if (!holders.length) throw new Error('لا يوجد مستثمرون مخصَّصون في هذه الفرصة.');
  if (!gross || gross <= 0) throw new Error('مبلغ توزيع غير صالح.');
  const shares = proRata(gross, holders.map(o => o.allocated || o.amount));
  const id = nextId(st.distributions, 'DST');
  st.distributions.push({ id, poolId, period, gross, paidAt: nowIso(),
    shares: holders.map((o, i) => ({ userId: o.userId, orderId: o.id, amount: shares[i] })) });
  return { entity: id, detail: 'توزيع ' + rial(gross) + ' على ' + holders.length + ' مستثمرًا في ' + p.ref };
}

function actSubmitReport(st, reportId, kpis, narrative, variance) {
  const r = st.reports.find(x => x.id === reportId);
  if (!r) throw new Error('تقرير غير موجود.');
  if (!kpis.length) throw new Error('يلزم مؤشر واحد على الأقل.');
  if (narrative.trim().length < 20) throw new Error('السرد قصير جدًا — 20 حرفًا على الأقل.');
  if (/مضمون|ضمان العائد|بلا مخاطر/.test(narrative)) throw new Error('السرد يحتوي عبارة ضمان — غير مسموح.');
  r.kpis = kpis; r.narrative = narrative.trim(); r.variance = variance.trim();
  r.submittedAt = nowIso();
  r.status = new Date() > new Date(r.dueAt + 'T23:59:59Z') ? 'late' : 'submitted';
  return { entity: reportId, detail: 'تقديم تقرير ' + r.period + (r.status === 'late' ? ' (متأخر)' : '') };
}

function actPublishReport(st, reportId) {
  assertPerm('report.publish');
  const r = st.reports.find(x => x.id === reportId);
  if (!r) throw new Error('تقرير غير موجود.');
  if (!['submitted', 'late'].includes(r.status)) throw new Error('لا يُنشر إلا تقرير مُقدَّم.');
  r.status = 'published';
  r.publishedAt = nowIso();
  return { entity: reportId, detail: 'نشر تقرير ' + r.period + ' للمستثمرين' };
}


/* ══════════════════════════════════════════════════════════════════════════
   ORIGINATION — a project owner submits, a reviewer turns it into a pool.
   The rules below are what make the disclosure buildable at all: the money
   asked for must equal the money accounted for, and the money accounted for
   must equal the money released. Everything downstream — allocation, staged
   disbursement, reporting — assumes those three tie exactly.
   ══════════════════════════════════════════════════════════════════════════ */
const APP_STATUS = {
  draft:          ['مسودة',            ''],
  submitted:      ['مُقدَّم',           'chip--brand'],
  in_review:      ['قيد الفحص',        'chip--warn'],
  info_requested: ['بانتظار استكمال',  'chip--sand'],
  approved:       ['موافَق عليه',      'chip--pos'],
  published:      ['منشور كفرصة',      'chip--pos'],
  rejected:       ['مرفوض',            'chip--crit'],
};
const SECTORS = ['تجزئة وفروع', 'لوجستيات ومركبات', 'معدات إنتاج غذائي', 'رعاية صحية',
                 'خدمات مهنية', 'تعليم وتدريب', 'صناعات خفيفة', 'ضيافة ومطاعم'];
const GOVERNORATES = ['مسقط', 'ظفار', 'شمال الباطنة', 'جنوب الباطنة', 'الداخلية',
                      'شمال الشرقية', 'جنوب الشرقية', 'الظاهرة', 'البريمي', 'الوسطى', 'مسندم'];
const DOC_LIST = [
  ['cr',         'السجل التجاري ساري المفعول'],
  ['financials', 'قوائم مالية لآخر سنتين'],
  ['quotes',     'عروض أسعار المورّدين المذكورين'],
  ['lease',      'عقد الإيجار أو سند الموقع'],
  ['ids',        'هويات الملاك ومن يملك 25% فأكثر'],
];
/* Wording that promises a return is refused at the source, not edited later. */
const GUARANTEE_RE = /مضمون|ضمان العائد|بلا مخاطر|أرباح مؤكدة|عائد مؤكد|لا خسارة/;

const MIN_CLOSE_BPS   = 6000;   // the minimum close may not sit below 60% of target
const MIN_OWNER_BPS   = 1500;   // the owner carries at least 15% of total project cost
const MIN_RISKS       = 3;
const MIN_UOF_LINES   = 2;

const appsOf = ownerId => STATE.applications.filter(a => a.ownerId === ownerId);
const sumBy = (rows, k) => rows.reduce((s, r) => s + (Number(r[k]) || 0), 0);

/* One place that decides whether an application is complete. The wizard uses
   it per step and the reviewer sees the same verdicts — a submission can
   never be complete for one and incomplete for the other. */
function checkApplication(a) {
  const bad = [];
  const target = a.ask.target, minClose = a.ask.minClose, stake = a.fin.ownerStake;
  const uofTotal = sumBy(a.uof, 'amount');
  const msTotal  = sumBy(a.milestones, 'amount');

  if (!a.company.name || a.company.name.length < 4) bad.push(['المنشأة', 'اسم المنشأة ناقص.']);
  if (!/^\d{5,9}$/.test(String(a.company.cr || ''))) bad.push(['المنشأة', 'رقم السجل التجاري غير صالح.']);
  if (!a.company.governorate) bad.push(['المنشأة', 'اختر المحافظة.']);
  if (!a.project.title || a.project.title.length < 8) bad.push(['المشروع', 'عنوان المشروع قصير جدًا.']);
  if (!a.project.sector) bad.push(['المشروع', 'اختر القطاع.']);
  if (!a.project.summary || a.project.summary.length < 60)
    bad.push(['المشروع', 'الوصف 60 حرفًا على الأقل — ما هي التوسعة تحديدًا وأين.']);
  if (GUARANTEE_RE.test(a.project.summary || '')) bad.push(['المشروع', 'الوصف يحتوي عبارة ضمان عائد — غير مسموح.']);

  if (!target) bad.push(['التمويل', 'المبلغ المطلوب غير محدد.']);
  if (!minClose) bad.push(['التمويل', 'الحد الأدنى للإغلاق غير محدد.']);
  if (target && minClose >= target) bad.push(['التمويل', 'الحد الأدنى للإغلاق يجب أن يقل عن المبلغ المطلوب.']);
  if (target && minClose && minClose * 10000 < target * MIN_CLOSE_BPS)
    bad.push(['التمويل', 'الحد الأدنى للإغلاق لا يقل عن ' + (MIN_CLOSE_BPS / 100) + '% من المطلوب ('
      + fmt(Math.ceil((target * MIN_CLOSE_BPS) / 10000), 0) + ' ر.ع).']);
  if (target && stake && (stake * 10000) < (target + stake) * MIN_OWNER_BPS)
    bad.push(['التمويل', 'مساهمتك لا تقل عن ' + (MIN_OWNER_BPS / 100) + '% من إجمالي تكلفة المشروع.']);
  if (!stake) bad.push(['التمويل', 'مساهمتك في المشروع غير محددة.']);

  if (a.uof.length < MIN_UOF_LINES) bad.push(['استخدام الأموال', 'بندان على الأقل.']);
  a.uof.forEach((r, i) => {
    if (!r.item) bad.push(['استخدام الأموال', 'البند ' + (i + 1) + ': الوصف ناقص.']);
    if (!r.supplier) bad.push(['استخدام الأموال', 'البند ' + (i + 1) + ': المورّد ناقص.']);
    if (!r.quote) bad.push(['استخدام الأموال', 'البند ' + (i + 1) + ': مرجع عرض السعر ناقص.']);
    if (!r.amount) bad.push(['استخدام الأموال', 'البند ' + (i + 1) + ': المبلغ ناقص.']);
  });
  if (target && uofTotal !== target)
    bad.push(['استخدام الأموال', 'المجموع ' + fmt(uofTotal, 0) + ' لا يساوي المطلوب ' + fmt(target, 0)
      + ' — الفرق ' + fmt(Math.abs(target - uofTotal), 0) + ' ر.ع.']);

  if (!a.milestones.length) bad.push(['المراحل', 'مرحلة صرف واحدة على الأقل.']);
  a.milestones.forEach((m, i) => {
    if (!m.label) bad.push(['المراحل', 'المرحلة ' + (i + 1) + ': العنوان ناقص.']);
    if (!m.condition || m.condition.length < 8)
      bad.push(['المراحل', 'المرحلة ' + (i + 1) + ': شرط الصرف يجب أن يصف دليلًا يمكن التحقق منه.']);
    if (!m.amount) bad.push(['المراحل', 'المرحلة ' + (i + 1) + ': المبلغ ناقص.']);
  });
  if (uofTotal && msTotal !== uofTotal)
    bad.push(['المراحل', 'مجموع المراحل ' + fmt(msTotal, 0) + ' لا يساوي استخدام الأموال ' + fmt(uofTotal, 0) + ' ر.ع.']);

  const sc = a.scenarios;
  sc.forEach(x => {
    if (!x.yieldBps && x.yieldBps !== 0) bad.push(['السيناريوهات', 'عائد سيناريو «' + x.name + '» ناقص.']);
    if (!x.basis || x.basis.length < 15) bad.push(['السيناريوهات', 'فرضية سيناريو «' + x.name + '» ناقصة.']);
  });
  if (sc.every(x => x.yieldBps !== '' && x.yieldBps != null)) {
    const [c, b, o] = sc.map(x => Number(x.yieldBps));
    if (!(c < b && b < o)) bad.push(['السيناريوهات', 'يجب أن يكون المتحفظ أقل من الأساسي، والأساسي أقل من المتفائل.']);
  }

  const risks = a.risks.filter(r => r && r.trim().length >= 15);
  if (risks.length < MIN_RISKS) bad.push(['المخاطر', MIN_RISKS + ' مخاطر على الأقل، كل واحد جملة مفيدة.']);

  DOC_LIST.forEach(d => { if (!a.docs[d[0]]) bad.push(['المستندات', 'مطلوب: ' + d[1]]); });

  /* Only on a submitted application: the wizard draft has no owner yet. */
  if (a.ownerId) {
    const o = user(a.ownerId);
    if (!o) bad.push(['المنشأة', 'حساب مقدّم الطلب غير موجود.']);
    else if (o.kyc !== 'approved')
      bad.push(['المنشأة', 'تحقق هوية مقدّم الطلب لم يُعتمد بعد — يعتمده فريق الالتزام أولًا.']);
  }

  return { ok: bad.length === 0, bad, uofTotal, msTotal };
}

/* ── actions ─────────────────────────────────────────────────────────── */
function actSubmitApplication(st, draft, ownerId) {
  const v = checkApplication(draft);
  if (!v.ok) throw new Error(v.bad[0][0] + ': ' + v.bad[0][1]);
  const id = nextId(st.applications, 'APP');
  st.applications.push(Object.assign({}, JSON.parse(JSON.stringify(draft)), {
    id, ownerId, status: 'submitted', submittedAt: nowIso(), decidedAt: null, poolId: null, notes: [],
  }));
  return { entity: id, detail: 'تقديم طلب تمويل «' + draft.project.title + '» بمبلغ ' + rial(draft.ask.target) };
}

/* An application sent back for more information has to be able to come back.
   Amending keeps the same reference and its review history — the reviewer
   sees what changed against what they asked for. */
function actUpdateApplication(st, appId, draft, ownerId) {
  const a = st.applications.find(x => x.id === appId);
  if (!a) throw new Error('طلب غير موجود.');
  if (a.ownerId !== ownerId) throw new Error('هذا الطلب ليس لك.');
  if (!['info_requested', 'draft'].includes(a.status))
    throw new Error('لا يُعدَّل إلا طلب أُعيد لك للاستكمال.');
  const v = checkApplication(draft);
  if (!v.ok) throw new Error(v.bad[0][0] + ': ' + v.bad[0][1]);
  ['company', 'project', 'fin', 'ask', 'uof', 'milestones', 'scenarios', 'risks', 'docs', 'decls']
    .forEach(k => { a[k] = JSON.parse(JSON.stringify(draft[k])); });
  a.status = 'submitted';
  a.resubmittedAt = nowIso();
  a.notes.push({ at: nowIso(), by: ownerId, kind: 'resubmit', text: 'أُعيد التقديم بعد الاستكمال.' });
  return { entity: appId, detail: 'إعادة تقديم الطلب بعد الاستكمال' };
}

function actReviewApplication(st, appId, action, note, byUserId) {
  assertPerm('application.review');
  const a = st.applications.find(x => x.id === appId);
  if (!a) throw new Error('طلب غير موجود.');
  if (['published', 'rejected'].includes(a.status)) throw new Error('هذا الطلب محسوم.');

  if (action === 'start') {
    if (a.status !== 'submitted') throw new Error('لا يبدأ الفحص إلا على طلب مُقدَّم.');
    a.status = 'in_review';
    return { entity: appId, detail: 'بدء الفحص النافي للجهالة' };
  }
  if (action === 'info') {
    if (!note || note.trim().length < 10) throw new Error('اكتب ما المطلوب استكماله.');
    a.status = 'info_requested';
    a.notes.push({ at: nowIso(), by: byUserId, kind: 'info', text: note.trim() });
    return { entity: appId, detail: 'طلب استكمال معلومات' };
  }
  if (action === 'reject') {
    if (!note || note.trim().length < 10) throw new Error('اكتب سبب الرفض.');
    a.status = 'rejected';
    a.decidedAt = nowIso();
    a.notes.push({ at: nowIso(), by: byUserId, kind: 'reject', text: note.trim() });
    return { entity: appId, detail: 'رفض الطلب' };
  }
  if (action === 'approve') {
    const v = checkApplication(a);
    if (!v.ok) throw new Error('لا يُعتمد طلب ناقص: ' + v.bad[0][1]);
    a.status = 'approved';
    a.decidedAt = nowIso();
    if (note && note.trim()) a.notes.push({ at: nowIso(), by: byUserId, kind: 'approve', text: note.trim() });
    return { entity: appId, detail: 'موافقة اللجنة على الطلب' };
  }
  throw new Error('إجراء غير معروف.');
}

/* Publishing is a translation, not a new authoring step: everything the pool
   discloses comes from the approved application, so the owner cannot be shown
   one thing and the investor another. */
function actPublishApplication(st, appId) {
  assertPerm('application.review');
  const a = st.applications.find(x => x.id === appId);
  if (!a) throw new Error('طلب غير موجود.');
  if (a.status !== 'approved') throw new Error('لا يُنشر إلا طلب موافَق عليه.');
  const v = checkApplication(a);
  if (!v.ok) throw new Error('لا يُنشر طلب ناقص: ' + v.bad[0][1]);

  const seq = st.pools.length + 1;
  const poolId = 'p_app' + seq;
  const closes = new Date(Date.now() + 60 * 86400000).toISOString().slice(0, 10);
  st.pools.push({
    id: poolId,
    ref: 'POOL-' + new Date().getFullYear() + '-' + String(seq).padStart(4, '0'),
    status: 'funding',
    title: a.project.title,
    sector: a.project.sector,
    issuer: a.company.name,
    governorate: a.company.governorate,
    target: a.ask.target,
    minClose: a.ask.minClose,
    ownerStake: a.fin.ownerStake,
    tenorMonths: Number(a.project.tenorMonths) || 36,
    publishedAt: nowIso().slice(0, 10),
    closesAt: closes,
    disclosureVersion: 1,
    summary: a.project.summary,
    uof: a.uof.map(r => ({ item: r.item, supplier: r.supplier, amount: r.amount, quote: r.quote })),
    scenarios: a.scenarios.map(x => ({ name: x.name, yieldBps: Number(x.yieldBps), basis: x.basis })),
    milestones: a.milestones.map((m, i) => ({ id: 'm' + (i + 1), label: m.label,
      amount: m.amount, condition: m.condition, state: 'pending' })),
    risks: a.risks.filter(r => r && r.trim()),
    fromApplication: a.id,
  });
  a.status = 'published';
  a.poolId = poolId;
  const owner = st.users.find(u => u.id === a.ownerId);
  if (owner && !owner.pool) owner.pool = poolId;   // the owner's screens light up
  return { entity: poolId, detail: 'نشر «' + a.project.title + '» كفرصة مفتوحة للتمويل بمبلغ ' + rial(a.ask.target) };
}

/* ══════════════════════════════════════════════════════════════════════════
   CREDENTIALS
   PBKDF2-SHA256, 150k iterations, per-account salt — the same derivation the
   seeded accounts were built with. It needs a secure context (https, or
   localhost); without one the page falls back to a weak digest and says so,
   rather than silently pretending the check is strong.

   The derived hashes live inside this document, which anyone holding the link
   can read. That is fine for accounts that guard nothing real, and is exactly
   why the sign-up form tells you not to reuse a password that matters.
   ══════════════════════════════════════════════════════════════════════════ */
const SUBTLE = (typeof crypto !== 'undefined' && crypto.subtle && window.isSecureContext) ? crypto.subtle : null;
const PBKDF2_ROUNDS = 150000;

const toHex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
const fromHex = hex => new Uint8Array(hex.match(/../g).map(h => parseInt(h, 16)));

async function derive(password, saltHex) {
  if (!SUBTLE) return 'weak:' + h64(saltHex + '|' + password);
  const key = await SUBTLE.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await SUBTLE.deriveBits(
    { name: 'PBKDF2', salt: fromHex(saltHex), iterations: PBKDF2_ROUNDS, hash: 'SHA-256' }, key, 256);
  return toHex(bits);
}
function newSalt() {
  const b = new Uint8Array(16);
  (crypto.getRandomValues ? crypto : { getRandomValues: a => a }).getRandomValues(b);
  return toHex(b);
}
/* Constant-time-ish compare: never leak how much of the hash matched. */
function sameHash(a, b) {
  if (typeof a !== 'string' || typeof b !== 'string' || a.length !== b.length) return false;
  let diff = 0;
  for (let i = 0; i < a.length; i += 1) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
  return diff === 0;
}

/* ══ permissions ═════════════════════════════════════════════════════════ */
const JOB_AR = {
  finance_ops:   'عمليات مالية',
  portfolio_ops: 'متابعة المحفظة',
  compliance:    'الالتزام والتحقق',
  auditor:       'تدقيق مستقل',
  system_admin:  'إدارة النظام',
};
const CLASS_AR = { retail: 'أفراد', angel: 'ملائكي', sophisticated: 'متمرس' };
const ROLE_AR  = { investor: 'مستثمر', owner: 'صاحب مشروع', staff: 'فريق التشغيل' };

/* A hidden button is not a control. Every mutation that a permission is
   supposed to gate asserts it here, so the rule holds even if a screen forgets
   to hide the affordance or someone dispatches the action directly. */
function assertPerm(perm) {
  if (!can(me(), perm)) throw new Error('لا تملك صلاحية تنفيذ هذا الإجراء.');
}
function can(u, perm) {
  if (!u) return false;
  if (u.role === 'investor' || u.role === 'owner') return false;
  return (u.perms || []).includes(perm);
}
/* An investor's class decides which offers they may even see. */
function classAllowed(u, p) {
  if (!p.restrictedTo) return true;
  if (!u || u.role !== 'investor') return true;
  return p.restrictedTo.includes(u.cls);
}
function visiblePools(u) { return STATE.pools.filter(p => classAllowed(u, p)); }

/* ══════════════════════════════════════════════════════════════════════════
   MATERIAL CHANGE AND THE RIGHT TO WITHDRAW
   A published disclosure is never edited. A change creates the next version,
   and when that change is material every investor already committed to the
   pool gets a fresh window to walk away — including those past their normal
   cooling-off. The window is what makes "we amended it" fair rather than a
   change of terms after the fact.
   ══════════════════════════════════════════════════════════════════════════ */
function liveOrdersOf(st, poolId) {
  return st.orders.filter(o => o.poolId === poolId && ['pending', 'confirmed'].includes(o.status));
}
function withdrawOpenUntil(o) {
  const cool = new Date(new Date(o.createdAt).getTime() + STATE.settings.coolingOffHours * 3600000);
  const mat = o.withdrawUntil ? new Date(o.withdrawUntil) : null;
  const latest = mat && mat > cool ? mat : cool;
  return latest > new Date() ? latest : null;
}

function actAmendDisclosure(st, poolId, summary, material, byUserId) {
  assertPerm('pool.manage');
  const p = st.pools.find(x => x.id === poolId);
  if (!p) throw new Error('فرصة غير موجودة.');
  if (!['funding', 'funded', 'operating'].includes(p.status))
    throw new Error('لا تُعدَّل إفصاحات فرصة منتهية أو قيد الاسترداد.');
  if (!summary || summary.trim().length < 20)
    throw new Error('اكتب ما الذي تغيّر بدقة — يُعرض للمستثمر كما كتبته.');
  if (GUARANTEE_RE.test(summary)) throw new Error('النص يحتوي عبارة ضمان عائد — غير مسموح.');

  p.disclosureLog = p.disclosureLog || [];
  let reopened = 0;
  if (material) {
    p.disclosureVersion += 1;
    if (p.status === 'funding') {
      const until = new Date(Date.now() + st.settings.coolingOffHours * 3600000).toISOString();
      liveOrdersOf(st, poolId).forEach(o => { o.withdrawUntil = until; o.withdrawReason = 'material_change'; });
      reopened = liveOrdersOf(st, poolId).length;
    }
  }
  p.disclosureLog.push({
    version: p.disclosureVersion, at: nowIso(), by: byUserId,
    summary: summary.trim(), material: !!material, reopened,
  });
  return { entity: p.ref, detail: (material ? 'تغيير جوهري — نسخة الإفصاح v' + p.disclosureVersion
      + (reopened ? ' وفتح حق العدول لـ' + reopened + ' التزامًا' : '')
    : 'تحديث غير جوهري على إفصاح ' + p.ref) };
}

/* One exit, whichever right is open: the ordinary cooling-off, or a window a
   material change reopened. The reason is recorded so the log can tell them
   apart later. */
function actWithdrawOrder(st, orderId, byUserId) {
  const o = st.orders.find(x => x.id === orderId);
  if (!o) throw new Error('التزام غير موجود.');
  if (o.userId !== byUserId) throw new Error('هذا الالتزام ليس لك.');
  if (!['pending', 'confirmed'].includes(o.status)) throw new Error('لا يُلغى إلا التزام قائم.');
  const until = withdrawOpenUntil(o);
  if (!until) throw new Error('انتهت مهلة العدول لهذا الالتزام.');
  o.status = 'cancelled';
  o.cancelledAt = nowIso();
  o.refundReason = o.withdrawReason === 'material_change' ? 'material_change' : 'investor_cancellation';
  return { entity: orderId, detail: 'عدول عن ' + rial(o.amount, 3)
    + (o.withdrawReason === 'material_change' ? ' بعد تغيير جوهري في الإفصاح' : ' خلال مهلة العدول') };
}

/* ══════════════════════════════════════════════════════════════════════════
   INVESTOR-RAISED CASES
   The complaint route the platform is required to have, and the only way the
   case queue gets fed by real people rather than by seed data.
   ══════════════════════════════════════════════════════════════════════════ */
const CASE_KINDS = [
  { k: 'شكوى',      sla: 5,  hint: 'اعتراض على إجراء أو تأخير يخصّك' },
  { k: 'استفسار',   sla: 3,  hint: 'سؤال عن فرصة أو عن حسابك' },
  { k: 'طلب بيانات', sla: 30, hint: 'نسخة من بياناتك الشخصية أو تصحيحها أو حذفها' },
  /* كان هذا النوع مزروعًا في الحالة ومرفوضًا من actOpenCase في آن — الحالة
     CASE-2026-0006 كُتبت في الكتلة مباشرةً فمرّت. صار نوعًا حقيقيًّا يفتحه
     من يطابق حين يجد فرقًا لا يفسّره. */
  { k: 'مطابقة',    sla: 2,  hint: 'فرق بين كشف الشريك المرخّص وسجل المنصة' },
];
function actOpenCase(st, kind, subject, body, poolId, byUserId) {
  const spec = CASE_KINDS.find(x => x.k === kind);
  if (!spec) throw new Error('نوع غير معروف.');
  if (!subject || subject.trim().length < 6) throw new Error('اكتب موضوعًا واضحًا.');
  if (!body || body.trim().length < 20) throw new Error('اشرح طلبك في 20 حرفًا على الأقل.');
  const id = nextId(st.cases, 'CASE');
  st.cases.push({
    id, kind, subject: subject.trim(), poolId: poolId || null,
    status: 'open', openedAt: nowIso(), slaDays: spec.sla,
    raisedBy: byUserId, assignedTo: null,
    notes: [{ at: nowIso(), by: byUserId, kind: 'raise', text: body.trim() }],
  });
  return { entity: id, detail: kind + ': ' + subject.trim() };
}

/* ══════════════════════════════════════════════════════════════════════════
   MONITORING, CASES AND SETTINGS
   ══════════════════════════════════════════════════════════════════════════ */

/* A submitted report is not yet an investor-facing one. Monitoring reads it
   against the forecast the disclosure published, then publishes it or sends
   it back with a reason — the owner never edits a report after it is live. */
function actReturnReport(st, reportId, note, byUserId) {
  assertPerm('report.publish');
  const r = st.reports.find(x => x.id === reportId);
  if (!r) throw new Error('تقرير غير موجود.');
  if (!['submitted', 'late'].includes(r.status)) throw new Error('لا يُعاد إلا تقرير مُقدَّم.');
  if (!note || note.trim().length < 10) throw new Error('اكتب سبب الإعادة.');
  r.status = new Date() > new Date(r.dueAt + 'T23:59:59Z') ? 'late' : 'scheduled';
  r.returnedAt = nowIso();
  r.returnNote = note.trim();
  r.submittedAt = null;
  return { entity: reportId, detail: 'إعادة تقرير ' + r.period + ' لصاحب المشروع للتعديل' };
}

/* Reporting continues for the life of the project, so publishing one period
   schedules the next rather than leaving the duty to memory. */
function actScheduleReport(st, poolId, period, dueAt) {
  assertPerm('report.publish');
  const p = st.pools.find(x => x.id === poolId);
  if (!p) throw new Error('فرصة غير موجودة.');
  if (!period.trim()) throw new Error('اكتب اسم الفترة.');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(dueAt)) throw new Error('تاريخ استحقاق غير صالح.');
  if (st.reports.some(r => r.poolId === poolId && r.period === period.trim()))
    throw new Error('هذه الفترة مجدولة بالفعل.');
  const id = nextId(st.reports, 'RPT');
  st.reports.push({ id, poolId, period: period.trim(), dueAt, status: 'scheduled',
    submittedAt: null, publishedAt: null, kpis: [], narrative: '', variance: '' });
  return { entity: id, detail: 'جدولة تقرير ' + period.trim() + ' لـ' + p.ref };
}

/* ── cases ─────────────────────────────────────────────────────────────
   A complaint has an owner and a clock. Unassigned work is nobody's work,
   so taking a case is an explicit act and is recorded. */
const CASE_STATUS = {
  open:     ['مفتوحة',    'chip--warn'],
  assigned: ['قيد المعالجة', 'chip--brand'],

function actTakeCase(st, caseId, byUserId) {

  c.assignedTo = byUserId;
  c.status = 'assigned';
  (c.notes = c.notes || []).push({ at: nowIso(), by: byUserId, text: 'تولّى المعالجة.' });
  return { entity: caseId, detail: 'تولّي الحالة ' + caseId };
}
function actNoteCase(st, caseId, note, byUserId) {
  assertPerm('case.work');
  const c = st.cases.find(x => x.id === caseId);
  if (!c) throw new Error('حالة غير موجودة.');
  if (!note || note.trim().length < 5) throw new Error('اكتب الملاحظة.');
  (c.notes = c.notes || []).push({ at: nowIso(), by: byUserId, text: note.trim() });
  return { entity: caseId, detail: 'ملاحظة على الحالة ' + caseId };
}
function actResolveCase(st, caseId, note, byUserId) {
  assertPerm('case.work');
  const c = st.cases.find(x => x.id === caseId);

  if (c.status === 'resolved') throw new Error('مغلقة بالفعل.');

}

/* ── settings ──────────────────────────────────────────────────────────
   Limits, fees and windows are dated rows changed through an approval path,
   never constants edited in a deploy. The same dual control applies: the
   administrator who proposes a change is not the one who enacts it. */
const SETTING_FIELDS = [
  { k: 'minTicket',       label: 'الحد الأدنى للاستثمار',      kind: 'money' },
  { k: 'unitPrice',       label: 'قيمة الوحدة',                 kind: 'money' },
  { k: 'overfundBps',     label: 'سقف الاكتتاب فوق الهدف',      kind: 'bps' },
  { k: 'coolingOffHours', label: 'مهلة العدول (ساعة)',          kind: 'int' },
  { k: 'retail.perIssuer',   label: 'أفراد — لكل متقدم تمويل',  kind: 'money' },
  { k: 'retail.rolling12m',  label: 'أفراد — خلال 12 شهرًا',    kind: 'money' },
  { k: 'angel.rolling12m',   label: 'ملائكي — خلال 12 شهرًا',   kind: 'money' },
  { k: 'feeBps.platform', label: 'رسم المنصة',                  kind: 'bps' },
  { k: 'feeBps.success',  label: 'رسم النجاح',                  kind: 'bps' },
];
function settingGet(st, key) {
  const s = st.settings;
  if (key.startsWith('retail.') || key.startsWith('angel.') || key.startsWith('sophisticated.')) {
    const [cls, f] = key.split('.');
    return s.limits[cls][f];
  }
  if (key.startsWith('feeBps.')) return s.feeBps[key.split('.')[1]];
  return s[key];
}
function settingSet(st, key, value) {
  const s = st.settings;
  if (key.startsWith('retail.') || key.startsWith('angel.') || key.startsWith('sophisticated.')) {
    const [cls, f] = key.split('.');
    s.limits[cls][f] = value;
    return;
  }
  if (key.startsWith('feeBps.')) { s.feeBps[key.split('.')[1]] = value; return; }
  s[key] = value;
}
function fmtSetting(kind, v) {
  if (v == null) return 'بلا حدّ منشور';
  if (kind === 'money') return fmt(v, 0) + ' ر.ع';
  if (kind === 'bps') return (v / 100).toFixed(2) + '%';
  return String(v);
}
function parseSetting(kind, text) {
  const t = String(text).trim();
  if (t === '' || t === '—') return null;
  if (kind === 'money') return parseOmr(t);
  if (kind === 'bps') return /^\d+(\.\d+)?$/.test(t) ? Math.round(Number(t) * 100) : null;
  return /^\d+$/.test(t) ? Number(t) : null;
}

function actProposeSetting(st, key, value, reason, effectiveFrom, byUserId) {
  assertPerm('admin.users');
  const field = SETTING_FIELDS.find(f => f.k === key);
  if (!field) throw new Error('إعداد غير معروف.');
  if (!reason || reason.trim().length < 10) throw new Error('اكتب مبرر التغيير — يُقرأ في التدقيق.');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(effectiveFrom)) throw new Error('تاريخ نفاذ غير صالح.');
  const before = settingGet(st, key);
  if (before === value) throw new Error('القيمة الجديدة تساوي الحالية.');
  if (st.settingProposals.some(x => x.key === key && x.status === 'pending'))
    throw new Error('يوجد اقتراح معلّق لهذا الإعداد.');
  const id = nextId(st.settingProposals, 'SET');
  st.settingProposals.push({ id, key, before, value, reason: reason.trim(), effectiveFrom,
    status: 'pending', proposedBy: byUserId, proposedAt: nowIso(), decidedBy: null, decidedAt: null });
  return { entity: id, detail: 'اقتراح تغيير «' + field.label + '» من '
    + fmtSetting(field.kind, before) + ' إلى ' + fmtSetting(field.kind, value) };
}
function actDecideSetting(st, id, approve, byUserId, reason) {
  assertPerm('admin.users');
  const pr = st.settingProposals.find(x => x.id === id);
  if (!pr) throw new Error('اقتراح غير موجود.');
  if (!DUAL.settingProposal.ready(pr)) throw new Error('هذا الاقتراح محسوم.');
  if (!DUAL.settingProposal.secondParty(pr, byUserId)) throw new Error(DUAL.settingProposal.refusal);
  const field = SETTING_FIELDS.find(f => f.k === pr.key);
  /* An approval carries its justification already — the proposer wrote it and
     it lands in settingsHistory. A refusal carried nothing, so the record said
     a change was rejected and never why, which is the half a later reader
     needs most. */
  if (!approve && (!reason || reason.trim().length < 10))
    throw new Error('اكتب سبب الرفض — عشرة أحرف على الأقل، ويُقرأ في التدقيق.');
  pr.status = approve ? 'approved' : 'rejected';
  pr.decidedBy = byUserId;
  pr.decidedAt = nowIso();
  if (!approve) pr.decidedReason = reason.trim();
  if (approve) {
    st.settingsHistory.push({ key: pr.key, before: pr.before, after: pr.value,
      effectiveFrom: pr.effectiveFrom, reason: pr.reason,
      proposedBy: pr.proposedBy, approvedBy: byUserId, at: nowIso() });
    settingSet(st, pr.key, pr.value);
    st.settings.effectiveFrom = pr.effectiveFrom;
  }
  return { entity: id, detail: (approve ? 'اعتماد' : 'رفض') + ' تغيير «' + (field ? field.label : pr.key)
    + '» — اقترحه ' + ((user(pr.proposedBy) || {}).name || pr.proposedBy)
    + (approve ? '' : ' · السبب: ' + reason.trim()) };
}

/* ══════════════════════════════════════════════════════════════════════════
   STAFF ENROLMENT
   Staff and administrators are never self-declared. Public sign-up creates
   investors and project owners only; a staff account exists because an
   administrator issued a single-use invitation that already carries the job
   and its permissions. The code is what grants them — the person being
   enrolled cannot choose or edit either.
   ══════════════════════════════════════════════════════════════════════════ */
const STAFF_JOBS = [
  { k: 'finance_ops',   perms: ['funds.request', 'funds.approve', 'funds.read', 'funds.reconcile',
                                'audit.read', 'dashboard.read'] },
  { k: 'portfolio_ops', perms: ['pool.manage', 'report.publish', 'distribution.create', 'funds.read',
                                'audit.read', 'dashboard.read', 'application.review'] },
  { k: 'compliance',    perms: ['kyc.read', 'kyc.approve', 'audit.read', 'dashboard.read', 'application.read'] },
  { k: 'auditor',       perms: ['audit.read', 'funds.read', 'dashboard.read', 'application.read'] },
  { k: 'system_admin',  perms: ['admin.users', 'admin.enrol', 'settings.read', 'audit.read', 'dashboard.read'] },
];
const INVITE_TTL_DAYS = 7;
const DORMANT_DAYS = 60;
/* A privileged account made this recently and not yet used is ordinary; past
   it, "never used" stops being a pending arrival and becomes a loose key. */
const NEVER_USED_DAYS = 14;

/* Ambiguous glyphs left out on purpose: a code gets read aloud and retyped. */
const CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newCode() {
  const b = new Uint8Array(12);
  crypto.getRandomValues(b);
  const raw = [...b].map(x => CODE_ALPHABET[x % CODE_ALPHABET.length]).join('');
  return raw.slice(0, 4) + '-' + raw.slice(4, 8) + '-' + raw.slice(8, 12);
}
function inviteState(inv) {
  if (inv.usedBy) return 'used';
  if (inv.revokedAt) return 'revoked';
  if (Date.now() > new Date(inv.expiresAt).getTime()) return 'expired';
  return 'open';
}
const INVITE_STATE = {
  open:    ['صالح',    'chip--pos'],
  used:    ['استُخدم', ''],
  expired: ['منتهٍ',   'chip--warn'],
  revoked: ['مُلغى',   'chip--crit'],
};

function actIssueInvite(st, job, note, byUserId) {
  assertPerm('admin.enrol');
  const spec = STAFF_JOBS.find(j => j.k === job);
  if (!spec) throw new Error('وظيفة غير معروفة.');
  const code = newCode();
  st.invites.push({
    code, job, perms: spec.perms.slice(), note: (note || '').trim(),
    issuedBy: byUserId, issuedAt: nowIso(),
    expiresAt: new Date(Date.now() + INVITE_TTL_DAYS * 86400000).toISOString(),
    usedBy: null, usedAt: null, revokedAt: null,
  });
  return { entity: code, detail: 'إصدار كود دعوة لوظيفة ' + (JOB_AR[job] || job) };
}
function actRevokeInvite(st, code, byUserId) {
  assertPerm('admin.enrol');
  const inv = st.invites.find(x => x.code === code);
  if (!inv) throw new Error('كود غير موجود.');
  if (inv.usedBy) throw new Error('لا يُلغى كود استُخدم بالفعل.');
  inv.revokedAt = nowIso();
  return { entity: code, detail: 'إلغاء كود دعوة' };
}

/* The invitation, not the form, decides the job and the permissions. */
function actEnrolStaff(st, code, name, email, salt, pw) {
  const inv = st.invites.find(x => x.code === code.trim().toUpperCase());
  if (!inv) throw new Error('كود الدعوة غير صحيح.');
  const state = inviteState(inv);
  if (state === 'used')    throw new Error('هذا الكود استُخدم من قبل.');
  if (state === 'expired') throw new Error('انتهت صلاحية هذا الكود — اطلب كودًا جديدًا.');
  if (state === 'revoked') throw new Error('أُلغي هذا الكود.');
  if (st.users.some(u => (u.email || '').toLowerCase() === email))
    throw new Error('هذا البريد مسجَّل بالفعل.');
  const id = 'u_stf' + (st.users.length + 1);
  st.users.push({ id, name, email, salt, pw, role: 'staff',
    job: inv.job, perms: inv.perms.slice(), enrolledVia: inv.code, createdAt: nowIso() });
  inv.usedBy = id;
  inv.usedAt = nowIso();
  return { entity: id, actor: id,
    detail: 'انضمام موظف بوظيفة ' + (JOB_AR[inv.job] || inv.job) + ' بكود ' + inv.code };
}

/* ══════════════════════════════════════════════════════════════════════════
   THE ACCOUNT LIFECYCLE

   A system could create accounts, sign them in and suspend them, and had
   nothing in between: no one could change a password, and anyone who lost
   one was finished. What follows closes that, and does it the same way staff
   enrolment already works — a one-time code an administrator hands over,
   never a mail-out this platform has no way to send.
   ══════════════════════════════════════════════════════════════════════════ */
const RESET_TTL_HOURS = 48;
const PW_MIN = 8;

/* One rule, four places: registration, enrolment, change and reset all call
   this, so a password that is refused in one is refused in every other. */
function pwProblem(pw, again, current) {
  if (!pw || pw.length < PW_MIN) return 'كلمة المرور ' + PW_MIN + ' أحرف على الأقل.';
  if (again != null && pw !== again) return 'كلمتا المرور غير متطابقتين.';
  if (current != null && pw === current) return 'اختر كلمة مرور مختلفة عن الحالية.';
  return null;
}

function resetState(r) {
  if (r.usedAt) return 'used';
  if (r.revokedAt) return 'revoked';
  if (Date.now() > new Date(r.expiresAt).getTime()) return 'expired';
  return 'open';
}
const RESET_STATE = {
  open:    ['صالح',    'chip--pos'],
  used:    ['استُخدم', ''],
  expired: ['منتهٍ',   'chip--warn'],
  revoked: ['مُلغى',   'chip--crit'],
};

/* Any outstanding code stops being valid the moment the password moves —
   otherwise a code issued last week still opens an account whose owner has
   since taken it back. */
function killOpenResets(st, userId, why) {
  st.resets.filter(r => r.userId === userId && resetState(r) === 'open')
    .forEach(r => { r.revokedAt = nowIso(); r.revokedReason = why; });
}

/* The account changes its own password. The current one is verified in the
   handler, where hashing can await; by the time this runs it is established. */
function actChangePassword(st, userId, salt, hash) {
  const u = st.users.find(x => x.id === userId);
  if (!u) throw new Error('حساب غير موجود.');
  u.salt = salt; u.pw = hash; u.pwChangedAt = nowIso();
  killOpenResets(st, userId, 'غيّر صاحب الحساب كلمة المرور');
  return { entity: u.id, detail: 'تغيير كلمة المرور — ' + u.name };
}

function actIssueReset(st, targetId, byUserId) {
  assertPerm('admin.users');
  const t = st.users.find(x => x.id === targetId);
  if (!t) throw new Error('حساب غير موجود.');
  /* Not for yourself: you are signed in, so «حسابي» already does it, and a
     self-issued code is one more way in that nobody else witnessed. */
  if (targetId === byUserId) throw new Error('لا تُصدر كودًا لنفسك — غيّر كلمة مرورك من «حسابي».');
  killOpenResets(st, targetId, 'أُصدر كود أحدث');
  const code = newCode();
  st.resets.push({ code, userId: targetId, issuedBy: byUserId, issuedAt: nowIso(),
    expiresAt: new Date(Date.now() + RESET_TTL_HOURS * 3600000).toISOString(),
    usedAt: null, revokedAt: null, revokedReason: null });
  return { entity: code, detail: 'إصدار كود استرداد لحساب ' + t.name };
}

function actRevokeReset(st, code, byUserId) {
  assertPerm('admin.users');
  const r = st.resets.find(x => x.code === code);
  if (!r) throw new Error('كود غير موجود.');
  if (r.usedAt) throw new Error('لا يُلغى كود استُخدم بالفعل.');
  r.revokedAt = nowIso();
  r.revokedReason = 'ألغاه مدير النظام';
  return { entity: code, detail: 'إلغاء كود استرداد' };
}

/* Redeemed from the public site by whoever holds the code. The e-mail has to
   match the account the code was cut for: the code alone is one secret, and
   one secret handed over in a corridor is not enough to reopen an account. */
function actRedeemReset(st, code, email, salt, hash) {
  const r = st.resets.find(x => x.code === String(code).trim().toUpperCase());
  const state = r && resetState(r);
  const u = r && st.users.find(x => x.id === r.userId);
  /* One message for "no such code", "revoked", "wrong account" and "the
     account is gone". Telling the two apart would confirm to whoever holds a
     code that it is a live one, and let them hunt for the address it belongs
     to. Expired and already-used stay distinct: you cannot reach either
     without a code that was genuinely cut, and both need a different remedy. */
  const wrong = () => { throw new Error('كود الاسترداد لا يطابق هذا البريد، أو لم يعد صالحًا.'); };
  if (!r || state === 'revoked' || !u) wrong();
  if (state === 'used')    throw new Error('هذا الكود استُخدم من قبل.');
  if (state === 'expired') throw new Error('انتهت صلاحية هذا الكود — اطلب كودًا جديدًا من مدير النظام.');
  if ((u.email || '').toLowerCase() !== String(email).trim().toLowerCase()) wrong();
  /* A suspended account does not come back through this door. */
  if (u.suspended) throw new Error('هذا الحساب موقوف. راجع مدير النظام.');
  u.salt = salt; u.pw = hash; u.pwChangedAt = nowIso();
  r.usedAt = nowIso();
  return { entity: u.id, actor: u.id, detail: 'استرداد كلمة المرور بكود — ' + u.name };
}

function actRecordSignIn(st, userId) {
  const u = st.users.find(x => x.id === userId);
  if (!u) throw new Error('حساب غير موجود.');
  u.lastSignInAt = nowIso();
  return { entity: u.id, detail: 'تسجيل دخول — ' + u.name };
}

/* ── slowing down the person at the keyboard ──────────────────────────────
   This lives in the browser, not in the document. Recording failures in the
   shared state would hand any anonymous visitor a write, and would let one
   person lock another out of their account by typing the wrong password.
   What it buys is real but narrow, and the UI says so rather than implying
   the account is guarded: the published document carries every salt and
   hash, so an attacker working offline is bounded by PBKDF2's cost, not by
   any counter kept here. */
const SIGNIN_KEY = 'hissa.signin';
const BACKOFF_S  = [0, 0, 0, 5, 15, 60, 180, 300];
function signinRead() {
  try { return JSON.parse(localStorage.getItem(SIGNIN_KEY)) || {}; } catch (e) { return {}; }
}
function signinWrite(v) {
  try { localStorage.setItem(SIGNIN_KEY, JSON.stringify(v)); } catch (e) { /* blocked storage */ }
}
function signinWait(email) {
  const rec = signinRead()[String(email).toLowerCase()];
  if (!rec) return 0;
  const wait = BACKOFF_S[Math.min(rec.n, BACKOFF_S.length - 1)] * 1000;
  return Math.max(0, Math.ceil((rec.at + wait - Date.now()) / 1000));
}
function signinFailed(email) {
  const all = signinRead(), k = String(email).toLowerCase();
  all[k] = { n: ((all[k] || {}).n || 0) + 1, at: Date.now() };
  signinWrite(all);
  return all[k].n;
}
function signinCleared(email) {
  const all = signinRead();
  delete all[String(email).toLowerCase()];
  signinWrite(all);
}

/* ══════════════════════════════════════════════════════════════════════════
   حقوق صاحب البيانات — DATA SUBJECT RIGHTS

   The support screen has always offered «طلب بيانات» with a thirty-day
   window and the words "a copy of your personal data, or its correction, or
   its deletion". The footer cites the Personal Data Protection Law, and the
   sign-up form asks you to consent under it. Nothing implemented any of the
   three. A promise with no machine behind it is worse than no promise.

   Three rights, and one of them cannot mean what its name says:

   ACCESS      everything held about a person, gathered and downloadable.
   RECTIFY     the person corrects their own name and e-mail.
   ERASE       redaction, not deletion — and the screen says so.

   Erasure is where an honest system has to refuse the easy answer. A
   commitment, an allocation and a disbursement are a financial record; the
   audit chain is what makes them provable. Deleting rows would destroy the
   evidence that the money was handled correctly — including the evidence
   that protects the very person asking. So erasure redacts the identifiers
   that make a row personal and leaves the money and the chain standing.
   ══════════════════════════════════════════════════════════════════════════ */

/* Everything the document holds about one person, in one place. The
   credential material is deliberately absent: a salt and a hash are not
   facts about a person that they can act on, and putting them in a file
   that leaves the screen is a hazard, not transparency. */
function personalData(userId) {
  const u = STATE.users.find(x => x.id === userId);
  if (!u) return null;
  const account = {};
  Object.keys(u).forEach(k => {
    if (k === 'salt' || k === 'pw') return;    // never, not even to its owner
    account[k] = u[k];
  });

  const orders = STATE.orders.filter(o => o.userId === userId);
  const shares = [];
  STATE.distributions.forEach(d => (d.shares || [])
    .filter(s => s.userId === userId)
    .forEach(s => shares.push({ distribution: d.id, period: d.period,
      paidAt: d.paidAt, amount: s.amount, orderId: s.orderId })));

  return {
    generatedAt: nowIso(),
    subject: userId,
    account,
    orders,
    distributionShares: shares,
    cases: STATE.cases.filter(c => c.raisedBy === userId),
    applications: STATE.applications.filter(a => a.ownerId === userId),
    /* Rows the person caused or that name them. The chain is append-only, so
       this is a read of the record, never a rewrite of it. */
    auditRows: STATE.audit.filter(r => r.actor === userId || r.entity === userId),
    notIncluded: ['ملح كلمة المرور وتجزئتها — لا تُصدَّر لأحد، ولا لصاحبها'],
  };
}

/* The person corrects their own record. The e-mail is the sign-in identifier,
   so changing it is verified with the password in the handler, exactly as a
   password change is. */
function actRectifyAccount(st, userId, name, email) {
  const u = st.users.find(x => x.id === userId);
  if (!u) throw new Error('حساب غير موجود.');
  const nm = String(name || '').trim();
  const em = String(email || '').trim().toLowerCase();
  if (nm.length < 3) throw new Error('اكتب اسمك الكامل.');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) throw new Error('بريد إلكتروني غير صالح.');
  if (st.users.some(x => x.id !== userId && (x.email || '').toLowerCase() === em))
    throw new Error('هذا البريد مسجَّل لحساب آخر.');
  if (nm === u.name && em === (u.email || '')) throw new Error('لا تغيير.');
  const before = { name: u.name, email: u.email };
  u.name = nm;
  u.email = em;
  u.rectifiedAt = nowIso();
  /* The detail names what changed, not the values: a correction is often made
     precisely because the old value was wrong about a person. */
  const what = [before.name !== nm ? 'الاسم' : null, before.email !== em ? 'البريد' : null]
    .filter(Boolean).join(' و');
  return { entity: u.id, detail: 'تصحيح بيانات الحساب — ' + what };
}

/* Erasure, meaning redaction. Refused while money is in flight: an account
   with a live commitment still has to be paid or refunded, and you cannot
   pay someone you have just made anonymous. */
const LIVE_ORDER = new Set(['pending', 'confirmed', 'allocated']);
function eraseBlockers(userId) {
  const out = [];
  const live = STATE.orders.filter(o => o.userId === userId && LIVE_ORDER.has(o.status));
  if (live.length) out.push(live.length + ' التزامًا قائمًا — يُغلق أو يُسترد أولًا');
  const apps = STATE.applications.filter(a => a.ownerId === userId
    && !['published', 'rejected'].includes(a.status));
  if (apps.length) out.push(apps.length + ' طلب تمويل قيد المعالجة — يُحسم أولًا');
  const open = STATE.cases.filter(c => c.raisedBy === userId && c.status !== 'resolved');
  if (open.length) out.push(open.length + ' طلب دعم مفتوح — يُغلق أولًا');
  return out;
}

function actErasePersonalData(st, userId, byUserId) {
  assertPerm('admin.users');
  const u = st.users.find(x => x.id === userId);
  if (!u) throw new Error('حساب غير موجود.');
  if (u.role === 'staff') throw new Error('حسابات فريق التشغيل تُوقف ولا تُطمس — سجلّ من فعل ماذا يحتاج اسمًا.');
  if (u.erasedAt) throw new Error('طُمست بيانات هذا الحساب بالفعل.');
  if (userId === byUserId) throw new Error('لا تطمس حسابك بنفسك.');
  const blockers = eraseBlockers(userId);
  if (blockers.length) throw new Error('لا يُطمس قبل: ' + blockers.join('، ') + '.');

  const was = u.name;
  u.name = 'حساب مطموس';
  u.email = null;
  u.salt = null;
  u.pw = null;                 // no credential remains, so no way back in
  delete u.claimedCls;
  u.kyc = 'erased';
  u.erasedAt = nowIso();
  u.erasedBy = byUserId;
  /* The record of the money stays. Only the identifiers go. */
  return { entity: u.id, detail: 'طمس البيانات الشخصية بطلب صاحبها — ' + was
    + ' · تبقى سجلات المال وسلسلة التدقيق كما هي' };
}

function actSetSuspended(st, userId, suspended, byUserId) {
  assertPerm('admin.users');
  const t = st.users.find(x => x.id === userId);
  if (!t) throw new Error('حساب غير موجود.');
  if (t.id === byUserId) throw new Error('لا توقف حسابك بنفسك.');
  if (t.job === 'system_admin' && suspended) {
    const others = st.users.filter(x => x.job === 'system_admin' && !x.suspended && x.id !== t.id);
    if (!others.length) throw new Error('لا يمكن إيقاف آخر مدير نظام نشط.');
  }
  t.suspended = suspended ? nowIso() : null;
  return { entity: t.id, detail: (suspended ? 'إيقاف حساب ' : 'إعادة تفعيل حساب ') + t.name };
}
function actSetJob(st, userId, job, byUserId) {
  assertPerm('admin.users');
  const t = st.users.find(x => x.id === userId);
  const spec = STAFF_JOBS.find(j => j.k === job);
  if (!t || !spec) throw new Error('بيانات غير صالحة.');
  if (t.role !== 'staff') throw new Error('الوظائف لحسابات فريق التشغيل فقط.');
  if (t.id === byUserId) throw new Error('لا تغيّر وظيفتك بنفسك — يلزم مدير آخر.');
  const before = t.job;
  t.job = job;
  t.perms = spec.perms.slice();
  return { entity: t.id, detail: 'تغيير وظيفة ' + t.name + ' من ' + (JOB_AR[before] || before)
    + ' إلى ' + (JOB_AR[job] || job) };
}

/* ══════════════════════════════════════════════════════════════════════════
   BANK RECONCILIATION

   Every public page of this platform promises the same thing: the money sits
   in a segregated escrow account at a licensed partner, not with us. The
   investor affirms it personally — it is the fifth of the five acknowledgements
   they must tick before a commitment exists.

   Nothing proved it. `moneyPosition()` computes an escrow figure, but it is an
   arithmetic residue of this document's own order and disbursement tables:
   allocated minus disbursed. If the partner's account held a different amount,
   no screen here would know, and no screen here could tell you.

   That is what reconciliation is. Not a report — a comparison against a party
   that has no reason to agree with us, and a signed statement that the
   difference is understood down to the baisa.

   Three rules shape it:

   Nothing is dropped silently. A statement line this parser cannot read is
   listed with the reason it could not be read. Quietly skipping a row is
   precisely how a difference disappears.

   The match is explainable. Amount, direction, and a reference that appears in
   the line's own description. A reconciliation nobody can re-derive is not
   evidence of anything.

   It does not close unless it ties. Opening plus what came in, minus what went
   out, plus every named difference, must equal the closing balance the partner
   reported — exactly, in integer baisa. And the person who prepared it is not
   the person who signs it.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── the statement, as pasted ──────────────────────────────────────────────
   Real bank exports are CSV or tab-separated, sometimes with a header, and
   they quote fields that contain the delimiter. This reads that, and refuses
   anything it cannot read *by name*. */
function splitDelimited(line, delim) {
  const out = [];
  let cur = '', q = false;
  for (let i = 0; i < line.length; i += 1) {
    const c = line[i];
    if (q) {
      if (c === '"' && line[i + 1] === '"') { cur += '"'; i += 1; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === delim) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out.map(x => x.trim());
}

const ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;

/* Columns: date, reference, description, credit (in), debit (out).
   A four-column form is accepted too, where the last column is signed. */
function parseStatement(text) {
  const rows = [];
  const rejected = [];
  const raw = String(text || '').split(/\r?\n/);
  const delim = (raw[0] || '').includes('\t') ? '\t' : ',';

  raw.forEach((line, i) => {
    const n = i + 1;
    if (!line.trim()) return;                       // blank lines are not rows
    const c = splitDelimited(line, delim);
    /* A header is whatever does not start with a date — skipped once, at the
       top, and reported if it appears anywhere else. */
    if (!ISO_DATE.test(c[0])) {
      if (i === 0) return;
      rejected.push({ n, raw: line, why: 'العمود الأول ليس تاريخًا بصيغة YYYY-MM-DD' });
      return;
    }
    if (c.length < 4) {
      rejected.push({ n, raw: line, why: 'أعمدة ناقصة — المطلوب: تاريخ، مرجع، وصف، وارد، صادر' });
      return;
    }
    const [date, ref, desc] = c;
    let credit = 0, debit = 0;
    if (c.length >= 5) {
      const inn = c[3] === '' ? 0 : parseOmr(c[3]);
      const out = c[4] === '' ? 0 : parseOmr(c[4]);
      if (inn === null || out === null) {
        rejected.push({ n, raw: line, why: 'مبلغ غير صالح — الريال بثلاث منازل، مثال 1500.000' });
        return;
      }
      if (inn && out) {
        rejected.push({ n, raw: line, why: 'وارد وصادر في سطر واحد — لا يُقرأ اتجاهه' });
        return;
      }
      credit = inn; debit = out;
    } else {
      const signed = c[3].trim();
      const neg = signed.startsWith('-');
      const v = parseOmr(neg ? signed.slice(1) : signed);
      if (v === null) {
        rejected.push({ n, raw: line, why: 'مبلغ غير صالح — الريال بثلاث منازل، مثال 1500.000' });
        return;
      }
      if (neg) debit = v; else credit = v;
    }
    if (!credit && !debit) {
      rejected.push({ n, raw: line, why: 'سطر بمبلغ صفر — لا يقابل حركة' });
      return;
    }
    rows.push({ n, date, ref, desc, credit, debit });
  });
  return { rows, rejected };
}

/* ── what the ledger says the account should have seen ─────────────────────
   Every movement this platform believes passed through the escrow account,
   with the reference the partner's description ought to carry. */
function ledgerMovements() {
  const out = [];
  STATE.orders.forEach(o => {
    if (['pending', 'confirmed', 'allocated'].includes(o.status))
      out.push({ kind: 'order', id: o.id, at: o.createdAt, credit: o.amount, debit: 0,
        what: 'التزام مستثمر' });
    /* A refunded or cancelled commitment is two movements, not one row with a
       credit and a debit in it. The money arrived, then it left; the partner's
       account saw two transactions on two dates, and a reconciliation that
       nets them into one can never match either. */
    else if (o.status === 'refunded' || o.status === 'cancelled') {
      const back = o.status === 'refunded' && o.refunded != null ? o.refunded : o.amount;
      out.push({ kind: 'order', id: o.id, at: o.createdAt, credit: o.amount, debit: 0,
        what: 'التزام مستثمر' });
      out.push({ kind: 'order', id: o.id, at: o.cancelledAt || o.createdAt, credit: 0, debit: back,
        what: o.status === 'refunded' ? 'استرداد للمستثمر' : 'عدول خلال المهلة' });
    }
  });
  STATE.disbursements.filter(d => d.status === 'executed').forEach(d =>
    out.push({ kind: 'disbursement', id: d.id, at: d.approvedAt, credit: 0, debit: d.amount,
      what: 'صرف لمورّد' }));
  STATE.distributions.forEach(d =>
    out.push({ kind: 'distribution', id: d.id, at: d.paidAt, credit: 0, debit: d.gross,
      what: 'توزيع على المستثمرين' }));
  return out;
}

const BREAK_KINDS = [
  { k: 'in_transit',    ar: 'في الطريق',        why: 'حركة سُجّلت هنا ولم تصل الكشف بعد، أو العكس' },
  { k: 'fee',           ar: 'رسم أو عمولة بنك', why: 'خصم من البنك لا يقابله حدث في السجل' },
  { k: 'not_ours',      ar: 'ليست حركتنا',      why: 'سطر في الكشف لا يخصّ هذا الحساب' },
  { k: 'ledger_missing', ar: 'ناقص في السجل',   why: 'وصل المال ولم يُسجَّل — يلزم تصحيح' },
  { k: 'bank_missing',  ar: 'ناقص في الكشف',    why: 'سُجّل هنا ولم يظهر لدى الشريك' },
  { k: 'unknown',       ar: 'غير مفسَّر',        why: 'لم يُعرف سببه بعد' },
];

/* ── the match ─────────────────────────────────────────────────────────────
   Amount, direction, and a reference that appears in the line's own text. No
   fuzzy scoring: a match a person cannot re-derive by reading the two rows
   side by side is not evidence. */
function reconcile(lines, movements) {
  const usedLine = new Set();
  const usedMove = new Set();
  const matched = [];

  movements.forEach((m, mi) => {
    const want = m.debit > 0 ? 'debit' : 'credit';
    const amount = m.debit > 0 ? m.debit : m.credit;
    const hit = lines.findIndex((l, li) =>
      !usedLine.has(li) && l[want] === amount
      && (String(l.ref) === m.id || String(l.desc).includes(m.id)));
    if (hit === -1) return;
    usedLine.add(hit); usedMove.add(mi);
    matched.push({ n: lines[hit].n, kind: m.kind, entityId: m.id, amount, dir: want });
  });

  const bankOnly = lines.filter((l, li) => !usedLine.has(li));
  const ledgerOnly = movements.filter((m, mi) => !usedMove.has(mi));
  return { matched, bankOnly, ledgerOnly };
}

/* ── the arithmetic that has to tie ────────────────────────────────────────
   Two separate facts, and it is worth being clear which is which.

   The difference between the two sides needs no checking: `reconcile()` builds
   the break list *as* that difference, so an identity over it would only
   restate its own construction. What does need checking is that the statement
   we were handed is whole — opening plus everything on it must equal the
   closing balance it claims. It usually will. When it does not, someone pasted
   part of a statement, or mistyped a balance, and every minute spent
   explaining differences against it is wasted. */
function reconBalance(rec) {
  const inn = rec.lines.reduce((s, l) => s + l.credit, 0);
  const out = rec.lines.reduce((s, l) => s + l.debit, 0);
  const computed = rec.openingBalance + inn - out;
  const bankOnly = rec.breaks.filter(b => b.side === 'statement');
  const ledgerOnly = rec.breaks.filter(b => b.side === 'ledger');
  return {
    inn, out, computed,
    gap: rec.closingBalance - computed,     // 0 ⇒ the statement is whole
    bankOnly: bankOnly.reduce((s, b) => s + b.amount, 0),
    ledgerOnly: ledgerOnly.reduce((s, b) => s + b.amount, 0),
    nBank: bankOnly.length, nLedger: ledgerOnly.length,
  };
}
const breakDone = b => !!(b.kind && b.note && b.note.trim().length >= 10);
function statementWhole(r) {
  const bal = reconBalance(r);
  if (bal.gap === 0) return null;
  return 'الكشف نفسه لا يتّزن: ' + rial(r.openingBalance) + ' افتتاحي زائد الوارد ناقص '
    + 'الصادر يساوي ' + rial(bal.computed) + '، والكشف يعلن إقفالًا عند '
    + rial(r.closingBalance) + ' — فرق ' + rial(bal.gap)
    + '. أسطر ناقصة من اللصق أو رصيد مكتوب خطأً.';
}

function actOpenReconciliation(st, periodFrom, periodTo, opening, closing, parsed, byUserId) {
  assertPerm('funds.reconcile');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(periodFrom) || !/^\d{4}-\d{2}-\d{2}$/.test(periodTo))
    throw new Error('تاريخا الفترة غير صالحين.');
  if (periodFrom > periodTo) throw new Error('بداية الفترة بعد نهايتها.');
  if (opening == null || closing == null) throw new Error('رصيدا الافتتاح والإقفال مطلوبان.');
  if (!parsed.rows.length) throw new Error('لا سطر مقروء في الكشف.');
  if (st.reconciliations.some(r => r.status !== 'signed'))
    throw new Error('توجد مطابقة مفتوحة — أغلقها قبل فتح أخرى.');

  const { matched, bankOnly, ledgerOnly } = reconcile(parsed.rows, ledgerMovements());
  const id = nextId(st.reconciliations, 'REC');
  let seq = 0;
  const mk = (side, ref, amount, what) =>
    ({ id: id + '-B' + (seq += 1), side, ref, amount, what, kind: null, note: '', caseId: null });

  st.reconciliations.push({
    id, periodFrom, periodTo,
    openingBalance: opening, closingBalance: closing,
    lines: parsed.rows, rejected: parsed.rejected, matched,
    breaks: bankOnly.map(l => mk('statement', l.ref || ('سطر ' + l.n),
        l.credit || l.debit, (l.credit ? 'وارد' : 'صادر') + ' — ' + (l.desc || '')))
      .concat(ledgerOnly.map(m => mk('ledger', m.id, m.debit || m.credit, m.what))),
    status: 'draft', preparedBy: null, preparedAt: null, signedBy: null, signedAt: null,
  });
  return { entity: id, detail: 'فتح مطابقة ' + periodFrom + ' إلى ' + periodTo
    + ' — ' + parsed.rows.length + ' سطرًا، ' + matched.length + ' مطابَقًا، '
    + (bankOnly.length + ledgerOnly.length) + ' فرقًا'
    + (parsed.rejected.length ? '، ' + parsed.rejected.length + ' سطرًا مرفوضًا' : '') };
}

function actExplainBreak(st, recId, breakId, kind, note, byUserId) {
  assertPerm('funds.reconcile');
  const r = st.reconciliations.find(x => x.id === recId);
  if (!r) throw new Error('مطابقة غير موجودة.');
  if (r.status === 'signed') throw new Error('هذه المطابقة موقَّعة — لا تُعدَّل.');
  const b = r.breaks.find(x => x.id === breakId);
  if (!b) throw new Error('فرق غير موجود.');
  if (!BREAK_KINDS.some(x => x.k === kind)) throw new Error('تصنيف غير معروف.');
  if (!note || note.trim().length < 10) throw new Error('اكتب تفسير الفرق — عشرة أحرف على الأقل.');
  b.kind = kind; b.note = note.trim(); b.at = nowIso(); b.by = byUserId;
  return { entity: recId, detail: 'تفسير فرق ' + b.ref + ' بمبلغ ' + rial(b.amount)
    + ' — ' + (BREAK_KINDS.find(x => x.k === kind) || {}).ar };
}

/* A difference nobody can explain becomes a case with a clock on it, not a
   note that scrolls away. */
function actEscalateBreak(st, recId, breakId, byUserId) {
  assertPerm('funds.reconcile');
  const r = st.reconciliations.find(x => x.id === recId);
  if (!r) throw new Error('مطابقة غير موجودة.');
  const b = r.breaks.find(x => x.id === breakId);
  if (!b) throw new Error('فرق غير موجود.');
  if (b.caseId) throw new Error('فُتحت حالة لهذا الفرق بالفعل.');
  const cid = nextId(st.cases, 'CASE');
  st.cases.push({
    id: cid, kind: 'مطابقة',
    subject: 'فرق ' + fmt(b.amount, 0) + ' ر.ع في مطابقة ' + recId + ' — ' + b.ref,
    poolId: null, status: 'open', openedAt: nowIso(), slaDays: 2,
    raisedBy: byUserId, assignedTo: null,
    notes: [{ at: nowIso(), by: byUserId, kind: 'raise',
      text: 'فرق من جهة ' + (b.side === 'statement' ? 'كشف الشريك' : 'سجل المنصة')
        + ': ' + b.what + '. ' + (b.note || 'بلا تفسير بعد.') }],
  });
  b.caseId = cid;
  return { entity: cid, detail: 'تصعيد فرق ' + b.ref + ' إلى حالة مطابقة' };
}

function actPrepareReconciliation(st, recId, byUserId) {
  assertPerm('funds.reconcile');
  const r = st.reconciliations.find(x => x.id === recId);
  if (!r) throw new Error('مطابقة غير موجودة.');
  if (r.status !== 'draft') throw new Error('هذه المطابقة أُعدّت أو وُقّعت.');
  /* Fail on the whole statement before anyone spends time on its parts. */
  const broken = statementWhole(r);
  if (broken) throw new Error(broken);
  const open = r.breaks.filter(b => !breakDone(b) && !b.caseId);
  if (open.length) throw new Error(open.length + ' فرقًا بلا تفسير — فسّره أو صعّده إلى حالة.');
  r.status = 'prepared';
  r.preparedBy = byUserId;
  r.preparedAt = nowIso();
  return { entity: recId, detail: 'إعداد مطابقة ' + recId + ' للتوقيع' };
}

/* The second party to a reconciliation could sign it or do nothing. Doing
   nothing leaves it "prepared" forever and says nothing about why — so a
   disagreement over whether the money is where we claim had no record at all.
   It goes back to draft with the reason attached, which is the same shape the
   report gate already uses when monitoring returns a report to its owner. */
function actRejectReconciliation(st, recId, reason, byUserId) {
  assertPerm('funds.reconcile');
  const r = st.reconciliations.find(x => x.id === recId);
  if (!r) throw new Error('مطابقة غير موجودة.');
  if (r.status === 'signed') throw new Error('وُقّعت بالفعل — لا تُعاد.');
  if (!DUAL.reconciliation.ready(r)) throw new Error('لا تُعاد مطابقة لم تُعدّ بعد.');
  if (!DUAL.reconciliation.secondParty(r, byUserId))
    throw new Error('أعددتَ هذه المطابقة بنفسك — لا تعيدها. يلزم طرف ثانٍ.');
  if (!reason || reason.trim().length < 10)
    throw new Error('اكتب سبب الإعادة — عشرة أحرف على الأقل.');
  const was = r.preparedBy;
  r.status = 'draft';
  r.returnedBy = byUserId;
  r.returnedAt = nowIso();
  r.returnReason = reason.trim();
  return { entity: recId, detail: 'إعادة مطابقة ' + recId + ' إلى المسودة — أعدّها '
    + ((user(was) || {}).name || was) + ' · السبب: ' + reason.trim() };
}

/* The signature says "the money is where we said it is". So it needs a second
   person, and it needs the arithmetic to actually tie — the same rule the
   allocation preview holds itself to before a pool may close. */
function actSignReconciliation(st, recId, byUserId) {
  assertPerm('funds.reconcile');
  const r = st.reconciliations.find(x => x.id === recId);
  if (!r) throw new Error('مطابقة غير موجودة.');
  if (r.status === 'signed') throw new Error('وُقّعت بالفعل.');
  if (!DUAL.reconciliation.ready(r)) throw new Error('لا تُوقَّع مطابقة لم تُعدّ بعد.');
  if (!DUAL.reconciliation.secondParty(r, byUserId)) throw new Error(DUAL.reconciliation.refusal);
  const open = r.breaks.filter(b => !breakDone(b) && !b.caseId);
  if (open.length) throw new Error(open.length + ' فرقًا بلا تفسير.');
  const broken = statementWhole(r);
  if (broken) throw new Error(broken);
  r.status = 'signed';
  r.signedBy = byUserId;
  r.signedAt = nowIso();
  return { entity: recId, detail: 'توقيع مطابقة ' + recId + ' — رصيد الشريك '
    + rial(r.closingBalance) + ' مطابق للسجل، أعدّها '
    + ((user(r.preparedBy) || {}).name || r.preparedBy) };
}
